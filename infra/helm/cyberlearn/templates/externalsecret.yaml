{{- /*
External Secrets Operator copies the Secrets Manager entries into one Kubernetes Secret.
The SecretStore has no auth block, so ESO uses its own Pod Identity role, which Terraform
scopes to this environment's secrets only.
*/ -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "cyberlearn.fullname" . }}-aws
  labels:
    {{- include "cyberlearn.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "config.AWS_REGION is required" .Values.config.AWS_REGION }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cyberlearn.fullname" . }}-env
  labels:
    {{- include "cyberlearn.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "cyberlearn.fullname" . }}-aws
  target:
    name: {{ include "cyberlearn.envSecret" . }}
    creationPolicy: Owner
  dataFrom:
    # Later entries win, so a hand-set value in `external` can override a generated one.
    - extract:
        key: {{ required "secrets.generated is required" .Values.secrets.generated }}
    {{- with .Values.secrets.external }}
    - extract:
        key: {{ . }}
    {{- end }}
