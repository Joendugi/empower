apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.appNamespace }}
  labels:
    # Reject privileged pods in the app namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# The aws-load-balancer-controller chart doesn't aggregate its CRD into the built-in
# admin/edit roles, so namespace admins (the CI deploy role) couldn't manage bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: targetgroupbindings-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["elbv2.k8s.aws"]
    resources: ["targetgroupbindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
