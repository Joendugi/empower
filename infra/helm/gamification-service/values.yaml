replicaCount: 2

image:
  repository: cyberlearn/gamification-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: 1

# Environment variables loaded from Kubernetes Secret
# Create secret: kubectl create secret generic gamification-service-secret \
#   --from-literal=DATABASE_URL=... \
#   --from-literal=REDIS_URL=... \
#   --from-literal=SECRET_KEY=...
secretName: gamification-service-secret

# Liveness / readiness probe settings
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /ready
    initialDelaySeconds: 8
    periodSeconds: 10

# Node affinity — prefer to spread across AZs
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gamification-service
          topologyKey: topology.kubernetes.io/zone
