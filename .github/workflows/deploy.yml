name: Deploy

# Runs after CI passes on main: build the API image once, deploy it to staging,
# then to production. Production waits for approval if the GitHub "production"
# environment has required reviewers (set that in Settings → Environments).
#
# One-time setup is in infra/README.md: repository secret AWS_BUILD_ROLE_ARN,
# and AWS_DEPLOY_ROLE_ARN + VITE_ADMIN_STAFF_HASH in each GitHub environment.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build API image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: af-south-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a re-run for the same commit skips the build.
      - id: exists
        run: |
          if aws ecr describe-images --repository-name cyberlearn/api \
               --image-ids imageTag=${{ steps.sha.outputs.sha }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/cyberlearn/api:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Staging
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit

  production:
    name: Production
    needs: [build, staging]
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit
