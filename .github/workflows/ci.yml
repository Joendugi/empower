name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JavaScript / TypeScript ─────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: PWA unit tests
        run: pnpm --filter @cyberlearn/pwa test

  # ── Python / FastAPI ────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cyberlearn_test
          POSTGRES_USER: cyberlearn
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      # Tests build tables with create_all, so apply the real migrations to a fresh
      # database too. Two at once, like two pods starting: the advisory lock in
      # alembic/env.py must make them take turns.
      - name: Apply migrations (two concurrent runs)
        env:
          DATABASE_URL: postgresql+asyncpg://cyberlearn:testpassword@localhost:5432/cyberlearn_migrations
          ENVIRONMENT: production
        run: |
          python -c "
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect('postgresql://cyberlearn:testpassword@localhost:5432/cyberlearn_test')
              await conn.execute('CREATE DATABASE cyberlearn_migrations')
              await conn.close()
          asyncio.run(main())
          "
          alembic upgrade head & first=$!
          alembic upgrade head & second=$!
          wait $first && wait $second
          alembic current | grep -q "(head)"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://cyberlearn:testpassword@localhost:5432/cyberlearn_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-not-for-production
          ENVIRONMENT: development
          CONTENT_DIR: ${{ github.workspace }}/content
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: api
        continue-on-error: true

  cms-tools:
    name: CMS Tools Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v
      - name: Validate catalogue
        run: cyberlearn-content validate-catalogue ${{ github.workspace }}/content
      # The PWA ships generated files (catalogue index + course packs). Fail if YAML changed
      # without regenerating them.
      - name: Generated catalogue is up to date
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/generate_catalogue.py
          git add -N apps/pwa/src/content/generated apps/pwa/public/packs
          git diff --exit-code --stat -- apps/pwa/src/content/generated apps/pwa/public/packs             || { echo "Run: python scripts/generate_catalogue.py, then commit the result"; exit 1; }

  # ── Infrastructure ──────────────────────────────────────────────────
  infra:
    name: Terraform & Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: |
          for dir in infra/terraform/bootstrap infra/terraform; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Helm lint and schema check
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          cat > /tmp/tf-values.yaml <<'EOF'
          image:
            repository: 123456789012.dkr.ecr.af-south-1.amazonaws.com/cyberlearn/api
          secrets:
            generated: example/api/generated
            external: example/api/external
          targetGroupBinding:
            targetGroupARN: arn:aws:elasticloadbalancing:af-south-1:123456789012:targetgroup/example/0123456789abcdef
          config:
            AWS_REGION: af-south-1
            UPLOADS_BUCKET: example-uploads
            PUBLIC_HOST: staging.example.org
          EOF
          for env in staging production; do
            args="-f infra/helm/cyberlearn/values-$env.yaml -f /tmp/tf-values.yaml --set image.tag=ci"
            helm lint infra/helm/cyberlearn $args
            helm template cyberlearn infra/helm/cyberlearn $args | ./kubeconform -strict -summary \
              -kubernetes-version 1.35.0 -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          helm lint infra/helm/cluster-config
          helm template cluster-config infra/helm/cluster-config | ./kubeconform -strict -summary -kubernetes-version 1.35.0

  # ── Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: apps/pwa/dist/
          retention-days: 7
