exercises:
- id: cyber-sy0701-d3-w1-q1
  type: MULTIPLE_CHOICE
  prompt: 'A public college website should typically sit in:'
  options:
  - id: a
    text: The same VLAN as payroll file shares
  - id: b
    text: A screened subnet / DMZ with controlled paths inward
  - id: c
    text: The welding bay air-gap
  - id: d
    text: The printer cartridge
  correct_answer: b
  hint: DMZ.
  explanation: Do not hairpin public traffic through the finance LAN.
  xp_reward: 50
- id: cyber-sy0701-d3-w1-q2
