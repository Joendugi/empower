  - id: b
    text: Broker admin access into a sensitive zone instead of exposing RDP to the world
  - id: c
    text: Replace TLS
  - id: d
    text: Store salts in a GIF
  correct_answer: b
  hint: Admin path.
  explanation: Combine with MFA and session recording if you can.
