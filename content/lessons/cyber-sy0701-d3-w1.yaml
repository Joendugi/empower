  prompt: 'Defence in depth means:'
  options:
  - id: a
    text: One expensive firewall and nothing else
  - id: b
    text: Overlapping controls so one failure does not end the CIA triad
  - id: c
    text: Deleting logs
  - id: d
    text: Open RDP
  correct_answer: b
  hint: Layers.
  explanation: Identity + patch + backup + segment + monitor.
  xp_reward: 50
