id: cyber-sy0701-d3-w1
course_id: secplus-architecture
title: Week 1 — Architecture models, segmentation, and secure design
title_sw: Wiki 1 — Miundo, segmentation, na usanifu salama
briefing: 'Domain 3 (18%) is how you place controls in a system. Models: on-premises, cloud, hybrid, and infrastructure concepts such as centralised vs decentralised, containerisation, virtualisation, IoT/ICS, and serverless. A Kenyan polytechnic is usually hybrid: on-prem AD and file servers, cloud mail, SaaS MIS. Design principles: least privilege, defence in depth, fail securely, keep it simple, privacy by design, and secure defaults.


  Segmentation: VLANs, subnets, DMZ for public web, air-gaps for ICS/welding-bay PLCs if required, east-west filtering, and micro-segmentation in virtualisation. Screened subnet (DMZ) holds the public website; it must not be a shortcut into finance. Jump servers/bastion hosts for admin. Jumping from student Wi-Fi straight to the domain controller is an architecture fail.


  Device placement: firewalls, sensors, WAF, load balancers, proxies, IDS/IPS, NAC. Fail-open versus fail-closed: a fail-open door lock may be a fire code requirement; a fail-open firewall is usually a security fail. Know which you were asked about.


  Draw this week: campus zones — students, staff, servers, guests, CCTV, and a DMZ. Label trust boundaries. That drawing is the architecture artefact.'
briefing_sw: On-prem, wingu, hybrid. DMZ, VLAN, jump server. Defence in depth, least privilege. Firewall fail-closed. ICS ya warsha itengwe. Chora kanda za chuo.
estimated_minutes: 32
