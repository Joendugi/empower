    '
- id: met-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why must vertical wooden pattern walls feature a 1° to 3° draft taper angle?

    '
  xp_reward: 50
  options:
  - id: a
    text: To make the casting heavier
  - id: b
    text: To prevent vacuum suction and friction from tearing and destroying the delicate packed greensand
      mold walls when the pattern is extracted vertically
  - id: c
    text: To make the pattern float in water
  - id: d
    text: To allow the molten metal to freeze faster
  explanation: 'A pattern with 90° perpendicular walls rubs against sand throughout its entire vertical
    withdrawal, causing sand to crumble and collapse. A 1°-3° taper breaks contact the instant the pattern
    moves upward by 1 mm, leaving sharp, pristine cavity edges.


    Why the other options are wrong: Draft taper has a negligible effect on weight; its purpose is clean
    pattern extraction. Patterns are used in dry molding flasks, not water. Solidification rate depends
    on section thickness and sand thermal conductivity, not draft angle.'
  correct_answer: b
- id: met-d4-q5
  type: FILL_BLANK
  prompt: 'Before pouring molten metal into a greensand mold, a heavy iron weight must be placed on top
    of the cope flask to counteract the powerful ___ pressure of the dense liquid metal, which would otherwise
    float the cope and blow out molten metal.

    '
  xp_reward: 50
  correct_answer: hydrostatic
  explanation: 'Molten metal is dense (aluminium 2.4 g/cm3, bronze 8.8 g/cm3). When the mold fills, hydrostatic
    head pressure pushes upward against the cope sand with hundreds of kilograms of force.

    '
