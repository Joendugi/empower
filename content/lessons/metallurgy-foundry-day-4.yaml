briefing: 'When machinery components break in remote field stations—a water pump impeller, a V-belt pulley,
  a pipe flange, or a bearing housing—replacement parts cannot be ordered online. Metal casting allows
  a workshop to replicate complex mechanical geometries using scrap aluminium or bronze. The cornerstone
  of the foundry is the Greensand mold: an economical, reusable composite of silica sand, bentonite clay
  binder, and moisture that holds sharp dimensional details against molten metal. This lesson covers pattern
  draft angles, shrinkage allowances, molding flask carpentry (cope and drag), gating system hydraulics
  (sprues, runners, ingates), and riser placement to feed solidification shrinkage.

  '
outline: 'The physical chemistry of Greensand (85-90% clean sub-angular silica sand, 8-10% sodium/calcium
  bentonite clay, 3-5% water); the hand-squeeze ball test for sand moisture; wooden pattern design rules:
  parting lines, draft taper angle (1° to 3°), and metal shrinkage allowances (1.3% for aluminium, 1.5%
  for bronze, 2.0% for cast iron); parting powder (talc, fine dry wood ash, graphite); molding flask anatomy
  (lower drag, upper cope, alignment register pins); ramming technique and venting needles; gating system
  engineering: pouring basin, tapered sprue, runner trap, ingates, and feeding risers (feeder heads) to
  eliminate internal shrinkage voids.

  '
content_md: "## The Principle of Greensand Casting\n\n**Greensand casting** does not mean the sand is\
  \ green in color; \"green\" refers to\nthe fact that the sand mold is bonded with clay and moisture\
  \ and used in its\n**damp (uncooked) state**:\n- **Why Greensand?**:\n  - Low cost: 100% locally sourceable\
  \ materials.\n  - 100% recyclable: After shaking out the cooled casting, the sand is re-moistened, re-milled,\
  \ and reused indefinitely.\n  - Excellent breathability: Natural sand pores allow boiling steam and\
  \ expanding gases to escape through the mold walls rather than bubbling into the molten metal.\n\n##\
  \ The Greensand Formula & The Hand-Squeeze Test\n\nA high-quality greensand formula:\n\n| Component\
  \ | Percentage by Weight | Function |\n|---|---|---|\n| **Silica Sand** | **85% – 88%** | Refractory\
  \ skeleton; clean, washed, sub-angular grain size (mesh 70 to 100). |\n| **Bentonite Clay** | **8% –\
  \ 10%** | Plastic binder; sodium bentonite provides high green strength and thermal durability. |\n\
  | **Water (Moisture)** | **3% – 5%** | Activates the clay platelets. |\n| *Optional: Coal Dust / Wood\
  \ Pitch* | 1% – 2% | Carbonizes on contact with metal, forming a gas cushion that creates a smooth casting\
  \ surface finish. |\n\n### The Master Foundryman's Hand-Squeeze Test:\n1. Take a handful of mixed, tempered\
  \ greensand and squeeze it firmly in your fist.\n2. Open your hand:\n   - The sand must form a firm,\
  \ cohesive lump that retains every fine fingerprint groove.\n3. Break the lump in half between your\
  \ thumbs:\n   - **CORRECT**: The lump snaps cleanly with sharp, crisp edges like a dry cookie, leaving\
  \ the palm of your hand dry and free of clinging mud.\n   - **TOO DRY**: The lump crumbles into loose\
  \ grains; sand will wash into the metal during pouring, creating sand inclusions.\n   - **TOO WET**:\
  \ Sand leaves wet mud stuck to your skin. **DANGER**: Excess water generates explosive high-pressure\
  \ steam when molten 1,000°C metal enters the mold!\n\n## Pattern Engineering: Draft & Shrinkage\n\n\
  The **pattern** is the replica of the object to be cast, carved from hardwood (mahogany,\ncedar), dense\
  \ polyurethane foam, or cast resin.\n\n### 1. The Parting Line:\nThe boundary plane dividing the mold\
  \ into two halves:\n- **Drag**: The bottom flask half.\n- **Cope**: The top flask half.\n\n```\n   \
  \                  [ COPE (Top Flask) ]\n═════════════════════════════════════════════════════════ Parting\
  \ Line\n                     [ DRAG (Bottom Flask) ]\n```\n\n### 2. Draft Angle (Taper):\nVertical walls\
  \ must never be 90° square. They must feature a **1° to 3° draft taper**:\n- Without draft taper, lifting\
  \ the pattern out of the packed sand creates vacuum suction that shears and breaks the delicate sand\
  \ mold edges.\n\n### 3. Solidification Shrinkage Rules:\nMetals expand when liquid and shrink as they\
  \ freeze from liquid to solid. Patterns\nmust be carved oversize using a **Shrinkage Rule**:\n\n| Metal\
  \ / Alloy | Liquid-to-Solid Shrinkage | Pattern Oversize Allowance |\n|---|---|---|\n| **Aluminium Alloys\
  \ (Al-Si)** | **1.3%** | Add **13 mm per 1 metre** (approx. 1/8\" per foot) |\n| **Bronze / Brass (Cu-Sn-Zn)**\
  \ | **1.5% – 1.8%** | Add **16 mm per 1 metre** (approx. 3/16\" per foot) |\n| **Cast Iron (Grey)**\
  \ | **1.0%** | Add **10 mm per 1 metre** (approx. 1/10\" per foot) |\n| **Lead / Zinc** | **2.5%** |\
  \ Add **25 mm per 1 metre** |\n\n## The Molding Flask: Cope and Drag\n\nA heavy wooden or welded steel\
  \ two-part box without top or bottom:\n- Equipped with precision **hardwood or steel alignment register\
  \ pins** on the sides.\n- The pins ensure that when the cope is lifted off to remove the pattern and\
  \ then put back on, the two mold cavities align with sub-millimetre precision.\n\n```\n            \
  \   POURING BASIN          RISER / FEEDER\n                    ▼                      ▼\n          \
  \   ┌──────┴──┐            ┌──────┴──┐\n  [ COPE ]   │  SPRU   │            │         │\n          \
  \   │  (Down) │            │         │\n═════════════╪═════════╪════════════╪═════════╪════════════\
  \ Parting Line\n  [ DRAG ]   │         │ RUNNER     │ CAVITY  │\n             └─────────┴────────────┴─────────┘\n\
  \                              ▲\n                           INGATE\n```\n\n## The 7-Step Sand Molding\
  \ Protocol\n\n1. **Place Pattern in Drag**:\n   - Place pattern flat-face down on a molding board inside\
  \ the inverted Drag flask.\n   - Dust pattern generously with **Parting Powder** (fine dry talcum powder,\
  \ powdered blackboard chalk, or fine dry wood ash) so sand will not stick to the wood.\n2. **Riddle\
  \ & Ram the Drag**:\n   - Sift fine greensand through a 3 mm wire riddle sieve directly over the pattern\
  \ (15 mm fine facing layer).\n   - Fill drag with coarse greensand; compact firmly using a wooden wedge\
  \ rammer around the edges, then flat butt-ram the top.\n   - Strike off excess sand flush with the top\
  \ of the flask using a straight steel bar.\n3. **Invert the Drag**:\n   - Roll the heavy drag 180° right-side-up.\
  \ Smooth the parting sand surface with a trowel.\n4. **Assemble the Cope**:\n   - Set the Cope flask\
  \ onto the Drag, locking the alignment register pins.\n   - Dust the entire parting plane with dry parting\
  \ powder.\n   - Set vertical wooden pegs in place for the **Sprue** (where metal enters) and the **Riser**\
  \ (where metal exits).\n5. **Ram the Cope & Vent**:\n   - Sift and ram greensand in the cope identical\
  \ to the drag.\n   - Carve a wide conical **Pouring Basin** around the sprue top.\n   - **Venting (Crucial)**:\
  \ Push a 2 mm bicycle spoke or wire needle down through the cope sand repeatedly, stopping 15 mm above\
  \ the pattern. These micro-vents let steam and air vent freely to avoid gas blowhole defects.\n6. **Separate\
  \ & Draw the Pattern**:\n   - Carefully lift the Cope vertically off the Drag; set it aside on its edge.\n\
  \   - Tap the wooden pattern gently with a small brass mallet (**rapping**) to loosen it from the sand.\n\
  \   - Screw a threaded steel draw-spike into the pattern and lift it vertically straight out without\
  \ wiggling.\n7. **Cut the Gating System**:\n   - With a curved brass spoon or gate cutter, carve a smooth\
  \ horizontal channel (**Runner**) in the drag connecting the bottom of the sprue to the mold cavity\
  \ via a restricted **Ingate**.\n   - Blow out any loose sand grains with a gentle hand air bulb.\n \
  \  - Re-close the Cope onto the Drag; lock the register pins.\n   - Place a **10 kg to 20 kg cast-iron\
  \ weight** on top of the cope sand (without weight, the hydrostatic lifting pressure of dense molten\
  \ metal will float the cope, blowing molten metal out the parting line!).\n\n## The Role of the Feeding\
  \ Riser\n\nThick sections of metal cool slower than thin walls. As the core freezes, it contracts,\n\
  leaving internal hollow voids (**shrinkage porosity**).\n- A **Riser (Feeder Head)** is a large reservoir\
  \ of molten metal placed above the thickest section of the casting.\n- The riser is designed to freeze\
  \ **last**, feeding liquid metal downward by gravity into the contracting casting until it is 100% solid,\
  \ dense, and void-free.\n"
exercises:
- id: met-d4-q1
  type: MULTIPLE_CHOICE
  prompt: 'A foundry patternmaker is carving a wooden pattern for an aluminium V-belt pulley that must
    have a finished outside diameter of exactly 200.0 mm. Accounting for aluminium''s 1.3% solidification
    shrinkage, what diameter must the wooden pattern be carved to?

    '
  xp_reward: 50
  options:
  - id: a
    text: 200.0 mm
  - id: b
    text: 213.0 mm
  - id: c
    text: 202.6 mm (200.0 mm × 1.013)
  - id: d
    text: 197.4 mm
  explanation: 'Aluminium contracts by 1.3% as it freezes from liquid to solid. The pattern must be oversized
    by 1.3%: 200.0 × 1.013 = 202.6 mm. When cast, the molten aluminium freezes and shrinks down to the
    target 200.0 mm.


    Why the other options are wrong: If carved at 200 mm, the finished casting will shrink to 197.4 mm
    and will be undersized scrap. This is a 6.5% oversize, which would require massive machining to bring
    to size. This subtracts shrinkage instead of adding it, making the part double-undersized.'
  correct_answer: c
- id: met-d4-q2
  type: FILL_BLANK
  prompt: 'Greensand for foundry mold making consists of 85% to 88% silica sand, 8% to 10% bentonite clay
    binder, and ___ to 5% moisture. When squeezed firmly in the fist, the sand lump should snap cleanly
    with sharp edges, leaving the palm of the hand ___.

    '
  xp_reward: 50
  correct_answer:
  - 3%
  - dry
  explanation: '3% to 5% water activates bentonite. If properly tempered, the sand feels firm and snaps
    cleanly like a cookie, leaving the palm dry. Wet sticky sand generates dangerous steam.

    '
