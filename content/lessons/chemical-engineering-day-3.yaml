    70% alcohol is the universal antiseptic standard.

    '
- id: chem-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'When testing a tuber mash (cassava or sweet potato) after 60 minutes of mashing with malted
    grain, a drop of iodine tincture placed in the mash turns deep blue-black. What does this indicate?

    '
  xp_reward: 50
  options:
  - id: a
    text: The mash has turned into pure alcohol
  - id: b
    text: The mash has acidified below pH 3.0
  - id: c
    text: The enzymes were overheated and generated sugar crystals
  - id: d
    text: Starch conversion is incomplete; complex starch chains are still present, requiring more enzymatic
      rest time or temperature adjustment before yeast pitching
  explanation: 'Iodine complexes with amylose starch chains to turn dark blue-black. A successful conversion
    yields maltose/glucose, which does not react with iodine (remains yellow/amber).


    Why the other options are wrong: Alcohol does not turn iodine blue-black; alcohol fermentation only
    happens after yeast is added. Iodine tests for starch polysaccharides, not pH. Blue-black indicates
    unreacted starch, not sugar crystals.'
  correct_answer: d
- id: chem-d3-q5
  type: FILL_BLANK
  prompt: 'For medical handrub formulation according to WHO guidelines, 833 mL of 96% ethanol is compounded
    with 42 mL of 3% ___ to destroy bacterial spores and 15 mL of ___ to act as a skin-protecting humectant.

    '
  xp_reward: 50
  correct_answer:
  - hydrogen peroxide
  - glycerol
  explanation: 'Hydrogen peroxide destroys resilient bacterial endospores that survive in alcohol, while
    glycerol (glycerin) retains moisture to prevent nurse and patient skin cracking.

    '
