  prompt: 'What is the first step a technician must take before starting Bookkeeping
    and Financial Statements: Cash Book, Profit and Loss, Cash Flow Forecast and Break-Even
    Calculation?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
    text: Inspect PPE, workspace ventilation, and machine guards
  - id: c
    text: Disable circuit breakers to save power
  - id: d
    text: Paint the workpiece
