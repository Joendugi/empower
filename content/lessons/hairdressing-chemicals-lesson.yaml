id: "hairdressing-chemicals-lesson"
course_id: "hairdressing"
title: "Colour, relaxer, and chemical safety"
title_sw: "Rangi, relaxer, na kemikali"
briefing: "Patch-test colour and some relaxers as the manufacturer and college require. Mix ratios (developer volumes) are chemistry. 40 volume is not a shortcut for 20 volume on a scalp. Timing starts when application is complete; over-processing burns.\n\nPPE: gloves, and apron. Bleach dust is not for inhaling. Do not mix products you cannot name. Never use metallic dye then oxidise without knowing the reaction risk.\n\nStrand tests tell you if the hair will survive. Overlapping relaxer on previously relaxed hair is a classic breakage. Apply to new growth as specified.\n\nEmergency: product in eyes — rinse and seek help. Keep SDS. Neutralise relaxer as directed; water alone is not always the full story."
briefing_sw: "Fanya patch test. Fuata ratio ya developer. Usiweke 40 volume kichwani ovyo. PPE. Usichanganye bidhaa usizozifahamu. Strand test. Overlap ya relaxer inavunja nywele."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/HBT/CR/02/5"
exam_domain: "Chemical services"
exercises:
  - id: "hairdressing-chemicals-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why is a patch test used before some colour services?"
    options:
      - id: "a"
        text: "To bill extra time"
      - id: "b"
        text: "To check for allergic reaction before full-scalp application"
      - id: "c"
        text: "To bleach the floor"
      - id: "d"
        text: "NITA requires it for water only"
    correct_answer: "b"
    hint: "Allergies can be severe."
    explanation: "Follow product timing. Document the result."
    xp_reward: 50
  - id: "hairdressing-chemicals-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Overlapping relaxer onto already relaxed lengths often causes:"
    options:
      - id: "a"
        text: "Extra shine only"
      - id: "b"
        text: "Breakage"
      - id: "c"
        text: "Permanent patch tests"
      - id: "d"
        text: "Lower pH automatically"
    correct_answer: "b"
    hint: "Virgin vs processed."
    explanation: "Apply to new growth. Protect lengths."
    xp_reward: 50
  - id: "hairdressing-chemicals-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Developer volume (10, 20, 30, 40) is mainly about:"
    options:
      - id: "a"
        text: "Bottle size"
      - id: "b"
        text: "Lift / oxidising strength — using too high on scalp burns"
      - id: "c"
        text: "Water temperature"
      - id: "d"
        text: "Comb colour"
    correct_answer: "b"
    hint: "Not a speed setting."
    explanation: "Wrong volume is a chemical burn risk."
    xp_reward: 50
  - id: "hairdressing-chemicals-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "If colour enters the eye you should:"
    options:
      - id: "a"
        text: "Rub with a towel of bleach"
      - id: "b"
        text: "Rinse with water and get medical help as SOP"
      - id: "c"
        text: "Apply more colour to equalise"
      - id: "d"
        text: "Ignore it"
    correct_answer: "b"
    hint: "First aid."
    explanation: "Stop the service. Irrigate. Record."
    xp_reward: 50
  - id: "hairdressing-chemicals-fb1"
    type: "FILL_BLANK"
    prompt: "A test on a small section of hair to see the result before full application is a ___ test."
    correct_answer: "strand"
    hint: "Not the skin patch test."
    explanation: "Strand tests check breakage and colour result."
    xp_reward: 50
  - id: "hairdressing-chemicals-scenario"
    type: "SCENARIO"
    prompt: "Hair snaps when you comb during relaxer processing. Trainee wants to leave it on “so it finishes”. You:"
    options:
      - id: "a"
        text: "Leave it — breakage means it is working"
      - id: "b"
        text: "Rinse/neutralise immediately per manufacturer and treat as an emergency over-process"
      - id: "c"
        text: "Add more lye"
      - id: "d"
        text: "Blow-dry on high to strengthen"
    correct_answer: "b"
    hint: "Stop the chemical."
    explanation: "Breakage during processing is a stop condition."
    xp_reward: 60
