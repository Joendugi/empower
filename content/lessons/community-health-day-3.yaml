briefing: 'Malaria causes over 600,000 deaths per year, over 95% in sub-Saharan Africa, and over 80% in
  children under 5. Kenya has high malaria burden in lakeside, coastal, and western regions. A community
  health worker equipped with a rapid diagnostic test (RDT) and artemisinin-based combination therapy
  (ACT) can test, diagnose, and treat uncomplicated malaria at the household level — saving lives before
  referral is possible.

  '
outline: 'Plasmodium species (falciparum, vivax, malariae, ovale); Anopheles mosquito lifecycle and biting
  behaviour; clinical presentation (uncomplicated vs severe malaria); rapid diagnostic tests (RDT) — HRP2
  antigen basis, procedure, and reading results; artemisinin-based combination therapy (ACT) dosing by
  weight; artemether-lumefantrine (AL) 6-dose regimen; danger signs requiring referral; insecticide-treated
  bed nets (ITNs) and indoor residual spraying (IRS).

  '
content_md: "## Plasmodium Species in East Africa\n\n| Species | Regional importance | Key features |\n\
  |---|---|---|\n| P. falciparum | 99% of Kenya cases — most dangerous | Can infect all red blood cell\
  \ ages; causes cerebral malaria |\n| P. vivax | Occasional, mainly highland | Dormant liver stage (hypnozoite);\
  \ relapses; requires primaquine |\n| P. malariae | Rare | Long incubation (18-40 days); quartan fever\
  \ (48-hr cycles) |\n| P. ovale | Rare | Similar to vivax; relapsing |\n\n**P. falciparum** is the primary\
  \ target of all Kenya malaria control programmes.\n\n## Anopheles Mosquito & Transmission\n\n- Female\
  \ Anopheles mosquitoes are the sole malaria vectors\n- Biting behaviour: **peak biting time 2200h-0200h**\
  \ (midnight hours)\n- Preferred breeding sites: slow-moving or still water — rice paddies, hoofprints,\n\
  \  irrigation channels, open water storage containers\n- Sporogonic cycle in mosquito: 10-14 days at\
  \ 25°C (pathogen develops in mosquito)\n- Incubation in human after bite: 7-14 days for P. falciparum\n\
  \n## Clinical Presentation\n\n### Uncomplicated Malaria (Classic Triad)\n\n1. Fever (> 37.5°C), often\
  \ with rigors (shaking chills)\n2. Headache\n3. Muscle pain and malaise\n\n**Fever pattern by species:**\n\
  - P. falciparum: irregular (no classic pattern in early infection)\n- P. vivax/ovale: tertian fever\
  \ — spikes every 48 hours\n- P. malariae: quartan fever — spikes every 72 hours\n\n### Severe Malaria\
  \ — Danger Signs (WHO)\n\nAny ONE of the following = severe malaria → urgent referral:\n\n1. Impaired\
  \ consciousness / coma (cerebral malaria)\n2. Multiple convulsions in 24 hours\n3. Respiratory distress\
  \ (acidotic breathing)\n4. Circulatory collapse (systolic BP < 70 mmHg)\n5. Jaundice + dark urine (blackwater\
  \ fever — haemoglobinuria)\n6. Abnormal bleeding\n7. Severe anaemia (Hb < 5 g/dL)\n8. Hypoglycaemia\
  \ (blood glucose < 2.2 mmol/L)\n\n## Rapid Diagnostic Tests (RDT)\n\nKenya National Malaria Programme\
  \ recommends HRP2-based RDTs that detect\nP. falciparum-specific histidine-rich protein 2.\n\n### RDT\
  \ Procedure\n\n1. Clean fingertip with alcohol swab — allow to dry completely\n2. Prick finger with\
  \ sterile lancet — wipe away first drop\n3. Collect 5 mcL blood with capillary tube\n4. Transfer blood\
  \ to sample well (S)\n5. Add 2-3 drops of buffer solution\n6. Read result at **15-20 minutes** (not\
  \ before 15 min; not after 25 min)\n\n### Reading the RDT\n\n| Result | Lines visible | Interpretation\
  \ |\n|---|---|---|\n| Negative | Control line (C) only | No P. falciparum antigen detected |\n| Positive\
  \ | Control (C) + Test line (T) | P. falciparum detected |\n| Invalid | No control line appears | Test\
  \ failed — repeat with new kit |\n\n**Important**: Always treat on RDT result. A positive RDT = give\
  \ ACT.\nDo NOT treat a patient who tests RDT negative for malaria with ACT —\nthe fever has another\
  \ cause.\n\n## ACT Treatment — Artemether-Lumefantrine (AL)\n\nKenya first-line ACT: artemether-lumefantrine\
  \ (Coartem, Lumartem)\nDosing by weight — 6-dose regimen over 3 days:\n\n| Weight | Tablets per dose\
  \ | Schedule |\n|---|---|---|\n| 5-14 kg (infants/young children) | 1 tablet | 0h, 8h, 24h, 36h, 48h,\
  \ 60h |\n| 15-24 kg (older children) | 2 tablets | same schedule |\n| 25-34 kg (adolescents) | 3 tablets\
  \ | same schedule |\n| 35 kg and above (adults) | 4 tablets | same schedule |\n\n**Key counselling points:**\n\
  - Give with food (fatty meal improves absorption by 3-fold — e.g. peanuts, milk, avocado)\n- Complete\
  \ all 6 doses even if fever resolves after dose 1-2\n- Return immediately if vomits within 30 minutes\
  \ of dose (repeat same dose)\n- Return in 3 days for follow-up RDT\n\n## Prevention — ITNs and IRS\n\
  \n**Insecticide-Treated Bed Nets (ITNs):**\n- Long-lasting insecticidal nets (LLINs) retain efficacy\
  \ for 3 years\n- Hang net to cover entire sleeping area; tuck edges under mattress\n- Effectiveness:\
  \ 50% reduction in child malaria mortality\n- Check for holes monthly; repair with needle and thread\n\
  \n**Indoor Residual Spraying (IRS):**\n- Spray all internal walls and ceilings with approved insecticide\n\
  - Effective for 3-6 months per application cycle\n- Move furniture away from walls before spraying\n\
  - Residents leave room for 30 minutes after spraying\n"
exercises:
- id: ch-d3-q1
  type: MULTIPLE_CHOICE
  prompt: 'A 7-year-old child (22 kg) has a positive RDT and fever. What is the correct AL dosing regimen
    for this child?

    '
  xp_reward: 50
  options:
  - id: a
    text: 2 tablets at 0h, 8h, 24h, 36h, 48h and 60h — give with food such as peanuts or milk
  - id: b
    text: 1 tablet at 0h, 8h, 24h, 36h, 48h and 60h
  - id: c
    text: 4 tablets in a single dose — adults and children over 15 kg take the same dose
  - id: d
    text: 2 tablets twice daily for 5 days
  explanation: '22 kg falls in the 15-24 kg weight band = 2 tablets per dose. The 6-dose regimen spans
    3 days: 0h, 8h, then twice daily (24h, 36h, 48h, 60h). Fatty food increases AL absorption 3-fold.


    Why the other options are wrong: 1 tablet is the dose for children 5-14 kg. At 22 kg the dose is 2
    tablets per dose. 4 tablets is for adults 35 kg and above. Paediatric dosing is weight-banded. 22
    kg = 2 tablets per dose, not a single adult dose. AL is a 6-dose 3-day regimen (not 5 days, not twice
    daily for the full period — doses are at 0h, 8h, 24h, 36h, 48h, 60h).'
  correct_answer: a
- id: ch-d3-q2
  type: FILL_BLANK
  prompt: 'Female Anopheles mosquitoes peak biting time is between ___h and ___h. The incubation period
    for P. falciparum in the human after a bite is ___ to ___ days.

    '
  xp_reward: 50
  correct_answer:
  - 2200h
  - 0200h
  - '7'
  - '14'
  explanation: 'Peak biting 2200h-0200h is why sleeping under an ITN during these hours is the primary
    protection. Incubation of 7-14 days means a returning traveller may not be symptomatic until 2 weeks
    after the infective bite — important for clinical history taking.

    '
- id: ch-d3-q3
  type: MATCH_PAIRS
  prompt: Match each severe malaria danger sign to its physiological cause.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Coma or impaired consciousness
    right:
      id: r-08675d
      text: Cerebral malaria — parasitised RBCs sequestered in brain capillaries
  - left:
      id: l2
      text: Dark (cola-coloured) urine
    right:
      id: r-59a1c2
      text: Blackwater fever — massive haemolysis releasing haemoglobin in urine
  - left:
      id: l3
      text: Severe anaemia (Hb < 5 g/dL)
    right:
      id: r-618656
      text: Destruction of red blood cells by parasite replication cycles
  - left:
      id: l4
      text: Hypoglycaemia (glucose < 2.2 mmol/L)
    right:
      id: r-136187
      text: Parasite glucose consumption + impaired hepatic gluconeogenesis
  correct_answer:
  - l1=r-08675d
  - l2=r-59a1c2
  - l3=r-618656
  - l4=r-136187
  explanation: 'P. falciparum causes severe disease through multiple mechanisms acting simultaneously.
    Each danger sign reflects a different organ system failure and is an independent indication for urgent
    IV artesunate + referral.

    '
- id: ch-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'An RDT shows no line in the Control (C) position after 20 minutes. What should the community
    health worker do?

    '
  xp_reward: 50
  options:
  - id: a
    text: The patient is negative for malaria — treat the fever as another cause
  - id: b
    text: The patient is strongly positive — two lines always indicate severe infection
  - id: c
    text: Give ACT immediately as a precaution since the result is unclear
  - id: d
    text: The test is invalid — discard it and repeat with a new RDT kit
  explanation: 'The control line must always appear — its presence confirms the test ran correctly. No
    C line = invalid test regardless of T line status. Repeat with a new kit from a different lot if repeated
    invalids occur (possible storage problem).


    Why the other options are wrong: No C line does not mean negative. It means the test failed. A valid
    negative shows C line only. Without C line the test gives no diagnostic information. A positive result
    shows C + T lines. No C line means invalid, regardless of whether T appears. The test has not functioned
    correctly. Kenya NMCP guidelines: treat only confirmed positives. Give empirical ACT only in high-transmission
    areas when RDT is unavailable. Repeat the test first.'
  correct_answer: d
- id: ch-d3-q5
  type: FILL_BLANK
  prompt: 'Long-lasting insecticidal nets (LLINs) retain efficacy for approximately ___ years and reduce
    child malaria mortality by approximately ___%. A patient who vomits AL within ___ minutes of a dose
    should receive the same dose again.

    '
  xp_reward: 50
  correct_answer:
  - 3 years
  - 50%
  - 30 minutes
  explanation: 'LLINs: factory-impregnated to last 3 years even with washing. 50% mortality reduction
    (RCT evidence, WHO malaria report 2023). AL vomiting: if < 30 minutes since ingestion, repeat the
    same dose (the tablet has not been absorbed). If > 30 minutes, do not repeat (assume absorbed even
    if some vomiting occurs).

    '
