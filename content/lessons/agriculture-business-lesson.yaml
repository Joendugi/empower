id: "agriculture-business-lesson"
course_id: "agriculture"
title: "Records, costs, and selling the crop"
title_sw: "Kumbukumbu, gharama, na soko"
briefing: "A farm without records is a hobby. Write seed, fertiliser, labour, water, and chemical costs. Weigh or count yields. Then you can say whether the enterprise made money.\n\nPost-harvest: drying, storage pests, and clean bags. Aflatoxin in poorly dried maize is a health and market disaster. Grade produce; mixing rotten tomatoes with good ones loses the whole crate.\n\nMarketing: know the buyer’s standard (size, pesticide PHI — pre-harvest interval). Selling before PHI is how consignments get rejected and people get poisoned.\n\nSimple cash flow: money for harvest labour must exist before the broker pays. That is agribusiness, not “the rain will provide”."
briefing_sw: "Andika gharama na mavuno. Kausha na hifadhi vizuri. Usiuze kabla ya PHI. Usichanganye mazao mabovu na mazuri. Biashara ni hesabu."
estimated_minutes: 16
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AGR/CR/03/5"
exam_domain: "Agribusiness"
exercises:
  - id: "agriculture-business-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Pre-harvest interval (PHI) is:"
    options:
      - id: "a"
        text: "How long to wait after spraying before harvest"
      - id: "b"
        text: "The length of the shamba"
      - id: "c"
        text: "A bank loan"
      - id: "d"
        text: "pH of the market"
    correct_answer: "a"
    hint: "Residue on food."
    explanation: "Harvest too soon and you sell poison."
    xp_reward: 50
  - id: "agriculture-business-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Mixing rotten and good fruit in one crate usually:"
    options:
      - id: "a"
        text: "Saves the rotten"
      - id: "b"
        text: "Spreads spoilage and loses grade"
      - id: "c"
        text: "Raises price"
      - id: "d"
        text: "Replaces drying"
    correct_answer: "b"
    hint: "One bad tomato."
    explanation: "Grade. Then pack."
    xp_reward: 50
  - id: "agriculture-business-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Farm records should include:"
    options:
      - id: "a"
        text: "Only WhatsApp jokes"
      - id: "b"
        text: "Inputs, dates, quantities, yields, and sales"
      - id: "c"
        text: "The neighbour’s PIN"
      - id: "d"
        text: "Rainfall on the moon"
    correct_answer: "b"
    hint: "Numbers."
    explanation: "Without records you cannot improve or access some finance."
    xp_reward: 50
  - id: "agriculture-business-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Poorly dried maize in store is a risk for:"
    options:
      - id: "a"
        text: "Extra protein"
      - id: "b"
        text: "Mould / aflatoxin and market rejection"
      - id: "c"
        text: "Higher germination in the plate"
      - id: "d"
        text: "Lower labour"
    correct_answer: "b"
    hint: "Moisture plus fungus."
    explanation: "Dry, clean, inspect. Aflatoxin kills and closes markets."
    xp_reward: 50
  - id: "agriculture-business-fb1"
    type: "FILL_BLANK"
    prompt: "The wait between last spray and picking the crop is the pre-harvest ___."
    correct_answer: "interval"
    hint: "PHI."
    explanation: "PHI protects the eater and the sale."
    xp_reward: 50
  - id: "agriculture-business-scenario"
    type: "SCENARIO"
    prompt: "A broker offers a higher price if you harvest tomatoes two days after spraying a pesticide with a 7-day PHI. You:"
    options:
      - id: "a"
        text: "Take the price"
      - id: "b"
        text: "Refuse; harvest after PHI even if the price drops"
      - id: "c"
        text: "Wash once and call it organic"
      - id: "d"
        text: "Spray again to be sure"
    correct_answer: "b"
    hint: "Food safety over cash today."
    explanation: "This is professional ethics in agribusiness."
    xp_reward: 60
