id: "welding-fabrication-weld-test-lesson"
course_id: "welding-fabrication"
title: "Week 7 — Weld testing: visual, bend, and when NDT is required"
title_sw: "Wiki 7 — Majaribio ya weld"
briefing: "Weld testing is a CDACC core (visual plus mechanical/NDT introduction). Start with visual: size, profile, undercut, overlap, porosity, slag, incomplete fusion, cracks, and spatter. Use a fillet gauge. A pretty ripple with undercut at the toe fails. Lighting and slag fully chipped — you cannot inspect through slag.\n\nDestructive tests in college: nick-break, face/root bend, and sometimes a macro etch. Bends reveal lack of fusion that visual missed. Non-destructive: dye penetrant (surface cracks), MPI on ferritic steel, and ultrasonics/radiography in industry. You will not run a gamma source without a licence; you must know when to call that test.\n\nAcceptance is against a code or the college WPS, not against “it held my weight”. Repair: grind to sound metal, re-weld, re-test. Peening cracks closed or filling with silicone is malpractice.\n\nPortfolio: a visual report with sketches, a bend result, and a sentence on why a cracked tandem-trailer hitch must not leave the bay. That is professional welding, not hobby art."
briefing_sw: "Visual: ukubwa, undercut, porosity, nyufa. Fillet gauge. Bend/nick-break vinaonyesha fusion. Dye penetrant. Usipake rangi juu ya crack. Rekodi majaribio."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/WEL/CR/07/5"
exam_domain: "Weld testing"
exercises:
  - id: "welding-fabrication-weld-test-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Undercut is:"
    options:
      - id: "a"
        text: "Extra reinforcement"
      - id: "b"
        text: "A groove melted into the parent at the toe, reducing thickness"
      - id: "c"
        text: "A type of gas"
      - id: "d"
        text: "Always acceptable"
    correct_answer: "b"
    hint: "Toe groove."
    explanation: "It is a stress raiser. Depth limits are in the spec."
    xp_reward: 50
  - id: "welding-fabrication-weld-test-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A root bend that opens along the fusion line indicates:"
    options:
      - id: "a"
        text: "Perfect procedure"
      - id: "b"
        text: "Likely lack of fusion / incomplete penetration"
      - id: "c"
        text: "Too much slag colour"
      - id: "d"
        text: "Correct flashback arrestors"
    correct_answer: "b"
    hint: "Destructive test."
    explanation: "Visual passed; the bend did not. That is why testing exists."
    xp_reward: 50
  - id: "welding-fabrication-weld-test-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Dye penetrant testing is suited to:"
    options:
      - id: "a"
        text: "Buried volumetric flaws only"
      - id: "b"
        text: "Surface-breaking defects on suitable materials"
      - id: "c"
        text: "Measuring voltage"
      - id: "d"
        text: "Replacing visual entirely"
    correct_answer: "b"
    hint: "Surface."
    explanation: "Clean, apply penetrant, dwell, remove, developer, inspect. Follow the kit."
    xp_reward: 50
  - id: "welding-fabrication-weld-test-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Painting over a visible crack on a lifting eye is:"
    options:
      - id: "a"
        text: "Industry standard"
      - id: "b"
        text: "Dangerous concealment — repair or reject to procedure"
      - id: "c"
        text: "A type of NDT"
      - id: "d"
        text: "Required before bend tests"
    correct_answer: "b"
    hint: "Safety critical."
    explanation: "Testing without honesty is worse than no testing."
    xp_reward: 50
  - id: "welding-fabrication-weld-test-fb1"
    type: "FILL_BLANK"
    prompt: "Checking a fillet size with a purpose-made gauge is a ___ inspection."
    correct_answer: "visual"
    hint: "VT."
    explanation: "Visual testing is still NDT. Do it first, every time."
    xp_reward: 50
  - id: "welding-fabrication-weld-test-scenario"
    type: "SCENARIO"
    prompt: "School gate welds pass a 10-second glance. A bend test from a coupon of the same WPS splits. You should:"
    options:
      - id: "a"
        text: "Ship the gate — coupons are theory"
      - id: "b"
        text: "Hold the job: investigate procedure, repair, and re-qualify as the instructor requires"
      - id: "c"
        text: "Add more paint"
      - id: "d"
        text: "Switch off the extractor"
    correct_answer: "b"
    hint: "Test represents the work."
    explanation: "CDACC weld testing is how fabrication earns the stamp, not how it earns a selfie."
    xp_reward: 60
