id: "sewing-garment-machine-lesson"
course_id: "sewing-garment"
title: "Lockstitch machine and workshop safety"
title_sw: "Mashine ya lockstitch na usalama"
briefing: "Fashion practicals start at the table, not at the pattern. Unplug the iron when you leave the board. Cover the needle, and never sew with the presser foot up. A lockstitch machine forms a stitch when the needle thread loops around the bobbin thread. If the machine is threaded wrong — especially missing the take-up lever — you get bird’s nests, skipped stitches, or a jammed hook.\n\nNeedle size must match fabric: 70/10 or 80/12 for shirting, 90/14 or 100/16 for denim and canvas. A blunt or bent needle on heavy cloth is the usual cause of skipped stitches, not “the machine is old”. Stitch length is typically 2.0–2.5 mm for construction seams and longer for basting. Tension discs must be closed when you thread; the thread sits between them, not on top.\n\nBobbin winding should be even. Drop the bobbin so it rotates the way the machine manual shows, pull the thread through the slot, and hold both threads to the back before the first stitch. At the end of a seam, reverse two or three stitches, then cut threads with the thread cutter or snips — not by yanking the garment.\n\nCDACC/NITA assessors watch whether you can thread independently, sew a straight seam on calico, and leave the station safe. That is the first unit, before any fashion drawing."
briefing_sw: "Anza na usalama: zima pasi, funika sindano. Lockstitch inahitaji uzi wa needle na bobbin kukutana. Chagua sindano kulingana na kitambaa: 80/12 kwa shirting, 90/14 au 100/16 kwa denim. Tension na take-up lever ni muhimu. Kadiria stitch 2.0–2.5 mm. Wakaguzi wanatazama kama unaweza kushona mshono sawa na kuacha meza salama."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/01/5"
exam_domain: "Machine skills & OSHA"
media:
  - kind: "animation"
    preset: "stitch"
    caption: "Lockstitch path — needle, hook, and bobbin must meet in time."
exercises:
  - id: "sewing-garment-machine-media"
    type: "MEDIA"
    prompt: "Watch the stitch animation, then confirm you can explain how a lockstitch is formed."
    correct_answer: "watched"
    hint: "Play or watch the demonstration, then confirm."
    explanation: "You confirmed that the demonstration was completed."
    xp_reward: 20
    media:
      - kind: "animation"
        preset: "stitch"
        mustFinish: true
        caption: "Confirm the stitch path before the written items."
  - id: "sewing-garment-machine-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A lockstitch skips on denim. What should you check first?"
    options:
      - id: "a"
        text: "The classroom Wi-Fi"
      - id: "b"
        text: "Needle size and condition, threading path, and tension discs"
      - id: "c"
        text: "Whether the mannequin is new"
      - id: "d"
        text: "Pinking shears only"
    correct_answer: "b"
    hint: "Skipped stitches are mechanical, not decorative."
    explanation: "Heavy fabric needs a larger, sharp needle, a complete thread path through the take-up, and balanced tension."
    xp_reward: 50
  - id: "sewing-garment-machine-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Why must the presser foot be down before you sew?"
    options:
      - id: "a"
        text: "It looks professional in photos"
      - id: "b"
        text: "It holds fabric and engages the top tension so stitches form correctly"
      - id: "c"
        text: "It cools the motor"
      - id: "d"
        text: "NITA bans feet-up sewing only at night"
    correct_answer: "b"
    hint: "Tension is not applied with the foot up on most lockstitch machines."
    explanation: "Sewing with the foot up gives loops, poor feed, and broken needles."
    xp_reward: 50
  - id: "sewing-garment-machine-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Typical construction stitch length on woven shirting is about:"
    options:
      - id: "a"
        text: "0.2 mm"
      - id: "b"
        text: "2.0–2.5 mm"
      - id: "c"
        text: "12 mm"
      - id: "d"
        text: "One stitch per collar"
    correct_answer: "b"
    hint: "Basting is longer; construction is medium."
    explanation: "About 2–2.5 mm (roughly 10–12 SPI) is standard. Tiny stitches perforate; huge stitches look homemade and weak."
    xp_reward: 50
  - id: "sewing-garment-machine-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "When you leave the ironing board you should:"
    options:
      - id: "a"
        text: "Leave the iron face-down on the garment"
      - id: "b"
        text: "Stand the iron safely and unplug as required by workshop rules"
      - id: "c"
        text: "Spray water on the element"
      - id: "d"
        text: "Balance it on the machine bed"
    correct_answer: "b"
    hint: "Burns and fires start from abandoned irons."
    explanation: "College workshops treat a live iron as a fire source. Unplug and set it on the rest."
    xp_reward: 50
  - id: "sewing-garment-machine-fb1"
    type: "FILL_BLANK"
    prompt: "The lower thread supply that meets the needle thread in a lockstitch is wound on a ___."
    correct_answer: "bobbin"
    hint: "Small metal or plastic spool under the needle plate."
    explanation: "Needle thread and bobbin thread lock in the fabric. Wrong bobbin insertion causes loops underneath."
    xp_reward: 50
  - id: "sewing-garment-machine-scenario"
    type: "SCENARIO"
    prompt: "A trainee’s first seam is a nest of loops on the underside. The top looks almost straight. What is the professional diagnosis?"
    options:
      - id: "a"
        text: "Buy a new machine immediately"
      - id: "b"
        text: "Re-thread the top path (take-up and tension) and re-seat the bobbin case"
      - id: "c"
        text: "Increase stitch length to 8 mm and ignore it"
      - id: "d"
        text: "Oil the fabric"
    correct_answer: "b"
    hint: "Loops underneath usually mean top threading or tension, not a new motor."
    explanation: "Underside looping is the classic “top thread not in tension / missed take-up” fault. Re-thread with the foot up, then down, and test on scrap."
    xp_reward: 60
