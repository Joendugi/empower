briefing: 'Diesel engines power essential heavy equipment: agricultural tractors, milling machinery, water
  well drilling rigs, and backup generators. While raw vegetable oil can run in a warm engine briefly,
  its high viscosity (10 times higher than petrodiesel) quickly leads to injector coking, piston ring
  sticking, and engine seizure. Through chemical transesterification, triglycerides are reacted with an
  alcohol in the presence of a strong base catalyst to strip the heavy glycerol backbone, producing Fatty
  Acid Methyl/Ethyl Esters (FAME/FAEE) with viscosity and cetane ratings matching commercial petrodiesel.

  '
outline: 'Transesterification stoichiometry (1 triglyceride + 3 alcohol -> 3 fatty acid esters + 1 glycerol);
  alcohol options (methanol vs bio-ethanol); catalyst selection (anhydrous NaOH or KOH); free fatty acid
  (FFA) titration using 0.1% NaOH and phenolphthalein/turmeric indicator; the soap problem (moisture +
  FFA forms soap, preventing separation); batch processor design (sealed 200L oil drum, water heater element,
  55°C temperature control, circulation pump); gravity settling and bottom glycerol draining; bubble washing
  and dry washing with wood ash; the 3/27 conversion test (fuel quality verification).

  '
content_md: "## Why Raw Vegetable Oil Destroys Diesel Engines\n\nDiesel fuel systems rely on precise spray\
  \ atomization through micro-orifices (0.15 mm)\nat injection pressures of 200–2,000 bar:\n- **Kinematic\
  \ Viscosity of Petrodiesel**: **2.5 to 3.5 cSt** at 40°C.\n- **Kinematic Viscosity of Raw Vegetable\
  \ Oil**: **35 to 50 cSt** at 40°C (over 10 times too thick).\n\nWhen raw oil is sprayed into a combustion\
  \ chamber:\n1. The thick droplets fail to vaporize, striking cold cylinder walls.\n2. Incomplete combustion\
  \ generates hard polycyclic carbon deposits (**coking**) that bake onto injector tips.\n3. Unburned\
  \ oil migrates past the piston rings into the crankcase, polymerizing with lubricating oil into a thick\
  \ jelly that starves the oil pump, throwing connecting rod bearings.\n\n## Transesterification Chemistry\n\
  \nTransesterification strips the bulky 3-carbon glycerol backbone and replaces it\nwith short single-carbon\
  \ (methyl) or two-carbon (ethyl) chains:\n\n$$\\begin{matrix}\n\\text{CH}_2-\\text{OOC}-\\text{R}_1\
  \ \\\\\n\\mid \\\\\n\\text{CH}-\\text{OOC}-\\text{R}_2 \\\\\n\\mid \\\\\n\\text{CH}_2-\\text{OOC}-\\\
  text{R}_3\n\\end{matrix}\n+ 3\\,\\text{R}'\\text{OH} \\xrightarrow{\\text{Base Catalyst}}\n\\begin{matrix}\n\
  \\text{CH}_2-\\text{OH} \\\\\n\\mid \\\\\n\\text{CH}-\\text{OH} \\\\\n\\mid \\\\\n\\text{CH}_2-\\text{OH}\n\
  \\end{matrix}\n+\n\\begin{matrix}\n\\text{R}_1-\\text{COO}-\\text{R}' \\\\\n\\text{R}_2-\\text{COO}-\\\
  text{R}' \\\\\n\\text{R}_3-\\text{COO}-\\text{R}'\n\\end{matrix}$$\n\n$$\\text{Triglyceride} + 3\\,\\\
  text{Alcohol} \\xrightarrow{\\text{KOH / NaOH}} \\text{Glycerol} + 3\\,\\text{Biodiesel Esters}$$\n\n\
  - Viscosity drops from **40 cSt down to 4.2 cSt** (fully engine-safe).\n- Cetane number increases from\
  \ 35–40 to **50–55** (excellent ignition quality).\n\n## Feedstocks in East Africa\n- **Jatropha curcas**:\
  \ Non-edible drought-hardy shrub; seeds yield 30%–35% oil.\n- **Croton megalocarpus**: Abundant indigenous\
  \ Kenyan tree; seeds contain 30% high-energy oil with low free fatty acids.\n- **Castor Oil**: High\
  \ viscosity; useful in blends (10%–20%).\n- **Waste Vegetable Cooking Oil (WVO)**: Collected from restaurants;\
  \ contains high Free Fatty Acids (FFA) and water, requiring filtering and titration.\n\n## Chemical\
  \ Quantities & Stoichiometry (per 1,000 mL Oil)\n\nStoichiometrically, 1 mole of triglyceride requires\
  \ 3 moles of alcohol. In practice,\nwe use a **100% stoichiometric excess** (approx. 6:1 molar ratio)\
  \ to drive the\nequilibrium reaction to 99%+ completion:\n\n| Reagent | Preferred Spec | Quantity per\
  \ 1 Litre Oil |\n|---|---|---|\n| **Vegetable Oil** | Dry (< 0.1% water), filtered to 5 microns | **1,000\
  \ mL** |\n| **Methanol** ($\\text{CH}_3\\text{OH}$) | 99.8% anhydrous pure | **200 mL** (20% by volume)\
  \ |\n| *Or Bio-Ethanol* ($\\text{C}_2\\text{H}_5\\text{OH}$) | 99.5% anhydrous (requires 3A sieves)\
  \ | **240 mL** (reaction runs slower, requires KOH) |\n| **Potassium Hydroxide ($\\text{KOH}$)** | 85%–90%\
  \ purity flakes | **7.0 grams** (base) + titration extra |\n| *Or Sodium Hydroxide ($\\text{NaOH}$)*\
  \ | 98%+ purity crystals | **5.0 grams** (base) + titration extra |\n\n## The Free Fatty Acid (FFA)\
  \ Titration\n\nUsed cooking oils and degraded seed oils contain Free Fatty Acids. When base catalyst\n\
  meets FFAs in the presence of moisture, it forms **soap** ($\\text{FFA} + \\text{NaOH} \\rightarrow\
  \ \\text{Soap} + \\text{H}_2\\text{O}$),\nwhich turns the entire 200 L reactor into an inseparable gel.\n\
  \n### Titration Procedure:\n1. Dissolve **1.0 gram of pure $\\text{NaOH}$** in **1,000 mL of distilled\
  \ water** (0.1% reference solution).\n2. Measure **10 mL of pure isopropanol (or 95% ethanol)** into\
  \ a small beaker; add 3 drops of phenolphthalein indicator (or 1 drop of yellow turmeric extract).\n\
  3. Add 0.1% NaOH drops until the alcohol turns faintly pink (pH 8.5) — this neutralizes the solvent.\n\
  4. Add **1.0 mL of the sample oil** and swirl vigorously.\n5. Using a graduated 1 mL syringe, titrate\
  \ the 0.1% NaOH solution dropwise into the oil-alcohol mix until a persistent pink colour lasts for\
  \ 30 seconds.\n6. **Calculation**: If it required **$X$ mL** of NaOH solution:\n   $$\\text{Total NaOH\
  \ per Litre of Oil} = 5.0\\text{ g (base catalyst)} + X\\text{ grams}$$\n   *(If using KOH, multiply\
  \ by 1.4: $\\text{Total KOH} = 7.0\\text{ g} + (X \\times 1.4)\\text{ grams}$)*.\n\n*Threshold Rule*:\
  \ If $X > 5\\text{ mL}$ (FFA > 5%), standard single-stage alkaline transesterification will fail. The\
  \ oil must undergo two-stage acid esterification (pretreatment with 1 mL/L concentrated sulfuric acid)\
  \ first.\n\n## Batch Processor Operation Sequence\n\n1. **Drying the Oil**: Heat filtered oil in a steel\
  \ drum to **105°C** until crackling/bubbling stops (all suspended water steam-flashes off). Cool down\
  \ to **55°C**.\n2. **Methoxide Preparation**:\n   - *DANGER: Toxic and blind-hazard fumes*. Mix methanol\
  \ and measured KOH flakes in a sealed HDPE container.\n   - Shake until all catalyst dissolves completely,\
  \ forming **potassium methoxide** ($\\text{KOCH}_3$). The reaction gets hot.\n3. **Reaction Run**:\n\
  \   - Add methoxide solution into the 55°C oil inside the closed reactor.\n   - **Keep below 60°C**\
  \ (methanol boils at 64.7°C; do not boil the alcohol off).\n   - Circulate vigorously through a closed\
  \ centrifugal pump or mechanical impeller for **60 to 90 minutes**.\n4. **Phase Separation (Settling)**:\n\
  \   - Allow the mixture to settle undisturbed in a conical-bottom tank for **8 to 12 hours**.\n   -\
  \ Two distinct layers form:\n     - **Top Layer (85%–90%)**: Golden-amber liquid — crude **Biodiesel\
  \ (FAME)**.\n     - **Bottom Layer (10%–15%)**: Dark brown, thick, viscous layer — **Glycerol / Soap\
  \ / Excess Catalyst**.\n5. **Draining**: Open the bottom drain valve to decant the thick dark glycerol\
  \ until the golden biodiesel begins to flow, then close the valve.\n\n## Fuel Washing & The 3/27 Quality\
  \ Test\n\nCrude biodiesel contains trace residual methanol, free glycerol, and microscopic soap.\n\n\
  ### Water Washing:\n1. Gently mist 20 L of warm water over 100 L of biodiesel without turbulent agitation\
  \ (prevents emulsion).\n2. Water droplets sink through the fuel, scrubbing polar impurities.\n3. Drain\
  \ the cloudy milky water from the conical bottom after 2 hours. Repeat 2–3 times until the rinse water\
  \ drains crystal clear.\n4. Reheat fuel to **100°C** for 15 minutes to flash off residual water until\
  \ the fuel is bright and clear (\"sparkling\").\n\n### The 3/27 Completeness of Reaction Test:\nBefore\
  \ pouring into an expensive tractor engine:\n- Add **3.0 mL of dry finished biodiesel** into **27.0\
  \ mL of pure room-temperature methanol** (1:9 ratio) inside a glass vial.\n- Shake for 10 seconds and\
  \ let sit for 15 minutes.\n- **PASS**: The biodiesel dissolves completely into the methanol, remaining\
  \ clear and transparent.\n- **FAIL**: Any droplet, haze, or fallout at the bottom indicates unreacted\
  \ triglycerides (incomplete conversion); the fuel will coke injectors and must be reprocessed.\n"
exercises:
- id: chem-d4-q1
  type: MULTIPLE_CHOICE
  prompt: 'A batch of used cooking oil requires 3.2 mL of 0.1% NaOH during titration. Using pure NaOH
    crystals, how much total catalyst should be dissolved into methanol per 1 litre of this oil for complete
    transesterification?

    '
  xp_reward: 50
  options:
  - id: a
    text: 3.2 grams of NaOH
  - id: b
    text: 5.0 grams of NaOH
  - id: c
    text: 11.5 grams of NaOH
  - id: d
    text: 8.2 grams of NaOH (5.0 g base + 3.2 g titration extra)
  explanation: 'Standard base catalyst for dry virgin oil is 5.0 g NaOH per litre. The titration result
    (3.2 mL of 0.1% solution) directly indicates 3.2 g of extra NaOH needed to neutralize the free fatty
    acids: 5.0 + 3.2 = 8.2 g/L.


    Why the other options are wrong: 3.2 g only neutralizes the free fatty acids; it leaves zero catalyst
    for the actual transesterification reaction. 5.0 g is the base amount for pure fresh oil with zero
    FFAs. In used oil, FFAs would consume part of this 5.0 g, causing reaction failure. This excessive
    amount would trigger severe saponification and lock the reactor into a solid gel.'
  correct_answer: d
- id: chem-d4-q2
  type: FILL_BLANK
  prompt: 'During the batch transesterification of vegetable oil with methanol and KOH, the reactor temperature
    should be maintained at approximately ___ degrees C, because exceeding 64.7°C causes the alcohol to
    ___ and escape as vapor.

    '
  xp_reward: 50
  correct_answer:
  - '55'
  - boil
  explanation: 'Reaction kinetics are fast and complete at 50°C-55°C. Methanol boils at 64.7°C, so staying
    below 60°C prevents boiling, overpressure, and toxic vapor loss.

    '
