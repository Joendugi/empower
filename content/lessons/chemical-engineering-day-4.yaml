    cleans the fuel.

    '
- id: chem-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'What is the mechanical consequence of running an unmodified direct-injection diesel engine
    on unheated, raw, unrefined vegetable oil over several weeks?

    '
  xp_reward: 50
  options:
  - id: a
    text: The engine runs too cool because vegetable oil has higher octane
  - id: b
    text: High kinematic viscosity (40 cSt vs 3 cSt) prevents droplet atomization, causing unburned fuel
      to glaze cylinder walls, stick piston rings, and coke injector nozzles
  - id: c
    text: The injection pump speeds up to dangerous RPM
  - id: d
    text: The exhaust emissions turn into pure nitrogen gas
  explanation: 'Raw oil viscosity is 10 times higher than diesel. Large droplets hit cylinder walls instead
    of burning in suspension, causing severe injector coking, blow-by, ring sticking, and crankcase oil
    polymerization.


    Why the other options are wrong: Diesel engines require cetane, not octane; high viscosity causes
    thermal and mechanical fouling, not cool running. The governor controls pump speed; thick oil actually
    strains and can snap pump drive shafts. Emissions increase with unburned hydrocarbons, acrolein, and
    heavy black carbon smoke.'
  correct_answer: b
- id: chem-d4-q5
  type: FILL_BLANK
  prompt: 'In the ''3/27'' fuel quality verification test, 3 mL of finished biodiesel is mixed into 27
    mL of pure ___. If the solution remains completely transparent with no fallout, the fuel ___ the conversion
    test.

    '
  xp_reward: 50
  correct_answer:
  - methanol
  - passes
  explanation: 'Pure biodiesel (FAME) is completely miscible in methanol at a 1:9 ratio. Unreacted mono-,
    di-, or triglycerides are insoluble and fall out as visible haze or oil droplets at the bottom.

    '
