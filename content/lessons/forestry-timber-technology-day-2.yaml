  explanation: 'Spudding cleans logs; end-sealing stops cracks; kerf is cutting waste; quarter-sawing
    creates dimensionally stable non-cupping planks.

    '
- id: for-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'A community has harvested 5 valuable timber logs and needs to produce 25 mm thick roofing boards.
    Why might the community choose manual pit sawing over an Alaskan chainsaw mill for this specific job?

    '
  xp_reward: 50
  options:
  - id: a
    text: The pit saw's narrow 3 mm kerf recovers nearly 90% of the log volume as usable boards, whereas
      the chainsaw mill's 10 mm kerf turns nearly 30% of the log into wasted sawdust
  - id: b
    text: Because pit sawing requires zero human physical effort
  - id: c
    text: Because chainsaws cannot cut hardwood trees
  - id: d
    text: Because pit-sawn lumber does not require drying
  explanation: 'Kerf thickness is critical when cutting thin 25 mm boards. A chainsaw blade grinds 10
    mm into dust for every 25 mm board cut (destroying nearly a third of the tree). The thin 3 mm pit
    saw blade produces 20-25% more finished boards from scarce timber.


    Why the other options are wrong: Pit sawing is exhausting, grueling manual labor. Chainsaws cut hardwoods
    easily, but waste significant wood volume as kerf. All green lumber must be dried before construction
    regardless of conversion method.'
  correct_answer: a
- id: for-d2-q5
  type: FILL_BLANK
  prompt: 'Alternate teeth on a pit saw blade are bent slightly to the left and right in a mechanical
    adjustment called the ___, which creates a kerf wider than the blade body to prevent the saw from
    ___ inside the cut.

    '
  xp_reward: 50
  correct_answer:
  - set
  - binding
  explanation: 'Tooth set (0.5 mm offset on each side) creates clearance. Without set, wood friction clamps
    onto the saw blade body, locking it motionless.

    '
