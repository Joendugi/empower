briefing: 'A round tree trunk lying in the mud cannot frame a clinic or build a bridge; it must be converted
  into dimensioned structural lumber (posts, rafters, purlins, planks). In remote forests without heavy
  industrial band sawmills, lumber conversion relies on two decentralized technologies: the classical
  two-man Pit Saw (zero-fuel manual conversion using human muscle) and the portable Chainsaw Alaskan Mill
  (gasoline-powered precision slabbing). This lesson covers log debarking, chalk line layout geometry,
  saw tooth set and kerf thickness calculations, pit sawyer roles (Topman vs Pitman), ripping chain geometry
  (10° top plate angle), and sawing patterns (through-and-through vs quarter sawing).

  '
outline: 'Log preparation: debarking to eliminate grit/stones, end-coating with wax to prevent drying
  checks; snapping parallel layout chalk lines; the mechanics of the Two-Man Pit Saw (long tapered blade,
  2.0 to 2.5 m, rip-filed teeth cutting on the downstroke); crew roles: the Topman (steers line from above)
  and the Pitman (powers downstroke in the pit); portable Chainsaw Alaskan Mills: aluminum guide rails,
  clamp carriages; the physics of the Ripping Chain (10° cutter angle vs standard 30° crosscut, scoring
  wood along end grain); kerf width analysis (3 mm pit saw vs 9 mm chainsaw mill) and percentage recovery
  yields; sawing patterns: Plain/Through-and-Through vs Quarter Sawing.

  '
content_md: "## The Challenge of Primary Timber Conversion\n\nPrimary conversion is the process of breaking\
  \ down a cylindrical log into square-edged,\nflat lumber.\nIn off-grid regions, heavy industrial diesel\
  \ sawmills cannot access roadless mountain\nforests. The timber must be milled right at the stump where\
  \ the tree fell:\n- **The Pit Saw (Manual)**: Driven entirely by human power; uses a thin-kerf blade\
  \ (3 mm); produces zero fuel emissions; whisper-quiet; highly labor intensive.\n- **The Alaskan Chainsaw\
  \ Mill (Mechanized)**: Driven by a heavy 70cc–90cc two-stroke engine mounted on a rigid aluminum frame;\
  \ highly portable; wide kerf (9 mm); fast production.\n\n## Log Preparation & The Snapping Line\n\n\
  Sawing straight lumber from a crooked log begins with layout:\n1. **Debarking (Spudding)**:\n   - Strip\
  \ the outer bark completely using an iron **bark spud** or sharpened spade.\n   - *Why*: Tree bark traps\
  \ wind-blown volcanic silica and sand grains that dull hand-saw teeth in 5 minutes and ruin chainsaw\
  \ chains!\n2. **End-Sealing**:\n   - Paint the exposed end-grain of the log immediately with melted\
  \ candle wax, bituminous roofing tar, or thick slaked lime slurry.\n   - *Why*: Water evaporates through\
  \ end-grain **10 to 15 times faster** than through radial bark, causing severe radial splitting (*end-checks*)\
  \ that ruins the first 50 cm of the log.\n3. **Snapping the Cut Lines**:\n   - Dip a long cotton string\
  \ into a slurry of water and black wood soot (or red ochre / chalk).\n   - Stretch the string taut between\
  \ measured tick marks on both log ends.\n   - Pluck the string vertically: it snaps against the white\
  \ wood, leaving a razor-sharp, dead-straight black reference guideline across the entire 4-metre log\
  \ length.\n\n## The Classical Two-Man Pit Saw\n\nUsed across East African highland forests for over\
  \ a century:\n\n```\n                     [ TOPMAN (Guides the Line & Lifts) ]\n                   \
  \                 ▲\n                                    │\n          ══════════════════════════╪════════════════════════════\n\
  \           LOG RESTING ON HEAVY TRESTLES OVER PIT\n          ══════════════════════════╪════════════════════════════\n\
  \                                    │\n                                    ▼\n                    \
  \ [ PITMAN (Powers the Heavy Downstroke) ]\n```\n\n### Anatomy of the Pit Saw:\n- A heavy steel blade\
  \ **2.0 to 2.5 metres long**, wider at the top handle (tiller) and tapering toward the bottom handle\
  \ (box).\n- **Teeth Geometry**: Large rip teeth (20 mm to 25 mm pitch) filed with a **0° to 5° rake\
  \ angle**. The teeth are shaped like miniature wood-chisels designed to cut wood strictly on the **downward\
  \ stroke**.\n- **The Saw Tooth Set**: Alternate teeth are bent left and right by **0.5 mm**. This creates\
  \ a cut kerf wider than the blade thickness, preventing the saw body from pinching inside the log.\n\
  \n### Crew Roles & Dynamics:\n- **The Topman (Leader)**:\n  - Stands on top of the log high in the air.\n\
  \  - Sights straight down the blade against the black chalk line, steering the tiller handle with millimeter\
  \ precision.\n  - Pulls the saw upward on the return stroke (relieving cutting pressure).\n- **The Pitman\
  \ (Engine)**:\n  - Stands beneath the log inside an excavated 2.0-metre-deep pit (or below an elevated\
  \ wooden scaffold).\n  - Grasps the lower box handle and pulls **violently downward with full body weight**,\
  \ driving the chisel teeth through the timber.\n  - Wears a wide-brimmed hat or goggles to shield eyes\
  \ from the continuous blinding rain of falling sawdust.\n\n## The Chainsaw Alaskan Mill\n\nAn Alaskan\
  \ mill clamps a precision aluminum ladder frame directly onto the chainsaw guide bar:\n- A beginner\
  \ attempts to mill lumber using a standard crosscut chain and burns up the powerhead.\n- Milling requires\
  \ an **Alaskan Ripping Chain**:\n\n```\n   STANDARD CROSSCUT TEETH (30° Angle)         RIPPING CHAIN\
  \ TEETH (10° Angle)\n               \\                                          |\n                \\\
  \  30°                                    |  10°\n                 \\                              \
  \          |\n    (Severs wood fibers across grain)           (Shaves wood fibers along end-grain)\n\
  ```\n\n### Why Ripping Chains Differ:\n- Wood fibers in a log run parallel like straws in a box.\n-\
  \ Slicing along the grain with a 30° crosscut chain tears out long, stringy fibers (*angel hair*) that\
  \ clog the sprocket cover, stalling the engine.\n- **Ripping Teeth are filed at a flat 10° angle**:\
  \ The cutter acts like a miniature hand-plane, peeling off microscopic wafer-thin wood shavings cleanly\
  \ without bogging the saw.\n\n## Kerf Loss & Recovery Yields\n\nThe **kerf** is the width of wood pulverized\
  \ into sawdust by the saw blade:\n- **Pit Saw Kerf**: **3.0 mm** (0.12 inches).\n- **Bandsaw Kerf**:\
  \ **2.0 mm to 2.5 mm**.\n- **Chainsaw Mill Kerf**: **9.0 mm to 10.0 mm** (3/8\" chain with side clearance).\n\
  \n### The Kerf Penalty in Lumber Recovery:\nSuppose you are sawing a log into **25 mm (1-inch) thick\
  \ planks**:\n- With a **Chainsaw Mill (10 mm kerf)**:\n  $$\\text{Total Wood per Plank} = 25\\text{\
  \ mm (wood)} + 10\\text{ mm (sawdust)} = 35\\text{ mm}$$\n  $$\\text{Lumber Recovery Efficiency} = \\\
  frac{25}{35} = \\mathbf{71.4\\%} \\quad (\\text{28.6\\% turned into sawdust!})$$\n- With a **Pit Saw\
  \ (3 mm kerf)**:\n  $$\\text{Total Wood per Plank} = 25\\text{ mm (wood)} + 3\\text{ mm (sawdust)} =\
  \ 28\\text{ mm}$$\n  $$\\text{Lumber Recovery Efficiency} = \\frac{25}{28} = \\mathbf{89.3\\%} \\quad\
  \ (\\text{Only 10.7\\% lost as sawdust})$$\n- *Engineering Trade-Off*: The chainsaw mill is 10 times\
  \ faster, but the manual pit saw yields **25% more usable building boards** from the exact same tree!\n\
  \n## Sawing Patterns: Plain vs Quarter Sawing\n\nThe orientation of cuts relative to the tree's annual\
  \ growth rings determines whether\nboards will cup, warp, or stay flat:\n\n### 1. Plain Sawing (Through-and-Through\
  \ / Flat Sawn):\n- Cut straight through the log in parallel horizontal slices.\n- Growth rings run parallel\
  \ to the wide face of the board ($< 45^\\circ$).\n- **Pros**: Fastest method; near-zero wasted wood.\n\
  - **Cons**: High tendency to **cup and warp** as it dries (tangential shrinkage is twice radial shrinkage).\n\
  \n### 2. Quarter Sawing (Radial Sawn):\n- Log is split into 4 quarters; boards are cut radiating inward\
  \ toward the center pith.\n- Growth rings run perpendicular to the face (**60° to 90°**).\n- **Pros**:\
  \ Outstanding dimensional stability; will not cup or twist; expands and shrinks 50% less; beautiful\
  \ ray-fleck grain (ideal for furniture, doors, flooring).\n- **Cons**: More complex repositioning; lower\
  \ board-foot recovery.\n"
exercises:
- id: for-d2-q1
  type: MULTIPLE_CHOICE
  prompt: 'A sawyer is setting up a 70cc chainsaw with an Alaskan mill to rip a hardwood log into dimensional
    framing planks. Why must a specialized ''Ripping Chain'' with a 10° cutter top-plate angle be installed
    instead of a standard 30° crosscut chain?

    '
  xp_reward: 50
  options:
  - id: a
    text: The 10° cutter angle acts like a miniature plane, shaving end-grain fibers cleanly into fine
      chips, whereas 30° crosscut teeth tear out long stringy 'angel-hair' fibers that instantly choke
      the saw sprocket and stall the engine
  - id: b
    text: Because 30° chains are illegal to use on fallen logs
  - id: c
    text: To make the chainsaw run twice as fast
  - id: d
    text: Because 10° chains never need sharpening
  explanation: 'Cutting parallel to wood grain requires a planing chisel action (10° angle). Standard
    30° crosscut teeth tear long strings that wrap around the clutch drum and pack the bar gullet, causing
    severe engine bogging and rough, grooved boards.


    Why the other options are wrong: There is no legal restriction; it is a purely mechanical wood-cutting
    physics problem. Engine RPM is limited by the governor; ripping chains actually experience higher
    resistance. Ripping chains must be filed frequently due to high end-grain wear.'
  correct_answer: a
- id: for-d2-q2
  type: FILL_BLANK
  prompt: 'In traditional two-man pit sawing, the saw blade is designed to cut wood strictly on the ___
    stroke, driven by the body weight of the ___ standing beneath the log inside the pit.

    '
  xp_reward: 50
  correct_answer:
  - downward
  - Pitman
  explanation: 'The teeth point downward with negative rake; cutting occurs on the downstroke powered
    by the Pitman below, while the Topman above steers the line and lifts.

    '
