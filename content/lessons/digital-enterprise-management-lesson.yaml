id: "digital-enterprise-management-lesson"
course_id: "digital-enterprise"
title: "Week 3 — Business model, operations, people, and customer systems"
title_sw: "Wiki 3 — Business model na usimamizi"
briefing: "A business model explains who the customer is, what problem you solve, why they choose you, how you deliver, and how money remains after costs. “I repair cars” is too broad. “Same-day cooling-system diagnosis for matatu operators, with written pressure-test results” is a defined offer. Validate demand by interviewing customers, observing current alternatives, and testing a small paid service—not by asking friends whether they like the logo.\n\nOperations turn promises into repeatable work. Map enquiry → inspection → quotation → deposit → job card → quality test → balance → handover → aftercare. Set capacity: productive hours, bay or machine availability, and lead time. Work in progress that sits waiting for parts ties up cash. Use reorder levels for fast-moving stock, approve suppliers by quality and delivery, and count inventory regularly. Separate customer parts from business stock and label every job.\n\nPeople management requires job descriptions, safe induction, fair schedules, task supervision, feedback, and records. Do not call every worker an “independent contractor” to avoid lawful obligations. Separate duties where possible: the person receiving cash should not alone alter invoices and reconcile the till. Owner withdrawals are drawings, not wages hidden inside material cost.\n\nCustomer management: quote scope, exclusions, time, price, warranty, and approval for additional work. Complaints become data. Track on-time delivery, rework, gross margin, stock loss, repeat customers, and safety incidents. A weekly 20-minute review of those numbers is management; shouting at apprentices after a late job is not."
briefing_sw: "Eleza mteja, tatizo, value, delivery, na mapato. Tengeneza workflow kutoka quotation hadi handover. Dhibiti stock na reorder level. Job descriptions na usalama. Tenganisha cash, invoice, na reconciliation. Pima delivery, rework, margin, na complaints."
estimated_minutes: 34
license: "CC-BY-SA-4.0"
exam_domain: "Entrepreneurship — business management"
exercises:
  - id: "digital-enterprise-management-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which is the clearest value proposition?"
    options:
      - id: "a"
        text: "We do everything for everyone"
      - id: "b"
        text: "Documented same-day cooling-system diagnosis for local matatu operators"
      - id: "c"
        text: "Our workshop is blue"
      - id: "d"
        text: "We borrow money"
    correct_answer: "b"
    hint: "Customer + problem + result."
    explanation: "A focused offer guides marketing, tools, staffing, price, and quality."
    xp_reward: 50
  - id: "digital-enterprise-management-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A reorder level exists to:"
    options:
      - id: "a"
        text: "Buy all stock at once"
      - id: "b"
        text: "Trigger replenishment before expected demand uses the remaining stock"
      - id: "c"
        text: "Hide inventory theft"
      - id: "d"
        text: "Replace the job card"
    correct_answer: "b"
    hint: "Demand during supplier lead time."
    explanation: "Reorder level considers usage, lead time, and safety stock."
    xp_reward: 50
  - id: "digital-enterprise-management-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Why separate cash receipt, invoice changes, and reconciliation?"
    options:
      - id: "a"
        text: "To employ unnecessary people"
      - id: "b"
        text: "Segregation of duties reduces error and fraud"
      - id: "c"
        text: "Because customers cannot count"
      - id: "d"
        text: "To avoid keeping records"
    correct_answer: "b"
    hint: "One person should not control the whole transaction."
    explanation: "Small businesses can use owner review, numbered receipts, and daily reconciliation as compensating controls."
    xp_reward: 50
  - id: "digital-enterprise-management-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "The most useful weekly operations dashboard includes:"
    options:
      - id: "a"
        text: "Social-media likes only"
      - id: "b"
        text: "On-time jobs, rework, margin, stock loss, cash due, and safety incidents"
      - id: "c"
        text: "The owner’s personal spending only"
      - id: "d"
        text: "Competitor rumours"
    correct_answer: "b"
    hint: "Measures tied to delivery, quality, and money."
    explanation: "Management uses a few actionable indicators, not vanity metrics."
    xp_reward: 50
  - id: "digital-enterprise-management-fb1"
    type: "FILL_BLANK"
    prompt: "The ordered path from customer enquiry through handover is a business ___."
    correct_answer: "workflow"
    hint: "A repeatable sequence."
    explanation: "A visible workflow prevents forgotten approvals, tests, and balances."
    xp_reward: 50
  - id: "digital-enterprise-management-scenario"
    type: "SCENARIO"
    prompt: "A workshop accepts 20 jobs with capacity for 8, spends every deposit on old debts, and gives no completion dates. Best management correction?"
    options:
      - id: "a"
        text: "Accept 20 more deposits"
      - id: "b"
        text: "Plan capacity, ring-fence job cash, issue realistic schedules, and track work-in-progress"
      - id: "c"
        text: "Stop writing job cards"
      - id: "d"
        text: "Hide unfinished vehicles"
    correct_answer: "b"
    hint: "Capacity and cash control."
    explanation: "Overbooking plus misuse of deposits produces late jobs and insolvency even when sales look high."
    xp_reward: 60
  - id: "digital-enterprise-management-practical"
    type: "PHOTO_CAPTURE"
    prompt: "Create and upload one readable page showing your business workflow, named responsibilities, two quality gates, and the records produced at each stage."
    correct_answer: "captured"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Workflow begins with customer need and written quotation"
      - "Deposit and additional-work approval are controlled"
      - "At least two quality or safety checks appear"
      - "Handover, payment balance, and aftercare are included"
