id: "automotive-rim-repair-lesson"
course_id: "automotive"
title: "Week 6 — Wheel rims: run-out, cracks, straightening limits, and safe rejection"
title_sw: "Wiki 6 — Rim: run-out, nyufa, na mipaka ya ukarabati"
briefing: "A rim is a safety-critical rotating part. Begin with tyre condition and pressure, wheel-nut torque, hub face, bearing play, and impact history. Remove the tyre for a complete crack inspection when damage is suspected. Clean without grinding away evidence. Inspect bead seats, flanges, spokes, centre bore, stud holes, and the inner barrel—many alloy cracks hide on the inner lip. Dye penetrant may be used on clean non-porous alloy following its instructions. Magnetic particle is only for suitable ferrous steel.\n\nMeasure radial run-out (up/down) and lateral run-out (side-to-side) with a dial indicator on a clean mounted wheel; compare with vehicle/wheel limits. First eliminate tyre variation, rust between wheel and hub, dirt, and bearing play. Balancing cannot correct a bent rim; it only compensates mass imbalance. A wheel that needs excessive weights deserves inspection.\n\nSteel rims with limited flange bends may be cold-straightened by trained personnel using controlled equipment, then checked for cracks, run-out, bead sealing, and coating damage. Do not heat a modern wheel with a torch: heat changes material properties and can start a crack. Alloy-wheel straightening/welding is specialist work. Cracks in spokes, hub/bolt area, multiple cracks, severe distortion, unknown previous welds, or manufacturer-prohibited repairs mean reject and replace. Even a repairable inner-lip crack needs alloy identification, controlled TIG procedure, machining, penetrant re-test, pressure/leak test, and run-out check by a qualified wheel repairer.\n\nNever weld a rim with the tyre fitted or inflated. Heat plus trapped pressure can explode the assembly. Deflate, remove valve core, demount tyre, and clean flammable tyre products before any authorised hot work. Final fit: correct wheel size/offset/load rating, clean hub, hand-start nuts, star sequence, calibrated torque wrench, tyre pressure, and torque recheck policy. Document a rejected wheel so it is not put back into stock."
briefing_sw: "Rim ni sehemu ya usalama. Ondoa tyre ili kuona crack. Pima radial na lateral run-out kwa dial indicator. Balancing haisahihishi rim iliyopinda. Steel flange inaweza kunyooshwa na specialist; alloy crack inahitaji specialist. Crack kwenye spoke/hub mara nyingi reject. Usilehemu rim ikiwa tyre iko ndani."
estimated_minutes: 32
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AUT/CR/06/5"
exam_domain: "Wheel inspection and repair decision"
exercises:
  - id: "automotive-rim-repair-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A crack runs from an alloy wheel stud hole toward a spoke. Correct decision?"
    options:
      - id: "a"
        text: "Weld it with the tyre inflated"
      - id: "b"
        text: "Reject and replace unless the wheel manufacturer and a qualified engineering process explicitly permit repair"
      - id: "c"
        text: "Balance it with more weights"
      - id: "d"
        text: "Drill the stud hole larger"
    correct_answer: "b"
    hint: "Hub and spoke carry structural load."
    explanation: "Cracks in the mounting centre/spokes are safety-critical and are generally not routine repair candidates."
    xp_reward: 50
  - id: "automotive-rim-repair-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Balancing a bent rim will:"
    options:
      - id: "a"
        text: "Make the rim straight"
      - id: "b"
        text: "Only correct mass imbalance; excessive run-out remains"
      - id: "c"
        text: "Repair cracks"
      - id: "d"
        text: "Restore heat treatment"
    correct_answer: "b"
    hint: "Balance is weight, run-out is geometry."
    explanation: "Measure run-out separately. Do not hide a geometric defect with weights."
    xp_reward: 50
  - id: "automotive-rim-repair-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Before any authorised welding on a wheel, the technician must:"
    options:
      - id: "a"
        text: "Inflate to maximum pressure"
      - id: "b"
        text: "Deflate, remove valve core, demount the tyre, clean, and identify the alloy/procedure"
      - id: "c"
        text: "Leave tyre sealant inside"
      - id: "d"
        text: "Heat the whole wheel red"
    correct_answer: "b"
    hint: "Pressure plus heat can kill."
    explanation: "Tyre assemblies can explode during hot work. Demounting is mandatory."
    xp_reward: 50
  - id: "automotive-rim-repair-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Lateral run-out is measured as:"
    options:
      - id: "a"
        text: "Wheel movement side-to-side at the rim face"
      - id: "b"
        text: "Tyre pressure loss per month"
      - id: "c"
        text: "Vehicle ride height"
      - id: "d"
        text: "Brake-fluid boiling point"
    correct_answer: "a"
    hint: "Lateral = sideways."
    explanation: "Radial run-out is up/down relative to the axis. Both use a fixed dial indicator."
    xp_reward: 50
  - id: "automotive-rim-repair-fb1"
    type: "FILL_BLANK"
    prompt: "Side-to-side geometric wheel error measured by a dial indicator is lateral ___."
    correct_answer: "run-out"
    hint: "Not balance."
    explanation: "Run-out must be within the vehicle/wheel specification after any repair."
    xp_reward: 50
  - id: "automotive-rim-repair-scenario"
    type: "SCENARIO"
    prompt: "Pothole impact: steel rim outer flange bent, no crack found after tyre removal, run-out above limit. Appropriate next step?"
    options:
      - id: "a"
        text: "Hammer it while inflated"
      - id: "b"
        text: "Qualified cold straightening within limits, then crack inspection, run-out and bead-leak tests"
      - id: "c"
        text: "Torch heat until red"
      - id: "d"
        text: "Add 400 g of balance weights"
    correct_answer: "b"
    hint: "Steel flange damage may be repairable with controlled equipment."
    explanation: "Repair is conditional on material, location, severity, and passing all final tests."
    xp_reward: 60
  - id: "automotive-rim-repair-practical"
    type: "VIDEO_RECORD"
    prompt: "Record a wheel inspection on a removed, deflated training assembly: identify wheel material, inspect bead/spokes/hub/barrel, demonstrate radial and lateral run-out setup, and state three rejection criteria."
    correct_answer: "recorded"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Wheel is secured, deflated, and safe to inspect"
      - "Material and all critical inspection zones are identified"
      - "Dial indicator has a fixed base and correct contact point"
      - "Radial versus lateral run-out is explained"
      - "Hub/spoke cracks, severe distortion, and unsafe prior repairs are rejected"
    min_seconds: 20
