id: digital-safety-101-lesson-2
course_id: digital-safety-101
title: SIM swap, devices, and account recovery
title_sw: SIM swap, vifaa, na kurejesha akaunti
briefing: 'M-Pesa and email reset via SMS, so a SIM swap at a shop (social engineering or bribed staff) can drain money and mailboxes. PINs, PUK, and “please register this line” stories need the official channel. Number lock / SIM PIN and alerting Safaricom on sudden loss of service are practical defences.


  Device hygiene: screen lock, OS updates, unknown APKs off, and USB charging from a power-only source when possible. A public cyber-cafe PC is hostile — never type a bank password there. Full-disk encryption (phone + laptop) helps if the device is stolen in a matatu.


  Account recovery: unique passwords (manager if you can), MFA that is not only SMS where the service allows an authenticator app, and backup codes stored offline. Family WhatsApp groups are not your password manager.


  If money has moved: freeze via *334# or app, report to the MNO and police/DCI cyber as advised, and keep SMS evidence. Speed matters more than arguing in the group chat.'
briefing_sw: SIM swap inaweza kuiba M-Pesa. Funga SIM PIN. Usitype nywila ya benki kwenye cyber. MFA si SMS tu kama inawezekana. Kama pesa zimeenda, froze na ripoti haraka.
