id: tvet-electronics-w3
course_id: basic-electronics
title: Week 3 — Number systems, memory classes, and emerging hardware
title_sw: Wiki 3 — Mifumo ya namba, kumbukumbu, na mwelekeo mpya
briefing: 'Computers count in binary. You must convert between decimal, binary, octal, and hexadecimal because addresses, MAC values, IPv6 nybbles, and colour codes are hex. One hex digit is four bits (a nybble). 0xA = 10 decimal = 1010 binary. BCD 8421 encodes each decimal digit in four bits — used in some displays and RTC chips. Binary addition carries just as decimal does; overflow is why an 8-bit register wraps from 255 to 0.


  Memory in this unit is classified by how it is used, not by brand. RAM is volatile working store. ROM (and its flash descendants) keep firmware when power dies. Magnetic memory (HDD) versus semiconductor (SSD, DRAM). Cache is small and fast; secondary storage is large and slower. “DAM” appears in some CDACC lists as a memory class — treat it as a listed type in oral tests and contrast it with RAM/ROM in practice.


  Emerging trends you should be able to name: SoC boards (Raspberry Pi class), NVMe, USB-C power delivery, and denser NAND. Challenges: counterfeit ICs, right-to-repair parts, e-waste, and ESD on finer processes. Coping: buy from reputable distributors, follow JEDEC handling, and recycle boards through licensed e-waste — that links to the environmental literacy basic unit.


  Assessment is written conversion plus identification. A typical paper: convert 156₁₀ to hex, state whether DDR is volatile, and name one risk of unbranded RAM. Show working. Do not skip the 16s column in hex.'
briefing_sw: Binary, octal, hex. Digit moja ya hex = bit 4. RAM ni volatile; ROM/firmware inabaki. SSD ni semiconductor; HDD ni magnetic. SoC, NVMe, USB-C ni mwelekeo. E-waste na ESD ni changamoto.
estimated_minutes: 30
