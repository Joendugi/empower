exam_domain: CDACC ICT L5 — Demonstrate Basic Electronics (IT/CU/ICT/CC/1/5, 100 h)
xp_total: 310
exercises:
- id: tvet-electronics-w3-q1
  type: MULTIPLE_CHOICE
  prompt: How many bits does one hexadecimal digit represent?
  options:
  - id: a
    text: '1'
  - id: b
    text: '4'
  - id: c
    text: '10'
  - id: d
    text: 16 bits exactly always
  correct_answer: b
  hint: Nybble.
  explanation: Hex 0–F maps to 0000–1111. That is why MAC addresses are written in hex.
  xp_reward: 50
- id: tvet-electronics-w3-q2
  type: MULTIPLE_CHOICE
  prompt: Which memory loses its contents when the PSU is switched off?
  options:
  - id: a
    text: ROM BIOS chip (firmware)
  - id: b
    text: DRAM / system RAM
  - id: c
    text: A programmed mask ROM in theory forever
  - id: d
    text: Stone tablet
  correct_answer: b
  hint: Volatile.
  explanation: RAM is working memory. Storage and firmware persist.
  xp_reward: 50
- id: tvet-electronics-w3-q3
  type: MULTIPLE_CHOICE
  prompt: '156 decimal in hexadecimal is:'
  options:
  - id: a
    text: '0x9C'
  - id: b
    text: '0x156'
  - id: c
    text: '0xFF'
  - id: d
    text: 156h meaning 156 decimal still
  correct_answer: a
  hint: 16 × 9 = 144, remainder 12 = C.
  explanation: 9C₁₆ = 9×16 + 12 = 144 + 12 = 156.
  xp_reward: 50
- id: tvet-electronics-w3-q4
  type: MULTIPLE_CHOICE
  prompt: 'BCD 8421 stores the decimal number 25 as:'
  options:
  - id: a
    text: 11001 in five bits
  - id: b
    text: 0010 0101
  - id: c
    text: FF
  - id: d
    text: 25 in ASCII only
  correct_answer: b
  hint: Each digit gets four bits.
  explanation: 2 → 0010, 5 → 0101. That is the CDACC binary-codes outcome.
  xp_reward: 50
- id: tvet-electronics-w3-fb1
  type: FILL_BLANK
  prompt: Base-16 numbering used for memory addresses is called ___.
  correct_answer: hexadecimal
  hint: Digits 0–9 and A–F.
  explanation: Hex is the technician’s shorthand for binary groups of four.
  xp_reward: 50
- id: tvet-electronics-w3-scenario
  type: SCENARIO
  prompt: A learner writes that an SSD is “RAM because it is semiconductor.” Your assessor comment?
  options:
  - id: a
    text: Correct — all semiconductors are volatile
  - id: b
    text: 'Wrong class: NAND flash is non-volatile semiconductor storage, not working RAM'
  - id: c
    text: SSDs are magnetic
  - id: d
    text: RAM is only magnetic tape
  correct_answer: b
  hint: Volatile versus persistent.
  explanation: Material (semiconductor) is not the same as the role (working memory vs storage).
  xp_reward: 60
