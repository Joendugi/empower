id: "sewing-garment-gents-lesson"
course_id: "sewing-garment"
title: "Week 9 — Gents wear: shirt, trouser, and fly"
title_sw: "Wiki 9 — Nguo za wanaume"
briefing: "Gents wear is a distinct core in fashion L5 (shirts, trousers, sometimes a jacket). A man’s shirt: yoke, collar and stand, placket, cuff with placket, and extra length at the back. Collar points must match; the stand sits so the collar rolls, not flaps. Interfacing in collar and stand is not optional if the spec is a uniform shirt.\n\nTrousers: front crease on the grain, fly with zip guard, waistband with a curtain or facing, and pockets that do not gape. Rise (body rise) is measured seated as well as standing or the crotch will cut. A ladies’ block is not a gents’ block — different balance and fly construction.\n\nTopstitching on a shirt is a quality mark: even width, matching thread, no tunnels. Buttons: men’s shirts traditionally button left over right (as worn). Confirm the college spec. Sleeve pitch: the sleeve cap notch matches the shoulder; twisting sleeves are a setting error from construction week, still assessed here.\n\nAssessed sample: a school/office shirt or a pair of trousers with a working fly. Attach the spec sheet. Industrial attachment later will expect you to hit minutes-per-operation; here you hit quality first."
briefing_sw: "Shati: yoke, collar na stand, placket, cuff. Suruali: crease, fly, waistband, rise. Block ya wanawake si ya wanaume. Topstitch sawa. Interfacing kwenye collar."
estimated_minutes: 30
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/09/5"
exam_domain: "Gents wear"
exercises:
  - id: "sewing-garment-gents-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A shirt collar that will not sit is often missing:"
    options:
      - id: "a"
        text: "A longer hem"
      - id: "b"
        text: "A correctly interfaced stand and balanced collar points"
      - id: "c"
        text: "A bust dart"
      - id: "d"
        text: "Knit fabric only"
    correct_answer: "b"
    hint: "Stand plus collar."
    explanation: "The stand is the engineered piece. Skipping it on a formal shirt is a fail."
    xp_reward: 50
  - id: "sewing-garment-gents-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Trouser fly construction must include:"
    options:
      - id: "a"
        text: "Only a safety pin"
      - id: "b"
        text: "Zip, guard/facing, and bar-tacks at stress points as specified"
      - id: "c"
        text: "A ladies invisible zip always"
      - id: "d"
        text: "No waistband"
    correct_answer: "b"
    hint: "Stress."
    explanation: "A fly without a guard or bar-tack fails first wash."
    xp_reward: 50
  - id: "sewing-garment-gents-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "If the crotch bites when the learner sits, check:"
    options:
      - id: "a"
        text: "Button colour"
      - id: "b"
        text: "Body rise / crotch depth on the pattern"
      - id: "c"
        text: "Selvage nap only"
      - id: "d"
        text: "Iron steam"
    correct_answer: "b"
    hint: "Rise."
    explanation: "Gents trousers fail on rise more than on hem length."
    xp_reward: 50
  - id: "sewing-garment-gents-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Shirt back yokes exist to:"
    options:
      - id: "a"
        text: "Waste cloth"
      - id: "b"
        text: "Add structure and often conceal a shoulder split / hanging loop area"
      - id: "c"
        text: "Replace collars"
      - id: "d"
        text: "Hold bust darts"
    correct_answer: "b"
    hint: "Shoulder span."
    explanation: "A well-set yoke is a gents-wear competence."
    xp_reward: 50
  - id: "sewing-garment-gents-fb1"
    type: "FILL_BLANK"
    prompt: "The band that lifts a shirt collar off the neck is the collar ___."
    correct_answer: "stand"
    hint: "Collar stand / band."
    explanation: "Collar and stand are two pattern pieces plus interfacing."
    xp_reward: 50
  - id: "sewing-garment-gents-scenario"
    type: "SCENARIO"
    prompt: "Gents school trousers twist so the crease spirals. Trainee says “press harder”. Diagnosis?"
    options:
      - id: "a"
        text: "More steam always fixes grain"
      - id: "b"
        text: "Legs off grain or twisted in making — recut/rehang on grain; pressing will not hold a grain fault"
      - id: "c"
        text: "Change to a ladies block"
      - id: "d"
        text: "Remove the fly"
    correct_answer: "b"
    hint: "Grain from textiles week."
    explanation: "Gents wear still obeys warp and weft. Pressing is not a grain correction."
    xp_reward: 60
