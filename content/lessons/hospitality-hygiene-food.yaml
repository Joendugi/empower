exercises:
- id: hospitality-food-hygiene-and-temperature-control-haccp-principles-danger-zone-cross-contamination-and-food-storage-records-q1
  type: MULTIPLE_CHOICE
  prompt: 'What is the first step a technician must take before starting Food Hygiene
    and Temperature Control: HACCP Principles, Danger Zone, Cross-Contamination and
    Food Storage Records?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
    text: Inspect PPE, workspace ventilation, and machine guards
  - id: c
    text: Disable circuit breakers to save power
  - id: d
    text: Paint the workpiece
  correct_answer: b
  hint: Safety and equipment inspection always precede tool contact.
  explanation: Workplace health and safety regulations require pre-operational checks
    of all tools and PPE.
  xp_reward: 50
- id: hospitality-food-hygiene-and-temperature-control-haccp-principles-danger-zone-cross-contamination-and-food-storage-records-q2
  type: FILL_BLANK
  prompt: Personal protective equipment (PPE) must always be worn to prevent ___ in
    the workshop.
  correct_answer: injury
  hint: Physical harm or accident.
  explanation: Rated PPE shields the operator from electrical, chemical, and physical
    hazards.
  xp_reward: 50
- id: hospitality-food-hygiene-and-temperature-control-haccp-principles-danger-zone-cross-contamination-and-food-storage-records-q3
  type: MULTIPLE_CHOICE
  prompt: 'Why is calibration and clean alignment critical in Food Hygiene and Temperature
    Control: HACCP Principles, Danger Zone, Cross-Contamination and Food Storage Records?'
  options:
  - id: a
    text: To ensure precision, prevent joint defects, and guarantee durability
  - id: b
    text: It is only required for cosmetic reasons
  - id: c
    text: It uses more consumables
  - id: d
    text: No reason; alignment does not affect quality
  correct_answer: a
  hint: Accuracy leads to high-grade workmanship.
  explanation: Precise setout prevents structural failure, porosity, and tolerance
    issues.
  xp_reward: 50
