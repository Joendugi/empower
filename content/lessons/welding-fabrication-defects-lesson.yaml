id: "welding-fabrication-defects-lesson"
course_id: "welding-fabrication"
title: "Weld defects and visual inspection"
title_sw: "Kasoro za weld na ukaguzi"
briefing: "Visual inspection is the first NDT. Look at profile, undercut, overlap, craters, and spatter. Undercut is a groove melted into the parent metal along the toe — it is a stress raiser. Porosity is gas holes from contamination, long arc, or damp flux. Slag inclusions happen when you do not chip and brush between passes. Lack of fusion is a cold joint that looks joined until it peels.\n\nCracks are never “just cosmetic”. Stop. Report. Do not peen a crack to hide it. For many student butts, the repair is grind to sound metal and re-weld, not a third pass over dirt.\n\nMeasure throat and legs with a gauge if you have one. A pretty ripple on an undersize fillet still fails. Parent metal thickness and the drawing decide the size, not your eye from two metres.\n\nWrite defects in the log with the cause: “undercut — current high / travel slow at the toe.” That sentence is how you improve, and how assessors see that you understand metallurgy at craft level."
briefing_sw: "Angalia undercut, porosity, slag, na fusion. Mpasuko si mapambo. Pima ukubwa wa fillet. Andika kasoro na sababu kwenye log."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/WEL/CR/03/5"
exam_domain: "Quality & inspection"
exercises:
  - id: "welding-fabrication-defects-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Undercut is dangerous mainly because:"
    options:
      - id: "a"
        text: "It uses extra rods"
      - id: "b"
        text: "It is a notch that concentrates stress"
      - id: "c"
        text: "It looks dark"
      - id: "d"
        text: "It cools the shop"
    correct_answer: "b"
    hint: "Fatigue starts at notches."
    explanation: "Toes must be smooth enough for the spec. Grind and re-weld if required."
    xp_reward: 50
  - id: "welding-fabrication-defects-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "The usual cause of slag trapped between MMA passes is:"
    options:
      - id: "a"
        text: "Too much grinding of the table"
      - id: "b"
        text: "Not deslagging and brushing before the next pass"
      - id: "c"
        text: "Using a helmet"
      - id: "d"
        text: "Earthing correctly"
    correct_answer: "b"
    hint: "Clean between runs."
    explanation: "Chip, brush, inspect, then weld. Slag is not filler metal."
    xp_reward: 50
  - id: "welding-fabrication-defects-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Porosity often comes from:"
    options:
      - id: "a"
        text: "Perfectly dry, clean joints"
      - id: "b"
        text: "Contamination, moisture, or a long arc"
      - id: "c"
        text: "Correct clamp only"
      - id: "d"
        text: "Too much PPE"
    correct_answer: "b"
    hint: "Gas in the puddle."
    explanation: "Clean, dry, short arc. Then look again."
    xp_reward: 50
  - id: "welding-fabrication-defects-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A crack in a butt weld should be:"
    options:
      - id: "a"
        text: "Painted"
      - id: "b"
        text: "Reported and repaired by removing to sound metal — not covered"
      - id: "c"
        text: "Ignored if the ripple is even"
      - id: "d"
        text: "Peened until shiny"
    correct_answer: "b"
    hint: "Hiding cracks is a fail and a hazard."
    explanation: "Structural honesty is the occupation."
    xp_reward: 50
  - id: "welding-fabrication-defects-fb1"
    type: "FILL_BLANK"
    prompt: "Gas pockets left in a weld metal are called ___."
    correct_answer: "porosity"
    hint: "Holes from gas."
    explanation: "Porosity is a visual and structural defect."
    xp_reward: 50
  - id: "welding-fabrication-defects-scenario"
    type: "SCENARIO"
    prompt: "Your fillet is shiny but a gauge shows legs of 3 mm where the drawing says 6 mm. What is correct?"
    options:
      - id: "a"
        text: "Pass it; shine is strength"
      - id: "b"
        text: "Add a correctly sized pass or rebuild to the specified throat/legs after cleaning"
      - id: "c"
        text: "Grind the parent thinner so the ratio looks bigger"
      - id: "d"
        text: "Photograph from far away"
    correct_answer: "b"
    hint: "Size is specified."
    explanation: "Undersize fillets fail even if they are pretty."
    xp_reward: 60
