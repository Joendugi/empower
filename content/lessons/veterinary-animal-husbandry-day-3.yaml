    '
- id: vet-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'When administering an intramuscular (IM) injection of an antibiotic or curative drug to cattle,
    where is the anatomically correct and safe location on the animal?

    '
  xp_reward: 50
  options:
  - id: a
    text: Directly into the center of the rump muscle
  - id: b
    text: The muscular triangle of the neck (bounded above by the nuchal ligament, below by cervical vertebrae,
      and behind by the shoulder joint)
  - id: c
    text: Directly into the abdominal wall near the navel
  - id: d
    text: Into the tail muscle
  explanation: 'The neck triangle avoids major nerves (sciatic nerve in rump) and preserves expensive
    prime rump/hindquarter meat cuts from injection abscesses.


    Why the other options are wrong: Rump injections risk damaging the sciatic nerve (causing permanent
    leg paralysis) and devalue prime beef cuts. This risks puncturing intestines or causing peritonitis.
    The tail has insufficient muscle mass and causes intense pain.'
  correct_answer: b
- id: vet-d3-q5
  type: FILL_BLANK
  prompt: 'Veterinary vaccines containing aluminum hydroxide adjuvants (such as Blackquarter bacterins)
    must be kept between +2°C and +8°C and must NEVER be allowed to ___, because low temperatures precipitate
    the adjuvant into irreversible crystals that destroy vaccine potency.

    '
  xp_reward: 50
  correct_answer: freeze
  explanation: 'Freezing ruins killed adjuvanted vaccines. Conditioned icepacks (at 0°C with free water
    droplets) must be used instead of deep-frozen sub-zero icepacks.

    '
