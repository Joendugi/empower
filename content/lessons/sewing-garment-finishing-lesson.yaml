id: "sewing-garment-finishing-lesson"
course_id: "sewing-garment"
title: "Fitting, hems, and quality control"
title_sw: "Fitting, hem, na udhibiti wa ubora"
briefing: "Fitting is a measured process. Put the garment on the client or dummy, pin on the right side, and mark with chalk. Do not cut until you have recorded the change on the pattern or a fitting sheet. A skirt that is 4 cm too long is not “trimmed at the floor”. Unpick the hem, measure from the waist with a stick or metre, mark a level hem, then rebuild the planned hem allowance (often 3–4 cm double-fold on uniforms).\n\nClosures must work: buttons align with holes, zippers open fully, hook-and-bar takes strain off a waist zip. Buttonholes are cut after stitching, not before, unless you use a bound method that requires a window. Secure buttons with a shank on coats so the fabric can sit.\n\nFinal press is directional: seams the way they were sewn, collars rolled at the edge, hems without a second shine-line from a dirty iron. Hang the garment and walk around it: unmatched side seams, twisted legs, and hanging threads fail assessment even if the design is pretty.\n\nBefore you submit, use a QC list: measurements vs spec, symmetry, inside neatness, labels if required, and safety (no pins left in). That list is how industry and CDACC both think."
briefing_sw: "Fitting ni kipimo, si kukata ovyo. Rekodi mabadiliko. Hem ndefu inarekebishwa kwa kufungua na kupima kutoka kiunoni. Angalia zip, vifungo, na symmetry. Fanya orodha ya QC kabla ya kuwasilisha."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/04/5"
exam_domain: "Fitting & finishing"
exercises:
  - id: "sewing-garment-finishing-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A double-fold hem is 4 cm too long. The professional fix is:"
    options:
      - id: "a"
        text: "Cut the hem off at floor level with scissors"
      - id: "b"
        text: "Unpick, re-measure from a fixed point (waist/dummy), and resew the planned hem allowance"
      - id: "c"
        text: "Glue the extra fabric inside"
      - id: "d"
        text: "Tell the client to grow"
    correct_answer: "b"
    hint: "Protect the hem allowance."
    explanation: "Length comes from a measured mark. Guess-cutting destroys the finish and the allowance for next term."
    xp_reward: 50
  - id: "sewing-garment-finishing-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Why make a button shank on a thick coat?"
    options:
      - id: "a"
        text: "Fashion only"
      - id: "b"
        text: "So the button sits above the cloth thickness and the hole can close without strain"
      - id: "c"
        text: "NITA bans shanks"
      - id: "d"
        text: "It replaces the facing"
    correct_answer: "b"
    hint: "Thickness needs space under the button."
    explanation: "A tight-sewn button on a coat pulls and the hole never meets."
    xp_reward: 50
  - id: "sewing-garment-finishing-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Which item belongs on a final QC list?"
    options:
      - id: "a"
        text: "Whether the trainee likes the colour"
      - id: "b"
        text: "Measurements against the spec, symmetry, threads, and no pins left in"
      - id: "c"
        text: "The Wi-Fi password"
      - id: "d"
        text: "The iron brand only"
    correct_answer: "b"
    hint: "Assessors use a checklist."
    explanation: "Quality is evidence against a spec, not a feeling."
    xp_reward: 50
  - id: "sewing-garment-finishing-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Fitting pins should be placed:"
    options:
      - id: "a"
        text: "On the wrong side only so the client cannot see errors"
      - id: "b"
        text: "On the body, marking the correction, then transferred to cloth/pattern before cutting"
      - id: "c"
        text: "Through the machine needle"
      - id: "d"
        text: "In the assessor’s file"
    correct_answer: "b"
    hint: "The dummy is not the pattern."
    explanation: "Transfer marks. Cutting on the person is unsafe and inaccurate."
    xp_reward: 50
  - id: "sewing-garment-finishing-fb1"
    type: "FILL_BLANK"
    prompt: "The extra length of cloth turned up at the bottom of a skirt or trouser is the ___ allowance."
    correct_answer: "hem"
    hint: "Not the 1.5 cm side seam."
    explanation: "Hem allowance is planned in the pattern. It is not leftover waste."
    xp_reward: 50
  - id: "sewing-garment-finishing-scenario"
    type: "SCENARIO"
    prompt: "An assessor finds three pins still in a finished uniform and a hanging bobbin thread at the zip. Result?"
    options:
      - id: "a"
        text: "Ignore — pins are a design feature"
      - id: "b"
        text: "Those are finishing faults; remove pins, tidy threads, and only then present"
      - id: "c"
        text: "They add XP in industry"
      - id: "d"
        text: "Cut the zip out"
    correct_answer: "b"
    hint: "Safety plus neatness."
    explanation: "Pins in a garment are a safety fail. Loose threads are a quality fail. Both are easy marks lost."
    xp_reward: 60
