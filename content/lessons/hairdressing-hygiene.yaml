- id: hairdressing-salon-hygiene-client-consultation-and-professional-conduct-sterilisation-coshh-allergy-alert-tests-and-client-records-q1
  type: MULTIPLE_CHOICE
  prompt: 'What is the first step a technician must take before starting Salon Hygiene,
    Client Consultation and Professional Conduct: Sterilisation, COSHH, Allergy Alert
    Tests and Client Records?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
    text: Inspect PPE, workspace ventilation, and machine guards
  - id: c
    text: Disable circuit breakers to save power
  - id: d
    text: Paint the workpiece
