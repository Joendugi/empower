id: "body-works-finish-lesson"
course_id: "body-works"
title: "Flatting, polish, and handing back the job"
title_sw: "Flatting, polish, na kukabidhi kazi"
briefing: "After cure, de-nib dust inclusions with fine grit, then polish as specified. Do not cut through edges — paint is thin on lines. Refit lights, mouldings, and tapes without scratching the new film.\n\nInspect in north light or a booth lamp: miss, dry spray, sinkage over filler, and unmatched colour (blend if the spec says). Clean the interior of dust. Torque bumper bolts to sense, not until they strip.\n\nCustomer handover: explain stone-chip care and curing time before a car-wash. Industry loses money on comebacks, not on an extra ten minutes of inspection."
briefing_sw: "Baada ya kukauka, de-nib na polish. Usikate kingo. Kagua rangi na filler sinkage. Kabidhi kazi baada ya usafi na maelezo ya curing."
estimated_minutes: 16
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/ABR/CR/03/5"
exam_domain: "Finishing & QC"
exercises:
  - id: "body-works-finish-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Polishing through an edge happens because:"
    options:
      - id: "a"
        text: "Edges have extra paint always"
      - id: "b"
        text: "Paint films are thinner on edges; too much cut burns through"
      - id: "c"
        text: "Polish is only water"
      - id: "d"
        text: "NITA requires burn-through"
    correct_answer: "b"
    hint: "Be gentle on lines."
    explanation: "Tape or light pressure on edges."
    xp_reward: 50
  - id: "body-works-finish-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Sinkage over filler a day later usually means:"
    options:
      - id: "a"
        text: "The colour code was lucky"
      - id: "b"
        text: "Filler or primer not cured/filled properly before colour"
      - id: "c"
        text: "Too much wax on day one is required"
      - id: "d"
        text: "The compressor nameplate is wrong"
    correct_answer: "b"
    hint: "Prep shows through later."
    explanation: "Rushing filler to colour is a classic comeback."
    xp_reward: 50
  - id: "body-works-finish-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Before handing back you should:"
    options:
      - id: "a"
        text: "Leave masking on as a gift"
      - id: "b"
        text: "Inspect, clean, refit, and brief the owner on cure time"
      - id: "c"
        text: "Wash with thinners"
      - id: "d"
        text: "Park under a grinder"
    correct_answer: "b"
    hint: "Complete job."
    explanation: "Unfinished refit is unfinished repair."
    xp_reward: 50
  - id: "body-works-finish-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Colour mismatch on a wing is often reduced by:"
    options:
      - id: "a"
        text: "Painting only a 2 cm spot in the middle"
      - id: "b"
        text: "Blending into adjacent panels as specified"
      - id: "c"
        text: "Using any leftover green"
      - id: "d"
        text: "Clear coat only on the badge"
    correct_answer: "b"
    hint: "Blend."
    explanation: "Spot repairs that do not blend show as a patch."
    xp_reward: 50
  - id: "body-works-finish-fb1"
    type: "FILL_BLANK"
    prompt: "Removing tiny dust bits from a cured film with fine abrasive is called de-___."
    correct_answer: "nib"
    hint: "Nibs are dust pimples."
    explanation: "De-nib then polish, do not wet-sand through colour."
    xp_reward: 50
  - id: "body-works-finish-scenario"
    type: "SCENARIO"
    prompt: "Owner wants a machine wash one hour after 2K clear. You should:"
    options:
      - id: "a"
        text: "Agree — clear is glass"
      - id: "b"
        text: "Explain cure time; early wash can mark the film"
      - id: "c"
        text: "Sand the whole car as a courtesy"
      - id: "d"
        text: "Spray more thinners as wax"
    correct_answer: "b"
    hint: "Chemistry needs time."
    explanation: "Handover includes aftercare. That is part of the trade."
    xp_reward: 60
