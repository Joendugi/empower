id: cyber-sy0701-d2-w1
course_id: secplus-threats
title: Week 1 — Threat actors, motivations, and attack surfaces
title_sw: Wiki 1 — Washambuliaji na motisha
briefing: 'Domain 2 is 22% of SY0-701. Know actors: nation-state, unskilled attacker, hacktivist, insider (intentional and unintentional), organised crime, shadow IT, and competitor. Attributes: internal vs external, resources, level of sophistication, whether they are funded. Motivations: data exfiltration, espionage, service disruption, blackmail, financial gain, philosophical/political, revenge, chaos, war. In Kenya you will see financial (SIM-swap, M-Pesa social engineering), insider (fee clerk), and opportunistic unskilled attackers using leaked tools.


  Targets and surfaces: from the objectives — networks, infrastructure, applications, default credentials, open service ports, default configurations, open permissions, unsecure protocols, shared accounts, and human vectors. An open RDP on a polytechnic firewall is a surface. A default MikroTik password is a surface. WhatsApp “HR internship” is a human surface.


  Supply chain and third parties belong here too: vendor laptops, cloned Android APKs, and USB gifts. You cannot patch a threat actor; you reduce their surface and motive payoff.


  This week: map three campus surfaces to likely actors. Example: guest Wi-Fi → unskilled / opportunistic; finance PC with USB → insider or crimeware; public WordPress → opportunistic scanners.'
briefing_sw: 'Nation-state, insider, organised crime, hacktivist, unskilled. Motisha: pesa, upelelezi, kero. Nyuso: RDP wazi, nenosiri chaguomsingi, protocal dhaifu, WhatsApp. Punguza surface.'
