id: digital-safety-101
course_id: cybersecurity
title: 'Digital Safety 101: Passwords, Safe Browsing, Phishing Recognition And Two-Factor
  Authentication: Principles and Practical Application'
title_sw: 'Digital Safety 101: Passwords, Safe Browsing, Phishing Recognition And
  Two-Factor Authentication: Kanuni na Utendaji wa Vitendo'
briefing: 'In professional workshop practice, mastering Digital Safety 101: Passwords,
  Safe Browsing, Phishing Recognition and Two-Factor Authentication requires strict
  adherence to safety standards and sequential execution. Always inspect personal
  protective equipment (PPE), ensure proper tool calibration, and verify that the
  workpiece is securely mounted before commencing. Observe manufacturer specifications
  and relevant standards. Maintain a clean work environment, store consumables dry,
  and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Digital Safety 101: Passwords, Safe
  Browsing, Phishing Recognition and Two-Factor Authentication kunahitaji kufuata
  sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla ya
  kuanza kazi.'
