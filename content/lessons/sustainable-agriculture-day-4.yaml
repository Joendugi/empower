  - l2=r-789a0a
  - l3=r-1943cb
  - l4=r-ff6964
  explanation: 'Matching species to site and farming system is critical. Leucaena fails on acid soils
    (pH < 5.5) where Calliandra thrives. Sesbania is for the farmer who can afford one fallow season.
    Desmodium is for maize-belt farmers with stem borer and Striga pressure.

    '
- id: sa-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'In the push-pull pest management system, what role does Desmodium intercropped with maize play,
    and what does the Napier grass border do?

    '
  xp_reward: 50
  options:
  - id: a
    text: Desmodium kills stem borers with natural insecticide; Napier grass blocks physical entry into
      the field
  - id: b
    text: Both Desmodium and Napier grass fix nitrogen — the system is primarily for soil fertility
  - id: c
    text: Desmodium releases volatile compounds that repel stem borers away from maize (push); Napier
      grass attracts stem borers to the field border where they lay eggs but larvae survive poorly (pull)
  - id: d
    text: Napier grass shades stem borer pupae preventing emergence; Desmodium provides habitat for parasitic
      wasps
  explanation: 'Desmodium (silverleaf) releases isothiocyanates that push stem borer moths away from the
    maize stand. Napier grass at borders produces a sticky exudate that traps stem borer larvae after
    hatching, acting as a dead-end trap crop. This also suppresses Striga through allelopathic root exudates.


    Why the other options are wrong: Desmodium does not directly kill insects — it repels them through
    volatile chemicals. Napier grass does not form a physical barrier; it attracts and traps larvae biochemically.
    Desmodium does fix some nitrogen as a legume, but the primary purpose of this system is pest and Striga
    management. Napier grass is a C4 grass and does not fix nitrogen. The mechanism is chemical, not physical
    shading. The parasitic wasp habitat aspect has some truth but is not the primary mechanism. The core
    is push (volatile repellent) and pull (attractive trap crop).'
  correct_answer: c
- id: sa-d4-q5
  type: FILL_BLANK
  prompt: 'In alley cropping with Leucaena rows spaced ___ to ___ metres apart, trees are pollarded to
    ___ to ___ metre height. FMNR costs approximately ___ per hectare since it manages trees that are
    already ___ on the farmland.

    '
  xp_reward: 50
  correct_answer:
  - '4'
  - '8'
  - '0.5'
  - '1.0'
  - zero (near zero)
  - regenerating
  explanation: 'Alley spacing of 4-8 m allows adequate light to reach inter-row crops while providing
    significant N-fixing tree biomass. Pollarding at 0.5-1.0 m keeps trees as hedges rather than large
    shade trees. FMNR''s near-zero cost arises because farmers protect and manage stumps already present
    in their fields — no tree nursery, no planting, no seedling cost.

    '
