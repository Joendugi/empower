briefing: 'Agroforestry — integrating trees with crops and livestock — is the most documented path to
  long-term soil fertility restoration in East Africa. Nitrogen-fixing trees deliver 50-200 kg of biologically
  fixed nitrogen per hectare per year through their root nodules, replacing expensive synthetic fertiliser.
  Properly designed agroforestry systems also provide fuelwood, fodder, shade, windbreaks, and improved
  water infiltration — all from trees already growing on the farm.

  '
outline: 'Biological nitrogen fixation mechanism (Rhizobium nodules, nitrogenase enzyme); key N-fixing
  species for East Africa (Calliandra calothyrsus, Leucaena leucocephala, Tithonia diversifolia, Sesbania
  sesban, Gliricidia sepium); improved fallow with Sesbania; fertiliser trees as green manure; Farmer
  Managed Natural Regeneration (FMNR); alley cropping design (tree rows 6m apart, pollarding height 0.5-1.0m);
  windbreak design; multi-purpose tree selection; legume intercropping.

  '
content_md: "## Biological Nitrogen Fixation\n\nNitrogen fixation is the conversion of atmospheric N2\
  \ (78% of air) into\nplant-available ammonium (NH4+) by the nitrogenase enzyme in Rhizobium bacteria\n\
  living symbiotically in root nodules of leguminous plants.\n\n**The process:**\n1. Legume root exudates\
  \ attract compatible Rhizobium from soil\n2. Bacteria infect root hair and form a nodule (2-10 mm diameter\
  \ pink/red inside)\n3. Inside the nodule: N2 + 8H+ + 8e- + 16 ATP → 2 NH3 + H2 + 16 ADP\n4. Ammonia\
  \ converted to ammonium (NH4+), absorbed by plant\n5. When roots decompose, fixed N enters the soil\n\
  \n**Pink/red nodule interior = active fixation** (contains leghaemoglobin).\nWhite or brown inside =\
  \ inactive or dead nodule (poor soil, wrong Rhizobium strain).\n\nAnnual N fixation rates by species\
  \ in East Africa:\n\n| Species | N fixed (kg/ha/year) |\n|---|---|\n| Leucaena leucocephala | 100-500\
  \ kg/ha |\n| Calliandra calothyrsus | 50-150 kg/ha |\n| Gliricidia sepium | 80-200 kg/ha |\n| Sesbania\
  \ sesban (short-cycle) | 40-200 kg/ha |\n| Tithonia diversifolia (shrub) | 20-100 kg/ha |\n| Climbing\
  \ beans (crop) | 50-150 kg/ha |\n\n## Key N-Fixing Species for East Africa\n\n### Calliandra calothyrsus\
  \ (Red Calliandra)\n- Multi-purpose: fodder (35% crude protein), fuelwood, erosion control\n- Tolerates:\
  \ acid soils (pH 4.5-7.0), waterlogged soils, altitudes to 2,400 m\n- Management: coppice to 0.5 m every\
  \ 2-3 months for fodder production\n- Green leaf application: 2-4 t/ha fresh biomass adds 40-80 kg N/ha\n\
  \n### Leucaena leucocephala (White Leadtree)\n- Highest N fixation rate (100-500 kg N/ha/year)\n- Fast-growing:\
  \ 3-5 m in first year; coppices vigorously\n- Limitations: intolerant of acid soils (pH < 5.5); mimosine\
  \ in leaves\n  toxic to non-ruminants and ruminants without adapted gut bacteria\n- Best for: alley\
  \ cropping in medium-altitude neutral-pH areas\n\n### Tithonia diversifolia (Mexican Sunflower)\n- Shrubby\
  \ perennial, not a legume — fixes N via mycorrhizal partnerships\n- Very high biomass N content: 3.5-4.5%\
  \ N in leaves (similar to synthetic urea)\n- Grow on field edges; cut and carry as green manure\n- Application:\
  \ 2-5 t/ha fresh biomass incorporated before planting adds\n  70-200 kg N equivalent per hectare\n\n\
  ### Sesbania sesban (Improved Fallow)\n- Short-cycle tree (1-2 year fallow): plant after harvest, cut\
  \ before next season\n- Produces 40-200 kg N/ha in one fallow season\n- Trials in western Kenya: following\
  \ 2-year Sesbania fallow, maize yields\n  4-6 t/ha without fertiliser vs 0.5-1.5 t/ha in unfallowed\
  \ control plots\n\n## Farmer Managed Natural Regeneration (FMNR)\n\nFMNR is the deliberate protection\
  \ and management of naturally regenerating\ntrees and shrubs on farmland by pruning suckers to a single\
  \ strong stem:\n\n1. Select strongest sucker from stumps already present in the field\n2. Remove competing\
  \ shoots; protect from grazing for first year\n3. Prune lower branches at 1.5-2.0 m height once established\n\
  4. Trees provide shade, N, roots to fight erosion, and fuelwood from prunings\n\nFMNR cost: near zero\
  \ (trees already exist). Impact: demonstrated to restore\n5 million ha of degraded Sahel farmland with\
  \ 500,000 farm families.\n\n## Alley Cropping Design\n\nIn alley cropping, rows of N-fixing trees are\
  \ planted at regular intervals\nwith food crops grown between them:\n\n| Parameter | Value |\n|---|---|\n\
  | Tree row spacing | 4-8 m apart (wider spacing = less shading of crops) |\n| Tree spacing within row\
  \ | 0.25-0.5 m (dense hedge) |\n| Pollarding height | 0.5-1.0 m above ground when cutting |\n| Cutting\
  \ frequency | At planting + 6-8 weeks later (when maize is knee-high) |\n| Biomass placement | Lay prunings\
  \ on soil surface as mulch; or incorporate |\n\nThe tree biomass from 4-8 m alleys in a 1 ha field provides\
  \ approximately\n60-180 kg N equivalent per hectare per year if harvested and incorporated.\n\n## Legume\
  \ Intercropping\n\nShort-cycle annual legumes grown with staple cereals provide dual benefits:\nnitrogen\
  \ fixation during the season + grain protein harvest.\n\n| Cereal | Intercrop legume | Arrangement |\n\
  |---|---|---|\n| Maize | Climbing bean (Phaseolus vulgaris) | Bean planted 2 weeks after maize, uses\
  \ maize stalk as support |\n| Sorghum | Cowpea (Vigna unguiculata) | Sow cowpea in alternate rows; cowpea\
  \ tolerates drought |\n| Millet | Groundnut (Arachis hypogaea) | Groundnut fixes 50-150 kg N/ha; also\
  \ enriches diet |\n| Maize | Desmodium (Silverleaf) | Push-pull system — Desmodium repels striga and\
  \ stem borers |\n\n**Push-Pull System** (ICIPE, Kenya): Desmodium intercrop repels stem borers\n(push);\
  \ Napier grass planted around field perimeter attracts stem borers away\nfrom maize (pull). Also suppresses\
  \ Striga weed through allelopathy.\nYield improvements: 2-3x in heavily infested fields.\n"
exercises:
- id: sa-d4-q1
  type: MULTIPLE_CHOICE
  prompt: 'A farmer cuts open a root nodule from a Leucaena tree and finds the interior is white/grey
    in colour. What does this indicate and what action should be taken?

    '
  xp_reward: 50
  options:
  - id: a
    text: White nodules indicate maximum nitrogen fixation — the colour shows pure NH3 production
  - id: b
    text: White nodules are normal in young trees — they turn pink after 6 months
  - id: c
    text: Only nodule size matters — small white nodules will fix more N than large pink ones
  - id: d
    text: White/grey nodules are inactive — no nitrogen fixation occurring; check soil pH (Leucaena requires
      pH > 5.5), consider Rhizobium inoculant on seeds of replacement plants
  explanation: 'Active nodules contain leghaemoglobin which gives a pink/red colour. White or grey interior
    indicates the Rhizobium are absent, dead, or inactive. Causes include: wrong Rhizobium strain, soil
    pH < 5.5 (kills Rhizobium), waterlogging, or high soil nitrogen (N inhibits fixation when fertiliser
    N is abundant).


    Why the other options are wrong: This is incorrect. Pink/red colour from leghaemoglobin is the indicator
    of active fixation. White or grey indicates inactive nodules. Active nodules are pink/red from early
    establishment. White nodules in mature trees indicate a problem, not a developmental stage. Size does
    not predict activity. Colour is the key indicator: pink/red = active, white/grey = inactive, regardless
    of size.'
  correct_answer: d
- id: sa-d4-q2
  type: FILL_BLANK
  prompt: 'Tithonia diversifolia leaves contain ___ to ___% nitrogen by dry weight, similar to synthetic
    urea. Applying 3 t/ha of fresh Tithonia biomass provides approximately ___ kg of nitrogen equivalent
    per hectare.

    '
  xp_reward: 50
  correct_answer:
  - 3.5%
  - 4.5%
  - 105-135 kg
  explanation: 'At 4% N (midpoint) in fresh biomass (approximately 25% DM): 3 t/ha fresh x 0.25 DM fraction
    = 0.75 t/ha dry matter. 0.75 t DM x 40 kg N/t DM (at 4% N) = 30 kg N — but fresh weight at 3.5-4.5%
    N on fresh weight basis: 3,000 kg x 0.04 = 120 kg N. Range 3.5-4.5% gives 105-135 kg N equivalent
    per ha. A powerful free fertiliser from a plant that grows on degraded land margins.

    '
