id: cyber-sy0701-d3-w2
course_id: secplus-architecture
title: Week 2 — Cloud, virtualisation, and shared responsibility
title_sw: Wiki 2 — Wingu, virtualisation, na majukumu
briefing: 'Cloud models: IaaS, PaaS, SaaS, public/private/hybrid/community. Shared responsibility: the vendor secures the cloud; you secure what you put in it. SaaS mail: you still configure MFA and DLP. IaaS VM: you patch the guest OS. Misreading this is a classic fail. Kenya Data Protection Act still applies to student data in EU or US regions — know where the data sits and the contract.


  Virtualisation risks: VM escape, snapshot sprawl (sensitive memory on a datastore), stale templates with old patches, and management-plane exposure (vCenter/Hyper-V on the student LAN). Containers share a kernel — isolation is weaker than separate VMs. Serverless still has IAM keys. Infrastructure as code without secrets scanning leaks keys into Git.


  Controls: cloud security groups as firewalls, private endpoints, customer-managed keys, CASB, and least-privilege IAM. Disable public S3-style buckets. Turn on provider logging (CloudTrail-like) and send it somewhere you actually watch.


  Campus example: Microsoft 365 is SaaS; a rented VPS for Moodle is IaaS. MFA on 365 is your job. Unpatched Moodle is your job.'
briefing_sw: IaaS, PaaS, SaaS. Muuzaji hulinda wingu; wewe hulinda data na usanidi. MFA ni kazi yako. VM escape, snapshot, IAM. Usiachie ndoo ya umma. DPA bado inatumika.
