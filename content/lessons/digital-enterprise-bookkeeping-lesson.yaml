id: "digital-enterprise-bookkeeping-lesson"
course_id: "digital-enterprise"
title: "Week 4 — Bookkeeping, profit, cash flow, and break-even"
title_sw: "Wiki 4 — Vitabu, faida, cash flow, na break-even"
briefing: "Use separate business money. Record every sale, purchase, expense, owner contribution, withdrawal, amount owed by customers (receivables), and amount owed to suppliers (payables). Keep source documents: invoice, receipt, M-Pesa/bank statement, delivery note, payroll record. Reconcile the cashbook to actual cash and the mobile/bank statement; differences are investigated, not forced into “miscellaneous”.\n\nProfit is not cash. Income statement: revenue minus cost of sales gives gross profit; minus operating expenses gives net profit. A profitable business can fail when customers pay in 60 days but suppliers demand cash today. A cash-flow forecast places expected receipts and payments in the week/month they occur. Opening cash + inflows − outflows = closing cash. VAT or other tax collected is not the owner’s profit; keep it separate according to current KRA obligations and obtain qualified advice.\n\nContribution per unit = selling price − variable cost. Break-even units = fixed costs ÷ contribution per unit. Example: a welding shop charges KES 6,000 for a standard grill; steel, rods, paint, and direct piece labour are KES 3,500. Contribution is KES 2,500. If monthly fixed costs are KES 100,000, break-even is 40 grills. Below 40 the model loses money; above it each additional grill contributes KES 2,500 before tax and unusual costs.\n\nGross margin percentage = gross profit ÷ revenue × 100. Markup is profit ÷ cost; it is not the same. Price also includes waste, warranty/rework, payment fees, bad debts, and tool depreciation. Close books monthly: stock count, receivables age, supplier reconciliation, bank reconciliation, income statement, and next 13 weeks of cash."
briefing_sw: "Tenganisha pesa ya biashara. Rekodi mauzo, gharama, drawings, receivables na payables. Profit si cash. Contribution = bei minus variable cost. Break-even = fixed costs / contribution. Reconcile cashbook na bank/M-Pesa. Tax si faida."
estimated_minutes: 36
license: "CC-BY-SA-4.0"
exam_domain: "Financial literacy — records and cash flow"
exercises:
  - id: "digital-enterprise-bookkeeping-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A job sells for KES 10,000 and variable cost is KES 6,500. Its contribution is:"
    options:
      - id: "a"
        text: "KES 16,500"
      - id: "b"
        text: "KES 3,500"
      - id: "c"
        text: "KES 6,500"
      - id: "d"
        text: "35 jobs"
    correct_answer: "b"
    hint: "Selling price minus variable cost."
    explanation: "The KES 3,500 first covers fixed costs; only the remainder after fixed costs is profit."
    xp_reward: 50
  - id: "digital-enterprise-bookkeeping-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Fixed costs are KES 84,000 and contribution per service is KES 2,800. Break-even volume is:"
    options:
      - id: "a"
        text: "30 services"
      - id: "b"
        text: "300 services"
      - id: "c"
        text: "KES 81,200"
      - id: "d"
        text: "No calculation possible"
    correct_answer: "a"
    hint: "84,000 ÷ 2,800."
    explanation: "At 30 services, total contribution equals fixed costs. Tax and financing are considered separately."
    xp_reward: 50
  - id: "digital-enterprise-bookkeeping-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A profitable company can run out of cash when:"
    options:
      - id: "a"
        text: "Customers pay slowly while wages and suppliers are due now"
      - id: "b"
        text: "Gross profit is positive"
      - id: "c"
        text: "It reconciles the bank"
      - id: "d"
        text: "It keeps an emergency reserve"
    correct_answer: "a"
    hint: "Timing."
    explanation: "Accrual profit records earned revenue; cash flow records when money actually moves."
    xp_reward: 50
  - id: "digital-enterprise-bookkeeping-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Owner takes KES 20,000 for school fees. In the business books this is:"
    options:
      - id: "a"
        text: "Material cost"
      - id: "b"
        text: "Owner drawing, not a business operating expense"
      - id: "c"
        text: "Sales revenue"
      - id: "d"
        text: "Supplier credit"
    correct_answer: "b"
    hint: "Business and owner are separate for records."
    explanation: "Misclassifying drawings makes job costs and profit unreliable."
    xp_reward: 50
  - id: "digital-enterprise-bookkeeping-fb1"
    type: "FILL_BLANK"
    prompt: "Matching the cashbook to bank or M-Pesa statements and explaining differences is called ___."
    correct_answer: "reconciliation"
    hint: "Compare independent records."
    explanation: "Reconciliation catches missed fees, duplicate entries, fraud, and timing differences."
    xp_reward: 50
  - id: "digital-enterprise-bookkeeping-scenario"
    type: "SCENARIO"
    prompt: "Sales rise, but the business cannot buy materials because half the invoices are over 60 days unpaid. Best action?"
    options:
      - id: "a"
        text: "Record more unpaid sales"
      - id: "b"
        text: "Age receivables, enforce deposits/credit terms, collect overdue accounts, and update the cash forecast"
      - id: "c"
        text: "Ignore supplier due dates"
      - id: "d"
        text: "Use payroll deductions without permission"
    correct_answer: "b"
    hint: "Turn accounting profit into collected cash."
    explanation: "Credit control is part of operations and financial management."
    xp_reward: 60
  - id: "digital-enterprise-bookkeeping-practical"
    type: "PHOTO_CAPTURE"
    prompt: "Prepare and upload a one-month sample cash-flow forecast with opening cash, weekly inflows/outflows, closing cash, and one action for any negative week."
    correct_answer: "captured"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Opening cash and timing periods are labelled"
      - "Sales receipts are separated from sales made on credit"
      - "Materials, wages, overhead, debt, and owner drawings are included"
      - "Every period calculates a closing balance"
      - "A realistic response to a cash shortfall is stated"
