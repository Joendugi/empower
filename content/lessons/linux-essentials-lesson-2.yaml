id: linux-essentials-lesson-2
course_id: linux-essentials
title: Processes, logs, and users on Linux
title_sw: Processes, logs, na watumiaji Linux
briefing: 'After pwd/ls/cd, you must see what is running and who is logged in. `ps`, `top`/`htop`, and `journalctl` or `/var/log/syslog` are how you find a runaway process or a failed service. Killing PID 1 is not a joke — know `kill` vs `kill -9` and when a service restart is cleaner.


  Users: `id`, `sudo -l`, and not giving sudo to every classmate. Files in `/home` vs `/etc` vs `/var`. Permissions 777 on `/etc/passwd` is vandalism. SUID binaries are a later topic; do not chmod +s randomly.


  Disk: `df -h` before the disk fills at 3 a.m. `du` finds the heavy directory. Logs that grow without logrotate will take a server down as surely as malware.


  You still do not run curl|sudo bash from a pastebin. Read. Then run, if the instructor approves.'
briefing_sw: ps/top kuona processes. Logs kwenye journalctl au /var/log. Usitoe sudo kwa kila mtu. df -h. Usitumie chmod 777 kwenye /etc. Usitekeleze script ya mtandao kama root bila kusoma.
estimated_minutes: 16
