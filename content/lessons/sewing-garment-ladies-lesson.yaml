id: "sewing-garment-ladies-lesson"
course_id: "sewing-garment"
title: "Week 8 — Ladies wear: dart, ease, and closures"
title_sw: "Wiki 8 — Nguo za wanawake"
briefing: "Ladies wear units in Kenyan fashion L5 typically produce a blouse, dress, or skirt that proves dart manipulation, closures, and fit on a female form. Bust darts point toward the bust point and stop short (about 1.5–2.5 cm) so they do not sit as cones on the apex. Waist darts shape the torso. If the client is between sizes, you alter the pattern — you do not guess on the cloth.\n\nClosures: centred zip, lapped zip, invisible zip, or buttons and placket. Invisible zips need the right foot and to be stitched close to the coils. A gaping back neck is a pattern/shoulder issue, not a bigger zip. Facings and bias bindings neat on the inside are marked hard.\n\nEase: a woven blouse needs wearing ease at bust (often ~5–8 cm depending on style). A “body-con” woven without stretch and without ease will not button. Knit ladies wear follows the textile week: stretch stitches, stay tape at the shoulder.\n\nAssessed sample: a school or office blouse with collar or neck finish, set-in sleeve, buttoned front or zip, and a finished hem. QC against the spec from sketching week."
briefing_sw: "Dart za bust zielekee bust point zisiguse apex. Zip invisible inahitaji foot sahihi. Ease ya kuvaa kwenye bust. Facing ndani safi. Blouse ya ofisi au shule ni mradi mzuri."
estimated_minutes: 30
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/08/5"
exam_domain: "Ladies wear"
exercises:
  - id: "sewing-garment-ladies-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A bust dart that reaches the nipple point typically:"
    options:
      - id: "a"
        text: "Looks couture"
      - id: "b"
        text: "Creates a pointy cone — stop the dart short of the apex"
      - id: "c"
        text: "Replaces ease"
      - id: "d"
        text: "Is required on knits only"
    correct_answer: "b"
    hint: "Stop short."
    explanation: "Dart intake shapes to the apex but the tip fades before it."
    xp_reward: 50
  - id: "sewing-garment-ladies-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "An invisible zip that shows teeth usually means:"
    options:
      - id: "a"
        text: "Correct coil exposure"
      - id: "b"
        text: "Stitching too far from the coils or the wrong foot"
      - id: "c"
        text: "Too much ease"
      - id: "d"
        text: "Selvage on the zip"
    correct_answer: "b"
    hint: "Zipper foot."
    explanation: "Practice on scrap of the same fabric and zip length."
    xp_reward: 50
  - id: "sewing-garment-ladies-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Wearing ease at the bust on a woven blouse is:"
    options:
      - id: "a"
        text: "Always 0 cm"
      - id: "b"
        text: "Extra circumference so the wearer can breathe and move"
      - id: "c"
        text: "The same as seam allowance"
      - id: "d"
        text: "Only for men"
    correct_answer: "b"
    hint: "Not skin-tight unless stretch/style says so."
    explanation: "Measure body + ease = garment circumference on the spec."
    xp_reward: 50
  - id: "sewing-garment-ladies-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A gaping back neck is usually fixed by:"
    options:
      - id: "a"
        text: "A longer zip"
      - id: "b"
        text: "Pattern alteration at neck/shoulder, not by pulling the zip harder"
      - id: "c"
        text: "Removing darts only"
      - id: "d"
        text: "A hotter iron"
    correct_answer: "b"
    hint: "Fit."
    explanation: "Ladies wear is a fitting unit as much as a sewing unit."
    xp_reward: 50
  - id: "sewing-garment-ladies-fb1"
    type: "FILL_BLANK"
    prompt: "The fullest bust landmark that darts aim toward is the bust ___."
    correct_answer: "point"
    hint: "BP on the pattern."
    explanation: "Measure BP height from the shoulder; it changes with size and age."
    xp_reward: 50
  - id: "sewing-garment-ladies-scenario"
    type: "SCENARIO"
    prompt: "Buttons strain and gap on a woven blouse even though hip and waist are fine. First pattern action?"
    options:
      - id: "a"
        text: "Shorten the hem"
      - id: "b"
        text: "Add bust ease or a dart/fullness alteration; check bust circumference vs body + ease"
      - id: "c"
        text: "Use a jeans needle"
      - id: "d"
        text: "Grade only the collar"
    correct_answer: "b"
    hint: "Bust circumference."
    explanation: "Ladies wear fails at the bust more than at the hem. Measure."
    xp_reward: 60
