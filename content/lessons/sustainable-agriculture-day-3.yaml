briefing: 'In semi-arid Kenya, where rainfall is bimodal, erratic, and declining, the difference between
  food security and food crisis is often 50 mm of rain that runs off bare, compacted soil rather than
  soaking in. Water-wise farming techniques — zai pits, half-moon catchments, contour swales, and low-cost
  drip irrigation — capture, store, and deliver every raindrop to the root zone of the crop, multiplying
  the effective rainfall by 2-4 times.

  '
outline: 'Rainfall-runoff relationship and infiltration rate; zai pit design and spacing (0.9 m apart,
  30x30x15 cm); half-moon catchment bunds; contour swale design using A-frame level; keyline cultivation
  principle; low-cost drip irrigation from jerrycan or gravity tank; bucket drip kit design (0.5 mm emitter
  holes, dripper spacing); mulching and its effect on evaporation; FOFIFA tied ridges for moisture conservation.

  '
content_md: "## Rainfall and Runoff\n\nKenya's semi-arid areas receive 400-700 mm of annual rainfall,\
  \ yet crop yields\nare often equivalent to what 150-200 mm of effective rainfall would support.\nThe\
  \ gap is lost water: runoff, evaporation, and deep drainage below the root zone.\n\n| Loss pathway |\
  \ Typical % of rainfall lost | Intervention |\n|---|---|---|\n| Runoff (bare soil) | 30-60% | Zai pits,\
  \ swales, tied ridges |\n| Evaporation (bare soil surface) | 20-40% | Mulching, minimum tillage |\n\
  | Deep drainage (sandy soils) | 5-20% | Biochar, organic matter |\n| Crop transpiration (desired) |\
  \ 20-40% | — |\n\n**Infiltration rate** of compacted crusted soil: 2-5 mm/hour.\nHealthy soil with good\
  \ structure: 20-50 mm/hour. During a 30-minute storm\ndelivering 20 mm of rain, compacted soil absorbs\
  \ only 1-2.5 mm — the rest\nruns off carrying topsoil.\n\n## Zai Pits\n\nOriginally from Burkina Faso\
  \ (Yacouba Sawadogo), adapted across the Sahel.\nZai pits are hand-dug micro-catchments that concentrate\
  \ water and organic\nmatter at the seed point.\n\n### Design Specifications\n\n- **Pit dimensions**:\
  \ 30 cm wide x 30 cm long x 15 cm deep\n- **Spacing**: 0.9 m between pits in rows; 0.9 m between rows\
  \ (1 pit per 0.81 m2)\n- **Density**: approximately 12,300 pits per hectare\n- **Soil placement**: excavated\
  \ soil forms a downslope crescent bund (catches runoff)\n- **Organic fill**: add 1-2 handfuls of compost\
  \ or manure per pit before planting\n- **Termite attraction**: manure fills attract termites which channel\
  \ additional water to 40+ cm depth\n\n### Yield Impact\n\nIn trials across semi-arid East Africa, zai\
  \ pits increase sorghum and millet\nyields by 40-100% compared to flat planting in the same rainfall\
  \ conditions.\nIn severe drought years, crops on zai pits often produce while flat-planted\ncrops fail\
  \ entirely.\n\n## Half-Moon Catchments (Demi-Lunes)\n\nUsed for trees and large shrubs in drylands:\n\
  \n- Semicircular earth bund, flat side upslope, curved bund downslope\n- Diameter: 2-4 m per demi-lune\n\
  - Plants at the centre of the flat base\n- One demi-lune catches runoff from an upslope area 3-5x its\
  \ own size\n\n## Contour Swales\n\nA swale is a level trench dug exactly on the contour (zero slope)\
  \ with the\nexcavated soil forming a downslope berm:\n\n### A-Frame Level Construction\n\n1. Cut two\
  \ equal legs (1.5 m each) and one crossbar (1.5 m) into an A-frame\n2. Hang a plumb line (stone + string)\
  \ from the apex\n3. Mark where plumb hits crossbar when both legs are on flat ground\n4. Walk the A-frame\
  \ along the slope: the contour is the line where the\n   plumb bob rests on the same mark\n5. Mark with\
  \ stakes every 2-3 m; connect stakes with a hoe trench\n\n### Swale Specifications\n\n| Parameter |\
  \ Value |\n|---|---|\n| Trench depth | 30-50 cm |\n| Trench width | 50-100 cm |\n| Berm height | 30-40\
  \ cm above downslope ground |\n| Spacing between swales | 3-10 m vertically (depends on slope steepness)\
  \ |\n| Overflow spillway | Always include — 20 cm lower section to prevent berm breach |\n\nSwales capture\
  \ runoff, allow it to infiltrate slowly, and recharge\ngroundwater. Trees planted on the berm access\
  \ this stored moisture\nduring dry spells.\n\n## Low-Cost Drip Irrigation\n\n### Jerrycan Gravity Drip\
  \ (Household Scale)\n\n- 20 L jerrycan elevated 1 m above ground on a stand\n- 0.5 mm holes (use hot\
  \ nail or drill bit) in a 15 mm PE pipe connected at bottom\n- One jerrycan irrigates approximately\
  \ 25 plants at 0.5 L each per filling\n- Flow rate: 0.5 mm holes deliver approximately 30 mL/hour at\
  \ 1 m head\n- Irrigation interval: every 2-3 days for most crops in warm lowlands\n\n### Bucket Drip\
  \ Kit (0.1-0.4 ha scale)\n\nCommercial bucket drip kits (KickStart, IDE) use:\n- 20 L elevated bucket\
  \ or small tank (200-1,000 L)\n- Mainline PE pipe (16 mm) with lateral lines (12 mm) every 60 cm\n-\
  \ Button emitters or punch-hole emitters at 30-60 cm spacing\n- Pressure filter on inlet to prevent\
  \ clogging\n- Cost: approximately KES 3,000-12,000 for a 0.1-0.2 ha kit\n\nWater savings versus flood\
  \ irrigation: 30-50% less water for same yield.\n\n## Mulching\n\nMulch reduces surface evaporation,\
  \ moderates soil temperature, suppresses\nweeds, and slowly adds organic matter as it decomposes.\n\n\
  | Mulch type | Depth | Evaporation reduction |\n|---|---|---|\n| Dry grass/straw | 5-10 cm | 50-70%\
  \ |\n| Crop residues | 5-8 cm | 40-60% |\n| Wood chips | 8-12 cm | 60-75% |\n| Living mulch (creeping\
  \ legume) | Ground cover | 40-60% + nitrogen fixation |\n\nApply mulch leaving a 5 cm gap around stem\
  \ base to prevent rot and rodent shelter.\n\n## Tied Ridges\n\nRidges formed between crop rows are tied\
  \ at 2-5 m intervals with small earth\ndams (ties), converting furrows into a series of small water\
  \ storage basins:\n\n- Each basin captures 2-5 L of runoff before overflowing to the next\n- Labour:\
  \ approximately 3 person-days per hectare to tie ridges\n- Yield improvement in semi-arid areas: 30-60%\
  \ over open ridges\n"
exercises:
- id: sa-d3-q1
  type: MULTIPLE_CHOICE
  prompt: 'A farmer has a 0.25 ha plot on a 5% slope in a semi-arid area receiving 500 mm of annual rain.
    During a 30 mm rainstorm, the compacted crusted soil absorbs only 3 mm/hour. Approximately what percentage
    of this storm''s rain is lost to runoff?

    '
  xp_reward: 50
  options:
  - id: a
    text: Approximately 50% runs off — most soils absorb at least half of incoming rain
  - id: b
    text: No runoff occurs — rain in semi-arid areas is always light and absorbed fully
  - id: c
    text: About 30% runs off — the remainder is lost to evaporation
  - id: d
    text: The storm delivers 30 mm in roughly 30 minutes; at 3 mm/hour absorption rate only about 1.5
      mm infiltrates — approximately 95% runs off
  explanation: 'If the storm delivers 30 mm in 30 min = 60 mm/hour rain rate. Infiltration is only 3 mm/hour.
    In 30 min, 1.5 mm infiltrates while 28.5 mm runs off = 95% loss. This is why crusted, bare soil is
    catastrophic in semi-arid areas — virtually all rain is lost.


    Why the other options are wrong: 50% absorption assumes around 30 mm/hour infiltration rate. Compacted
    crusted soil only achieves 2-5 mm/hour. At 3 mm/hour in a 30-minute storm, only ~5% infiltrates. Semi-arid
    rainfall is often intense and convective. High-intensity short-duration storms are the norm, and they
    overwhelm the infiltration capacity of bare compacted soils, producing flash runoff. Evaporation occurs
    over hours to days, not during the storm itself. During the storm, the primary loss mechanism is runoff.
    30% runoff would require an infiltration rate of ~42 mm/hour — not possible on compacted crust.'
  correct_answer: d
- id: sa-d3-q2
  type: FILL_BLANK
  prompt: 'Standard zai pits are ___ cm wide x ___ cm long x ___ cm deep, spaced ___ m apart in all directions.
    At this spacing there are approximately ___ pits per hectare.

    '
  xp_reward: 50
  correct_answer:
  - 30 cm
  - 30 cm
  - 15 cm
  - 0.9 m
  - '12300'
  explanation: '30x30x15 cm pits at 0.9 m x 0.9 m spacing gives 1/0.81 = 1.235 pits per m2, so 12,350
    pits per hectare (commonly rounded to 12,300). Each pit receives a handful of manure before planting,
    creating a microhabitat of concentrated fertility and water at every seed point.

    '
- id: sa-d3-q3
  type: MATCH_PAIRS
  prompt: Match each water-wise technique to its primary mechanism of action.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Zai pits
    right:
      id: r-1db6c7
      text: Concentrate runoff and organic matter at individual plant points on degraded crusted soil
  - left:
      id: l2
      text: Contour swales
    right:
      id: r-b3722e
      text: Intercept hillslope runoff along the contour and allow slow infiltration to recharge groundwater
  - left:
      id: l3
      text: Tied ridges
    right:
      id: r-55b21c
      text: Convert inter-row furrows into a series of small water-retention basins between tie dams
  - left:
      id: l4
      text: Mulching
    right:
      id: r-202f12
      text: Reduce surface evaporation by 50-75% while adding organic matter as it decomposes
  correct_answer:
  - l1=r-1db6c7
  - l2=r-b3722e
  - l3=r-55b21c
  - l4=r-202f12
  explanation: 'These techniques act at different scales: zai pits at the individual plant, tied ridges
    at the row, swales at the field/catchment. They can be combined — swales intercept hillslope runoff
    that is then distributed to zai-pit fields below.

    '
- id: sa-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'A household sets up a jerrycan gravity drip system with 0.5 mm holes in the lateral pipe, elevated
    1 m. Each hole delivers approximately 30 mL/hour. If the system runs for 6 hours, how much water does
    one emitter deliver, and is this sufficient for a mature tomato plant?

    '
  xp_reward: 50
  options:
  - id: a
    text: 180 mL per emitter per 6-hour session — mature tomatoes need 1-2 L/day so 2-3 sessions per day
      or longer run time is needed
  - id: b
    text: 180 mL — this fully meets mature tomato water needs
  - id: c
    text: 30 mL — the system only delivers at the flow rate, not accumulative
  - id: d
    text: 1.8 L — units must be converted from mL to L
  explanation: '30 mL/hour x 6 hours = 180 mL. A fruiting tomato needs 1,000-2,000 mL/day. Multiple emitters
    per plant or longer run time is needed. Jerrycan drip is best for seedlings or drought-stressed crops
    receiving supplemental irrigation, not sole-source irrigation for heavy feeders.


    Why the other options are wrong: 180 mL is far below the 1,000-2,000 mL/day mature tomatoes require.
    Jerrycan drip provides supplemental irrigation — it must be paired with rain-fed or higher-volume
    supply for fruiting crops. Volume delivered = flow rate x time. 30 mL/hour x 6 hours = 180 mL. The
    accumulative volume over time is what reaches the plant. 180 mL = 0.18 L, not 1.8 L. 1.8 L would require
    300 mL/hour flow rate, which is much larger than a 0.5 mm hole at 1 m head delivers.'
  correct_answer: a
- id: sa-d3-q5
  type: FILL_BLANK
  prompt: 'The A-frame level is used to mark the ___ (gradient = zero) line on a hillslope for swale construction.
    A swale berm must always include an ___ spillway section ___ cm lower than the main berm to prevent
    catastrophic failure during heavy rain.

    '
  xp_reward: 50
  correct_answer:
  - contour
  - overflow
  - 20 cm
  explanation: 'A contour is a line of equal elevation — water placed on a true contour swale spreads
    evenly left and right with no tendency to flow. An overflow spillway 20 cm lower than the berm crest
    ensures that when the swale fills in a major storm, water exits in a controlled location rather than
    overtopping and eroding the berm catastrophically.

    '
