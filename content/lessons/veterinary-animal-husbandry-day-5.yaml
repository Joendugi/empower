briefing: 'Controlling tick vectors—the carriers of East Coast Fever, Babesiosis, Anaplasmosis, and Heartwater—requires
  disciplined community infrastructure. The communal plunge dip (a 15,000-litre concrete vat through which
  hundreds of cattle swim weekly) is the most cost-effective tick control tool in Africa. However, poor
  dip management—allowing rainwater dilution, failing to test chemical wash strength, or using the wrong
  acaricide class—triggers rapid tick resistance, rendering million-shilling facilities useless. This
  capstone lesson covers plunge dip civil engineering, chemical classes (amidines, synthetic pyrethroids,
  organophosphates), the dip vat titration test kit, replenishing depleted vats, hand spray-race calibration,
  and rotational strategies to break tick resistance.

  '
outline: 'Communal plunge dip architecture: collection crush, footbath silt traps, 15,000L deep swim tank,
  splash curtains, draining race with sump return; acaricide chemical classes: Amidines (Amitraz 0.025%),
  Synthetic Pyrethroids (Deltamethrin / Cypermethrin), Organophosphates (Chlorfenvinphos); the ''Stripping''
  phenomenon (ticks and hair removing chemical faster than water); dip wash titration testing protocols
  (testing chemical active ingredient strength); topping-up and reinforcement arithmetic; operating mechanical
  spray races; managing acaricide resistance (chemical class rotation every 2-3 years, refugia maintenance);
  PHOTO_CAPTURE assessment rubric of livestock examination, dip facility, or veterinary equipment.

  '
content_md: "## The Communal Cattle Plunge Dip\n\nA plunge dip is an engineered hydraulic concrete facility\
  \ that forces cattle to\ncompletely submerge in an aqueous acaricide bath, soaking every square centimetre\n\
  of hide, inner ear folds, and perineum:\n\n```\nEntry Crush ──► [ Footbath (Silt Trap) ] ──► [ The Drop-Off\
  \ Ramp ]\n                                                       │\n                               \
  \                        ▼\n                                           [ 15,000L Swim Tank (2.2m Deep)\
  \ ]\n                                                       │\n                                    \
  \                   ▼\nReturn Paddock ◄── [ Double Draining Race ] ◄── [ Stepped Exit Ramp ]\n     \
  \                       │\n                            ▼\n                   [ Sump Sediment Trap ]\
  \ ───► Clean Wash Returns to Tank\n```\n\n### Engineering Dimensions & Components:\n1. **Collection\
  \ Pens & Race**: Funnels cattle into a single-file race with high timber walls.\n2. **Footbaths (Two\
  \ in Series, 5 m long each)**: Clean water troughs that wash caked mud off hooves before cattle jump.\
  \ Mud entering the main tank binds and neutralizes chemical acaricides!\n3. **The Drop-Off**: A sudden,\
  \ slick concrete lip sloping downward at 45°. Cattle cannot stop; they leap forward into the deep water.\n\
  4. **The Swim Tank (15,000 to 20,000 Litres)**:\n   - Length: 10 to 12 metres.\n   - Depth: **2.2 metres**\
  \ (forces adult cattle to swim with only heads exposed).\n   - Splash Curtains: Deflect outward splashes\
  \ back into the tank.\n5. **The Head Dunker**: An operator stands on a raised gantry holding a wooden\
  \ **dipping fork** (a Y-shaped pole), pushing each cow's head gently underwater twice to ensure ears\
  \ and horns are 100% drenched.\n6. **Draining Race (Sloped Concrete Floors)**: Cattle stand for 10 minutes;\
  \ excess liquid drains back into a settling silt trap that filters hair before returning clean wash\
  \ to the main tank.\n\n## Major Acaricide Chemical Classes\n\nUsing the wrong chemical or failing to\
  \ understand its pharmacology causes herd poisonings or resistance:\n\n| Chemical Class | Common Active\
  \ Ingredient | Target Concentration in Dip | Strengths & Properties | Critical Limitations |\n|---|---|---|---|---|\n\
  | **Amidines** | **Amitraz (Triatix / Norotraz)** | **0.025% (250 ppm)** | Rapid \"detachment\" effect\
  \ (ticks detach within hours); kills organophosphate-resistant ticks. | **Unstable in acid/neutral water**!\
  \ Must be stabilized with **hydrated lime (Ca(OH)2)** to keep pH > 10. |\n| **Synthetic Pyrethroids\
  \ (SP)** | **Deltamethrin (Decatix) / Cypermethrin** | **0.005% (50 ppm)** | Highly potent; long residual\
  \ persistence (7 to 10 days); safe for young calves. | High risk of tick cross-resistance if used continuously\
  \ for > 3 years. |\n| **Organophosphates (OP)** | **Chlorfenvinphos (Supona) / Diazinon** | **0.05%\
  \ (500 ppm)** | Excellent stability in dirty wash water; broad-spectrum against ticks, lice, and biting\
  \ flies. | **High mammalian toxicity** (cholinesterase inhibitor); toxic to handlers; dangerous to dogs.\
  \ |\n\n## The \"Stripping\" Phenomenon & Replenishment Math\n\nWhen a cow swims through a dip, its hair\
  \ coat and tick bodies absorb chemical active\ningredient molecules **faster than they absorb water**.\n\
  - **The Result**: The liquid carried out in the cow's coat is at a higher chemical concentration than\
  \ the bulk tank.\n- The remaining wash in the tank becomes progressively **weaker and under-dosed (Stripping)**\
  \ after every 100 animals!\n\n### The Replenishment Rule (Reinforcement):\nBecause of stripping, you\
  \ cannot simply add fresh water and standard-rate chemical.\nYou must add **Reinforcement Concentrate**\
  \ at a higher ratio:\n- *Standard Initial Filling Rate (Amitraz)*: 1 Litre per **1,000 Litres of water**\
  \ (1:1,000).\n- *Replenishment Rate (Topping up)*: 1 Litre per **600 Litres of water added** (1:600).\n\
  \n## Testing Dip Wash Strength (Field Titration Test)\n\nUnder-strength dip wash does not kill ticks;\
  \ it breeds super-resistant tick strains!\nCommunity dip managers must test wash concentration every\
  \ dipping day:\n\n### The Field Dip-Testing Kit:\n1. Measure exactly **100 mL of well-mixed dip wash**\
  \ from the center of the tank using a glass cylinder.\n2. Add 5 drops of chemical indicator reagent\
  \ (color turns yellow/orange).\n3. Titrate drop-by-drop with the test acid/alkali reagent from a calibrated\
  \ dropper bottle until the color snaps to permanent blue/green.\n4. Count the drops:\n   - **30 to 35\
  \ drops**: **CORRECT STRENGTH** (Proceed with dipping).\n   - **< 25 drops**: **UNDER-STRENGTH** (DANGEROUS!\
  \ Calculate and add required chemical concentrate before admitting cattle).\n   - **> 45 drops**: **OVER-STRENGTH**\
  \ (Toxic! Add fresh water to prevent organ damage in calves).\n\n## Strategic Tick Resistance Management\n\
  \nTicks evolve biological immunity when exposed to sub-lethal chemical doses over many generations.\n\
  \n### Principles of Resistance Prevention:\n1. **Strict Class Rotation**:\n   - Never use the same chemical\
  \ class indefinitely. Rotate between an **Amidine (Amitraz)** and a **Synthetic Pyrethroid (Deltamethrin)**\
  \ every **2 to 3 years**.\n   - Never rotate between two brands of the same class (e.g., switching from\
  \ Decatix to Bayticol is useless, as both are synthetic pyrethroids).\n2. **Seasonal Dipping Frequency**:\n\
  \   - *Dry Season (Low Tick Burden)*: Dip once every **14 days** (or cease dipping to allow natural\
  \ tick immunity to develop in indigenous zebu cattle).\n   - *Wet Rainy Season (High ECF Challenge)*:\
  \ Dip strictly every **7 days** to break the nymph-to-adult transmission cycle.\n3. **Never Under-Dose**:\
  \ Under-dosing is the fastest path to resistance; always maintain full label concentration.\n"
exercises:
- id: vet-d5-q1
  type: MULTIPLE_CHOICE
  prompt: 'A communal cattle dip tank filled with an Amitraz (Amidine) acaricide wash is tested with a
    field titration kit and found to be under-strength after 1,000 cattle have swum through it. Why does
    the chemical concentration drop faster than water volume?

    '
  xp_reward: 50
  options:
  - id: a
    text: The chemical evaporates into the air within 2 hours
  - id: b
    text: Cattle drink the dip wash in large quantities
  - id: c
    text: 'The ''Stripping'' phenomenon: Cattle hair and hide absorb the chemical active ingredient molecules
      preferentially faster than water, leaving the remaining bath progressively diluted and requiring
      higher-rate reinforcement concentrate when topping up'
  - id: d
    text: Bacteria in the cattle dung destroy the chlorine atoms
  explanation: 'As cattle pass through, the lipophilic chemical adheres to grease on the hair, removing
    active molecules faster than water is lost. Topping up requires a richer ''replenishment rate'' (e.g.,
    1:600 instead of 1:1,000) to maintain lethal concentration.


    Why the other options are wrong: Amitraz is non-volatile in water and does not evaporate rapidly.
    Cattle dislike the taste and do not drink significant volumes; water loss is mechanical carryout on
    coats. Stripping is a physical surface-absorption phenomenon, not bacterial degradation.'
  correct_answer: c
- id: vet-d5-q2
  type: FILL_BLANK
  prompt: 'When using Amitraz (an Amidine class acaricide) in an open concrete plunge dip, the wash is
    chemically unstable at neutral or acidic pH and must be stabilized by adding hydrated ___ (calcium
    hydroxide) to maintain a high alkaline pH of greater than ___.

    '
  xp_reward: 50
  correct_answer:
  - lime
  - '10'
  explanation: 'Amitraz hydrolyzes and degrades in acidic or neutral wash water. Adding 10 kg of hydrated
    lime per 1,000 L maintains pH > 10, keeping the active ingredient stable for months.

    '
