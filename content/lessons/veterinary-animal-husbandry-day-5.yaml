    expensive chemical.

    '
- id: vet-d5-q4
  type: MULTIPLE_CHOICE
  prompt: 'To manage and prevent chemical acaricide resistance among tick populations in a pastoral grazing
    zone, how should communal dipping programs rotate acaricides?

    '
  xp_reward: 50
  options:
  - id: a
    text: Switch brand names every week while keeping the same active chemical
  - id: b
    text: Rotate between completely different chemical classes (e.g., switch from an Amidine like Amitraz
      to a Synthetic Pyrethroid like Deltamethrin) every 2 to 3 years
  - id: c
    text: Dilute the chemical to 10% of normal strength during the dry season
  - id: d
    text: Mix organophosphates, amidines, and pyrethroids together in the same tank
  explanation: 'Resistance develops to a specific biochemical mechanism of action. Rotating chemical classes
    breaks the evolutionary cycle by killing ticks that survived the previous class. Switching brand names
    within the same class is useless.


    Why the other options are wrong: Brand names have no biological relevance; switching brands of the
    same class maintains continuous selection pressure for resistance. Sub-lethal under-dosing is the
    primary cause of rapid resistance evolution. Cocktail mixing triggers multi-class cross-resistance
    and causes severe chemical toxicities.'
  correct_answer: b
