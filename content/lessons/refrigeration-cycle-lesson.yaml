id: "refrigeration-cycle-lesson"
course_id: "refrigeration"
title: "Vapour-compression cycle and components"
title_sw: "Mzunguko wa vapour-compression"
briefing: "Almost every fridge and split AC you service uses the vapour-compression cycle. The compressor raises pressure and temperature of the vapour. The condenser rejects heat so the refrigerant becomes liquid. The expansion device (capillary or TXV) drops pressure. The evaporator absorbs heat as liquid boils at low pressure. If you cannot point to those four on a domestic fridge, you are not diagnosing — you are guessing.\n\nHigh-side vs low-side: gauges, pipe temperatures, and frost patterns tell a story. Ice on the evaporator with a warm cabinet can be airflow, defrost, or charge — not “always add gas”. The thermostat stops the compressor; it does not fix a leak.\n\nElectrical isolation still applies: unplug, discharge capacitors as trained, and do not short a thermostat with a nail to “test cooling”."
briefing_sw: "Compressor inainua shinikizo. Condenser inatoa joto. Expansion inashusha shinikizo. Evaporator inachukua joto. Usiweke gesi bila kuelewa mzunguko. Zima umeme kabla ya kufungua unit."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/RAC/CR/01/5"
exam_domain: "Cooling cycle"
exercises:
  - id: "refrigeration-cycle-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which component raises refrigerant pressure and temperature?"
    options:
      - id: "a"
        text: "Evaporator fan only"
      - id: "b"
        text: "Compressor"
      - id: "c"
        text: "Drain pipe"
      - id: "d"
        text: "Room thermostat plastic"
    correct_answer: "b"
    hint: "The pump of the cycle."
    explanation: "The compressor compresses vapour; the condenser then rejects heat."
    xp_reward: 50
  - id: "refrigeration-cycle-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Heat is rejected to the room (or outside air) mainly at the:"
    options:
      - id: "a"
        text: "Evaporator"
      - id: "b"
        text: "Condenser"
      - id: "c"
        text: "Suction filter drier only"
      - id: "d"
        text: "Door gasket"
    correct_answer: "b"
    hint: "The hot component."
    explanation: "Condenser heat rejection is why the back of a fridge is warm."
    xp_reward: 50
  - id: "refrigeration-cycle-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A capillary tube is a type of:"
    options:
      - id: "a"
        text: "Compressor oil"
      - id: "b"
        text: "Expansion device"
      - id: "c"
        text: "Condenser fan blade"
      - id: "d"
        text: "Electrical earth"
    correct_answer: "b"
    hint: "It meters liquid to the evaporator."
    explanation: "Restriction drops pressure so boiling can happen in the evaporator."
    xp_reward: 50
  - id: "refrigeration-cycle-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "To service a packaged unit electrically you first:"
    options:
      - id: "a"
        text: "Bypass every safety"
      - id: "b"
        text: "Isolate power and prove dead as for any appliance"
      - id: "c"
        text: "Hold the live to feel current"
      - id: "d"
        text: "Ground the compressor shell to the water pipe randomly"
    correct_answer: "b"
    hint: "RAC is also electrical work."
    explanation: "Capacitors store charge. Isolation is not optional."
    xp_reward: 50
  - id: "refrigeration-cycle-fb1"
    type: "FILL_BLANK"
    prompt: "The component that absorbs heat from the cabinet as refrigerant boils is the ___."
    correct_answer: "evaporator"
    hint: "It is the cold heat exchanger."
    explanation: "No airflow over a dirty evaporator means poor cooling even with a full charge."
    xp_reward: 50
  - id: "refrigeration-cycle-scenario"
    type: "SCENARIO"
    prompt: "A fridge ices heavily at the back wall but the cabinet is warm. A trainee reaches for a gas cylinder. What should happen?"
    options:
      - id: "a"
        text: "Add gas until the pipe sweats"
      - id: "b"
        text: "Check airflow, defrost, leaks, and evidence before any charge"
      - id: "c"
        text: "Pierce the pipe to listen"
      - id: "d"
        text: "Pour water on the compressor"
    correct_answer: "b"
    hint: "Symptom is not a procedure."
    explanation: "Blind topping-up hides leaks and overcharges. Diagnose first."
    xp_reward: 60
