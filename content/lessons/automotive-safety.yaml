briefing: 'In professional workshop practice, mastering Automotive Workshop Safety:
  Vehicle Lifting, Jack Stands, Creeper Safety, Fluid Hazards and Fire Extinguisher
  Use requires strict adherence to safety standards and sequential execution. Always
  inspect personal protective equipment (PPE), ensure proper tool calibration, and
  verify that the workpiece is securely mounted before commencing. Observe manufacturer
  specifications and relevant standards. Maintain a clean work environment, store
  consumables dry, and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Automotive Workshop Safety: Vehicle
  Lifting, Jack Stands, Creeper Safety, Fluid Hazards and Fire Extinguisher Use kunahitaji
  kufuata sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla
  ya kuanza kazi.'
