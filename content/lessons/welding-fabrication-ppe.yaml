title_sw: 'Arc Welding Safety: Ppe Selection, Welding Bay Setup, Arc Flash, Fume Extraction
  And Hot Work Permits: Kanuni na Utendaji wa Vitendo'
briefing: 'In professional workshop practice, mastering Arc Welding Safety: PPE Selection,
  Welding Bay Setup, Arc Flash, Fume Extraction and Hot Work Permits requires strict
  adherence to safety standards and sequential execution. Always inspect personal
  protective equipment (PPE), ensure proper tool calibration, and verify that the
  workpiece is securely mounted before commencing. Observe manufacturer specifications
  and relevant standards. Maintain a clean work environment, store consumables dry,
  and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Arc Welding Safety: PPE Selection,
  Welding Bay Setup, Arc Flash, Fume Extraction and Hot Work Permits kunahitaji kufuata
  sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla ya
  kuanza kazi.'
