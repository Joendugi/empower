exercises:
- id: r000-13-q1
  type: MULTIPLE_CHOICE
  prompt: In the 2016 Ukraine power grid attack, what type of industrial control system did the attackers compromise to remotely open circuit breakers?
  options:
  - id: a
    text: ERP (Enterprise Resource Planning)
  - id: b
    text: SCADA (Supervisory Control and Data Acquisition)
  - id: c
    text: DNS (Domain Name System)
  - id: d
    text: SIEM (Security Information and Event Management)
  correct_answer: b
  hint: It controls physical industrial equipment remotely.
  explanation: SCADA systems monitor and control industrial processes including power distribution. Compromising them allowed attackers to send real commands to circuit breakers, causing physical power outages.
  xp_reward: 50
- id: r000-13-q2
  type: MULTIPLE_CHOICE
  prompt: What single security failure allowed DarkSide to access Colonial Pipeline's network in 2021?
  options:
  - id: a
    text: An unpatched operating system on a public web server
  - id: b
    text: A compromised VPN password found in a leaked credentials database
  - id: c
    text: A malicious USB drive left in the car park
  - id: d
    text: A zero-day vulnerability in the pipeline's SCADA software
  correct_answer: b
  hint: It was a password — not an exotic exploit.
  explanation: A single VPN account password, previously leaked in a separate breach and never changed, gave DarkSide their initial foothold. This demonstrates why password reuse and credential monitoring are critical.
  xp_reward: 50
- id: r000-13-q3
  type: FILL_BLANK
  prompt: The Cl0p group exploited a ___ injection vulnerability in MOVEit to steal data from hundreds of organisations without targeting each one individually.
  correct_answer: SQL
  hint: It is a classic web application attack that manipulates database queries.
  explanation: SQL injection in the MOVEit zero-day allowed Cl0p to query and exfiltrate databases without authentication. This supply-chain attack hit every customer of the vulnerable software simultaneously.
  xp_reward: 50
- id: r000-13-q4
  type: FILL_BLANK
  prompt: The Colonial Pipeline ransomware attack disrupted fuel supply to the US East Coast for ___ days.
  correct_answer: '6'
  hint: Nearly a week.
  explanation: Colonial voluntarily shut down its 8,850-km pipeline for six days. The disruption caused fuel shortages and price spikes across the US East Coast, demonstrating how a digital attack translates into real-world physical and economic harm.
  xp_reward: 50
