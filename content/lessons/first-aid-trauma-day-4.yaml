briefing: 'Unstabilised fractures cause severe pain, vascular transection, fat embolism syndrome,

  and convert closed fractures into contaminated open wounds during bumpy rural transport.

  A fractured femur can bleed 1.5 to 2.0 litres of blood into the thigh compartment silently.

  This day teaches fracture classification, the PMS (Pulse, Motor, Sensory) neurovascular

  assessment algorithm, the golden rule of splinting (immobilising the joint above and below),

  and practical improvised splints built from sticks, cardboard, blankets, and triangular bandages.

  '
briefing_sw: 'Mifupa iliyovunjika isipowekewa splint husababisha maumivu makali, uharibifu wa mishipa

  ya damu, na kuvuja kwa damu kwa ndani (mfupa wa paja unaweza kupoteza lita 1.5–2 za damu).

  Siku hii inafundisha jinsi ya kutambua mivunjiko, ukaguzi wa PMS (Mapigo ya moyo, Mwendo,

  na Hisia), na mbinu za kutengeneza splint kwa kutumia miti, makadibodi, na kanga.

  '
outline: '1. Fracture classifications: closed vs open (compound), greenstick, comminuted

  2. The PMS check: Pulse, Motor function, and Sensory assessment before and after splinting

  3. The Golden Rule of Splinting: immobilise one joint above and one joint below the fracture

  4. Open fracture emergency management: sterile covering, no bone reduction into wound

  5. Improvised splinting materials: branches, timber slats, folded cardboard, rolled blankets

  6. Traction splinting concepts for mid-shaft femur fractures (anatomical splinting)

  7. Sling and swathe techniques for collarbone (clavicle) and shoulder dislocations

  8. Compartment syndrome recognition: the 5 Ps (Pain out of proportion, Pallor, Pulselessness, Paresthesia,
  Paralysis)

  '
content_md: "## Fracture Classification & Hemorrhagic Risks\n\n- **Closed Fracture:** Skin remains intact\
  \ over the fracture site.\n- **Open (Compound) Fracture:** Bone fragments have penetrated through skin,\
  \ or a deep laceration extends down to the broken bone. High risk of osteomyelitis and systemic sepsis.\n\
  \n### Internal Blood Loss from Fractures:\n| Bone Fractured | Estimated Internal Hemorrhage | Shock\
  \ Risk |\n|----------------|-------------------------------|------------|\n| Radius / Ulna | 250 – 500\
  \ mL | Low |\n| Humerus | 500 – 750 mL | Moderate |\n| Tibia / Fibula | 500 – 1 000 mL | Moderate |\n\
  | **Femur (Thigh)** | **1 000 – 2 000 mL** | **Severe (Class II–III Shock)** |\n| **Pelvis** | **1 500\
  \ – 3 500+ mL** | **Critical / Fatal** |\n\n## The PMS Assessment Algorithm\n\n**Always assess PMS BEFORE\
  \ applying any splint, and RE-ASSESS immediately AFTER splinting:**\n1. **Pulse (Circulation):** Palpate\
  \ the most distal pulse (radial pulse for arm fractures; dorsalis pedis or posterior tibial pulse for\
  \ leg fractures). Check capillary refill time (< 2 seconds).\n2. **Motor (Movement):** Ask patient to\
  \ wiggle fingers or toes (\"Can you squeeze my fingers?\" or \"Push against my hand like pressing a\
  \ car accelerator\").\n3. **Sensory (Nerves):** Lightly touch distal digits and ask: \"Which finger/toe\
  \ am I touching? Does it feel numb or tingling?\"\n\n*Crucial Rule:* If pulses disappear or severe numbness\
  \ appears *after* splinting, the splint or ties are too tight. Loosen immediately!\n\n## The Golden\
  \ Rule of Splinting\n\n> **To immobilise a fractured bone, you must immobilise the joint ABOVE and the\
  \ joint BELOW the fracture site.**\n\n- **Example — Mid-shaft Tibia/Fibula fracture:** Splint must extend\
  \ from above the **knee joint** down past the **ankle joint**, securing the foot at 90 degrees.\n- **Example\
  \ — Forearm fracture:** Splint must support the **elbow joint** and immobilise the **wrist joint**.\n\
  \n## Rules of Field Splinting:\n1. **Splint the limb in the position found**, unless there is no distal\
  \ pulse (absent circulation). If pulseless, apply gentle, steady inline axial traction to align the\
  \ limb until pulse returns before splinting.\n2. **Never push protruding bone fragments back beneath\
  \ the skin.** Cover exposed bone with sterile moist gauze or clean cloth, then splint around it.\n3.\
  \ **Pad the splint:** Rigid boards or sticks must be padded with clothing, cotton, or towels over bony\
  \ prominences (ankles, knees, elbows) to prevent pressure necrosis.\n4. **Tie knots on the outside of\
  \ the splint**, never directly over the fracture or against bare skin.\n\n## Improvised Splinting Materials\
  \ in Kenya\n\n- **Cardboard Splint:** Fold heavy cardboard into a \"U\" or \"trough\" shape. Extremely\
  \ rigid once bent along its flutes; ideal for forearms and lower legs.\n- **Anatomical Splint (Buddy\
  \ Taping):** Use the patient's own body as a splint:\n  - Broken leg tied to uninjured leg with 4–5\
  \ cloth ties (kangas, scarves, belts) with padding between knees and ankles.\n  - Broken finger taped\
  \ to adjacent healthy finger.\n- **Tree Branches / Timber:** Two straight branches (padded with dry\
  \ grass or fabric) placed on medial and lateral sides of the limb, secured with strips of cloth.\n-\
  \ **Kanga / Scarf Slings:**\n  - Broad arm sling to elevate and support forearm fractures.\n  - **Swathe:**\
  \ A second horizontal cloth wrapped around the chest and injured arm to bind the arm securely against\
  \ the torso, preventing swing.\n"
exercises:
- id: fa4-q1
  type: MULTIPLE_CHOICE
  prompt: You apply an improvised cardboard splint to a patient's fractured lower leg. Five minutes later,
    the patient complains their foot feels numb and you can no longer feel the dorsalis pedis pulse. What
    should you do immediately?
  xp_reward: 35
  options:
  - id: a
    text: Elevate the leg higher to decrease swelling
  - id: b
    text: Loosen the splint wraps and re-check the distal pulse and sensation
  - id: c
    text: Wait 30 minutes to see if circulation normalizes
  - id: d
    text: Tighten the ties further to secure the bone fragments
  correct_answer: b
  explanation: 'Correct! Disappearance of a pulse or onset of numbness post-splinting indicates mechanical
    vascular or nerve compression by the splint ties. Loosen the bandages immediately until pulses return.


    Why the other options are wrong: Elevation will not restore a mechanically compressed arterial supply
    and may worsen ischemia. Waiting risks permanent nerve damage and ischemic muscle death. Ischemia
    must be relieved immediately. Tightening further will completely occlude remaining collateral circulation,
    causing gangrene.'
- id: fa4-q2
  type: FILL_BLANK
  prompt: The golden rule of fracture management dictates that a splint must immobilise the joint ___
    and the joint ___ the fracture site.
  xp_reward: 20
  correct_answer:
  - above
  - below
  explanation: Immobilising both the joint above and the joint below prevents muscular contraction and
    rotational forces from displacing the fractured bone ends.
- id: fa4-q3
  type: MATCH_PAIRS
  prompt: Match each type of improvised splint to its ideal clinical application.
  xp_reward: 30
  pairs:
  - left:
      id: l1
      text: Anatomical leg splint (Buddy splinting)
    right:
      id: r-9a80c8
      text: Binding the injured leg to the uninjured leg with padding between knees and ankles
  - left:
      id: l2
      text: Sling and swathe
    right:
      id: r-95b310
      text: Immobilising clavicle fractures and dislocated shoulders against the chest wall
  - left:
      id: l3
      text: Folded cardboard trough
    right:
