      text: Rapid rigid immobilisation of forearm, wrist, or lower leg fractures
  - left:
      id: l4
      text: Straight padded branches
    right:
      id: r-12381c
      text: Bilateral lateral/medial splinting for remote wilderness long-bone fractures
