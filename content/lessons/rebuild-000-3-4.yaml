exam_domain: CompTIA Security+ 3.0 · Digital Citizenship
xp_total: 210
exercises:
- id: r000-34-q1
  type: MULTIPLE_CHOICE
  prompt: According to the industry-standard 3-2-1 backup strategy, how many copies of your essential data should you maintain?
  options:
  - id: a
    text: 1 copy
  - id: b
    text: 2 copies
  - id: c
    text: 3 copies
  - id: d
    text: 10 copies
  correct_answer: c
  hint: The "3" in 3-2-1 stands for the total number of copies.
  explanation: 'The 3-2-1 rule dictates 3 copies of your data: the live working copy plus two distinct backup copies.'
  xp_reward: 50
- id: r000-34-q2
  type: MULTIPLE_CHOICE
  prompt: Why is it vital that at least one backup copy is kept "offline" (air-gapped) and disconnected from your computer network?
  options:
  - id: a
    text: Offline drives consume zero electricity and run faster
  - id: b
    text: Ransomware and attackers actively search for and encrypt any backup drive connected to the network
  - id: c
    text: Data transfers faster when the cable is unplugged
  - id: d
    text: Offline storage prevents physical dust from accumulating
  correct_answer: b
  hint: Think about how ransomware spreads across connected drives and shared folders.
  explanation: Ransomware traverses network shares and external drives plugged into infected machines. An air-gapped, disconnected drive cannot be reached or encrypted over the network.
  xp_reward: 50
- id: r000-34-q3
  type: FILL_BLANK
  prompt: A backup device physically disconnected from all networks and computers is described as being ___-gapped.
  correct_answer: air
  hint: A gap of physical air between the device and the network.
  explanation: An air gap provides physical isolation, preventing remote cyberattacks, malware propagation, and unauthorized network access.
  xp_reward: 50
- id: r000-34-q4
  type: SCENARIO
  prompt: A microfinance cooperative stores its loan ledger on a single office desktop. The manager plugs in an external hard drive every Friday to back up files, then unplugs it and locks it in a fireproof safe. Is this an effective 3-2-1 practice?
  options:
  - id: a
    text: No, external hard drives should never be stored in safes
  - id: b
    text: Yes, it provides an offline, air-gapped copy protected from both network ransomware and physical hazards
  - id: c
    text: No, backups should always remain plugged in 24/7
  - id: d
    text: No, financial ledgers do not need backups
  correct_answer: b
  hint: It creates an isolated, offline copy protected from malware and physical loss.
  explanation: Unplugging the drive and securing it in a safe creates an authentic air-gapped backup. Even if ransomware infects the office network on Monday, Friday's ledger remains untouched and restorable.
  xp_reward: 60
