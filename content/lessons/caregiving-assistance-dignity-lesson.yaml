id: "caregiving-assistance-dignity-lesson"
course_id: "caregiving-assistance"
title: "Week 1 — Dignity, consent, safeguarding, and boundaries"
title_sw: "Wiki 1 — Heshima, ridhaa, na ulinzi"
briefing: "Caregiving begins with the person, not the task list. Introduce yourself, explain each action, obtain consent, offer choices, and protect privacy during washing or dressing. Capacity can vary; follow the care plan and lawful representative process rather than assuming every older person cannot decide.\n\nProfessional boundaries protect both parties: do not borrow money, change a will, share photos, or accept control of mobile banking. Record gifts according to policy. Safeguarding signs include unexplained injury, fear, poor hygiene, missing medication, sudden financial change, or a caregiver who will not let the client speak.\n\nReport concerns through the designated channel and preserve immediate safety. Confidentiality does not mean hiding abuse or a medical emergency. Write objective observations—what you saw and heard—not accusations."
briefing_sw: "Wiki 1 — Heshima, ridhaa, na ulinzi: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "caregiving-assistance-dignity-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for a safeguarding concern?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "caregiving-assistance-dignity-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that a safeguarding concern was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "caregiving-assistance-dignity-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "caregiving-assistance-dignity-scenario"
    type: "SCENARIO"
    prompt: "A relative asks you to withdraw money using the client’s PIN because “we always do it.” What should you do?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
