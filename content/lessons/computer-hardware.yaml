- id: tvet-ict-technician-computer-hardware-motherboard-components-cpu-ram-storage-devices-psu-peripheral-interfaces-and-fault-finding-q1
  type: MULTIPLE_CHOICE
  prompt: 'What is the first step a technician must take before starting Computer
    Hardware: Motherboard Components, CPU, RAM, Storage Devices, PSU, Peripheral Interfaces
    and Fault Finding?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
    text: Inspect PPE, workspace ventilation, and machine guards
  - id: c
    text: Disable circuit breakers to save power
  - id: d
    text: Paint the workpiece
  correct_answer: b
