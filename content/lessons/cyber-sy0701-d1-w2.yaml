exercises:
- id: cyber-sy0701-d1-w2-q1
  type: MULTIPLE_CHOICE
  prompt: 'A backout plan is used when:'
  options:
  - id: a
    text: The change succeeds and you celebrate only
  - id: b
    text: The change fails or causes harm and you restore the last known good state
  - id: c
    text: You fire the SOC
  - id: d
    text: You disable logging
  correct_answer: b
  hint: Undo.
  explanation: No backout = gambling with availability.
  xp_reward: 50
- id: cyber-sy0701-d1-w2-q2
  type: MULTIPLE_CHOICE
  prompt: 'Allow lists / deny lists during a change are:'
  options:
  - id: a
    text: Irrelevant slogans
  - id: b
    text: Technical implications that may block or permit traffic/apps
  - id: c
    text: Physical bollards
  - id: d
    text: Honeytokens
  correct_answer: b
  hint: 1.3 technical implications.
  explanation: A new deny list can break the MIS. Impact-analyse it.
  xp_reward: 50
- id: cyber-sy0701-d1-w2-q3
  type: MULTIPLE_CHOICE
  prompt: 'The best time to restart a student records server is usually:'
  options:
  - id: a
    text: Peak registration without notice
  - id: b
    text: An agreed maintenance window with stakeholders told
  - id: c
    text: During the exam as a surprise
  - id: d
    text: Never, even for patches
  correct_answer: b
  hint: Window.
  explanation: Availability is a CIA pillar. Windows exist to protect it.
  xp_reward: 50
- id: cyber-sy0701-d1-w2-q4
  type: MULTIPLE_CHOICE
  prompt: 'After a network change, diagrams should be:'
  options:
  - id: a
    text: Left stale
  - id: b
    text: Updated so the next incident responder is not flying blind
  - id: c
    text: Deleted for secrecy
  - id: d
    text: Printed in Comic Sans only
  correct_answer: b
  hint: Documentation.
  explanation: Objective 1.3 lists updating diagrams and policies.
  xp_reward: 50
