id: cyber-sy0701-d1-w2
course_id: secplus-concepts
title: Week 2 — Change management and security impact
title_sw: Wiki 2 — Usimamizi wa mabadiliko
briefing: 'Objective 1.3: explain why change management exists. Untracked changes are how “who opened RDP” happens. Business process: request, approval, ownership, stakeholders, impact analysis, test results, backout plan, maintenance window, and SOP. A campus firewall rule at 10 a.m. on a registration day without a window is an availability incident waiting to happen.


  Technical implications: allow lists and deny lists, restricted activities, downtime, service/application restart, legacy applications, and dependencies. Updating a TLS certificate may restart a web server — say so in the change ticket. Documentation: update diagrams and policies. Version control for firewall configs and scripts is part of the objective, not a developer hobby.


  Kenyan polytechnic translation: the ICT officer who “just changed DNS” without a ticket violates this even if it worked. Security+ will give you a scenario where a change caused an outage because there was no backout. The answer is almost never “try another random change”.


  Artefact this week: a change request for enabling WPA3 on student Wi-Fi — impact, test (one AP first), backout (restore WPA2-Enterprise), window (Sunday 05:00), and who approves.'
briefing_sw: Ombi, idhini, uchambuzi wa athari, majaribio, mpango wa kurejesha, dirisha la matengenezo. Sasisha michoro. Version control. Usibadilishe DNS kimya.
