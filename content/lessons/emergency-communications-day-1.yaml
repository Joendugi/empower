      text: Reliable line-of-sight communication over 10–50 km with compact antennas
  - left:
      id: l3
      text: UHF Band (300–3000 MHz)
    right:
      id: r-9183af
      text: Superior penetration through urban concrete walls and dense forest foliage
  - left:
      id: l4
      text: 50 Ohm Dummy Load
    right:
      id: r-9ffe20
      text: Absorbs transmitted RF power as heat for safe transmitter calibration
