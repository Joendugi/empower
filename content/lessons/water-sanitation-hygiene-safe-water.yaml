- id: water-sanitation-hygiene-safe-water-chain-from-source-to-cup-catchment-protection-treatment-options-boiling-chlorination-sodis-filtration-q1
  type: MULTIPLE_CHOICE
  prompt: 'What is the first step a technician must take before starting Safe Water
    Chain from Source to Cup: Catchment Protection, Treatment Options (Boiling, Chlorination,
    SODIS, Filtration)?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
    text: Inspect PPE, workspace ventilation, and machine guards
  - id: c
    text: Disable circuit breakers to save power
  - id: d
    text: Paint the workpiece
  correct_answer: b
  hint: Safety and equipment inspection always precede tool contact.
  explanation: Workplace health and safety regulations require pre-operational checks
    of all tools and PPE.
  xp_reward: 50
- id: water-sanitation-hygiene-safe-water-chain-from-source-to-cup-catchment-protection-treatment-options-boiling-chlorination-sodis-filtration-q2
