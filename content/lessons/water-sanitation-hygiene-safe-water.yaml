briefing: 'In professional workshop practice, mastering Safe Water Chain from Source
  to Cup: Catchment Protection, Treatment Options (Boiling, Chlorination, SODIS, Filtration)
  requires strict adherence to safety standards and sequential execution. Always inspect
  personal protective equipment (PPE), ensure proper tool calibration, and verify
  that the workpiece is securely mounted before commencing. Observe manufacturer specifications
  and relevant standards. Maintain a clean work environment, store consumables dry,
  and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Safe Water Chain from Source to Cup:
  Catchment Protection, Treatment Options (Boiling, Chlorination, SODIS, Filtration)
  kunahitaji kufuata sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga
  (PPE) kabla ya kuanza kazi.'
