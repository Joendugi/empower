id: "plumbing-sanitary-lesson"
course_id: "plumbing"
title: "Week 6 — Sanitary appliances: set-out, seals, and flush"
title_sw: "Wiki 6 — Vifaa vya usafi"
briefing: "Sanitary appliances are a listed plumber core: WC pans, cisterns, basins, sinks, urinals, showers, bidets as the college workshop stocks. Set-out from finished floor and centre-lines so the pan sits square to the wall and the seat does not hit the cistern. Pan connectors (soil fitments) must be the right offset; a pan wedged with mortar is a crack waiting.\n\nBasins: brackets or pedestals that actually carry the load, waste and overflow working, trap accessible. Do not support a basin only on the trap. Showers: tray level, waste with hair trap, and a fall that does not flood the room. Sealant is a second defence, not a substitute for a mechanical joint.\n\nFlush: cistern fills to the marked waterline, drop valve or siphon as specified, no continuous trickle (wastes water and stains). Dual flush where specified. After install, flush several times and check the pan connector from the access if you have it.\n\nHygiene: potable supplies to cisterns via approved inlet valves; overflow discharging safely. PPE for used appliances on rehab jobs. Test: fill, flush, no drip at the stopcock, no rock on the pan."
briefing_sw: "WC iwe square, connector sahihi, si mortar kama wedge. Bonde liwe na bracket, si trap pekee. Cistern ijaa hadi alama, isichuruzike. Sealant si kiungo pekee. Flush mara kadhaa kisha kagua."
estimated_minutes: 26
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/06/4"
exam_domain: "Sanitary appliances"
exercises:
  - id: "plumbing-sanitary-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A WC pan should be held by:"
    options:
      - id: "a"
        text: "Mortar jammed as a wedge under one side only"
      - id: "b"
        text: "Specified fixings, level, with the correct pan connector — not stress from packing"
      - id: "c"
        text: "The trap of the basin"
      - id: "d"
        text: "PTFE only"
    correct_answer: "b"
    hint: "Mechanical fix."
    explanation: "Stressed ceramic cracks after handover."
    xp_reward: 50
  - id: "plumbing-sanitary-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A basin supported only by the waste trap will:"
    options:
      - id: "a"
        text: "Last longer"
      - id: "b"
        text: "Strain and leak — use brackets/pedestal as designed"
      - id: "c"
        text: "Improve seal"
      - id: "d"
        text: "Vent the stack"
    correct_answer: "b"
    hint: "Load path."
    explanation: "Traps are not structural."
    xp_reward: 50
  - id: "plumbing-sanitary-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A cistern that never stops filling usually has:"
    options:
      - id: "a"
        text: "A failed inlet valve / wrong waterline / leaking flush valve"
      - id: "b"
        text: "Too much fall on the gutter"
      - id: "c"
        text: "A good dual flush"
      - id: "d"
        text: "No overflow needed ever"
    correct_answer: "a"
    hint: "Inlet or outlet leaking."
    explanation: "Adjust or replace. Continuous flow is a defect and a water bill."
    xp_reward: 50
  - id: "plumbing-sanitary-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Silicone around a shower tray:"
    options:
      - id: "a"
        text: "Replaces the waste joint"
      - id: "b"
        text: "Seals the perimeter after the tray is level and the waste is proven"
      - id: "c"
        text: "Should be applied to the soil stack threads"
      - id: "d"
        text: "Is a type of PTFE"
    correct_answer: "b"
    hint: "Second defence."
    explanation: "If the waste leaks, silicone at the wall will not save the ceiling."
    xp_reward: 50
  - id: "plumbing-sanitary-fb1"
    type: "FILL_BLANK"
    prompt: "The fitting that joins a WC pan to the soil pipe is a pan ___."
    correct_answer: "connector"
    hint: "Also soil fitment / horn connector."
    explanation: "Correct offset and a dry, complete push-fit beat cement smears."
    xp_reward: 50
  - id: "plumbing-sanitary-scenario"
    type: "SCENARIO"
    prompt: "After tiling, the pan rocks 8 mm and the connector weeps on flush. Trainee adds more silicone at the floor. You should:"
    options:
      - id: "a"
        text: "Approve the smear"
      - id: "b"
        text: "Reset the pan level on a proper bed/fixings and remake the connector; silicone is not a joint"
      - id: "c"
        text: "Tighten the seat bolts until the ceramic cracks"
      - id: "d"
        text: "Block the overflow"
    correct_answer: "b"
    hint: "Level plus connector."
    explanation: "Sanitary appliances are a fit-and-test unit."
    xp_reward: 60
