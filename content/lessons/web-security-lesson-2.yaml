id: web-security-lesson-2
course_id: web-security
title: Sessions, cookies, HTTPS, and secrets
title_sw: Sessions, cookies, HTTPS, na siri
briefing: 'After injection and XSS, you must understand the session. Cookies that store session IDs need Secure and HttpOnly flags in production thinking. A session in localStorage is easier for XSS to steal. CSRF tokens or SameSite cookies reduce cross-site request forgery.


  HTTPS (TLS) protects data in transit from cafe Wi-Fi snooping. It does not fix SQL injection. Mixed content (HTTPS page loading HTTP script) is a downgrade. Certificate warnings exist because someone might be intercepting — do not click through on banking.


  Secrets: API keys in a public GitHub repo are live incidents. .env files are not for the frontend bundle. Rotate keys if they leak. Password reset tokens must expire and be single-use.


  Auth: default admin/admin on a lab app is a finding. Change it. Lockout / MFA on admin panels is a control, not a nuisance.'
briefing_sw: Cookie ya session iwe HttpOnly/Secure. HTTPS inalinda njiani, si injection. Usiignore certificate warning kwenye benki. Usiweke API key kwenye GitHub. Badilisha default passwords.
