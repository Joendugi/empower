id: "welding-fabrication-mma-lesson"
course_id: "welding-fabrication"
title: "Joints, electrodes, and MMA setup"
title_sw: "Viungo, electrode, na MMA"
briefing: "MMA/SMAW (stick) is the common polytechnic process. Joint types: butt (edges in one plane), lap (overlap), T-fillet, and corner. A fillet sits in the included angle; its size is the leg length, not how pretty the ripples look. Clean mill scale, rust, and oil from the joint. A dirty joint is porosity waiting to happen.\n\nElectrode diameter and current are paired. A typical starting point many trainers use: roughly 30–40 A per millimetre of electrode diameter, then tune to the puddle. Too cold: the slag fights you and the bead sits high. Too hot: undercut and burn-through on thin plate. Electrode angle and arc length (about the core diameter) matter as much as the dial.\n\nStrike on the joint or on a scrap, not on the bench. Travel speed should leave a bead about twice the core diameter for many pad welds — follow the WPS or job card. Stop, chip, and inspect between runs on a multi-pass butt. Interpass temperature matters on thicker plate; do not freeze a second pass onto black cold slag.\n\nStore electrodes dry. Damp rutile/basic rods give hydrogen cracks and porosity. If the oven is required, use it."
briefing_sw: "Butt, lap, fillet. Safisha kiungo. Current inafuatana na kipenyo cha electrode. Arc fupi. Angle na kasi vinaathiri bead. Hifadhi electrode kavu."
estimated_minutes: 22
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/WEL/CR/02/5"
exam_domain: "MMA / SMAW practice"
exercises:
  - id: "welding-fabrication-mma-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which joint joins two plates in the same plane, edge to edge?"
    options:
      - id: "a"
        text: "Lap joint"
      - id: "b"
        text: "Butt joint"
      - id: "c"
        text: "Wood dovetail"
      - id: "d"
        text: "Rivet without heat"
    correct_answer: "b"
    hint: "Edges face each other."
    explanation: "A butt joint welds two edges in one plane."
    xp_reward: 50
  - id: "welding-fabrication-mma-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A fillet weld size is primarily described by:"
    options:
      - id: "a"
        text: "The colour of slag"
      - id: "b"
        text: "Leg length (and throat as specified)"
      - id: "c"
        text: "Electrode brand only"
      - id: "d"
        text: "Helmet sticker"
    correct_answer: "b"
    hint: "Geometry, not art."
    explanation: "Inspectors measure legs. Ripple is secondary to size and fusion."
    xp_reward: 50
  - id: "welding-fabrication-mma-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "An arc that is too long typically causes:"
    options:
      - id: "a"
        text: "Perfect fusion always"
      - id: "b"
        text: "Spatter, unstable arc, and poor shielding"
      - id: "c"
        text: "Automatic heat treatment"
      - id: "d"
        text: "Smaller electrodes"
    correct_answer: "b"
    hint: "The gas shield is the flux envelope."
    explanation: "Keep a short arc. Long arcs suck air into the puddle."
    xp_reward: 50
  - id: "welding-fabrication-mma-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Damp basic electrodes are a risk because:"
    options:
      - id: "a"
        text: "They weld faster"
      - id: "b"
        text: "Moisture can add hydrogen and porosity / cracking"
      - id: "c"
        text: "They become stainless"
      - id: "d"
        text: "NITA requires wet rods"
    correct_answer: "b"
    hint: "Hydrogen cracking."
    explanation: "Dry storage or baking as specified is part of the trade."
    xp_reward: 50
  - id: "welding-fabrication-mma-fb1"
    type: "FILL_BLANK"
    prompt: "Stick welding using a flux-coated consumable electrode is abbreviated MMA or ___."
    correct_answer: "SMAW"
    hint: "Shielded Metal Arc Welding."
    explanation: "MMA and SMAW are the same family of process."
    xp_reward: 50
  - id: "welding-fabrication-mma-scenario"
    type: "SCENARIO"
    prompt: "Thin 1.5 mm sheet burns through at 120 A with a 3.2 mm rod. What is the professional adjustment?"
    options:
      - id: "a"
        text: "Increase to 180 A"
      - id: "b"
        text: "Drop current, consider a smaller electrode, faster travel, and a backing or different joint"
      - id: "c"
        text: "Remove the helmet to see better"
      - id: "d"
        text: "Weld underwater"
    correct_answer: "b"
    hint: "Heat input vs thickness."
    explanation: "Heat input is current, voltage/arc, and time. Thin sheet needs less heat, not more heroics."
    xp_reward: 60
