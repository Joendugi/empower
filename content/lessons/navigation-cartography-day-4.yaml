  - l2=r-fb2259
  - l3=r-a1c5e4
  - l4=r-76dc2e
  explanation: 'Alidade sights rays; plumbing fork centers the table over pegs; trough compass finds magnetic
    north; backsighting provides high-precision orientation.

    '
- id: nav-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why is ''Backsighting'' preferred over using a magnetic trough compass for orienting a plane
    table when surveying a closed settlement boundary?

    '
  xp_reward: 50
  options:
  - id: a
    text: Backsighting can be done in pitch darkness
  - id: b
    text: Because trough compass needles break if used outdoors
  - id: c
    text: Backsighting relies strictly on optical line-of-sight between surveyed pegs, making it completely
      immune to local magnetic anomalies, ironstone rocks, and compass reading errors
  - id: d
    text: Backsighting automatically measures elevation contours
  explanation: 'Trough compasses can be deflected by buried iron minerals, fencing, or vehicles by 1°
    to 3°. Backsighting directly aligns with the surveyed baseline on the ground, delivering optical orientation
    accuracy of minutes of arc.


    Why the other options are wrong: Backsighting requires visual optical line-of-sight to a ranging rod
    in daylight. Trough compasses are durable, but sensitive to magnetic distortion. Standard sight-rule
    alidades measure horizontal directions, not vertical contours.'
  correct_answer: c
- id: nav-d4-q5
  type: FILL_BLANK
  prompt: 'When surveying a 1:500 community base map using the Method of Radiation, a measured ground
    distance of 35.0 metres from the central station to a water well will be scaled off as exactly ___
    cm along the alidade ray on the paper.

    '
  xp_reward: 50
  correct_answer: '7.0'
  explanation: 'At 1:500 scale, 1 cm on paper = 500 cm = 5.0 metres on ground. Paper distance = 35.0 m
    / 5.0 m/cm = 7.0 cm.

    '
