id: tvet-database-w2
course_id: database-systems
title: Week 2 — Design, integrity, and normalisation
title_sw: Wiki 2 — Usanifu, uadilifu, na normalisation
briefing: 'Design concepts in the unit include entity integrity and referential integrity. Entity integrity: primary key unique and not null. Referential integrity: a foreign key must match an existing parent or be null if allowed. If you delete a course that still has enrolments, the DBMS should reject or cascade according to the rule you declared — you must choose on purpose.


  Relationships: one-to-one (rarely, citizen ID card), one-to-many (one department, many staff), many-to-many (students and units) which needs a junction table (enrolment). Cardinality belongs on the ER drawing. Attributes have data types: integer, varchar, date, boolean. Do not store “yes” and “Y” and “true” as three conventions.


  Normalisation (1NF, 2NF, 3NF) is how you remove repeating groups and partial/transitive dependencies. 1NF: atomic columns, no lists in a cell. 2NF: no partial key dependencies in composite keys. 3NF: no non-key column depending on another non-key (city depending on postal code stored beside a repeating address). College example: do not store lecturer phone on every enrolment row.


  Deliverable: ER for a simple library or workshop job-card system, mapped to 3NF tables, with keys marked. That is the design week before SQL next week.'
briefing_sw: 'Entity integrity: primary key si null. Referential: foreign key ina mzazi. Many-to-many inahitaji jedwali la kiungo. 1NF, 2NF, 3NF. Usiweke simu ya mwalimu kwenye kila mstari wa alama.'
