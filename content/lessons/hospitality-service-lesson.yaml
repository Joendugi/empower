id: "hospitality-service-lesson"
course_id: "hospitality"
title: "Service, mise en place, and complaints"
title_sw: "Huduma, mise en place, na malalamiko"
briefing: "Mise en place means everything in its place before service: garnishes cut, stations stocked, glasses polished. Panic during service is usually poor prep, not fate.\n\nGreet, inform, and serve from the correct side as the style requires. Hot plates are warned. Dietary needs are not a joke — allergen contamination can hospitalise.\n\nComplaints: listen, apologise without arguing, replace or remove, tell the supervisor, log. A hair in soup is not a debate about protein. The guest is not always right about the recipe, but they are always heard.\n\nClose-down is hygiene: labelling, temperatures, and a clean pass so the morning brigade does not inherit your mess."
briefing_sw: "Mise en place kabla ya service. Allergens ni hatari. Malalamiko: sikiliza, samahani, badilisha, log. Usibishane kuhusu nywele kwenye supu."
estimated_minutes: 16
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FBP/CR/03/5"
exam_domain: "Food service"
exercises:
  - id: "hospitality-service-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Mise en place is:"
    options:
      - id: "a"
        text: "A type of pastry"
      - id: "b"
        text: "Preparation so service is not a scramble"
      - id: "c"
        text: "Mopping after close only"
      - id: "d"
        text: "A French complaint"
    correct_answer: "b"
    hint: "Before service."
    explanation: "Prep is the job. Service is the test of prep."
    xp_reward: 50
  - id: "hospitality-service-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A guest finds a hair in soup. Professional response:"
    options:
      - id: "a"
        text: "Argue that protein looks like hair"
      - id: "b"
        text: "Apologise, remove, replace, and log with the supervisor"
      - id: "c"
        text: "Discount nothing and laugh"
      - id: "d"
        text: "Blame the guest"
    correct_answer: "b"
    hint: "Service recovery."
    explanation: "Own it. Fix the kitchen check that failed."
    xp_reward: 50
  - id: "hospitality-service-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A peanut allergy must be treated as:"
    options:
      - id: "a"
        text: "Pickiness"
      - id: "b"
        text: "A safety specification — avoid cross-contact"
      - id: "c"
        text: "Solved by extra chilli"
      - id: "d"
        text: "Only a front-of-house issue"
    correct_answer: "b"
    hint: "Anaphylaxis."
    explanation: "Tell the kitchen. Use clean utensils. If unsure, do not serve."
    xp_reward: 50
  - id: "hospitality-service-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Arguing with a guest about a cold plate usually:"
    options:
      - id: "a"
        text: "Improves the brand"
      - id: "b"
        text: "Makes the situation worse — fix and follow up"
      - id: "c"
        text: "Is required in exams"
      - id: "d"
        text: "Replaces mise en place"
    correct_answer: "b"
    hint: "Recovery."
    explanation: "Replace the plate. Train the pass. Do not win the argument."
    xp_reward: 50
  - id: "hospitality-service-fb1"
    type: "FILL_BLANK"
    prompt: "Having tools and garnishes ready before service is mise en ___."
    correct_answer: "place"
    hint: "French: putting in place."
    explanation: "Mise en place is professional prep."
    xp_reward: 50
  - id: "hospitality-service-scenario"
    type: "SCENARIO"
    prompt: "Kitchen sent fish to a guest who asked for no fish (religion). It is already on the table. You:"
    options:
      - id: "a"
        text: "Tell them to pick it off"
      - id: "b"
        text: "Remove immediately, apologise, get a correct meal, inform chef, log the error"
      - id: "c"
        text: "Offer extra tartare as compensation only"
      - id: "d"
        text: "Hide the fish under salad"
    correct_answer: "b"
    hint: "Respect plus hygiene."
    explanation: "Do not negotiate belief or contamination. Replace the dish."
    xp_reward: 60
