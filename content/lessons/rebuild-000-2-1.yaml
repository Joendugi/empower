exercises:
- id: r000-21-q1
  type: MULTIPLE_CHOICE
  prompt: Which phase of a cyberattack involves installing a hidden account or backdoor to ensure continued access?
  options:
  - id: a
    text: Reconnaissance
  - id: b
    text: Initial Access
  - id: c
    text: Persistence
  - id: d
    text: Impact
  correct_answer: c
  hint: The attacker wants to survive even if discovered.
  explanation: Persistence is Phase 3. After gaining initial access, attackers create mechanisms — backdoors, hidden admin accounts, scheduled tasks — that keep them inside even if their original entry point is closed.
  xp_reward: 50
- id: r000-21-q2
  type: MULTIPLE_CHOICE
  prompt: During the Reconnaissance phase, which of these activities would an attacker MOST likely perform?
  options:
  - id: a
    text: Encrypting the target's files with ransomware
  - id: b
    text: Installing a remote access trojan on a server
  - id: c
    text: Searching LinkedIn for employee names and scraping public IP ranges
  - id: d
    text: Sending phishing emails to the target's staff
  correct_answer: c
  hint: Reconnaissance is passive information gathering — before any attack.
  explanation: 'Reconnaissance involves collecting publicly available information: employee names, email formats, IP addresses, software versions, and leaked credentials. No attack has happened yet — the attacker is building a map of their target.'
  xp_reward: 50
- id: r000-21-q3
  type: FILL_BLANK
  prompt: The three most common Initial Access vectors are phishing, unpatched software, and weak or ___ passwords.
  correct_answer: stolen
  hint: Think about credentials obtained from previous breaches.
  explanation: 'Stolen (or leaked) passwords from previous data breaches are used in credential-stuffing attacks: attackers try the same email/password combination across many services, exploiting users who reuse passwords.'
  xp_reward: 50
- id: r000-21-q4
  type: SCENARIO
  prompt: An attacker sends a fake "salary slip" email to an HR officer at a power company. The officer opens the attached PDF, which silently installs software giving the attacker remote access. Which two phases have just occurred?
  options:
  - id: a
    text: Reconnaissance and Persistence
  - id: b
    text: Initial Access and Persistence
  - id: c
    text: Reconnaissance and Impact
  - id: d
    text: Initial Access and Impact
  correct_answer: b
  hint: The email is the entry point; the installed software ensures the attacker can stay.
  explanation: The phishing email represents Initial Access (Phase 2) — exploiting a human weakness to gain the first foothold. The software that installs in the background is a backdoor, which is Persistence (Phase 3). Reconnaissance happened earlier and Impact has not yet occurred.
  xp_reward: 60
