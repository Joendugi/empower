id: "hospitality-hygiene-food-lesson"
course_id: "hospitality"
title: "Food hygiene and temperature control"
title_sw: "Usafi wa chakula na joto"
briefing: "The danger zone for bacterial growth is approximately 5–60 °C. Keep cold food cold and hot food hot. Do not leave cooked stew on the pass overnight “to cool slowly in a deep pot”. Cool quickly in shallow containers as taught, then refrigerate.\n\nSeparate raw and cooked: boards, knives, cloths. Colour-coded boards exist because chicken juice on a salad is an outbreak. Wash hands after raw protein, after the toilet, and after handling refuse.\n\nFIFO stock rotation. Date labels. A dented blown can is not a bargain. Report pest signs; do not hide droppings with a mat.\n\nPersonal hygiene: hair restrained, wounds covered with a waterproof dressing, no jewellery that falls in food. That is the unit, not extra politeness."
briefing_sw: "Danger zone takriban 5–60 °C. Tenganisha mbichi na iliyopikwa. Poza haraka. FIFO. Funga vidonda. Funga nywele."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FBP/CR/01/5"
exam_domain: "Food hygiene"
exercises:
  - id: "hospitality-hygiene-food-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "The danger zone for bacterial growth in food is approximately:"
    options:
      - id: "a"
        text: "Below 0 °C only"
      - id: "b"
        text: "About 5 °C to 60 °C"
      - id: "c"
        text: "Above 200 °C only"
      - id: "d"
        text: "Room temperature is always safe"
    correct_answer: "b"
    hint: "Fridge vs hot-hold."
    explanation: "Time in the zone matters. Get through it quickly."
    xp_reward: 50
  - id: "hospitality-hygiene-food-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Raw chicken and salad should share:"
    options:
      - id: "a"
        text: "The same board “if wiped”"
      - id: "b"
        text: "Separate boards and utensils"
      - id: "c"
        text: "The same cloth all service"
      - id: "d"
        text: "A bucket of warm danger-zone water"
    correct_answer: "b"
    hint: "Cross-contamination."
    explanation: "Colour codes only work if you obey them."
    xp_reward: 50
  - id: "hospitality-hygiene-food-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "FIFO means:"
    options:
      - id: "a"
        text: "Fry in fat only"
      - id: "b"
        text: "First in, first out — older stock used first"
      - id: "c"
        text: "Finish in the oven"
      - id: "d"
        text: "Fire in the pastry"
    correct_answer: "b"
    hint: "Rotation."
    explanation: "Date and rotate. Reduced waste and safer food."
    xp_reward: 50
  - id: "hospitality-hygiene-food-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A deep pot of stew cooling on the stove all night is a risk because:"
    options:
      - id: "a"
        text: "It tastes better"
      - id: "b"
        text: "The core stays in the danger zone for too long"
      - id: "c"
        text: "Refrigerators dislike steel"
      - id: "d"
        text: "NITA bans stew"
    correct_answer: "b"
    hint: "Cooling method."
    explanation: "Portion, shallow, chill. Then store."
    xp_reward: 50
  - id: "hospitality-hygiene-food-fb1"
    type: "FILL_BLANK"
    prompt: "Using the oldest food first is the ___ system (four letters)."
    correct_answer: "FIFO"
    hint: "First in, first out."
    explanation: "FIFO is stock rotation."
    xp_reward: 50
  - id: "hospitality-hygiene-food-scenario"
    type: "SCENARIO"
    prompt: "A trainee uses the raw-meat board for chopping parsley because the green board is in the wash. You:"
    options:
      - id: "a"
        text: "Allow it if they wipe with their apron"
      - id: "b"
        text: "Stop: wash a clean board or delay; do not contaminate ready-to-eat food"
      - id: "c"
        text: "Rinse parsley in the chicken sink"
      - id: "d"
        text: "Serve extra chilli to kill bacteria"
    correct_answer: "b"
    hint: "Ready-to-eat."
    explanation: "Chilli does not sanitise Salmonella. Get a clean board."
    xp_reward: 60
