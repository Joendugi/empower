id: tvet-net-w3
course_id: computer-networks
title: Week 3 — Device configuration, LAN types, and network testing
title_sw: Wiki 3 — Usanidi wa vifaa, LAN, na majaribio
briefing: 'Perform Computer Networking (300 hours) learning outcomes continue: identify types (LAN, WAN, PAN, MAN), topologies (star, ring, mesh, hybrid, point-to-point), then connect, configure, build a LAN, and test. Devices: hub versus switch versus router, ports, media (copper, fibre, wireless), NICs, gateways. Hubs collide; switches forward by MAC; routers by IP.


  Configuration: management IP on a switch, default gateway, DNS, DHCP pool, and wireless SSID/security (WPA2/WPA3, not open lab SSIDs with the password on the blackboard forever). Ethernet and the TCP/IP suite. Document the architecture: which VLAN is staff, which is students, where NAT happens. College LANs usually star out from a core switch — do not invent a ring because it looks exam-fancy if the site is a star.


  Testing tools in the curriculum: cable tester, tone/signal tester, clamp meter and voltmeter when you suspect PoE or power issues, plus `ping`, `ipconfig`/`ip`, `tracert`. Write a test plan: what will be tested, expected result, instruments. A link light is not a test report. Split pairs pass some cheap testers and fail under load — use a proper wiremap.


  Safety: antistatic, no copper punch-downs on live PoE without knowing the kit, fibre eye safety. Resources: crimp tools, RJ45, punch-down, labelled patch panel. Portfolio: drawing, IP plan, test results. That is 300 hours evidenced, not one successful ping of localhost.'
briefing_sw: LAN/WAN/PAN, star/mesh. Switch ni MAC; router ni IP. DHCP, gateway, WPA2/WPA3. Cable tester, ping, traceroute. Andika mpango wa majaribio. Usitumie nenosiri la Wi-Fi ubaoni milele.
estimated_minutes: 32
