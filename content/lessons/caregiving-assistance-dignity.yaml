  prompt: 'Why is calibration and clean alignment critical in Dignity, Consent and
    Safeguarding in Caregiving: Person-Centred Care, Professional Boundaries and Duty
    of Candour?'
  options:
  - id: a
    text: To ensure precision, prevent joint defects, and guarantee durability
  - id: b
    text: It is only required for cosmetic reasons
  - id: c
    text: It uses more consumables
  - id: d
    text: No reason; alignment does not affect quality
  correct_answer: a
  hint: Accuracy leads to high-grade workmanship.
  explanation: Precise setout prevents structural failure, porosity, and tolerance
    issues.
  xp_reward: 50
