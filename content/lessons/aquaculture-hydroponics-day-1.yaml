  - l4=r-9fa201
  explanation: 'Secchi 30-40 cm is ideal; nitrite causes methemoglobinemia treatable with chloride; Secchi
    < 20 cm warns of algal crash; DO < 3.0 mg/L halts feeding and growth.

    '
- id: aqua-d1-q4
  type: MULTIPLE_CHOICE
  prompt: 'When excavating an earthen fish pond in clay-loam soil, what is the recommended slope ratio
    for the inside (wet) dyke walls, and why?

    '
  xp_reward: 50
  options:
  - id: a
    text: 2:1 or 3:1 (horizontal to vertical), because steeper slopes will slump and collapse into the
      pond under wave action and saturated soil hydrostatic pressure
  - id: b
    text: 1:1 vertical cut to maximize the total water holding volume of the pond
  - id: c
    text: 5:1 slope on all sides to allow fish to swim onto the grass to forage
  - id: d
    text: Vertical timber walls backed by untreated cardboard
  explanation: 'A slope of 2:1 (2 m horizontal for every 1 m vertical) or 3:1 prevents dyke slumping.
    Vertical or 1:1 slopes quickly erode and collapse into the pond basin when saturated with water.


    Why the other options are wrong: A 1:1 slope in unreinforced earth will quickly wash out and cave
    in under wave action. 5:1 is unnecessarily shallow, wasting vast amounts of agricultural land and
    shallowing water. Cardboard will dissolve instantly and timber will rot rapidly underwater.'
  correct_answer: a
- id: aqua-d1-q5
  type: FILL_BLANK
  prompt: 'African Sharptooth Catfish (Clarias gariepinus) can survive in stagnant, zero-dissolved-oxygen
    water and tolerate stocking densities above 50 kg/m³ because they possess a specialized arborescent
    accessory breathing organ known as the ___ organ, allowing them to inhale atmospheric air.

    '
  xp_reward: 50
  correct_answer: suprabranchial
  explanation: 'The suprabranchial organ (or arborescent organ) located above the gills functions like
    a primitive lung, enabling Clarias gariepinus to absorb oxygen directly from atmospheric air.

    '
