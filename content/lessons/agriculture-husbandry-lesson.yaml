id: "agriculture-husbandry-lesson"
course_id: "agriculture"
title: "Soil, water, and crop husbandry"
title_sw: "Udongo, maji, na mazao"
briefing: "Know your soil. pH and texture decide whether fertiliser is used or wasted. Overdosing nitrogen burns and pollutes water. Follow a recommendation, not “more is greener”. Organic matter and drainage matter as much as a bag of DAP.\n\nCrop rotation breaks pest cycles and balances nutrients. Planting the same family on the same plot every season trains pests. Spacing and seed rate are on the packet or the local recommendation — crowding makes weak stems and disease.\n\nWater: irrigate to the root zone. Little-and-often on a baked crust can still stress plants. Mulch to reduce evaporation where taught.\n\nIdentify the crop stage. Spraying a flowering crop with the wrong product kills pollinators and can void a market standard."
briefing_sw: "Jua pH ya udongo. Mbolea nyingi si bora. Zungusha mazao. Fuata seed rate. Mwagilia kwenye mizizi. Usinyunyize dawa ovyo wakati wa maua."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AGR/CR/01/5"
exam_domain: "Crop production"
exercises:
  - id: "agriculture-husbandry-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Crop rotation is used mainly to:"
    options:
      - id: "a"
        text: "Confuse the market"
      - id: "b"
        text: "Break pest/disease cycles and balance soil nutrients"
      - id: "c"
        text: "Avoid paying labour"
      - id: "d"
        text: "Stop rainfall"
    correct_answer: "b"
    hint: "Pests follow the crop."
    explanation: "Changing families of crops reduces host-specific pests."
    xp_reward: 50
  - id: "agriculture-husbandry-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Too much nitrogen fertiliser often:"
    options:
      - id: "a"
        text: "Always increases profit"
      - id: "b"
        text: "Burns plants and can pollute water"
      - id: "c"
        text: "Replaces weeding forever"
      - id: "d"
        text: "Raises pH to 14 safely"
    correct_answer: "b"
    hint: "More is not always better."
    explanation: "Use recommended rates. Split applications as taught."
    xp_reward: 50
  - id: "agriculture-husbandry-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Seed rate on a packet exists to:"
    options:
      - id: "a"
        text: "Decorate"
      - id: "b"
        text: "Set population for yield and disease control"
      - id: "c"
        text: "Confuse TVET"
      - id: "d"
        text: "Replace soil tests"
    correct_answer: "b"
    hint: "Spacing."
    explanation: "Too dense: disease. Too thin: weeds and low yield."
    xp_reward: 50
  - id: "agriculture-husbandry-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Irrigating only the soil surface on a hot day can still fail because:"
    options:
      - id: "a"
        text: "Roots need water at depth"
      - id: "b"
        text: "Leaves drink first always"
      - id: "c"
        text: "Mulch is illegal"
      - id: "d"
        text: "pH becomes rainfall"
    correct_answer: "a"
    hint: "Root zone."
    explanation: "Check moisture where roots are, not just the crust."
    xp_reward: 50
  - id: "agriculture-husbandry-fb1"
    type: "FILL_BLANK"
    prompt: "Soil acidity or alkalinity is measured as ___."
    correct_answer: "pH"
    hint: "A scale around 7 is neutral."
    explanation: "pH affects nutrient availability. Test before dumping lime or acidifying fertiliser."
    xp_reward: 50
  - id: "agriculture-husbandry-scenario"
    type: "SCENARIO"
    prompt: "Maize leaves yellow in a waterlogged corner. Trainee wants more CAN. You:"
    options:
      - id: "a"
        text: "Broadcast extra nitrogen on the mud"
      - id: "b"
        text: "Improve drainage/oxygen first; fertiliser on waterlogged roots is wasted"
      - id: "c"
        text: "Plant tomatoes in the same hole this week"
      - id: "d"
        text: "Spray herbicide on the yellow as fertiliser"
    correct_answer: "b"
    hint: "Waterlogging."
    explanation: "Yellow can be nitrogen, but drowning roots cannot take it up. Diagnose the site."
    xp_reward: 60
