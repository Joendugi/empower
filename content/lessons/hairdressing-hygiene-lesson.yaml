id: "hairdressing-hygiene-lesson"
course_id: "hairdressing"
title: "Hygiene, consultation, and professional conduct"
title_sw: "Usafi, ushauri, na maadili"
briefing: "Salon work is a health trade. Wash hands, sanitise or sterilise tools to the salon SOP, and change towels. Blood on a blade goes in a sharps container, not the general bin. Do not work with open wounds on your hands without covering as policy says.\n\nConsultation is assessment: scalp, history of relaxer/colour, allergies, and what the client actually wants. Photographs help. If the scalp is broken, you do not apply relaxer “gently”. Refuse, explain, reschedule or refer.\n\nRecords protect the client and the college: products, batch if required, and patch-test outcome. Gossip about a scalp condition is unprofessional.\n\nGowning and posture prevent product on clothes and injury to you during long cutting sessions."
briefing_sw: "Osha mikono na taka vyombo. Consultation: kichwa, historia, mzio. Kama kichwa kimejeruhiwa, usitumie relaxer. Weka kumbukumbu. Usisemeaze hali ya mteja."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/HBT/CR/01/5"
exam_domain: "Salon hygiene"
exercises:
  - id: "hairdressing-hygiene-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Combs and scissors between clients should be:"
    options:
      - id: "a"
        text: "Wiped on your uniform only"
      - id: "b"
        text: "Cleaned and disinfected to salon standard"
      - id: "c"
        text: "Shared wet with the next queue"
      - id: "d"
        text: "Stored in the till"
    correct_answer: "b"
    hint: "Infection control."
    explanation: "Even “just a trim” has infection risk."
    xp_reward: 50
  - id: "hairdressing-hygiene-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A client with open scalp sores wants a relaxer today. You:"
    options:
      - id: "a"
        text: "Apply stronger product to burn infection"
      - id: "b"
        text: "Refuse the chemical service, explain risk, refer or reschedule after healing"
      - id: "c"
        text: "Cover sores with concealer and proceed"
      - id: "d"
        text: "Use kitchen lye"
    correct_answer: "b"
    hint: "Broken skin."
    explanation: "Ethics: do not put sodium/calcium hydroxide on open skin."
    xp_reward: 50
  - id: "hairdressing-hygiene-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Used blades belong in:"
    options:
      - id: "a"
        text: "The towel skip"
      - id: "b"
        text: "A sharps container"
      - id: "c"
        text: "The client’s bag"
      - id: "d"
        text: "The sink"
    correct_answer: "b"
    hint: "Sharps."
    explanation: "Needlestick and blade injuries are salon incidents too."
    xp_reward: 50
  - id: "hairdressing-hygiene-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Consultation notes are kept because:"
    options:
      - id: "a"
        text: "They fill a file"
      - id: "b"
        text: "They record consent, products, and patch tests for safety and complaints"
      - id: "c"
        text: "NITA bans talking"
      - id: "d"
        text: "They replace hygiene"
    correct_answer: "b"
    hint: "Evidence."
    explanation: "If something goes wrong, the card matters."
    xp_reward: 50
  - id: "hairdressing-hygiene-fb1"
    type: "FILL_BLANK"
    prompt: "Checking a small area of skin before a full colour is a ___ test."
    correct_answer: "patch"
    hint: "Allergy check."
    explanation: "Patch tests prevent some severe reactions."
    xp_reward: 50
  - id: "hairdressing-hygiene-scenario"
    type: "SCENARIO"
    prompt: "A client demands you skip the patch test because they are late for a matatu. You:"
    options:
      - id: "a"
        text: "Skip it to keep the tip"
      - id: "b"
        text: "Hold the policy: no required test, no chemical service"
      - id: "c"
        text: "Do a patch test on yourself instead"
      - id: "d"
        text: "Use extra peroxide to save time"
    correct_answer: "b"
    hint: "Policy over speed."
    explanation: "Anaphylaxis is not worth a fare."
    xp_reward: 60
