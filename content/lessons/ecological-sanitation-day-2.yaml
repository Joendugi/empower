- id: ecos-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'Urine collected from a healthy household with no UTI cases should be stored for a minimum of
    how long before direct application to food crops?

    '
  xp_reward: 50
  options:
  - id: a
    text: It can be applied immediately — urine is sterile
  - id: b
    text: 6 months — the same as for faecal humus
  - id: c
    text: 1 month, then dilute 1:5 with water before applying
  - id: d
    text: 2 years — urine is too dangerous without long storage
  explanation: 'WHO guidelines recommend at least 1 month storage (during which pH rises to 8-9, inactivating
    most pathogens) and dilution 1:5 before applying to edible crops as an additional safety margin.


    Why the other options are wrong: While urine from healthy individuals is nearly sterile, WHO still
    recommends 1 month storage before crop application to ensure pathogen inactivation and as a precautionary
    principle. 6 months is required only when diarrhoeal or UTI cases are present in the household. For
    a healthy household, 1 month is sufficient. 2 years is not required. At 1 month, pH-driven inactivation
    makes urine safe for most crops.'
  correct_answer: c
- id: ecos-d2-q5
  type: FILL_BLANK
  prompt: 'A family of 6 produces approximately ___ litres of urine per year. If maize requires 120 kg
    N/ha and urine contains 6 g N/L, this family''s annual urine fertilises approximately ___ hectares
    of maize.

    '
  xp_reward: 50
  correct_answer:
  - 3285 litres
  - 0.16 hectares
  explanation: 'Urine volume = 6 x 1.5 L x 365 = 3,285 L per year. N available = 3,285 L x 6 g/L = 19,710
    g = 19.7 kg N. Area fertilised = 19.7 kg / 120 kg/ha = 0.164 ha, approximately 0.16 ha.

    '
