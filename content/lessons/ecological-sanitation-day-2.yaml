briefing: 'The urine-diversion dry toilet (UDDT) is the most resource-efficient sanitation technology
  for water-scarce off-grid communities. By separating urine from faeces at source, it eliminates odour,
  desiccates pathogens, and produces two safe agricultural inputs — liquid fertiliser and dry humus —
  without any water for flushing.

  '
outline: 'Why separation matters (pathogen matrix and nutrient value); UDDT vault geometry and desiccation
  chamber sizing; cover material selection (ash, sawdust, dry soil); urine collection and storage — pH
  kill curve for pathogens; emptying protocols and safe use of dry humus; construction sequence — block
  or brick vault with fibreglass divider pedestal.

  '
content_md: "## Why Separate Urine from Faeces?\n\nHuman faeces and urine have very different properties:\n\
  \n| Property | Urine | Faeces |\n|---|---|---|\n| Volume share | 95% of toilet waste by volume | 5%\
  \ |\n| Pathogen load | Very low (sterile if not UTI) | Very high |\n| Nitrogen content | 80% of excreted\
  \ N (as urea) | 20% |\n| Phosphorus content | 50% of excreted P | 50% |\n| Potassium | 60% of excreted\
  \ K | 40% |\n| Odour cause | Hydrolysis of urea to ammonia if mixed with faeces | Anaerobic decomposition\
  \ |\n\nWhen kept **separate and dry**, faeces desiccate within 6 months into odourless,\npathogen-safe\
  \ humus. When mixed with water or urine, pathogens persist for years.\n\n## UDDT Vault Design\n\nA standard\
  \ two-vault UDDT alternates use between two desiccation chambers:\n\n- **Vault dimensions**: 0.8 m x\
  \ 0.8 m x 1.0 m deep (640 L) per vault\n- **Capacity**: one vault serves a 5-person family for 6 months\n\
  - **Cover**: sealed slab with pedestal (fibreglass or ceramic) — urine enters\n  front bowl, faeces\
  \ fall into rear chamber\n- **Ventilation**: 110 mm PVC vent pipe painted black, 300 mm above roof —\n\
  \  creates upward thermal draft, carries odour up and out\n\n### Cover Material Addition (after each\
  \ use)\n\nAdd one scoop (approximately 200 mL) of dry cover material after each\nfaecal deposit:\n\n\
  | Material | Effectiveness | Notes |\n|---|---|---|\n| Wood ash | Excellent — raises pH > 9, kills pathogens\
  \ | Best available; free where biomass is burned |\n| Dry soil | Good — absorbs moisture | Must be completely\
  \ dry |\n| Sawdust | Good — absorbs moisture | Avoid treated wood |\n| Dried leaves | Moderate | Should\
  \ be ground/shredded |\n\n**Ash is preferred** because the high pH (> 9) creates a hostile environment\n\
  for Ascaris eggs, the most resistant faecal pathogen (requires pH > 9 for\nkill, or 6+ months desiccation).\n\
  \n## Urine Storage and Pathogen Inactivation\n\nCollected urine should be stored in sealed 20 L jerry\
  \ cans or a lidded tank.\n\n**pH rise**: Urea hydrolyses to ammonium (NH4+) and bicarbonate within 24\
  \ h,\nraising pH from ~6 to 8–9. At pH 9 most bacterial pathogens are inactivated\nwithin 24 h.\n\n\
  **Recommended storage time before agricultural use:**\n\n| Risk level | Storage time |\n|---|---|\n\
  | Healthy population, no diarrhoeal outbreak | 1 month minimum |\n| Known diarrhoeal or UTI cases in\
  \ household | 6 months |\n| WHO lowest-risk category | 1 month + dilute 1:5 with water before application\
  \ |\n\n### Urine Application Rate\n\nFresh urine contains approximately 6 g nitrogen per litre.\n\n\
  For a maize crop requiring 120 kg N/ha:\n- Urine needed = 120,000 g N / 6 g N/L = **20,000 L/ha**\n\
  - A family of 5 produces 5 x 1.5 L/day x 365 days = **2,737 L/year**\n- One family's annual urine fertilises\
  \ approximately 0.14 ha of maize\n\n## Vault Emptying Protocol\n\nAfter 6 months of filling and 6 months\
  \ of desiccation:\n\n1. Don gloves and dust mask.\n2. Open the emptying hatch at the side or rear of\
  \ the vault.\n3. The contents should be dry, dark brown, crumbly, and odourless.\n4. Test with paper\
  \ pH strip — if pH < 8, return to vault for another month.\n5. Apply directly as soil amendment, or\
  \ co-compost with plant waste for 1 month.\n6. Record emptying date in household hygiene register.\n\
  \n## Construction Sequence\n\n1. **Excavate** two 0.8 x 0.8 x 1.0 m pits, 0.5 m apart.\n2. **Line pits**\
  \ with concrete block or burnt brick (no mortar in base — allow\n   moisture to drain to subsoil; or\
  \ use concrete base if water table is close).\n3. **Cast slab** — 75 mm reinforced concrete slab with\
  \ two access holes and\n   offset urine channel moulded in.\n4. **Set pedestal** — fibreglass dividing\
  \ pedestal bonded to slab with PU sealant.\n5. **Build superstructure** — timber frame or block walls,\
  \ corrugated iron or\n   thatch roof.\n6. **Install vent pipe** — black PVC pipe from rear of vault\
  \ chamber to\n   300 mm above roof ridge.\n7. **Fit fly screen** to top of vent pipe (1 mm mesh).\n"
exercises:
- id: ecos-d2-q1
  type: MULTIPLE_CHOICE
  prompt: 'A family uses a UDDT and adds dry wood ash after every faecal deposit. What is the primary
    mechanism by which ash prevents pathogen survival?

    '
  xp_reward: 50
  options:
  - id: a
    text: Ash raises the pH above 9, creating conditions lethal to most faecal pathogens including Ascaris
      eggs
  - id: b
    text: Ash absorbs all moisture, causing rapid physical dessication
  - id: c
    text: Ash releases chlorine gas which disinfects the chamber
  - id: d
    text: Ash is a nutrient that feeds beneficial bacteria which outcompete pathogens
  explanation: 'Wood ash pH is typically 10-12. A layer of ash around faecal matter raises local pH above
    9, which is lethal to bacterial pathogens within hours and inactivates the most resistant helminth
    eggs within weeks.


    Why the other options are wrong: Ash does absorb some moisture but its primary mechanism is alkalinity,
    not desiccation. Dry soil or sawdust are better pure-desiccant materials. Ash does not release chlorine.
    It works through alkalinity (high pH). Ash is not a nutrient for beneficial competitive bacteria.
    Its action is chemical — high pH.'
  correct_answer: a
- id: ecos-d2-q2
  type: FILL_BLANK
  prompt: 'A standard UDDT vault measures 0.8 m x 0.8 m x 1.0 m, giving a volume of ___ litres. One vault
    serves a 5-person family for approximately ___ months of filling before switching to the second vault.

    '
  xp_reward: 50
  correct_answer:
  - 640 litres
  - 6 months
  explanation: 'Volume = 0.8 x 0.8 x 1.0 = 0.64 m3 = 640 L. At a generation rate of about 1 L/person/day
    of faeces + cover material, a 5-person family fills the vault in roughly 6 months, after which the
    second vault is used while the first desiccates for 6 more months.

    '
