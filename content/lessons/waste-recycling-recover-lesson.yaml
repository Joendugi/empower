id: "waste-recycling-recover-lesson"
course_id: "waste-recycling"
title: "Week 2 — Compost, material recovery, and circular enterprise"
title_sw: "Wiki 2 — Compost, recovery, na biashara"
briefing: "Compost needs carbon-rich browns, nitrogen-rich greens, moisture like a wrung sponge, oxygen, and time. Exclude batteries, glass, plastics, treated timber, meat where the system cannot manage it, and human waste unless a specialised process exists. Turn or aerate; record temperature where pathogen control is claimed.\n\nMaterial recovery: sort by buyer specification, remove contamination, bale or bundle safely, and store dry. Glass by colour where demanded; metals separated; e-waste sent to licensed handlers. Never heat wires to burn off insulation—the fumes poison workers and neighbours.\n\nBusiness records include input weight, recovery rate, labour, transport, buyer price, rejects, and PPE costs. Community benefit is real only if the enterprise is safe, lawful, and solvent."
briefing_sw: "Wiki 2 — Compost, recovery, na biashara: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "waste-recycling-recover-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for material recovery?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "waste-recycling-recover-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that material recovery was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "waste-recycling-recover-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "waste-recycling-recover-scenario"
    type: "SCENARIO"
    prompt: "A buyer offers more money if workers burn cable insulation to recover copper quickly. What should the supervisor do?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
