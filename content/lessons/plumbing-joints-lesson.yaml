id: "plumbing-joints-lesson"
course_id: "plumbing"
title: "Pipe materials and making joints"
title_sw: "Aina za mabomba na viungo"
briefing: "PVC solvent weld needs a square cut, even chamfer, clean dry surfaces, the right cement for the pipe, and the full insertion with a twist. Hold until it grabs. Purple primer where specified is not graffiti — it is preparation. Too little cement leaks; too much puddles and weakens.\n\nCompression joints: pipe square, olive the right way, do not overtighten brass to the point of crushing. PTFE on threads: in the direction of the thread, not as a random bandage, and not on compression olives.\n\nPPR fusion: temperature and time from the manufacturer. Burnt sockets fail later inside the wall. Support pipes so joints are not in bending.\n\nPressure-test joints before you close the chase. A leak behind tiles is your name on a complaint."
briefing_sw: "PVC: kata sawa, safisha, cement sahihi. Compression: usikaze kupita kiasi. PTFE kwenye thread, si olive. PPR: fuata joto na muda. Jaribu shinikizo kabla ya kufunga ukuta."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/02/5"
exam_domain: "Jointing"
exercises:
  - id: "plumbing-joints-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Solvent-weld PVC fails most often because:"
    options:
      - id: "a"
        text: "The moon is full"
      - id: "b"
        text: "Dirty, oval, unchamfered, or dry-fit joints without cement"
      - id: "c"
        text: "Too many pipe clips"
      - id: "d"
        text: "White pipes"
    correct_answer: "b"
    hint: "Prep."
    explanation: "Cement cannot stick to mud or a pipe sitting on 3 mm of the socket."
    xp_reward: 50
  - id: "plumbing-joints-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "PTFE tape belongs on:"
    options:
      - id: "a"
        text: "Compression olives"
      - id: "b"
        text: "Tapered threads as taught, wound with the thread"
      - id: "c"
        text: "The tap aerator as flavour"
      - id: "d"
        text: "Solvent-weld sockets"
    correct_answer: "b"
    hint: "Threads, not olives."
    explanation: "Tape on an olive prevents the olive from sealing."
    xp_reward: 50
  - id: "plumbing-joints-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "You should pressure-test:"
    options:
      - id: "a"
        text: "After the tiler has finished"
      - id: "b"
        text: "Before concealing joints"
      - id: "c"
        text: "Never, if you are confident"
      - id: "d"
        text: "With sewage"
    correct_answer: "b"
    hint: "Access."
    explanation: "Test while you can still see the joint."
    xp_reward: 50
  - id: "plumbing-joints-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A PPR socket that was overheated typically:"
    options:
      - id: "a"
        text: "Gets stronger"
      - id: "b"
        text: "Can restrict internally or fail later"
      - id: "c"
        text: "Becomes copper"
      - id: "d"
        text: "Needs no cooling time"
    correct_answer: "b"
    hint: "Melted plastic."
    explanation: "Follow time-and-temp charts. Inspect the bore."
    xp_reward: 50
  - id: "plumbing-joints-fb1"
    type: "FILL_BLANK"
    prompt: "The small brass or copper ring in a compression fitting is the ___."
    correct_answer: "olive"
    hint: "It crushes to seal."
    explanation: "Olives are single-use in many repairs — replace them."
    xp_reward: 50
  - id: "plumbing-joints-scenario"
    type: "SCENARIO"
    prompt: "A new solvent-weld waste drips at the socket after 20 minutes. Trainee adds more cement on the outside. You should:"
    options:
      - id: "a"
        text: "Approve the smear"
      - id: "b"
        text: "Cut out and remake the joint correctly; exterior cement is not a repair"
      - id: "c"
        text: "Paint the drip"
      - id: "d"
        text: "Tighten with a hammer"
    correct_answer: "b"
    hint: "Solvent weld is not filler on the outside."
    explanation: "Remake. Cosmetics over a gap will leak again."
    xp_reward: 60
