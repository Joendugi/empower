id: rebuild-000-4-4
course_id: the-rebuild-protocol
title: Your First Mission Briefing
title_sw: Muongozo Wako wa Misheni ya Kwanza
briefing: 'MISSION BRIEFING: Recruit, you have completed the foundational theory. The four sectors of the Civilization Map now await your deployment.


  Upon passing the Initiate Assessment, you will select your primary specialization track:


  Track 1 — TVET ICT Technician: Aligned with Kenya CDACC Level 5 curriculum. Master electrical workshop safety, computer hardware diagnostics, operating systems administration, local area networking, and database systems. You restore the physical and operational hardware of our cities.


  Track 2 — Cybersecurity Practitioner: Aligned with CompTIA Security+ SY0-701 and LPIC-1. Master Linux system commands, threat mitigation, security architecture, network perimeter defense, and digital forensics. You defend our institutions against adversaries.


  Track 3 — Renewable Energy & Hardware Trades: Solar installation, electrical wiring, off-grid telemetry, and electronics repair. You ensure the power grid never fails again.


  Review your notes. Ensure you understand the five infrastructure layers, attack phases, password hygiene, phishing indicators, 2FA, and the 3-2-1 backup rule. The Initiate Assessment is the final gate.'
briefing_sw: 'MISSION BRIEFING: Umemaliza mafunzo ya msingi. Baada ya tathmini hii, utachagua mkondo wako wa utaalamu:

  1. Fundi wa ICT wa TVET (CDACC Level 5),

  2. Mtaalamu wa Usalama wa Mtandao (Security+ SY0-701),

  3. Nishati Jadidifu na Vifaa vya Umeme.


  Jitayarishe kwa Tathmini ya Mwanajeshi Mpya.'
estimated_minutes: 6
license: CC-BY-SA-4.0
exam_domain: Digital Citizenship
xp_total: 210
exercises:
- id: r000-44-q1
  type: MULTIPLE_CHOICE
  prompt: Which track should you select if your primary goal is passing the CompTIA Security+ SY0-701 certification and learning ethical cyber defense?
  options:
  - id: a
    text: Carpentry & Joinery
  - id: b
    text: Cybersecurity Practitioner
  - id: c
    text: Plumbing Technology
  - id: d
    text: Office Secretarial Studies
  correct_answer: b
  hint: Select the specialized security track.
  explanation: The Cybersecurity Practitioner track aligns with all five CompTIA Security+ SY0-701 domains, LPIC-1 Linux fundamentals, and Kenya cyber law.
  xp_reward: 50
- id: r000-44-match
  type: MATCH_PAIRS
  prompt: Match each specialization track to its primary certification focus.
  pairs:
  - left:
      id: tvet
      text: TVET ICT Technician
    right:
      id: cert-cdacc
      text: CDACC ICT Technician Level 5 (CR/1–6/5)
  - left:
      id: cyber
      text: Cybersecurity Practitioner
    right:
      id: cert-secplus
      text: CompTIA Security+ SY0-701 & LPIC-1
  - left:
      id: energy
      text: Renewable Energy & Solar
    right:
      id: cert-epra
      text: EPRA Solar Technician Certification
  correct_answer:
  - tvet=cert-cdacc
  - cyber=cert-secplus
  - energy=cert-epra
  hint: Match the study pathway to its accredited industry certification.
  explanation: Every CyberLearn path leads directly to accredited vocational or industry certifications recognized by employers.
  xp_reward: 50
- id: r000-44-q3
  type: FILL_BLANK
  prompt: When you pass the Capstone Initiate Assessment with a score of 70% or higher, you earn the "Rebuilder Initiate" portable digital badge compatible with the OpenBadges ___ standard.
  correct_answer: v3
  hint: The current version of the W3C / 1EdTech Open Badges standard.
  explanation: OpenBadges v3 credentials are cryptographically verifiable records that you can display on LinkedIn, digital portfolios, or CVs.
  xp_reward: 50
- id: r000-44-q4
  type: SCENARIO
  prompt: You are about to begin the Initiate Assessment. It contains 15 questions covering all four units and requires 70% to pass. What happens if you score 60% on your first attempt?
  options:
  - id: a
    text: Your account is permanently locked
  - id: b
    text: You receive a targeted feedback report identifying which units to review, and you can retake the assessment without penalty
  - id: c
    text: You must pay a monetary fine in M-Pesa to unlock it
  - id: d
    text: You are disqualified from taking any other course
  correct_answer: b
  hint: CyberLearn uses formative, supportive assessment.
  explanation: Assessment in the Rebuilder Corps is diagnostic and supportive. You are given clear feedback on your weak domains and can revisit the material to re-attempt until you achieve mastery.
  xp_reward: 60
