id: "sewing-garment-grading-lesson"
course_id: "sewing-garment"
title: "Week 7 — Pattern grading and size sets"
title_sw: "Wiki 7 — Grading ya pattern na saizi"
briefing: "Construction of a master pattern (size 12 or the college block) is not the end. Grading produces the size set (e.g. 8–16) using grade rules: how much the bust, waist, hip, and length change per size. You do not photocopy at 110% — that enlarges buttons, seam allowances, and dart intake wrongly. Shift cardinal points: bust point, waist, hip, shoulder, scye, hem.\n\nManual grading uses a grade table and tracks (move X and Y). Computer grading does the same with CAD. Nested patterns should look like a family: even gaps at side seams, not a fan that explodes at the hem only. Check that dart tips still aim at the bust point after grade.\n\nKenyan school uniforms often have a size chart in centimetres. Measure a sample of learners; do not import a European chart blindly. Ease must remain after grading — a size 16 that lost wearing ease is unwearable.\n\nThis week: grade a skirt block one size up and one down, nest them, and measure hip circumference against the chart. That is the CDACC grading outcome."
briefing_sw: "Grading si photocopy 110%. Tumia grade rules: bust, waist, hip, urefu. Cardinal points. Nested patterns ziwe familia. Ease ibaki. Pima chati ya Kenya, si ya Ulaya tu."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/07/5"
exam_domain: "Pattern grading"
exercises:
  - id: "sewing-garment-grading-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Photocopying a pattern at 115% is a poor grade because it:"
    options:
      - id: "a"
        text: "Is always perfect"
      - id: "b"
        text: "Also scales seam allowances, buttonholes, and dart logic incorrectly"
      - id: "c"
        text: "Is required by CDACC"
      - id: "d"
        text: "Only affects colour"
    correct_answer: "b"
    hint: "Not a photo enlarge."
    explanation: "Grade rules move body measurements; SA often stays 1.5 cm."
    xp_reward: 50
  - id: "sewing-garment-grading-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A nested set that fans wildly only at the hem usually means:"
    options:
      - id: "a"
        text: "Perfect hip grade"
      - id: "b"
        text: "Uneven or incorrect length/hip rules"
      - id: "c"
        text: "Good CAD"
      - id: "d"
        text: "Selvage error only"
    correct_answer: "b"
    hint: "Even nest."
    explanation: "Inspect the nest before you cut a size run."
    xp_reward: 50
  - id: "sewing-garment-grading-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Wearing ease after grading should:"
    options:
      - id: "a"
        text: "Disappear on larger sizes to save cloth"
      - id: "b"
        text: "Remain as specified so the garment can be worn"
      - id: "c"
        text: "Become negative"
      - id: "d"
        text: "Equal the seam allowance"
    correct_answer: "b"
    hint: "Still a garment."
    explanation: "Size 16 is not size 12 with no ease and longer hem only."
    xp_reward: 50
  - id: "sewing-garment-grading-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Cardinal points in grading include:"
    options:
      - id: "a"
        text: "The iron temperature"
      - id: "b"
        text: "Bust, waist, hip, shoulder, armhole, hem"
      - id: "c"
        text: "Only the brand logo"
      - id: "d"
        text: "The bobbin colour"
    correct_answer: "b"
    hint: "Body landmarks."
    explanation: "Those points get X/Y moves from the grade table."
    xp_reward: 50
  - id: "sewing-garment-grading-fb1"
    type: "FILL_BLANK"
    prompt: "The table of millimetre moves per size for each landmark is a ___ rule table."
    correct_answer: "grade"
    hint: "Grade rules."
    explanation: "Without a table you are guessing, not grading."
    xp_reward: 50
  - id: "sewing-garment-grading-scenario"
    type: "SCENARIO"
    prompt: "Size 10 blouse fits. Size 16 made by scaling the whole block including 1.5 cm SA to 2.2 cm and huge darts. Fix?"
    options:
      - id: "a"
        text: "Ship it"
      - id: "b"
        text: "Re-grade with constant SA and proper bust/waist/hip rules; true the darts"
      - id: "c"
        text: "Only lengthen the hem by 40 cm"
      - id: "d"
        text: "Change fibre to polyester"
    correct_answer: "b"
    hint: "Rules, not scale."
    explanation: "That is the difference between grading and enlarging a drawing."
    xp_reward: 60
