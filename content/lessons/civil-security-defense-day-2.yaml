- id: sec-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'What simple mechanical measure prevents intruders from using a timber pole to lever a heavy
    steel perimeter gate completely off its pintle hinges?

    '
  xp_reward: 50
  options:
  - id: a
    text: Painting the hinges red to indicate they are hardened steel
  - id: b
    text: Inverting one of the hinge pins (e.g., top pin pointing downward and bottom pin pointing upward)
      or welding steel retention collars above the pins
  - id: c
    text: Greasing the hinges with lithium grease every morning
  - id: d
    text: Mounting the gate on wooden pegs instead of steel
  explanation: 'If both pins point upward, a crowbar under the gate lifts it off in seconds. Inverting
    one pin locks the gate on its vertical axis so it can rotate freely but cannot be lifted off without
    unbolting or torch cutting.


    Why the other options are wrong: Paint provides zero physical mechanical resistance. Grease smooths
    rotation, but makes it even easier to lift off. Wooden pegs are weak and easily sheared.'
  correct_answer: b
