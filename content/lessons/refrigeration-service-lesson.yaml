id: "refrigeration-service-lesson"
course_id: "refrigeration"
title: "Leak, charge, and performance checks"
title_sw: "Uvujaji, charge, na utendaji"
briefing: "Charge is a measured quantity, often by mass (weigh-in) on a capillary system, or by superheat/subcooling on TXV systems as you are taught. “Until the pipe ices” is not a method. Find and repair leaks, replace driers when the system has been open, evacuate, then charge.\n\nAirflow is half of refrigeration. A blocked condenser (dust, cow hair, butcher-shop grease) raises head pressure and trips overloads. A blocked evaporator ices. Clean, straighten fins, check fans, then talk about gas.\n\nAfter service: cabinet temperature vs spec, no abnormal noise, no ice where it should not be, electrical covers back, and a record of refrigerant type and mass. That record is professional, and it protects the next person."
briefing_sw: "Charge ni uzito au superheat/subcooling, si “hadi barafu”. Rekodi uvujaji. Safisha condenser na evaporator. Weka kumbukumbu ya aina na kiasi cha gesi."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/RAC/CR/03/5"
exam_domain: "Service diagnosis"
exercises:
  - id: "refrigeration-service-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "The professional way to charge many capillary domestic systems is:"
    options:
      - id: "a"
        text: "Guess from hissing"
      - id: "b"
        text: "Weigh in the specified mass after vacuum"
      - id: "c"
        text: "Fill until the compressor is silent"
      - id: "d"
        text: "Use oxygen to push liquid"
    correct_answer: "b"
    hint: "The nameplate has grams."
    explanation: "Overcharge is as bad as undercharge."
    xp_reward: 50
  - id: "refrigeration-service-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A filthy condenser typically causes:"
    options:
      - id: "a"
        text: "Lower energy use"
      - id: "b"
        text: "High head pressure and poor cooling / trips"
      - id: "c"
        text: "Freezing of the compressor oil into ice cubes"
      - id: "d"
        text: "Automatic leak repair"
    correct_answer: "b"
    hint: "Heat must leave the cycle."
    explanation: "Clean heat exchangers before you condemn compressors."
    xp_reward: 50
  - id: "refrigeration-service-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "After opening a system you often replace the:"
    options:
      - id: "a"
        text: "Door colour"
      - id: "b"
        text: "Filter-drier"
      - id: "c"
        text: "Serial plate"
      - id: "d"
        text: "Owner’s manual only"
    correct_answer: "b"
    hint: "Moisture protection."
    explanation: "Driers are cheap compared with acid and burnout."
    xp_reward: 50
  - id: "refrigeration-service-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Service records should include:"
    options:
      - id: "a"
        text: "Only the trainee’s nickname"
      - id: "b"
        text: "Refrigerant type, quantity, and work done"
      - id: "c"
        text: "The customer’s M-Pesa PIN"
      - id: "d"
        text: "Nothing, to stay fast"
    correct_answer: "b"
    hint: "Traceability."
    explanation: "The next technician and the law both like records."
    xp_reward: 50
  - id: "refrigeration-service-fb1"
    type: "FILL_BLANK"
    prompt: "Charging by reading a scale under the cylinder is called a ___-in charge."
    correct_answer: "weigh"
    hint: "Mass, not vibes."
    explanation: "Weigh-in is standard on many factory-charged capillary units."
    xp_reward: 50
  - id: "refrigeration-service-scenario"
    type: "SCENARIO"
    prompt: "Split AC cools one room weakly. Outdoor unit is packed with lint. Trainee wants to add 2 kg of mixed leftover gas. What do you do?"
    options:
      - id: "a"
        text: "Add the mix"
      - id: "b"
        text: "Clean airflow path, confirm type, leak-check, then charge only the specified refrigerant to spec"
      - id: "c"
        text: "Swap indoor and outdoor pipes randomly"
      - id: "d"
        text: "Bypass the high-pressure switch permanently"
    correct_answer: "b"
    hint: "Airflow then refrigerant identity."
    explanation: "Mixed leftovers are not a refrigerant. Dirty condensers fake a “low gas” story."
    xp_reward: 60
