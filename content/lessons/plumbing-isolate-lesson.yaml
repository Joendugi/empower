id: "plumbing-isolate-lesson"
course_id: "plumbing"
title: "Water systems, isolation, and hygiene"
title_sw: "Mifumo ya maji, isolation, na usafi"
briefing: "Plumbing keeps potable water in and sewage out. Know the incoming stopcock, tank valves, and fixture isolators before you cut. Drain the section; opening a live PPR or copper line is a flood, not a shortcut.\n\nNever connect waste to drinking water. Backflow risk is why we use air gaps and approved valves. Do not use the same wrench-dirty rag on a kitchen tap that just sat in a gully.\n\nHot water: unvented cylinders and solar thermosiphon systems have extra hazards (pressure, scalds). If it is outside your unit, stop and call the person who is allowed to open it.\n\nMark isolated valves so the next person does not open them on your open joint."
briefing_sw: "Funga stopcock na drain kabla ya kukata. Usichanganye taka na maji ya kunywa. Weka alama kwenye valve. Mifumo ya pressure ya hot water ina hatari za ziada."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/01/5"
exam_domain: "Cold & hot water"
exercises:
  - id: "plumbing-isolate-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Before cutting a live water pipe you should:"
    options:
      - id: "a"
        text: "Increase boiler temperature"
      - id: "b"
        text: "Close the isolating valve / stopcock and drain the section"
      - id: "c"
        text: "Open every tap as a substitute for isolation"
      - id: "d"
        text: "Hit the pipe to relieve pressure"
    correct_answer: "b"
    hint: "No water, no flood."
    explanation: "Isolate and drain. Know which valve actually holds."
    xp_reward: 50
  - id: "plumbing-isolate-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Connecting a waste pipe into a drinking-water line is forbidden because of:"
    options:
      - id: "a"
        text: "Extra fittings cost"
      - id: "b"
        text: "Contamination / backflow of sewage into potable water"
      - id: "c"
        text: "It reduces pressure nicely"
      - id: "d"
        text: "PVC colour rules"
    correct_answer: "b"
    hint: "Health."
    explanation: "Cross-connections cause disease. There is no “temporary” version."
    xp_reward: 50
  - id: "plumbing-isolate-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "After isolating a valve for work you should:"
    options:
      - id: "a"
        text: "Hide it"
      - id: "b"
        text: "Tag/control it so nobody opens it on your open joint"
      - id: "c"
        text: "Remove the handle and throw it"
      - id: "d"
        text: "Paint it gold"
    correct_answer: "b"
    hint: "Same idea as electrical lock-out."
    explanation: "Unexpected repressurising injures and floods."
    xp_reward: 50
  - id: "plumbing-isolate-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A kitchen tap should be installed with hygiene in mind because:"
    options:
      - id: "a"
        text: "Assessors like shine only"
      - id: "b"
        text: "It delivers water people drink and cook with"
      - id: "c"
        text: "It is plastic"
      - id: "d"
        text: "Gullies are potable"
    correct_answer: "b"
    hint: "Potable."
    explanation: "Dirty tools on drinking outlets are a professional fail."
    xp_reward: 50
  - id: "plumbing-isolate-fb1"
    type: "FILL_BLANK"
    prompt: "The valve that stops the incoming mains water to a house is often called the ___."
    correct_answer: "stopcock"
    hint: "Also stop tap / isolation valve at the origin."
    explanation: "Find it before you cut."
    xp_reward: 50
  - id: "plumbing-isolate-scenario"
    type: "SCENARIO"
    prompt: "You open a PPR joint and water keeps coming. The gate valve handle turns but does not stop flow. Next step?"
    options:
      - id: "a"
        text: "Keep turning until it snaps"
      - id: "b"
        text: "Go to an upstream isolation, drain, and treat the valve as failed"
      - id: "c"
        text: "Block with your thumb and solvent-weld"
      - id: "d"
        text: "Call it a feature"
    correct_answer: "b"
    hint: "Failed isolator."
    explanation: "A spinning handle is not isolation. Move upstream."
    xp_reward: 60
