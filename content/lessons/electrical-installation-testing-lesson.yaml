id: "electrical-installation-testing-lesson"
course_id: "electrical-installation"
title: "Inspection and testing basics"
title_sw: "Ukaguzi na majaribio"
briefing: "Dead tests before live tests. Continuity of protective conductors (including bonding), insulation resistance (typically 500 V IR tester on many LV circuits — follow the instrument and standard you were taught), and polarity: live to the switch, not the other way round.\n\nA failed IR (low megohms) means moisture, damaged insulation, or connected equipment. Disconnect lamps and sensitive electronics as instructed before IR tests. Do not IR-test a circuit with a surge-protected socket still in, then blame the student meter.\n\nWhen the instructor allows live testing: earth-fault loop and RCD trip times are measured with the correct instrument. Record results on the schedule. A test not written down did not happen for assessment.\n\nNever energise an installation that failed dead tests. Paperwork is part of competence."
briefing_sw: "Majaribio ya dead kwanza: continuity, insulation, polarity. Kisha live tests kwa ruhusa. Andika matokeo. Usitie umeme kama dead tests zimeshindwa."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/EIT/CR/04/5"
exam_domain: "Inspection & testing"
exercises:
  - id: "electrical-installation-testing-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Insulation resistance tests are usually done:"
    options:
      - id: "a"
        text: "After you hand the keys over, never before"
      - id: "b"
        text: "As a dead test before energising"
      - id: "c"
        text: "Only on the kettle"
      - id: "d"
        text: "With a wet finger"
    correct_answer: "b"
    hint: "Dead before live."
    explanation: "IR on a live circuit is wrong practice."
    xp_reward: 50
  - id: "electrical-installation-testing-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Polarity on a lighting circuit means:"
    options:
      - id: "a"
        text: "Earth is optional"
      - id: "b"
        text: "The switch breaks the live conductor, not only the neutral"
      - id: "c"
        text: "The lamp cap is painted"
      - id: "d"
        text: "MCB rating equals wattage"
    correct_answer: "b"
    hint: "Switch in the live."
    explanation: "A switch in the neutral leaves the lampholder live when “off”."
    xp_reward: 50
  - id: "electrical-installation-testing-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Low IR might be caused by:"
    options:
      - id: "a"
        text: "Perfect dry cables"
      - id: "b"
        text: "Damp, damaged insulation, or connected electronic loads"
      - id: "c"
        text: "Correct bonding only"
      - id: "d"
        text: "Too many labels"
    correct_answer: "b"
    hint: "Paths to earth that should not exist."
    explanation: "Investigate; do not just raise the MCB."
    xp_reward: 50
  - id: "electrical-installation-testing-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Test results belong:"
    options:
      - id: "a"
        text: "In your head"
      - id: "b"
        text: "On the installation schedule / certificate as taught"
      - id: "c"
        text: "On WhatsApp status"
      - id: "d"
        text: "Only if they pass"
    correct_answer: "b"
    hint: "Evidence."
    explanation: "Failed results still get recorded, then defects repaired."
    xp_reward: 50
  - id: "electrical-installation-testing-fb1"
    type: "FILL_BLANK"
    prompt: "Confirming that the switch is in the live conductor is a ___ test."
    correct_answer: "polarity"
    hint: "Live vs neutral the right way."
    explanation: "Polarity failures leave fittings live when switched off."
    xp_reward: 50
  - id: "electrical-installation-testing-scenario"
    type: "SCENARIO"
    prompt: "IR reads 0.02 MΩ on a new lighting radial. Trainee wants to connect the supply because the lamps work on a test lead. You should:"
    options:
      - id: "a"
        text: "Energise — lamps working is enough"
      - id: "b"
        text: "Treat as fail: isolate, disconnect loads, find the insulation fault before live"
      - id: "c"
        text: "Fit a larger MCB"
      - id: "d"
        text: "Earth the live to “clear” it"
    correct_answer: "b"
    hint: "Working on a wander lead is not an IR pass."
    explanation: "0.02 MΩ is a serious insulation failure."
    xp_reward: 60
