- id: aqua-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'A freshly constructed RAS biofilter consistently fails to control ammonia even though Kaldnes
    K3 media has been installed at a 55% fill ratio and aeration appears adequate. The system was only
    started 5 days ago. What is the most probable root cause?

    '
  xp_reward: 50
  options:
  - id: a
    text: The K3 media is incorrectly installed; it must be glued to the tank walls
  - id: b
    text: The nitrifying bacteria (Nitrosomonas and Nitrobacter) have not had sufficient time to colonize
      and form a mature biofilm; RAS biofiltration requires 4 to 6 weeks of biological cycling before
      reaching full nitrification capacity
  - id: c
    text: The biofilter needs to be disinfected with chlorine bleach before bacteria can colonize
  - id: d
    text: Ammonia is too low in a new system; nitrifying bacteria only grow at TAN > 10 mg/L
  explanation: 'Nitrifying bacteria are autotrophic specialist chemolithotrophs with doubling times of
    8 to 24 hours — orders of magnitude slower than heterotrophs. A new biofilter needs 4 to 6 weeks of
    gradual, increasing ammonia load exposure to develop a full, stable biofilm capable of handling production-level
    TAN loads.


    Why the other options are wrong: K3 media is designed to float freely in suspension — it must NOT
    be attached. Free movement is essential to biofilm stability. Chlorine is lethal to nitrifying bacteria
    and would prevent biofilm establishment. Nitrifiers grow across a wide range of TAN concentrations;
    the constraint is colonization time, not minimum substrate concentration.'
  correct_answer: b
- id: aqua-d4-q5
  type: FILL_BLANK
  prompt: 'In a recirculating aquaculture system, carbon dioxide produced by fish cellular respiration
    accumulates and causes hypercapnia. Fish begin experiencing clinical hypercapnia symptoms (lethargy,
    reduced growth, respiratory distress) when dissolved CO2 concentration exceeds ___ mg/L, making continuous
    CO2 stripping by airlift pumps or degassing columns mandatory.

    '
  xp_reward: 50
  correct_answer: '25'
  explanation: 'Dissolved CO2 concentrations exceeding 25 mg/L in recirculated water cause hypercapnia:
    blood pH drops through respiratory acidosis, the Bohr Effect reduces hemoglobin-oxygen affinity, and
    fish exhibit lethargy, gasping, and suppressed growth.

    '
