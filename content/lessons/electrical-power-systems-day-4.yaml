    right:
      id: r-25a19e
      text: Human life electrocution protection tripping within 40 milliseconds
  correct_answer:
  - l1=r-71250b
  - l2=r-3bf174
  - l3=r-3e81c2
  - l4=r-25a19e
  explanation: 'Type B is sensitive for resistive loads; Type C handles normal motor inrush; Type D handles
    extreme transformer and welder surges; RCD protects human life.

    '
- id: elec-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why is a 30 mA RCD strictly mandatory on every installation using a TT (isolated earth rod)
    earthing system?

    '
  xp_reward: 50
  options:
  - id: a
    text: TT systems have no neutral connection
  - id: b
    text: RCDs generate the earth connection internally
  - id: c
    text: Earth fault loop impedance through rural soil is often 20-100 ohms, limiting fault current to
      only a few amperes—far too low to trip a standard 16 A or 20 A MCB
  - id: d
    text: Because TT systems operate strictly on DC current
  explanation: 'In a TT system, fault current must travel through earth soil back to the generator neutral
    rod. By Ohm''s law: I = 230V / 50 ohms = 4.6 A. A 16 A MCB will never trip on 4.6 A, leaving appliance
    metalwork energized at 230 V indefinitely! An RCD trips at 0.030 A, clearing the fault instantly.


    Why the other options are wrong: TT systems have a standard neutral wire; only the earthing conductor
    is isolated from the generator neutral. An RCD does not provide an earth; it requires a functional
    earth or human path to detect fault differential current. TT is a standard AC distribution earthing
    regime.'
  correct_answer: c
- id: elec-d4-q5
  type: FILL_BLANK
  prompt: 'To reduce electrical resistance around a driven copper earth rod in dry or rocky soils, the
    rod can be backfilled with water-swelling ___ clay, or treated with alternating layers of crushed
    wood ___ and rock salt.

    '
  xp_reward: 50
  correct_answer:
  - bentonite
  - charcoal
  explanation: 'Sodium bentonite clay retains moisture indefinitely; crushed charcoal and salt create
    an electrolyte-rich conductive envelope around the earth electrode.

    '
