id: "masonry-quality-lesson"
course_id: "masonry"
title: "Plumb, line, curing, and weather"
title_sw: "Plumb, line, curing, na hali ya hewa"
briefing: "Check plumb and line every few courses, not only at the end of the day. Corner profiles and a line keep the face true. Raking back or toothing as specified if you stop a length.\n\nGreen mortar fears sun and rain. Cure: keep it damp as taught; do not let it bake on day one. Incoming rain: cover the wall; do not add extra storeys onto weak beds. Washout of cement from joints is a defect.\n\nJoint finishing (flush, tooled) is done at the right stiffness — too early and you smear; too late and you polish a cracked skin. Brush excess without staining the face.\n\nLeave weep holes and DPCs as the drawing shows. A beautiful wall that bridges the DPC with mortar droppings can still damp."
briefing_sw: "Kagua plumb kila baadhi ya kozi. Linda chokaa mpya na mvua na jua. Finish joints kwa wakati. Usiingize mortar kwenye DPC."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/MAS/CR/03/5"
exam_domain: "Quality of work"
exercises:
  - id: "masonry-quality-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Rain is coming and today’s mortar is still green on a 1.2 m wall. Right action:"
    options:
      - id: "a"
        text: "Cover the work and do not load extra height onto weak mortar"
      - id: "b"
        text: "Spray diesel"
      - id: "c"
        text: "Build two more metres to weight it down"
      - id: "d"
        text: "Remove all profiles"
    correct_answer: "a"
    hint: "Protect green work."
    explanation: "Rain washes cement from fresh joints."
    xp_reward: 50
  - id: "masonry-quality-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Mortar droppings on a DPC can:"
    options:
      - id: "a"
        text: "Improve insulation always"
      - id: "b"
        text: "Bridge the DPC and let damp rise"
      - id: "c"
        text: "Replace the DPC"
      - id: "d"
        text: "Square the diagonal"
    correct_answer: "b"
    hint: "Keep the DPC clean."
    explanation: "Cavity/DPC hygiene is part of the craft."
    xp_reward: 50
  - id: "masonry-quality-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "You should check plumb:"
    options:
      - id: "a"
        text: "Only after painting"
      - id: "b"
        text: "Frequently as the wall rises"
      - id: "c"
        text: "Never — the line is enough"
      - id: "d"
        text: "With a tape across the road"
    correct_answer: "b"
    hint: "Little and often."
    explanation: "End-of-day surprises are expensive."
    xp_reward: 50
  - id: "masonry-quality-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Pointing too early typically:"
    options:
      - id: "a"
        text: "Strengthens cement"
      - id: "b"
        text: "Smears and stains the face"
      - id: "c"
        text: "Replaces curing"
      - id: "d"
        text: "Sets the DPC"
    correct_answer: "b"
    hint: "Timing."
    explanation: "Wait for the right stiffness."
    xp_reward: 50
  - id: "masonry-quality-fb1"
    type: "FILL_BLANK"
    prompt: "Keeping new mortar from drying too fast is called ___."
    correct_answer: "curing"
    hint: "Not “cooking”."
    explanation: "Curing develops strength. Baking in the sun does not."
    xp_reward: 50
  - id: "masonry-quality-scenario"
    type: "SCENARIO"
    prompt: "An assessor’s 2 m spirit level shows a belly in the face. Trainee offers to render thick to hide it. You should:"
    options:
      - id: "a"
        text: "Render 40 mm to fake plumb"
      - id: "b"
        text: "Cut out and rebuild the section; render is not a structural correction"
      - id: "c"
        text: "Paint it dark"
      - id: "d"
        text: "Lean the next wall the other way"
    correct_answer: "b"
    hint: "Geometry first."
    explanation: "Thick render fails and still shows. Rebuild."
    xp_reward: 60
