id: "hairdressing-finish-salon-lesson"
course_id: "hairdressing"
title: "Cutting finish, styling heat, and aftercare"
title_sw: "Kumalizia kukata, heat, na aftercare"
briefing: "A haircut is checked in the mirror and with the head in movement, not only on a still mannequin. Balance both sides. Cross-check. Do not hide a mistake with excessive thinning that will spike in two weeks.\n\nHeat tools: temperature suitable for the hair’s condition. Heat protectant is not optional on already chemical-processed hair. Burns on ears and necks are professionalism failures.\n\nAftercare: which shampoo, how soon to wash colour, how to sleep on a silk scarf if that is the method, and when to return. Selling a product is fine; lying about what the chemical did is not.\n\nClean the station before the next client. Hair on the floor is a slip and a hygiene fail."
briefing_sw: "Kagua cut pande zote. Heat protectant kwenye nywele ya kemikali. Usiwasha masikio. Eleza aftercare. Safisha kituo kabla ya mteja mwingine."
estimated_minutes: 16
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/HBT/CR/03/5"
exam_domain: "Finish & aftercare"
exercises:
  - id: "hairdressing-finish-salon-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Cross-checking a haircut means:"
    options:
      - id: "a"
        text: "Ignoring the longer side"
      - id: "b"
        text: "Looking at the cut from another angle/section to find imbalance"
      - id: "c"
        text: "Only using clippers"
      - id: "d"
        text: "Wetting with relaxer"
    correct_answer: "b"
    hint: "Quality control."
    explanation: "Two views catch a heavy side."
    xp_reward: 50
  - id: "hairdressing-finish-salon-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "High heat on chemically relaxed hair without protection often:"
    options:
      - id: "a"
        text: "Adds protein"
      - id: "b"
        text: "Causes dryness and breakage"
      - id: "c"
        text: "Replaces conditioner forever"
      - id: "d"
        text: "Lowers pH"
    correct_answer: "b"
    hint: "Processed hair is weaker."
    explanation: "Protect and lower temperature."
    xp_reward: 50
  - id: "hairdressing-finish-salon-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Aftercare is part of the service because:"
    options:
      - id: "a"
        text: "Clients enjoy lectures"
      - id: "b"
        text: "Home care decides whether the result lasts and stays healthy"
      - id: "c"
        text: "NITA bans aftercare"
      - id: "d"
        text: "It replaces patch tests"
    correct_answer: "b"
    hint: "The job continues at home."
    explanation: "Tell them what not to do for 48 hours as the product says."
    xp_reward: 50
  - id: "hairdressing-finish-salon-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Hair clippings on a wet floor are a:"
    options:
      - id: "a"
        text: "Style"
      - id: "b"
        text: "Slip and hygiene hazard"
      - id: "c"
        text: "Patch test"
      - id: "d"
        text: "Type of bond"
    correct_answer: "b"
    hint: "Housekeeping."
    explanation: "Sweep. Mop. Next client."
    xp_reward: 50
  - id: "hairdressing-finish-salon-fb1"
    type: "FILL_BLANK"
    prompt: "A spray used before tongs or straighteners to reduce heat damage is heat ___."
    correct_answer: "protectant"
    hint: "Also heat protector."
    explanation: "Especially on chemically processed hair."
    xp_reward: 50
  - id: "hairdressing-finish-salon-scenario"
    type: "SCENARIO"
    prompt: "Client hates the length after you cut. They asked for “a trim”. You cut 8 cm. Professional response?"
    options:
      - id: "a"
        text: "Blame their hair"
      - id: "b"
        text: "Acknowledge the consultation failure, discuss realistic fix (style, wait, or further agreed cut), and record"
      - id: "c"
        text: "Relax the hair as compensation"
      - id: "d"
        text: "Refuse to look in the mirror"
    correct_answer: "b"
    hint: "Consultation."
    explanation: "Show length with fingers first next time. Own the error."
    xp_reward: 60
