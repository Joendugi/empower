cdacc_unit_id: "CU/FAS/CR/05/5"
exam_domain: "Textile principles"
exercises:
  - id: "sewing-garment-textiles-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Warp yarns in a woven fabric generally:"
    options:
      - id: "a"
        text: "Run across the fabric and stretch a lot"
      - id: "b"
        text: "Run parallel to the selvage and have little stretch"
      - id: "c"
        text: "Are always wool"
      - id: "d"
        text: "Replace the grainline"
    correct_answer: "b"
    hint: "Length of the piece."
    explanation: "Weft is across. Grainline of most shirts follows warp."
    xp_reward: 50
  - id: "sewing-garment-textiles-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A polyester school blouse should be pressed:"
    options:
      - id: "a"
        text: "On linen heat with steam forever"
      - id: "b"
        text: "On a cooler setting, tested on a scrap — synthetics melt"
      - id: "c"
        text: "With a welding torch"
      - id: "d"
        text: "Never, because polyester cannot crease"
    correct_answer: "b"
    hint: "Melt point."
    explanation: "Shine and holes are heat damage. Use a press cloth."
    xp_reward: 50
  - id: "sewing-garment-textiles-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Knit jersey for a T-shirt needs:"
    options:
      - id: "a"
        text: "A leather needle and 4 mm straight stitch only"
      - id: "b"
        text: "Ball-point or stretch needle and a stretch stitch or overlocker"
      - id: "c"
        text: "No needle"
      - id: "d"
        text: "A size 110 jeans needle always"
    correct_answer: "b"
    hint: "Loops, not a tight weave."
    explanation: "Sharp needles cut knits and cause holes that run."
    xp_reward: 50
  - id: "sewing-garment-textiles-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Nap fabrics such as corduroy must be cut:"
    options:
      - id: "a"
        text: "With pile running in mixed directions to save cloth"
      - id: "b"
        text: "With all pieces in the same pile direction"
      - id: "c"
        text: "On the weft only"
      - id: "d"
        text: "Without grainlines"
    correct_answer: "b"
    hint: "Light reflection."
    explanation: "One panel will look a different shade if the pile is reversed."
    xp_reward: 50
  - id: "sewing-garment-textiles-fb1"
    type: "FILL_BLANK"
    prompt: "The factory-finished edge of woven cloth parallel to the warp is the ___."
    correct_answer: "selvage"
    hint: "Also selvedge."
    explanation: "Grainline is usually parallel to the selvage."
    xp_reward: 50
  - id: "sewing-garment-textiles-scenario"
    type: "SCENARIO"
    prompt: "You cut a cotton uniform without pre-washing. After hostel laundry it is two sizes smaller. Cause?"
    options:
      - id: "a"
        text: "The machine stitch length"
      - id: "b"
        text: "Relaxation/residual shrinkage — pre-shrink cottons before cutting production garments"
      - id: "c"
        text: "Too much interfacing"
      - id: "d"
        text: "Wrong zip colour"
    correct_answer: "b"
    hint: "Textile science."
    explanation: "CDACC textile principles exist so the garment still fits after wet treatment."
    xp_reward: 60
