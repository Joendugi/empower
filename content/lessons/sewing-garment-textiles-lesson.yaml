id: "sewing-garment-textiles-lesson"
course_id: "sewing-garment"
title: "Week 5 — Textile science and fabric choice"
title_sw: "Wiki 5 — Sayansi ya nguo na chaguo la kitambaa"
briefing: "Fashion Level 5 occupational standards start with textile principles, not only the machine. Fibres are natural (cotton, linen, wool, silk) or manufactured (polyester, nylon, viscose, blends). Cotton breathes and sews easily; it wrinkles and shrinks if not pre-shrunk. Wool felts with heat and moisture. Polyester is strong and crease-resistant but melts under a too-hot iron — that is why you test the iron on a scrap.\n\nYarn becomes fabric by weaving (plain, twill, satin) or knitting. Woven fabrics have warp (along the grain, little stretch) and weft. Knit fabrics stretch and need ball-point needles, stretch stitches, and a walking foot or careful feed. Cutting a woven shirt on the bias (45°) gives drape; cutting off-grain makes a hem twist after washing — a classic assessor fail.\n\nGrainline on the pattern must follow the warp unless the designer marked bias. Selvage is the factory edge parallel to warp. Nap (velvet, corduroy) must all lie the same way or light hits as two colours. Pre-wash or steam-shrink as the fabric requires before you cut a uniform that must survive the hostel laundry.\n\nIdentify: fibre burn tests are taught with care (tiny sample, ventilation, never in a sewing classroom full of cloth). Care labels: wash temperature, tumble, iron dots. Portfolio: a fabric swatch card with fibre, weave, suitable garment, needle size, and stitch length."
briefing_sw: "Nyuzi asilia dhidi ya synthetic. Cotton inapumua na kuwa wrinkles; polyester inayeyuka kwa pasi moto. Weave ina warp na weft; knit inanyooshwa. Grainline ifuate warp. Pre-shrink sare. Nap ya velvet iwe upande mmoja."
