    (stone).

    '
- id: chem-d1-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why will pure slaked lime mortar [Ca(OH)2 + sand] fail to set if used to line the submerged
    interior of an underwater cistern?

    '
  xp_reward: 50
  options:
  - id: a
    text: Non-hydraulic lime requires atmospheric CO2 gas to carbonate into solid limestone; submerged
      underwater, dissolved CO2 is insufficient and the putty remains soft indefinitely
  - id: b
    text: Water dissolves all calcium compounds completely within 24 hours
  - id: c
    text: The sand expands underwater, breaking the mortar joints
  - id: d
    text: Lime mortar must be frozen to trigger crystalline setting
  explanation: 'Air lime hardens strictly through carbonation from contact with atmospheric CO2 gas. Underwater,
    it requires a pozzolan (reactive amorphous silica like volcanic ash) to create hydraulic C-S-H bonds.


    Why the other options are wrong: Ca(OH)2 has low solubility (approx. 1.7 g/L at room temp), but it
    cannot carbonate without CO2. Quartz sand is inert and dimensionally stable in water. Freezing destroys
    uncured lime mortar completely.'
  correct_answer: a
- id: chem-d1-q5
  type: FILL_BLANK
  prompt: 'To formulate ancient Roman hydraulic mortar that cures underwater, lime putty must be blended
    with a natural pozzolan rich in amorphous silica, such as finely ground volcanic ___ or pulverized
    red ___ dust.

    '
  xp_reward: 50
  correct_answer:
  - ash
  - brick
  explanation: 'Volcanic ash (pozzolana) or crushed baked brick (surkhi) contains amorphous silica and
    alumina that react with Ca(OH)2 to form water-insoluble calcium silicate hydrates.

    '
