    '
- id: wind-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'When sizing a penstock pipe for a micro-hydro scheme carrying 0.040 m³/s at a design flow velocity
    of 2.5 m/s, what is the minimum required internal pipe diameter?

    '
  xp_reward: 50
  options:
  - id: a
    text: Approximately 143 mm (0.143 m), calculated from D = √(4Q / π × v) = √(0.160/7.854) = √0.02037
      ≈ 0.143 m
  - id: b
    text: 250 mm because pipe diameter must always exceed 5 × the design flow in litres per second
  - id: c
    text: 40 mm because pipe diameter in mm equals flow in litres per second
  - id: d
    text: 100 mm because that is the standard rural micro-hydro penstock specification
  explanation: 'D = √(4 × 0.040 / (π × 2.5)) = √(0.160/7.854) = √0.02037 = 0.1427 m ≈ 143 mm. Select the
    next standard pipe size above this (typically 160 mm DN160 HDPE) to stay below the 2.5 m/s design
    velocity.


    Why the other options are wrong: No such rule exists. Pipe diameter is calculated from the cross-sectional
    area required for a given flow and velocity. Flow in L/s has no direct mm-equivalent. Pipe diameter
    must be calculated from the continuity equation Q = A × v. There is no single standard size; diameter
    depends on site-specific flow rate and velocity target.'
  correct_answer: a
- id: wind-d3-q5
  type: FILL_BLANK
  prompt: 'The Darcy-Weisbach friction head loss formula hf = f × (L/D) × (v²/2g) predicts penstock pipe
    friction losses. As a design guideline for an efficient micro-hydro scheme, these friction losses
    should not exceed ___ percent of the gross head, because greater losses represent wasted elevation
    and permanently reduce system electrical output.

    '
  xp_reward: 50
  correct_answer: '10'
  explanation: 'Standard micro-hydro design practice limits penstock friction head losses to 10% of gross
    head. Losses above this threshold indicate the pipe is undersized; the penalty is a permanent reduction
    in net head and power output equivalent to the excess loss percentage.

    '
