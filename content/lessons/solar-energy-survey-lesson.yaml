id: "solar-energy-survey-lesson"
course_id: "solar-energy"
title: "Week 1 — Site survey, demand, and solar resource"
title_sw: "Wiki 1 — Survey, matumizi, na jua"
briefing: "A solar system starts with a load audit, not a panel catalogue. List every appliance, its watts, hours per day, and surge current. Daily energy is watts × hours. Separate essential loads (clinic fridge, lights, router) from optional loads. Inspect the roof for orientation, shading from trees and water tanks, corrosion, wind exposure, access, and structural condition.\n\nUse a sun-path app or repeated observation, but verify on site. One shaded cell can reduce a whole string. Decide whether the project is off-grid, grid-tied, or hybrid; each has different protection and legal requirements. Record cable routes and distances because voltage drop determines conductor size.\n\nThe survey report includes client needs, load table, photos, risks, proposed equipment location, and an initial single-line diagram. Do not promise “24-hour power” before calculating worst-month generation and storage."
briefing_sw: "Wiki 1 — Survey, matumizi, na jua: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "solar-energy-survey-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for a solar site survey?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "solar-energy-survey-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that a solar site survey was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "solar-energy-survey-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "audit"
    hint: "A planned check, not an opinion."
    explanation: "A quality audit provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "solar-energy-survey-scenario"
    type: "SCENARIO"
    prompt: "The client adds an electric cooker after sizing and the inverter overloads every evening. What should the technician do?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
