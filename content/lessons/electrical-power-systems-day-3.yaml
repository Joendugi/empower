briefing: 'Transformers are purely passive, solid-state electromagnetic machines that operate at over
  95% efficiency. Without transformers, transmitting electricity beyond a few hundred metres at 230V would
  require copper cables as thick as tree trunks due to resistive I²R voltage drop. By stepping voltage
  up to 1,000V–11,000V for rural transmission and stepping back down to 230V/400V at homestead clusters,
  line losses are slashed by up to 99%. This lesson covers transformer electromagnetic induction, grain-oriented
  silicon steel laminated core calculations, turns-per-volt formulas, wire gauge selection, and insulation
  varnishing.

  '
outline: 'Transformer induction laws and turns ratio formula (Vp / Vs = Np / Ns = Is / Ip); the electrical
  power loss equation P_loss = I^2 * R and why stepping up voltage cuts line losses by the square of voltage
  ratio; core physics (magnetic saturation Bmax, hysteresis, eddy currents in laminated silicon steel
  sheets); transformer design formula: E = 4.44 * f * Bmax * Ac * N; turns-per-volt calculation; copper
  wire circular mil / mm2 sizing based on 3.0 A/mm2 current density; insulating materials (Nomex paper,
  Kapton, baked polyurethane varnish); rewinding and testing open-circuit vs short-circuit parameters.

  '
content_md: "## The Transformer & Faraday's Law\n\nA transformer transfers electrical energy between two\
  \ isolated circuits via mutual\nelectromagnetic induction through a shared ferromagnetic core:\n\n$$\\\
  frac{V_p}{V_s} = \\frac{N_p}{N_s} = \\frac{I_s}{I_p} = a \\quad (\\text{Turns Ratio})$$\n\n- If $N_s\
  \ > N_p$: **Step-up transformer** (voltage increases, current decreases).\n- If $N_s < N_p$: **Step-down\
  \ transformer** (voltage decreases, current increases).\n- **Power Invariance (Ideal)**:\n  $$P_{\\\
  text{primary}} = P_{\\text{secondary}} \\quad \\Longrightarrow \\quad V_p \\times I_p = V_s \\times\
  \ I_s$$\n\n## Why Step-Up Voltage Cuts Distribution Losses\n\nConductor power loss due to wire resistance\
  \ ($R_{\\text{cable}}$) is determined by the\nsquare of the transmitted current:\n\n$$P_{\\text{loss}}\
  \ = I^2 \\times R_{\\text{cable}}$$\n\n*Practical Demonstration*:\nSuppose an off-grid micro-hydro turbine\
  \ generates **23 kW** of power at a river site\nlocated **1,000 metres (1 km)** away from a village\
  \ school. Cable loop resistance = $2.0\\,\\Omega$.\n\n### Case A: Direct Transmission at 230 V:\n- Current\
  \ required: $I = \\frac{P}{V} = \\frac{23,000\\text{ W}}{230\\text{ V}} = 100\\text{ Amperes}$.\n- Power\
  \ lost as heat in the cable:\n  $$P_{\\text{loss}} = (100\\text{ A})^2 \\times 2.0\\,\\Omega = 10,000\
  \ \\times 2.0 = \\mathbf{20,000\\text{ Watts (20 kW)}}$$\n- **Catastrophic Failure**: Out of 23 kW generated,\
  \ 20 kW is burned in the wires. Only 3 kW arrives at the school (efficiency = 13%).\n\n### Case B: Stepped\
  \ Up to 2,300 V (10:1 Step-Up Transformer):\n- Current required: $I = \\frac{23,000\\text{ W}}{2,300\\\
  text{ V}} = 10\\text{ Amperes}$ (current dropped by a factor of 10).\n- Power lost as heat in the cable:\n\
  \  $$P_{\\text{loss}} = (10\\text{ A})^2 \\times 2.0\\,\\Omega = 100 \\times 2.0 = \\mathbf{200\\text{\
  \ Watts (0.2 kW)}}$$\n- **Result**: Stepping voltage up by 10× slashes transmission power losses by\
  \ a factor of $10^2 =$ **100 times** ($99\\%\\text{ loss reduction}$)!\n- At the school, a 2300V $\\\
  rightarrow$ 230V step-down transformer restores safe household power with 98.5% total transmission efficiency.\n\
  \n## The Transformer Design Equation\n\nThe electromotive force ($\\text{RMS Voltage } E$) induced in\
  \ a coil of $N$ turns wrapped\naround a magnetic core of cross-sectional area $A_c$ (in $\\text{m}^2$)\
  \ at frequency $f$ (in Hz):\n\n$$E = 4.44 \\times f \\times B_{\\text{max}} \\times A_c \\times N$$\n\
  \nWhere:\n- $E$ = RMS Voltage (Volts)\n- $f$ = Grid Frequency (**50 Hz**)\n- $B_{\\text{max}}$ = Peak\
  \ magnetic flux density in the iron core (in **Tesla**).\n  - Standard non-oriented transformer steel:\
  \ $1.0\\text{ to } 1.2\\text{ Tesla}$.\n  - Cold-Rolled Grain-Oriented (CRGO) silicon steel: **$1.4\\\
  text{ to } 1.6\\text{ Tesla}$**.\n  - Ferrite / cast iron (scrap): $< 0.8\\text{ Tesla}$.\n- $A_c$ =\
  \ Effective iron core cross-sectional area ($\\text{m}^2$).\n- $N$ = Number of wire turns.\n\n## Sizing\
  \ a Practical Transformer: Turns-Per-Volt (TPV)\n\nRearranging the design formula yields the **Turns\
  \ Per Volt (TPV)** constant for a given core:\n\n$$\\text{TPV} = \\frac{N}{E} = \\frac{1}{4.44 \\times\
  \ f \\times B_{\\text{max}} \\times A_c}$$\n\nAt $50\\text{ Hz}$ with high-grade CRGO steel ($B_{\\\
  text{max}} = 1.5\\text{ Tesla}$):\n$$\\text{TPV} = \\frac{1}{4.44 \\times 50 \\times 1.5 \\times A_c}\
  \ = \\frac{1}{333 \\times A_c}$$\n\n*Worked Example*: Fabricating a 1.0 kVA Isolation / Distribution\
  \ Transformer:\n- Stacking laminated E-I iron sheets to produce a center tongue width of $40\\text{\
  \ mm}$ and stack depth of $50\\text{ mm}$.\n- Gross area = $40\\text{ mm} \\times 50\\text{ mm} = 2,000\\\
  text{ mm}^2 = 0.0020\\text{ m}^2$.\n- Accounting for a 90% stacking factor (varnish insulation between\
  \ thin laminations):\n  $$A_c = 0.0020 \\times 0.90 = 0.0018\\text{ m}^2$$\n- Calculate TPV:\n  $$\\\
  text{TPV} = \\frac{1}{333 \\times 0.0018} = \\mathbf{1.668\\text{ Turns per Volt}}$$\n\n### Primary\
  \ Winding (230 V):\n$$N_p = 230\\text{ V} \\times 1.668 \\approx \\mathbf{384\\text{ Turns}}$$\n\n###\
  \ Secondary Winding (115 V):\nAdd a 5% allowance to compensate for copper resistance voltage drop under\
  \ load:\n$$N_s = (115\\text{ V} \\times 1.668) \\times 1.05 = 192 \\times 1.05 \\approx \\mathbf{202\\\
  text{ Turns}}$$\n\n## Copper Wire Sizing & Current Density\n\nRunning excessive current through magnet\
  \ wire overheats the core, melting insulation:\n- **Design Current Density ($J$)**: For natural air-cooled\
  \ transformers, select **$J = 2.5\\text{ to } 3.0\\text{ Amperes per mm}^2$**.\n- **Wire Cross-Sectional\
  \ Area**:\n  $$A_{\\text{wire}} = \\frac{I}{J} \\quad (\\text{in mm}^2)$$\n\n*Example*: For 1,000 VA\
  \ at 230 V, primary current $I_p = 1000 / 230 = 4.35\\text{ A}$.\n$$A_{\\text{wire}} = \\frac{4.35\\\
  text{ A}}{3.0\\text{ A/mm}^2} = 1.45\\text{ mm}^2$$\nConsulting standard wire tables, $1.45\\text{ mm}^2$\
  \ corresponds to **1.36 mm diameter enamelled copper wire (approx. 16 AWG / 17 SWG)**.\n\n## Transformer\
  \ Core Losses & Winding Safety\n\n1. **Eddy Current Losses**: Alternating magnetic flux induces circulating\
  \ currents inside solid iron, acting like a giant heating element. Cores must be built from **thin insulated\
  \ laminations (0.35 mm to 0.5 mm thick)** coated in insulating varnish to break the electrical current\
  \ paths.\n2. **Inter-Layer Insulation**: Between each layer of primary and secondary wire, place a layer\
  \ of **Kraft paper, Nomex, or polyester film**.\n3. **Electrostatic Shield**: An unclosed copper foil\
  \ strip placed between the primary and secondary winding (grounded to Earth) blocks high-frequency lightning\
  \ spikes from crossing from the high-voltage transmission line into low-voltage building wiring.\n4.\
  \ **Varnish Impregnation & Baking**: After winding, submerge the entire core in electrical insulating\
  \ resin/varnish under vacuum, then bake at **110°C for 4 hours**. This cements wires in place, preventing\
  \ mechanical wire buzzing and abrasive insulation wear.\n"
exercises:
- id: elec-d3-q1
  type: MULTIPLE_CHOICE
  prompt: 'Why are iron transformer cores constructed from stacks of thin, varnish-insulated silicon steel
    sheets (laminations) rather than a solid block of forged iron?

    '
  xp_reward: 50
  options:
  - id: a
    text: Laminated cores are cheaper to ship by weight
  - id: b
    text: Solid iron blocks cannot conduct magnetic flux
  - id: c
    text: Thin laminations interrupt and suppress circulating eddy currents induced by the alternating
      magnetic field, preventing severe thermal overheating and wasted core energy
  - id: d
    text: Laminations allow the transformer to convert AC directly into DC
  explanation: 'Solid iron provides low resistance paths for massive circulating eddy currents that waste
    huge power as heat (P = V²/R). Slicing the core into 0.35 mm insulated sheets restricts eddy currents
    to microscopic loops, reducing losses by over 95%.


    Why the other options are wrong: Laminated cores have the same weight and are more labour-intensive
    to produce. Solid iron conducts magnetic flux very well, but suffers massive electrical heating losses.
    Transformers operate strictly on AC and do not rectify.'
  correct_answer: c
- id: elec-d3-q2
  type: FILL_BLANK
  prompt: 'If transmission line voltage is stepped up by a factor of 5 using a transformer, the current
    required to transmit the same kilowatt load drops by a factor of ___, and the resistive I²R line power
    losses in the transmission wires drop by a factor of ___.

    '
  xp_reward: 50
  correct_answer:
  - '5'
  - '25'
  explanation: 'Current is inversely proportional to voltage (I = P / V), so current drops by 5×. Power
    loss is proportional to current squared (P_loss = I² × R), so loss drops by 5² = 25 times.

    '
- id: elec-d3-q3
  type: MATCH_PAIRS
  prompt: Match each transformer design parameter to its operational purpose.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Turns Per Volt (TPV)
    right:
      id: r-3b8dd6
      text: Ratio determining how many wire loops are wound per volt of coil potential
  - left:
      id: l2
      text: Current Density (J = 3.0 A/mm2)
    right:
      id: r-aa4ae3
      text: Sizing rule preventing copper conductor overheating and insulation breakdown
  - left:
      id: l3
      text: Electrostatic Shield
    right:
      id: r-a858b2
      text: Grounded copper foil layer preventing high-voltage lightning capacitive coupling
  - left:
      id: l4
      text: Secondary +5% Turn Allowance
    right:
      id: r-6f2fb1
      text: Compensates for internal winding resistance and inductive leakage voltage drop
  correct_answer:
  - l1=r-3b8dd6
  - l2=r-aa4ae3
  - l3=r-a858b2
  - l4=r-6f2fb1
  explanation: 'TPV governs core magnetic saturation; current density sizes copper; electrostatic shields
    protect against line surges; extra turns compensate for internal I×R drop.

    '
- id: elec-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'An off-grid technician designs a 50 Hz transformer on a core with effective iron area Ac =
    0.0025 m2 using grain-oriented silicon steel with Bmax = 1.4 Tesla. Using E = 4.44 × f × Bmax × Ac
    × N, what is the calculated Turns Per Volt (TPV)?

    '
  xp_reward: 50
  options:
  - id: a
    text: Approximately 1.29 Turns per Volt
  - id: b
    text: Approximately 12.9 Turns per Volt
  - id: c
    text: Approximately 0.55 Turns per Volt
  - id: d
    text: Exactly 5.0 Turns per Volt
  explanation: 'TPV = 1 / (4.44 × 50 × 1.4 × 0.0025) = 1 / (310.8 × 0.0025) = 1 / 0.777 ≈ 1.287 Turns
    per Volt.


    Why the other options are wrong: This is ten times too high, which would result in an over-wound coil
    that would not fit in the core window. This would heavily saturate the magnetic core, causing massive
    excitation current and tripping circuit breakers. This neglects the core area and Bmax calculations.'
  correct_answer: a
- id: elec-d3-q5
  type: FILL_BLANK
  prompt: 'After winding a high-voltage transformer coil, the assembly must be impregnated with insulating
    resin and baked at 110 degrees C to cement the windings together, preventing microscopic abrasive
    wear caused by magnetic ___ between adjacent wire turns.

    '
  xp_reward: 50
  correct_answer: vibration
  explanation: 'Alternating 50 Hz magnetic fields exert physical mechanical forces on the copper conductors.
    Without solid varnish impregnation, wires vibrate and buzz, rubbing through thin enamel insulation
    and causing catastrophic turn-to-turn short circuits.

    '
