briefing: 'Whether driven by a diesel engine, biomass gasifier, or hydro turbine, the synchronous alternator
  is the beating heart of an autonomous AC electrical grid. Converting mechanical shaft rotation into
  stable 230V/400V 50Hz electricity requires understanding rotor-stator electromagnetic induction, brushless
  exciter architectures, and closed-loop Automatic Voltage Regulators (AVR). When heavy inductive loads
  switch on, generator voltage plunges without immediate excitation response. This lesson covers synchronous
  speed physics, residual magnetism flash procedures, AVR tuning, and diode bridge diagnosis.

  '
outline: 'Synchronous speed formula N = (120 * f) / P; 2-pole (3000 RPM) vs 4-pole (1500 RPM) alternators;
  revolving field vs revolving armature architectures; brushless exciter system (pilot exciter, rotating
  3-phase rectifier diode bridge, main rotor field); loss of residual magnetism and 12V battery "field
  flashing" protocol; Automatic Voltage Regulator (AVR) feedback loop, sensing transformers, and stability/voltage
  trimpot tuning; generator derating factors (ambient temperature, altitude > 1000m); troubleshooting
  low voltage, hunting oscillations, and diode failures.

  '
content_md: "## The Synchronous AC Alternator\n\nAn AC generator converts mechanical torque into electrical\
  \ power via Faraday's Law:\n$$\\mathcal{E} = -N \\times \\frac{d\\Phi}{dt}$$\n\nIn modern industrial\
  \ alternators (Stamford, Mecc Alte, Leroy Somer), the design uses a\n**Revolving Field / Stationary\
  \ Armature**:\n- **Stator (Armature)**: Stationary outer laminated steel core containing heavy 3-phase\
  \ copper windings that output main load power (230V/400V).\n- **Rotor (Field)**: Electromagnet mounted\
  \ on the spinning shaft that carries low-voltage direct current (DC) excitation.\n- **Why this design?**:\
  \ High load currents (hundreds of amps at 400V) do not pass through failure-prone carbon brushes or\
  \ spinning slip rings.\n\n## Synchronous Speed & Frequency Equation\n\nThe electrical frequency ($f$,\
  \ in Hertz) generated by an alternator is rigidly\nlocked to the mechanical shaft rotation speed ($N$,\
  \ in RPM) and the number of magnetic poles ($P$):\n\n$$f = \\frac{N \\times P}{120} \\quad \\Longleftrightarrow\
  \ \\quad N = \\frac{120 \\times f}{P}$$\n\n### Operating Speeds for 50 Hz African Mini-Grids:\n| Pole\
  \ Count ($P$) | Synchronous Speed ($N$) | Common Application |\n|---|---|---|\n| **2 Poles** | **3,000\
  \ RPM** | Small portable petrol generators (noisy, short engine lifespan) |\n| **4 Poles** | **1,500\
  \ RPM** | Heavy-duty stationary diesel generators, medium hydro turbines (long continuous lifespan)\
  \ |\n| **6 Poles** | **1,000 RPM** | Slow-speed biomass engines, direct-coupled hydro |\n| **8 Poles**\
  \ | **750 RPM** | Large run-of-river hydro turbines |\n\n*Rule of Grid Frequency*: Frequency is strictly\
  \ controlled by the **engine mechanical governor / water turbine throttle** (controlling shaft RPM).\n\
  Voltage is strictly controlled by the **rotor excitation current** (controlling magnetic field strength).\n\
  \n## Brushless Exciter Architecture\n\nModern alternators have no brushes or slip rings. They generate\
  \ their own excitation power internally:\n\n```\n                     MAIN SHAFT (Spinning at 1500 RPM)\n\
  ┌────────────────────────────────────────────────────────────────────────┐\n│                      \
  \                                                  │\n│   [Exciter Armature]  ────>  [Rotating Diode\
  \ Bridge]  ────> [Main Rotor]\n│       (AC Output)                   (DC Rectifier)             (DC\
  \ Poles)\n│            ▲                                                       │\n└────────────┼───────────────────────────────────────────────────────┼───┘\n\
  \             │ Magnetic Induction                                    │ 400V Output\n┌────────────┴─────────────┐\
  \                           ┌─────────────▼───┐\n│     [Exciter Stator]     │                      \
  \     │   [Main Stator] │\n│    (Stationary DC Field) │                           │  (3-Phase Power)│\n\
  └────────────▲─────────────┘                           └─────────────┬───┘\n             │         \
  \                                              │\n             └────────── [Automatic Voltage Regulator\
  \ (AVR)] ────────┘\n                               (Feedback Control)\n```\n\n1. The **AVR** samples\
  \ the main stator AC output voltage (e.g., 400V).\n2. If voltage sags, the AVR sends increased DC current\
  \ (0–60V DC) into the stationary **Exciter Stator**.\n3. The spinning **Exciter Armature** passes through\
  \ this field, generating AC power on the spinning shaft.\n4. A **Rotating Diode Bridge** (6 diodes mounted\
  \ on a wheel on the shaft) rectifies this AC into high-current DC.\n5. This DC powers the **Main Rotor**,\
  \ intensifying the magnetic field and restoring main 400V stator voltage.\n\n## Field Flashing: Recovering\
  \ Lost Residual Magnetism\n\nWhen an alternator sits unused for months or experiences a dead short circuit,\
  \ the\nhardened iron exciter core loses its permanent **residual magnetism** ($< 2\\text{V}$ residual).\n\
  Upon engine startup, the exciter generates zero voltage, the AVR receives no power, and the alternator\
  \ outputs 0 to 15 Volts.\n\n### 12V Battery Flash Procedure:\n1. Stop the generator engine completely.\n\
  2. Locate the exciter stator field terminals on the AVR (typically labelled **$F+$ and $F-$** or **$X$\
  \ and $XX$**).\n3. Disconnect $F+$ and $F-$ from the AVR terminals to prevent damaging the regulator\
  \ diodes.\n4. Connect a series current-limiting resistor (or a 12V automotive headlight bulb) to the\
  \ positive terminal of a 12V lead-acid battery.\n5. **Flash the Field**:\n   - Connect Battery Positive\
  \ ($+$) to $F+$ (red wire).\n   - Tap Battery Negative ($-$) to $F-$ (black wire) for **2 to 3 seconds**.\n\
  \   - An audible click and small spark will occur as the magnetic domains realign.\n6. Disconnect the\
  \ battery, reconnect $F+/F-$ to the AVR, and restart the generator. Output voltage will instantly jump\
  \ back to 230V/400V.\n\n## The Automatic Voltage Regulator (AVR)\n\nCommon off-grid AVR modules (SX460,\
  \ AS440, SX440) feature adjustable trimpots:\n- **VOLT (Voltage Setpoint)**: Sets nominal output (typically\
  \ 230V single-phase / 400V line-to-line). Turn clockwise to increase.\n- **STAB (Stability)**: Adjusts\
  \ dampening loop response.\n  - *Too high*: Voltage responds sluggishly when heavy motor starts.\n \
  \ - *Too low*: Generator \"hunts\" (voltage and engine sound pulse cyclically up and down every second).\n\
  \  - *Tuning procedure*: Turn STAB counter-clockwise until voltage starts oscillating slightly, then\
  \ turn clockwise approx. 1/8 turn until steady.\n- **UFRO (Under-Frequency Roll-Off)**: Protects alternator\
  \ from burning out during engine lug-down. When engine drops below 47 Hz, UFRO automatically slashes\
  \ output voltage proportionally to shedding load.\n\n## Generator Altitude & Temperature Derating\n\n\
  Alternators rely on atmospheric air circulation to cool their copper windings:\n- **Altitude Derating**:\
  \ At high altitudes (e.g., Nairobi at 1,800 m, Eldoret at 2,100 m), thinner air has lower heat capacity.\n\
  \  - Derate continuous kVA capacity by **3% per 300 metres above 1,000 m**.\n  - A 100 kVA generator\
  \ at 2,100 m altitude can only safely supply:\n    $$\\text{Derating} = \\frac{2100 - 1000}{300} \\\
  times 3\\% = 3.67 \\times 3\\% \\approx 11\\%$$\n    $$\\text{Continuous Rating} = 100 \\times (1 -\
  \ 0.11) = 89\\text{ kVA}$$\n- **Ambient Temperature Derating**: Standard rating is for 40°C ambient\
  \ air. In hot semi-arid zones (Garissa, Lodwar at 45°C), derate by an additional **5% to 8%**.\n"
exercises:
- id: elec-d2-q1
  type: MULTIPLE_CHOICE
  prompt: 'A stationary 4-pole synchronous diesel generator is being commissioned in Kenya to power a
    50 Hz micro-grid. What exact rotational speed in RPM must the engine mechanical governor maintain?

    '
  xp_reward: 50
  options:
  - id: a
    text: 3,000 RPM
  - id: b
    text: 1,800 RPM
  - id: c
    text: 1,000 RPM
  - id: d
    text: 1,500 RPM
  explanation: 'N = (120 × f) / P = (120 × 50) / 4 = 6000 / 4 = 1,500 RPM. A 4-pole alternator must spin
    at exactly 1,500 RPM to produce 50 Hz AC.


    Why the other options are wrong: 3,000 RPM corresponds to a 2-pole generator (typical of small portable
    petrol sets), not a 4-pole unit. 1,800 RPM is the standard speed for 60 Hz grids (e.g., North America),
    not 50 Hz. 1,000 RPM corresponds to a 6-pole machine.'
  correct_answer: d
- id: elec-d2-q2
  type: FILL_BLANK
  prompt: 'When an idle generator fails to generate voltage due to loss of residual magnetism in the exciter
    iron, the recovery technique of connecting a 12V DC battery briefly to the F+ and F- field terminals
    is called field ___.

    '
  xp_reward: 50
  correct_answer: flashing
  explanation: 'Field flashing injects a DC current pulse from an external battery to re-align magnetic
    domains in the exciter stator core, restoring residual flux.

    '
- id: elec-d2-q3
  type: MATCH_PAIRS
  prompt: Match each alternator subsystem to its functional engineering duty.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Automatic Voltage Regulator (AVR)
    right:
      id: r-bdb571
      text: Senses stator AC output and dynamically controls DC exciter current
  - left:
      id: l2
      text: Rotating Diode Bridge
    right:
      id: r-e507ae
      text: Rectifies spinning AC exciter armature output into DC for main rotor
  - left:
      id: l3
      text: Under-Frequency Roll-Off (UFRO)
    right:
      id: r-431ac3
      text: Slashes generator voltage if engine RPM bogs down below 47 Hz
  - left:
      id: l4
      text: Mechanical Engine Governor
    right:
      id: r-6263c1
      text: Throttles fuel injection to maintain steady 1500 RPM / 50 Hz frequency
  correct_answer:
  - l1=r-bdb571
  - l2=r-e507ae
  - l3=r-431ac3
  - l4=r-6263c1
  explanation: 'AVR controls voltage; diodes provide brushless DC on the shaft; UFRO protects windings
    during overloads; governor maintains 50 Hz shaft speed.

    '
- id: elec-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'A generator operator notices that the generator voltage and diesel engine tone are pulsing
    up and down cyclically every 1–2 seconds (''hunting'') even with a steady electrical load. Which AVR
    trimpot adjustment fixes this issue?

    '
  xp_reward: 50
  options:
  - id: a
    text: Turn the VOLT trimpot to maximum
  - id: b
    text: Disconnect the neutral ground wire
  - id: c
    text: Adjust the STABILITY (STAB) trimpot slightly clockwise to increase dampening and suppress hunting
      oscillations
  - id: d
    text: Replace the stator windings
  explanation: 'Hunting indicates loop instability in the AVR''s voltage feedback loop. Increasing the
    STABILITY dampening prevents over-correction and stabilizes the output voltage.


    Why the other options are wrong: Increasing voltage does not fix loop instability and will over-voltage
    connected appliances. Disconnecting ground is extremely dangerous and does not address AVR hunting.
    Hunting is a control tuning phenomenon, not an insulation breakdown.'
  correct_answer: c
- id: elec-d2-q5
  type: FILL_BLANK
  prompt: 'Because air is less dense at high altitudes, an alternator operated in the Kenyan highlands
    at 2,000 m must be derated by approximately ___% of its nameplate capacity due to reduced cooling
    airflow.

    '
  xp_reward: 50
  correct_answer: 10%
  explanation: 'Standard derating is 3% per 300 m above 1,000 m. For 2,000 m: (2000 - 1000) / 300 × 3%
    = 3.33 × 3% = 10% capacity derate.

    '
