title: 'Earthing, Bonding And Protective Devices: Earth Fault Loop, Rcds, Mcbs, Tn
  And Tt Systems: Principles and Practical Application'
title_sw: 'Earthing, Bonding And Protective Devices: Earth Fault Loop, Rcds, Mcbs,
  Tn And Tt Systems: Kanuni na Utendaji wa Vitendo'
briefing: 'In professional workshop practice, mastering Earthing, Bonding and Protective
  Devices: Earth Fault Loop, RCDs, MCBs, TN and TT Systems requires strict adherence
  to safety standards and sequential execution. Always inspect personal protective
  equipment (PPE), ensure proper tool calibration, and verify that the workpiece is
  securely mounted before commencing. Observe manufacturer specifications and relevant
  standards. Maintain a clean work environment, store consumables dry, and double-check
  your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Earthing, Bonding and Protective Devices:
  Earth Fault Loop, RCDs, MCBs, TN and TT Systems kunahitaji kufuata sheria za usalama
  na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla ya kuanza kazi.'
