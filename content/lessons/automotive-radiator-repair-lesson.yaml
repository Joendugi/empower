title: "Week 5 — Radiator diagnosis, solder repair, plastic tanks, and flow"
title_sw: "Wiki 5 — Ukarabati wa radiator"
briefing: "Start cold. Inspect cap seal, neck, tanks, seams, tube-to-header joints, drain plug, mounts, fan shroud, hoses, and staining. Pressure-test only to the specified cap pressure; too much pressure can create the leak you claim to diagnose. Remove the radiator if access or tank testing requires it. Plug openings and use a regulated water/air bench tester; never apply unregulated compressor pressure. Submerge testing uses low regulated pressure and bubbles to locate leaks.\n\nConstruction decides the repair. Older copper/brass radiators can often be de-soldered, cleaned to bright metal, fluxed, and soft-soldered at a tank seam or tube-to-header joint. Control heat so adjacent solder does not release. Damaged tubes may be professionally pinched and soldered only within an acceptable percentage; too many blocked tubes reduce cooling and require a re-core. Flush flux residue and pressure-test again.\n\nModern aluminium cores with crimped plastic tanks are different. A split plastic tank, hardened gasket, broken neck, or damaged crimp usually needs a replacement tank/gasket by a radiator specialist—or complete radiator replacement. Epoxy on a hot pressurised tank is usually temporary and may fail suddenly. Aluminium tube repair needs correct aluminium brazing/TIG equipment and skill; overheating thin tubes creates a larger hole. Bent fins may be straightened carefully, but punctured tubes and internal blockage need specialist evaluation.\n\nDiagnose overheating beyond leaks: restricted core (temperature scan shows cold bands), external mud/insects, missing shroud, wrong fan direction, thermostat, pump impeller, air lock, head-gasket gas, wrong coolant mix, and weak cap. Final service: correct coolant type and ratio, bleed using manufacturer procedure, cabin heater hot, fan cycles, no bubbles/leaks, stable road-test temperature, and recovery bottle level rechecked after cool-down. Never release coolant to soil or drains."
briefing_sw: "Anza radiator ikiwa baridi. Pressure-test hadi rating ya cap tu. Copper/brass inaweza kusolderiwa baada ya kusafishwa; aluminium/plastic tank mara nyingi hubadilishwa au specialist. Epoxy ni temporary. Kagua flow, fan, thermostat, pump, air lock, na coolant sahihi."
