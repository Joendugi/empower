id: "automotive-radiator-repair-lesson"
course_id: "automotive"
title: "Week 5 — Radiator diagnosis, solder repair, plastic tanks, and flow"
title_sw: "Wiki 5 — Ukarabati wa radiator"
briefing: "Start cold. Inspect cap seal, neck, tanks, seams, tube-to-header joints, drain plug, mounts, fan shroud, hoses, and staining. Pressure-test only to the specified cap pressure; too much pressure can create the leak you claim to diagnose. Remove the radiator if access or tank testing requires it. Plug openings and use a regulated water/air bench tester; never apply unregulated compressor pressure. Submerge testing uses low regulated pressure and bubbles to locate leaks.\n\nConstruction decides the repair. Older copper/brass radiators can often be de-soldered, cleaned to bright metal, fluxed, and soft-soldered at a tank seam or tube-to-header joint. Control heat so adjacent solder does not release. Damaged tubes may be professionally pinched and soldered only within an acceptable percentage; too many blocked tubes reduce cooling and require a re-core. Flush flux residue and pressure-test again.\n\nModern aluminium cores with crimped plastic tanks are different. A split plastic tank, hardened gasket, broken neck, or damaged crimp usually needs a replacement tank/gasket by a radiator specialist—or complete radiator replacement. Epoxy on a hot pressurised tank is usually temporary and may fail suddenly. Aluminium tube repair needs correct aluminium brazing/TIG equipment and skill; overheating thin tubes creates a larger hole. Bent fins may be straightened carefully, but punctured tubes and internal blockage need specialist evaluation.\n\nDiagnose overheating beyond leaks: restricted core (temperature scan shows cold bands), external mud/insects, missing shroud, wrong fan direction, thermostat, pump impeller, air lock, head-gasket gas, wrong coolant mix, and weak cap. Final service: correct coolant type and ratio, bleed using manufacturer procedure, cabin heater hot, fan cycles, no bubbles/leaks, stable road-test temperature, and recovery bottle level rechecked after cool-down. Never release coolant to soil or drains."
briefing_sw: "Anza radiator ikiwa baridi. Pressure-test hadi rating ya cap tu. Copper/brass inaweza kusolderiwa baada ya kusafishwa; aluminium/plastic tank mara nyingi hubadilishwa au specialist. Epoxy ni temporary. Kagua flow, fan, thermostat, pump, air lock, na coolant sahihi."
estimated_minutes: 32
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AUT/CR/05/5"
exam_domain: "Cooling-system radiator service"
exercises:
  - id: "automotive-radiator-repair-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A modern radiator has a split plastic top tank beside the hose neck. Best durable repair?"
    options:
      - id: "a"
        text: "Heat it with an oxy-acetylene torch"
      - id: "b"
        text: "Replace the tank and seal professionally if serviceable, or replace the radiator"
      - id: "c"
        text: "Add engine oil to soften the plastic"
      - id: "d"
        text: "Fit a higher-pressure cap"
    correct_answer: "b"
    hint: "Hot plastic tanks cycle pressure."
    explanation: "External glue is rarely a durable repair at a stressed neck. Replacement restores pressure integrity."
    xp_reward: 50
  - id: "automotive-radiator-repair-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Cold vertical bands on a hot radiator during a controlled temperature scan suggest:"
    options:
      - id: "a"
        text: "Perfect flow"
      - id: "b"
        text: "Internally restricted tubes"
      - id: "c"
        text: "A stronger fan belt"
      - id: "d"
        text: "Too much brake fluid"
    correct_answer: "b"
    hint: "Coolant is not flowing through those rows."
    explanation: "Blocked tubes reduce effective core area and can cause overheating under load."
    xp_reward: 50
  - id: "automotive-radiator-repair-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Why regulate air pressure during a submerged radiator test?"
    options:
      - id: "a"
        text: "To make bubbles smaller for photographs only"
      - id: "b"
        text: "Unregulated shop air can rupture the core or tanks and injure the technician"
      - id: "c"
        text: "Radiators normally run at 8 bar"
      - id: "d"
        text: "Air has no stored energy"
    correct_answer: "b"
    hint: "Use the cap rating and bench procedure."
    explanation: "Cooling systems operate at relatively low pressure. Shop compressors can exceed that many times."
    xp_reward: 50
  - id: "automotive-radiator-repair-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "After soldering a copper/brass seam, the next step is:"
    options:
      - id: "a"
        text: "Paint immediately over active flux"
      - id: "b"
        text: "Clean flux residue, pressure-test, flush, refit, bleed, and verify temperature"
      - id: "c"
        text: "Remove the thermostat permanently"
      - id: "d"
        text: "Mix any coolant colours"
    correct_answer: "b"
    hint: "Repair then prove."
    explanation: "Flux is corrosive, and a bench repair still needs system commissioning."
    xp_reward: 50
  - id: "automotive-radiator-repair-fb1"
    type: "FILL_BLANK"
    prompt: "Replacing the complete tube-and-fin centre of a repairable radiator is called a re-___."
    correct_answer: "core"
    hint: "Re-core."
    explanation: "A re-core keeps serviceable tanks while replacing a badly blocked or damaged core."
    xp_reward: 50
  - id: "automotive-radiator-repair-scenario"
    type: "SCENARIO"
    prompt: "Taxi overheats uphill. Radiator has no external leak, fan works, and thermal scan shows half the core cold. Best repair decision?"
    options:
      - id: "a"
        text: "Fit a 25 psi cap"
      - id: "b"
        text: "Confirm restricted flow, then re-core or replace the radiator and correct coolant/contamination cause"
      - id: "c"
        text: "Drill holes through cold tubes"
      - id: "d"
        text: "Remove the fan shroud"
    correct_answer: "b"
    hint: "Cold bands are lost heat-transfer area."
    explanation: "A blocked core is a flow defect. Higher pressure does not restore tube area."
    xp_reward: 60
  - id: "automotive-radiator-repair-practical"
    type: "VIDEO_RECORD"
    prompt: "Record a cold cooling-system inspection or bench mock-up: identify radiator construction, cap rating, four likely leak points, safe pressure-test steps, and the final bleed/test sequence."
    correct_answer: "recorded"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Cold-system warning and PPE are stated"
      - "Copper/brass versus aluminium/plastic construction is identified"
      - "Pressure limit and regulated tester are shown"
      - "Repair and replacement limits are explained"
      - "Coolant recovery, bleeding, and hot verification are included"
    min_seconds: 20
