    '
- id: vet-d1-q4
  type: MULTIPLE_CHOICE
  prompt: 'A dairy cow grazing on lush morning alfalfa pasture collapses with extreme distension of the
    left flank. A passed stomach tube fails to release gas because it clogs with thick green lather. What
    immediate emergency treatment will collapse the foam?

    '
  xp_reward: 50
  options:
  - id: a
    text: Administer 500 mL of cooking vegetable oil or dimethicone/poloxalene directly into the rumen
      to break the foam bubble surface tension
  - id: b
    text: Inject antibiotic penicillin into the left flank
  - id: c
    text: Force the cow to drink 20 litres of cold water
  - id: d
    text: Administer large doses of baking soda
  explanation: 'Pasture bloat produces stable micro-bubbles that trap gas in viscous foam. Non-polar oils
    (vegetable oil or mineral oil) break surface tension, coalescing the foam into free gas that the cow
    belches out.


    Why the other options are wrong: Penicillin has zero immediate effect on mechanical foam surface tension.
    Adding more water increases ruminal volume, accelerating suffocation. Baking soda (sodium bicarbonate)
    releases more CO2 gas when mixed with acid, worsening the bloat.'
  correct_answer: a
- id: vet-d1-q5
  type: FILL_BLANK
  prompt: 'To safely restrain a standing cow and prevent it from kicking backward during a clinical examination,
    an assistant can perform the tail ___, grasping the tail base and pushing it vertically upward over
    the spine.

    '
  xp_reward: 50
  correct_answer: jack
  explanation: 'The ''tail jack'' flexes the sacrococcygeal joint, immobilizing the pelvic hindquarters
    and preventing kicking without causing pain or injury.

    '
