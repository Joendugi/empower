briefing: 'Commercial fish feeds account for 60 to 70% of total aquaculture production costs. For smallholder
  and off-grid farmers, importing pelleted commercial feed at US\$700–900 per tonne is economically unsustainable.
  On-farm compounded feed, using locally available high-protein agricultural by-products, can cut feed
  costs by 40 to 60% without sacrificing growth performance. This lesson covers fish nutritional physiology,
  amino acid requirements, the Pearson Square balancing method for two-ingredient feed blending, Black
  Soldier Fly (BSF) larvae production as a self-replicating local protein source, and the mechanics of
  low-cost farm-scale feed milling and pellet drying.

  '
outline: 'Fish nutritional physiology: amino acids as the primary energy source in carnivores and omnivores
  (unlike ruminants, fish preferentially oxidize protein for energy); crude protein (CP) requirements:
  fry 40–45%, grow-out Tilapia 25–30%, grow-out Catfish 35–40%; the concept of digestible protein and
  apparent digestibility coefficients (ADC); essential amino acids (lysine, methionine, threonine) and
  their primary dietary sources; key local feed ingredients: soybean meal (44–48% CP), fishmeal (60–72%
  CP, avoid un-dried locally produced meal), sunflower seedcake (34–38% CP), blood meal (80% CP, use at
  max 5% of diet), rice bran (12–14% CP, maximum 30% inclusion), maize grain (8–10% CP, energy carrier),
  BSF prepupae (Hermetia illucens: 40–44% CP DM, 30–36% crude fat); the Pearson Square method for balancing
  two-ingredient blends to a target protein level; farm-scale feed production steps: weighing, grinding
  to < 1 mm particle size, mixing, steam pelleting or ring-die extrusion, and solar-tray drying of finished
  pellets.

  '
content_md: "## Fish Nutritional Physiology: Why Protein Matters Most\n\nUnlike cattle and pigs that primarily\
  \ oxidize carbohydrates for energy, carnivorous and\nomnivorous fish evolved in protein-rich aquatic\
  \ environments; they preferentially catabolize\namino acids as their primary metabolic fuel. This means:\n\
  1. **Protein Demands Are High**: Grow-out Tilapia require 26–32% crude protein (CP) in the diet; catfish\
  \ fry require 45%+ CP.\n2. **Carbohydrate Utilization Is Poor**: Fish lack the pancreatic amylase enzyme\
  \ activity needed for efficient starch digestion. Diet starch content should remain below 20%.\n3. **Lipid\
  \ Quality Matters**: Polyunsaturated fatty acids (PUFAs) — specifically n-3 PUFA series (EPA and DHA)\
  \ — are essential for fish immune function, growth, and flesh quality.\n\n```\nCRUDE PROTEIN (CP) TARGET\
  \ BY SPECIES AND LIFE STAGE\n┌─────────────────────────────┬──────────────┬───────────────┬────────────────┐\n\
  │ Life Stage                  │ Tilapia (CP) │ Catfish (CP)  │ Carps (CP)     │\n├─────────────────────────────┼──────────────┼───────────────┼────────────────┤\n\
  │ Larvae / Yolk-Sac Fry       │ —            │ —             │ —              │\n│ First-Feeding to\
  \ 1 g        │ 45–48 %      │ 45–50 %       │ 40–45 %        │\n│ Fingerling (1–20 g)         │ 35–40\
  \ %      │ 40–45 %       │ 35–40 %        │\n│ Juvenile (20–100 g)         │ 28–35 %      │ 35–40 %\
  \       │ 30–35 %        │\n│ Sub-Adult Grow-Out          │ 25–30 %      │ 32–38 %       │ 25–32 % \
  \       │\n│ Broodstock Conditioning     │ 35–40 %      │ 38–42 %       │ 35–40 %        │\n└─────────────────────────────┴──────────────┴───────────────┴────────────────┘\n\
  ```\n\n---\n\n## Common Feed Ingredients & Composition Table\n\n| Ingredient | Crude Protein (%) | Crude\
  \ Fat (%) | Key Notes |\n| :--- | :---: | :---: | :--- |\n| Fishmeal (sun-dried) | 60–72 | 8–12 | Best\
  \ protein; expensive; risk of rancidity |\n| Soybean Meal (solvent) | 44–48 | 1–2 | Excellent plant\
  \ protein; anti-nutritional factors destroyed by heat |\n| Blood Meal (spray-dried) | 78–85 | 0.5 |\
  \ Max 5% inclusion; dark pellets; poor palatability |\n| Sunflower Seedcake | 34–38 | 2–5 | Good local\
  \ availability; low in lysine |\n| Groundnut Cake | 42–48 | 8–12 | Risk of aflatoxin if poorly stored;\
  \ heat at 100°C for 15 min |\n| BSF Larvae (*Hermetia*) | 40–44 | 28–36 | Self-replicating from organic\
  \ waste; excellent palatability |\n| Maize Grain (ground) | 8–10 | 3–5 | Energy carrier; cheap filler;\
  \ max 30% inclusion |\n| Rice Bran | 12–14 | 12–16 | High fat prone to rancidity; max 20–25% inclusion\
  \ |\n\n---\n\n## The Pearson Square Method: On-Farm Feed Balancing\n\nThe Pearson Square allows a farmer\
  \ to determine the exact proportion of two ingredients\nneeded to reach a target protein level.\n\n\
  ### Worked Example: Targeting 32% CP Grow-Out Catfish Feed Using Soybean Meal + Maize\n\n**Ingredients**:\
  \ Soybean Meal (45% CP) and Maize (9% CP). **Target**: 32% CP blend.\n\n```\nPEARSON SQUARE DIAGRAM\n\
  \n      Soybean Meal (45% CP) ─────────────────────────── 23 parts\n                       \\      \
  \                        /\n                        \\        Target: 32%         /\n              \
  \           \\                          /\n      Maize (9% CP)  ─────────────────────────────── 13 parts\n\
  \                                                    ─────────\n                                   \
  \             Total: 36 parts\n```\n\n**Step-by-Step Calculation:**\n1. Place the higher-CP ingredient\
  \ (SBM, 45%) in the **top-left corner**.\n2. Place the lower-CP ingredient (Maize, 9%) in the **bottom-left\
  \ corner**.\n3. Place the **Target CP value (32%)** in the center.\n4. **Top-right corner**: Target\
  \ − Lower ingredient: 32 − 9 = **23 parts SBM**\n5. **Bottom-right corner**: Higher ingredient − Target:\
  \ 45 − 32 = **13 parts Maize**\n6. **Total parts**: 23 + 13 = **36 total parts**\n7. **Proportions**:\n\
  \   * Soybean Meal: 23/36 = **63.9% of diet**\n   * Maize: 13/36 = **36.1% of diet**\n\n**Verification**:\
  \ (0.639 × 45) + (0.361 × 9) = 28.75 + 3.25 = **32.0% CP** ✓\n\n---\n\n## Black Soldier Fly (BSF) Larvae:\
  \ Self-Replicating Protein\n\n*Hermetia illucens* is arguably the most powerful decentralized protein\
  \ production system\navailable to off-grid aquaculture farmers. A BSF colony converts organic waste\
  \ (kitchen\nscraps, restaurant refuse, agricultural by-products) directly into high-grade protein with\n\
  negligible land and water requirements.\n\n```\n                      BSF LIFE CYCLE FOR FARMER-CONTROLLED\
  \ PRODUCTION\n           ┌──────────────────────────────────────────────────────┐\n           │    \
  \                                                  ↑\n       Eggs (4 days)                         \
  \             Adult Fly (5-7 days)\n           ↓                                                   \
  \   │\n      Tiny Larvae                                         Pupation (14 days)\n       (hatches)\
  \                                                  │\n           ↓                                 \
  \                     │\n    Growth on Waste ──────────────────────────► Pre-Pupae (14-18 days)\n  \
  \    (10-12 days)             HARVEST            (45% CP, fat: 36%)\n          │                   WINDOW\
  \   ↙\n          │               (Migrating to Pupate → Naturally Walk into Collection Bucket!)\n  \
  \        ↓\n Processing: Fresh Feed / Sun-Dry / Pellet Inclusion\n```\n\n**BSF Production Metrics (per\
  \ square metre of substrate cage):**\n* Feed waste input: 1.0 to 2.0 kg/day of organic kitchen scraps\
  \ or brewery waste.\n* Larvae biomass yield: 60 to 100 grams fresh-weight prepupae per kg of waste substrate.\n\
  * Protein content of sun-dried prepupae: 40–44% CP on dry-matter basis.\n* Water requirement: Near zero\
  \ (larvae moisture from waste substrate itself).\n\n---\n\n## On-Farm Feed Milling Process\n\n```\n\
  FARM-SCALE FEED PRODUCTION FLOW\n[Raw Ingredients Sourced] → [Dry Ingredients Weighed in Batch] → [Grind\
  \ to < 1.0 mm]\n       ↓                                                                     ↓\n[Wet\
  \ Binders Added: 1% CMC, or fish oil + water] ←─────────────── [Batch Blended 10 min]\n       ↓\n[PELLET\
  \ FORMATION OPTIONS]\n       ├── RING-DIE PELLET MILL (Commercial): 4–6 mm diameter cylindrical pellets\n\
  \       ├── FLAT-DIE HAND PELLET PRESS (Artisanal): Manual pressing through 4 mm holes\n       └── WET\
  \ EXTRUSION (Simple): Force moist dough through syringe barrel or garden pipe fittings\n       ↓\n[Solar-Tray\
  \ Drying on wire mesh screens (8–12 hrs sun drying to < 12% moisture)]\n       ↓\n[Quality Check: Pellet\
  \ Water Stability Test — sink test; good pellet holds form 20 min submerged]\n       ↓\n[Store in sealed\
  \ grain bags or airtight drums in cool dark area; max 4 weeks for high-fat diets]\n```\n\n**Critical\
  \ Quality Parameters:**\n* **Particle Size (< 1 mm)**: Coarse grinding reduces surface area available\
  \ for binding; pellets\n  will crumble and disintegrate in 2 to 5 minutes of submersion, creating turbidity\
  \ and bacterial\n  bloom.\n* **Moisture (< 12%)**: Inadequate drying triggers explosive mold growth\
  \ (*Aspergillus*) within 72 hours.\n* **Pellet Stability Test**: Drop 5 pellets into a container of\
  \ water. After 20 minutes, remove\n  and inspect. A passing pellet must remain 80% intact. A crumbling\
  \ pellet means insufficient binder\n  or over-coarse grind.\n"
exercises:
- id: aqua-d3-q1
  type: MULTIPLE_CHOICE
  prompt: 'Using the Pearson Square method, a fish farmer wants to formulate a catfish grow-out feed reaching
    a target of 35% Crude Protein (CP), using Fishmeal (65% CP) and Rice Bran (13% CP). What is the correct
    ratio of Fishmeal to Rice Bran in the blend?

    '
  xp_reward: 50
  options:
  - id: a
    text: '22 parts Fishmeal : 30 parts Rice Bran (ratio 42% Fishmeal and 58% Rice Bran)'
  - id: b
    text: 50% Fishmeal and 50% Rice Bran by equal weight
  - id: c
    text: 35 parts Fishmeal to 65 parts Rice Bran
  - id: d
    text: Fishmeal and Rice Bran cannot be blended because their proteins are biologically incompatible
  explanation: 'Using the Pearson Square: Top-right (Fishmeal parts) = Target − Rice Bran = 35 − 13 =
    22 parts. Bottom-right (Rice Bran parts) = Fishmeal − Target = 65 − 35 = 30 parts. Total = 52 parts.
    Fishmeal = 22/52 = 42.3%; Rice Bran = 30/52 = 57.7%. Verification: (0.423 × 65) + (0.577 × 13) = 27.5
    + 7.5 = 35.0% CP. ✓


    Why the other options are wrong: 50/50 equal blend would yield (0.5 × 65) + (0.5 × 13) = 32.5 + 6.5
    = 39.0% CP, not 35%. This proportion gives approximately (0.35 × 65) + (0.65 × 13) = 22.75 + 8.45
    = 31.2% CP. Fishmeal and rice bran are routinely combined in fish diets worldwide.'
  correct_answer: a
- id: aqua-d3-q2
  type: FILL_BLANK
  prompt: 'Black Soldier Fly (Hermetia illucens) prepupae harvested at the migration stage provide approximately
    ___ to 44% crude protein and 28 to 36% crude fat on a dry-matter basis, making them a self-replicating,
    zero-water-requirement local protein source perfectly suited for off-grid aquaculture feed supplementation.

    '
  xp_reward: 50
  correct_answer: '40'
  explanation: 'Sun-dried BSF prepupae contain 40 to 44% crude protein and 28 to 36% crude fat on a dry-matter
    basis, comparable in protein quality to conventional fishmeal.

    '
- id: aqua-d3-q3
  type: MATCH_PAIRS
  prompt: Match each feed ingredient to its most important inclusion limitation or practical risk in fish
    diets.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Blood Meal (80% CP)
    right:
      id: r-96d5e6
      text: Limits to 5% maximum inclusion; dark coloration and poor palatability reduce feed intake
  - left:
      id: l2
      text: Rice Bran (13% CP)
    right:
      id: r-00eb55
      text: High oil fraction rapidly oxidizes causing rancidity; maximum 20-25% inclusion
  - left:
      id: l3
      text: Groundnut Cake (45% CP)
    right:
      id: r-190bb3
      text: Must be heat-treated at 100°C for 15 minutes to destroy aflatoxin contamination risk
  - left:
      id: l4
      text: Raw Soybean Meal
    right:
      id: r-18ad24
      text: Contains trypsin inhibitors and lectins; must be heat-processed to destroy anti-nutritional
        factors
  correct_answer:
  - l1=r-96d5e6
  - l2=r-00eb55
  - l3=r-190bb3
  - l4=r-18ad24
  explanation: 'Blood meal limits palatability; rice bran goes rancid rapidly; groundnut cake requires
    aflatoxin control by heating; raw soybean contains anti-nutritional factors destroyed by heat.

    '
- id: aqua-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'What simple standard field test should a fish farmer conduct to confirm that freshly produced
    on-farm feed pellets are of adequate quality before stocking them in the fish pond?

    '
  xp_reward: 50
  options:
  - id: a
    text: Smell the pellets; if they smell of fresh fish, they contain enough protein for good growth
  - id: b
    text: Count the number of pellets that sink versus float; all good pellets must sink immediately
  - id: c
    text: The 20-minute water stability submersion test — drop 5 pellets into pond water; passing pellets
      must remain at least 80% structurally intact after 20 minutes underwater
  - id: d
    text: Crush a pellet between fingers; a quality pellet shatters into uniform powder
  explanation: 'Fish require 5 to 15 minutes to locate and consume pellets after broadcasting. Pellets
    that disintegrate within 2 to 5 minutes leach nutrients into the water, causing bacterial blooms,
    zero-growth of fish, and toxic ammonia spikes.


    Why the other options are wrong: Aroma is not a reliable indicator of nutritional balance or pellet
    binding quality. Floating pellets are beneficial for many species (monitoring feed intake); sinking
    does not determine protein level. A quality pellet should resist crushing and hold shape. Shattering
    into powder indicates poor binding.'
  correct_answer: c
- id: aqua-d3-q5
  type: FILL_BLANK
  prompt: 'To prevent explosive mold growth (particularly Aspergillus spp.) and maintain safe feed quality
    during storage, farm-produced fish feed pellets must be solar-dried until their internal moisture
    content is below ___ percent, then stored sealed in cool, dark conditions for a maximum of 4 weeks
    for high-fat diets.

    '
  xp_reward: 50
  correct_answer: '12'
  explanation: 'Fish feed moisture content must be below 12% during storage. Above this threshold, mold
    fungi proliferate rapidly within 48 to 72 hours, producing mycotoxins that suppress fish immune systems
    and cause mortalities.

    '
