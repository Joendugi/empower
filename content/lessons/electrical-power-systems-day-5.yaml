  - l2=r-027702
  - l3=r-fcc149
  - l4=r-71083f
  explanation: 'Governor droop balances kW; lamps confirm synchronism; UFLS prevents blackout cascades;
    ELC stabilizes run-of-river hydro frequency without throttles.

    '
- id: elec-d5-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why must run-of-river micro-hydro turbine generators use an Electronic Load Controller (ELC)
    with a ballast dump load rather than an automotive-style throttle to regulate grid frequency?

    '
  xp_reward: 50
  options:
  - id: a
    text: Because hydro turbines cannot generate 50 Hz electricity directly
  - id: b
    text: Rapidly closing a water valve to drop turbine power creates catastrophic hydraulic water hammer
      pressures that burst penstocks; the ELC keeps water flow constant while dynamically shunting electrical
      power
  - id: c
    text: Because resistive dump loads make the water cleaner
  - id: d
    text: To recharge the mechanical governor springs
  explanation: 'Water has immense mass and momentum. Snapping a spear valve shut sends high-pressure shockwaves
    (water hammer) that shatter PVC or steel pipes. An ELC diverts surplus electricity into water-heating
    dump loads in milliseconds, keeping water flow and generator frequency rock-steady.


    Why the other options are wrong: Hydro turbines generate standard 50 Hz power via standard synchronous
    alternators. Dump loads dissipate electrical heat; they are not water filters. ELCs are solid-state
    electronic controllers, not mechanical springs.'
  correct_answer: b
