      text: Automatically disconnects non-essential loads when frequency drops below 49 Hz
  - left:
      id: l4
      text: Electronic Load Controller (ELC)
    right:
      id: r-71083f
      text: Shunts excess micro-hydro power to dump load heaters to maintain 50 Hz speed
  correct_answer:
