id: "plumbing-rainwater-lesson"
course_id: "plumbing"
title: "Week 4 — Rainwater harvesting: gutters, downpipes, and test"
title_sw: "Wiki 4 — Kuvuna maji ya mvua"
briefing: "CDACC plumbing includes install rainwater harvesting: interpret drawings, quantify goods, mount, and test. Gutters are troughs under the eaves. Materials: PVC, galvanised, aluminium, GRP. Accessories: running outlets, stop ends, unions, angles (90°/135°), hopper heads, downpipes, shoes, and brackets. Size from roof area and a rainfall intensity (teaching figure often ~0.0208 L/s/m² — use the figure your college cites from BS EN 12056-3).\n\nFall: gutters must fall toward the outlet (typically around 1:350 to 1:600 as taught — follow the manufacturer). Backfall ponds water and breeds mosquitoes. Brackets at specified centres; do not hang a 6 m PVC gutter on two nails. Expansion: plastics move — use union details that allow it. Isolation from sewage: rainwater is not connected into a foul stack without an approved design.\n\nMounting: PPE (height work), fascia sound, outlets cut, downpipes plumb, shoes to a gully or tank inlet with a leaf screen. First-flush diverters improve tank water. Tanks: opaque, covered, mosquito-proof, on a level plinth, overflow arranged so it does not undermine the foundation.\n\nTest: water or hose test for leaks at unions, overflow operation, and that the gully/tank receives flow. Housekeeping: offcuts, sealant, and safe ladder work. Portfolio: take-off list plus a photo of a falling gutter and a test note."
briefing_sw: "Gutter, downpipe, outlet, stop end. Kadiria kutoka eneo la paa. Fall kuelekea outlet. PVC inapanuka. Tangi funika ili mbu wasizae. Jaribu uvujaji. Usichanganye maji ya mvua na soil stack ovyo."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/04/4"
exam_domain: "Rainwater harvesting"
exercises:
  - id: "plumbing-rainwater-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Gutters that pond water usually have:"
    options:
      - id: "a"
        text: "Too much fall toward the outlet"
      - id: "b"
        text: "Insufficient or reverse fall"
      - id: "c"
        text: "Too many brackets"
      - id: "d"
        text: "A correct first-flush"
    correct_answer: "b"
    hint: "Gradient."
    explanation: "Set fall with a line and spirit level / laser as taught."
    xp_reward: 50
  - id: "plumbing-rainwater-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A rainwater shoe typically:"
    options:
      - id: "a"
        text: "Joins two gutters at 90°"
      - id: "b"
        text: "Turns the downpipe discharge into a gully or channel"
      - id: "c"
        text: "Is a type of trap for soil stacks only"
      - id: "d"
        text: "Replaces the fascia"
    correct_answer: "b"
    hint: "Foot of the downpipe."
    explanation: "Access for cleansing is part of the fitting’s job."
    xp_reward: 50
  - id: "plumbing-rainwater-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "An uncovered rainwater tank in the tropics is a health issue mainly because of:"
    options:
      - id: "a"
        text: "Voltage drop"
      - id: "b"
        text: "Mosquito breeding and contamination"
      - id: "c"
        text: "Ohm’s law"
      - id: "d"
        text: "Too much fall"
    correct_answer: "b"
    hint: "Vector control."
    explanation: "Lids, screens, and overflow details are part of the unit."
    xp_reward: 50
  - id: "plumbing-rainwater-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Quantifying rainwater goods should start from:"
    options:
      - id: "a"
        text: "A random shop bundle"
      - id: "b"
        text: "The drawing: roof area, runs, outlets, and specified materials"
      - id: "c"
        text: "The cheapest offcut in the yard"
      - id: "d"
        text: "Soil-stack diameter only"
    correct_answer: "b"
    hint: "Take-off."
    explanation: "CDACC lists quantifying goods as a learning outcome."
    xp_reward: 50
  - id: "plumbing-rainwater-fb1"
    type: "FILL_BLANK"
    prompt: "The shallow trough fixed under the eaves to collect roof water is a ___."
    correct_answer: "gutter"
    hint: "Not the downpipe."
    explanation: "Gutters collect; downpipes convey; tanks store."
    xp_reward: 50
  - id: "plumbing-rainwater-scenario"
    type: "SCENARIO"
    prompt: "PVC gutter installed dead level “for looks” holds water and mosquitoes. Fix?"
    options:
      - id: "a"
        text: "Add insecticide only"
      - id: "b"
        text: "Reset brackets to specified fall, check outlets, and prove with a hose test"
      - id: "c"
        text: "Connect it into the WC pan"
      - id: "d"
        text: "Paint the water black"
    correct_answer: "b"
    hint: "Fall plus test."
    explanation: "Rainwater harvesting is a tested installation, not a decoration."
    xp_reward: 60
