id: "body-works-paint-lesson"
course_id: "body-works"
title: "Masking, primer, and spray-booth rules"
title_sw: "Masking, primer, na booth"
briefing: "Isocyanate 2K paints need a specified respirator and booth practice. A dust mask is for dust, not vapour. Read the SDS. Mix by ratio, strain, and apply flash-off times. Mask adjacent panels properly; overspray on glass and rubber is extra labour.\n\nDegrease before primer, and do not touch the keyed surface with bare oily hands. Build coats. Runs mean too much material or too close a gun.\n\nThinners are hazardous waste, not sink waste. Gun wash in the dedicated equipment. No smoking, no grinding next to wet paint."
briefing_sw: "Rangi ya 2K inahitaji respirator na booth. Soma SDS. Mask panels. Degrease kabla ya primer. Thinners si maji ya kuzama."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/ABR/CR/02/5"
exam_domain: "Paint safety"
exercises:
  - id: "body-works-paint-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why is a dust mask often inadequate for 2K spraying?"
    options:
      - id: "a"
        text: "Wrong colour"
      - id: "b"
        text: "Vapours (e.g. isocyanates) need a specified respirator and booth"
      - id: "c"
        text: "NITA bans all spray"
      - id: "d"
        text: "Cars do not need primer"
    correct_answer: "b"
    hint: "Vapour vs dust."
    explanation: "Follow SDS and college booth rules."
    xp_reward: 50
  - id: "body-works-paint-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Runs in paint usually mean:"
    options:
      - id: "a"
        text: "Too little material"
      - id: "b"
        text: "Too much material, too close, or insufficient flash-off"
      - id: "c"
        text: "Perfect technique"
      - id: "d"
        text: "The compressor is too dry"
    correct_answer: "b"
    hint: "Film thickness."
    explanation: "Gun distance, speed, and coats are a skill, not luck."
    xp_reward: 50
  - id: "body-works-paint-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Used thinners should go:"
    options:
      - id: "a"
        text: "Down the rainwater gully"
      - id: "b"
        text: "Into labelled hazardous-waste containers as instructed"
      - id: "c"
        text: "Into the tea urn"
      - id: "d"
        text: "On the canteen floor for shine"
    correct_answer: "b"
    hint: "Environment and fire."
    explanation: "Solvents are controlled waste."
    xp_reward: 50
  - id: "body-works-paint-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Touching a degreased panel with bare hands:"
    options:
      - id: "a"
        text: "Improves adhesion"
      - id: "b"
        text: "Can deposit oil that causes fish-eyes or poor bond"
      - id: "c"
        text: "Is required by NITA"
      - id: "d"
        text: "Replaces masking"
    correct_answer: "b"
    hint: "Skin oil."
    explanation: "Handle edges or wear gloves after degrease."
    xp_reward: 50
  - id: "body-works-paint-fb1"
    type: "FILL_BLANK"
    prompt: "The enclosed extracted room used for spraying is the spray ___."
    correct_answer: "booth"
    hint: "Not the welding bay."
    explanation: "Booths control overspray, fire, and exposure."
    xp_reward: 50
  - id: "body-works-paint-scenario"
    type: "SCENARIO"
    prompt: "A trainee wants to spray in the open workshop next to the welding bay “to save time”. You say:"
    options:
      - id: "a"
        text: "Approve — overspray helps rust"
      - id: "b"
        text: "Stop: fire, fume, and contamination; use the booth and isolate ignition sources"
      - id: "c"
        text: "Turn on grinders for airflow"
      - id: "d"
        text: "Spray toward the stores"
    correct_answer: "b"
    hint: "Sparks plus solvent vapour."
    explanation: "Hot work and spraying are separated for a reason."
    xp_reward: 60
