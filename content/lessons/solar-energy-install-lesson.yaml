id: "solar-energy-install-lesson"
course_id: "solar-energy"
title: "Week 2 — DC safety, batteries, commissioning, and maintenance"
title_sw: "Wiki 2 — Usalama wa DC, betri, commissioning"
briefing: "Solar DC arcs do not pass through zero like AC and can persist. Cover modules or isolate strings using rated devices before working. Use DC-rated isolators, fuses, connectors, and cable. Never mix incompatible “MC4-style” brands unless the manufacturer approves them. Crimp with the correct tool and pull-test.\n\nBatteries store dangerous energy. Match chemistry and BMS settings; fuse close to the positive terminal; ventilate lead-acid banks; keep lithium batteries within manufacturer temperature limits. Torque lugs to specification and record it. Commission in the manufacturer’s order: polarity, insulation where required, open-circuit voltage, battery voltage, inverter settings, controlled load test, and monitoring.\n\nHandover includes shutdown/startup, expected daily limits, cleaning without standing on panels, and an emergency contact. Maintenance compares current output with baseline, checks hot/loose terminals, cleans safely, and records battery health."
briefing_sw: "Wiki 2 — Usalama wa DC, betri, commissioning: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "solar-energy-install-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for solar commissioning?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "solar-energy-install-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that solar commissioning was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "solar-energy-install-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "test"
    hint: "A planned check, not an opinion."
    explanation: "A quality test provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "solar-energy-install-scenario"
    type: "SCENARIO"
    prompt: "During commissioning, a string polarity is reversed and the isolator crackles. What is the correct response?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
