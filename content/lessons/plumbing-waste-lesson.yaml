id: "plumbing-waste-lesson"
course_id: "plumbing"
title: "Traps, waste, and leak diagnosis"
title_sw: "Traps, waste, na uvujaji"
briefing: "A P-trap holds a water seal that blocks sewer gas. A dry trap in a guest bathroom smells like a blocked sewer even when the line is fine. Prime it, then fix evaporation, leaks, or missing venting.\n\nWaste runs need fall (often around 1:40 as a teaching starting point — follow the spec). Backfall holds water and solids. Boss connections into stacks must use the right fittings, not a hole and hope.\n\nDiagnosis: dry the area, use tissue or a dye, pressurise or run water in one fixture at a time. Condensation on a cold pipe is not always a leak. Repair the source, not the ceiling stain.\n\nPPE for sewage: gloves, wash, and keep tools for soil work separate from potable work."
briefing_sw: "P-trap inazuia gesi. Trap kavu hunuka. Waste inahitaji fall. Gundua uvujaji kwa kukausha na kujaribu fixture moja. Usichanganye zana za soil na za maji safi."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/03/5"
exam_domain: "Sanitary & faults"
exercises:
  - id: "plumbing-waste-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "The main purpose of a P-trap under a sink is to:"
    options:
      - id: "a"
        text: "Increase pressure"
      - id: "b"
        text: "Hold a water seal that blocks sewer gas"
      - id: "c"
        text: "Filter fluoride"
      - id: "d"
        text: "Earth the tap"
    correct_answer: "b"
    hint: "Smell prevention."
    explanation: "The seal stops foul air while allowing waste to flow."
    xp_reward: 50
  - id: "plumbing-waste-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A hostel bathroom smells of sewage and the trap is dry. First practical step:"
    options:
      - id: "a"
        text: "Connect waste to the drinking tap"
      - id: "b"
        text: "Pour water to restore the seal, then find why it dried"
      - id: "c"
        text: "Seal the gully with paint"
      - id: "d"
        text: "Ignore it with incense"
    correct_answer: "b"
    hint: "Prime the trap."
    explanation: "Then address leaks, disuse, or venting."
    xp_reward: 50
  - id: "plumbing-waste-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Waste pipes without fall typically:"
    options:
      - id: "a"
        text: "Self-clean better"
      - id: "b"
        text: "Block because solids do not travel"
      - id: "c"
        text: "Become potable"
      - id: "d"
        text: "Need no clips"
    correct_answer: "b"
    hint: "Gravity."
    explanation: "Correct gradient is a design and practical item."
    xp_reward: 50
  - id: "plumbing-waste-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A wet patch on a ceiling under a bathroom might be:"
    options:
      - id: "a"
        text: "Always rain"
      - id: "b"
        text: "A leaking joint, seal, or overflow — test methodically"
      - id: "c"
        text: "Always condensation from the fridge"
      - id: "d"
        text: "Proof the earth is live"
    correct_answer: "b"
    hint: "Evidence."
    explanation: "One stain, many possible sources. Isolate which fixture."
    xp_reward: 50
  - id: "plumbing-waste-fb1"
    type: "FILL_BLANK"
    prompt: "The water held in a trap that blocks foul air is called the water ___."
    correct_answer: "seal"
    hint: "It seals the pipe from the room."
    explanation: "Without a seal, the stack talks to the room."
    xp_reward: 50
  - id: "plumbing-waste-scenario"
    type: "SCENARIO"
    prompt: "You are asked to clear a blocked soil stack with raw chemical while tenants are on the highest floor with open traps. You should:"
    options:
      - id: "a"
        text: "Pour extra acid"
      - id: "b"
        text: "Protect people, use mechanical clearing as trained, and never mix unknown chemicals"
      - id: "c"
        text: "Open the drinking tank into the stack"
      - id: "d"
        text: "Ignore PPE because it is only waste"
    correct_answer: "b"
    hint: "Chemicals plus people."
    explanation: "Caustic plus acid plus methane is how plumbers get hurt. Method and PPE."
    xp_reward: 60
