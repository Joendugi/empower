id: "carpentry-setout-wood-lesson"
course_id: "carpentry"
title: "Measuring, face marks, and hand tools"
title_sw: "Kipimo, face marks, na zana"
briefing: "Joinery is accurate only if every cut is taken from known faces. Mark face side and face edge. Squares sit on those faces. A rod or cutting list beats measuring each piece from the last mistake.\n\nSaws: a sharp saw is safer than a dull one. Support the waste so the last fibre does not splinter. Chisels: two hands, no body behind the point, knockers — not your palm on a stuck mortise in a hurry.\n\nMoisture: wet timber moves after you hang a door. Store stickers, off the ground, as taught. Write the job size after checking the opening, not from the drawing alone if the site is out.\n\nAssessors look at your marks. Faint, confused lines produce confused joints."
briefing_sw: "Weka face side na face edge. Pima mara mbili. Msumeno mkali ni salama. Mbao yenye unyevu inasogea. Alama safi ni sehemu ya alama za mtihani."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/CRP/CR/01/5"
exam_domain: "Setting out"
exercises:
  - id: "carpentry-setout-wood-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why mark a face side and face edge before joints?"
    options:
      - id: "a"
        text: "To decorate the timber"
      - id: "b"
        text: "So all measurements and joints reference the same true faces"
      - id: "c"
        text: "NITA forbids pencils"
      - id: "d"
        text: "It increases moisture"
    correct_answer: "b"
    hint: "A datum for the whole job."
    explanation: "Without reference faces, squares and gauges lie."
    xp_reward: 50
  - id: "carpentry-setout-wood-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A dull handsaw is more dangerous because:"
    options:
      - id: "a"
        text: "It is lighter"
      - id: "b"
        text: "You force it and it jumps"
      - id: "c"
        text: "It vaporizes timber"
      - id: "d"
        text: "CDACC bans sharp tools"
    correct_answer: "b"
    hint: "Force."
    explanation: "Sharpen or replace. Do not muscle a blunt saw."
    xp_reward: 50
  - id: "carpentry-setout-wood-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "You should take the hanging size of a door from:"
    options:
      - id: "a"
        text: "The internet"
      - id: "b"
        text: "The actual opening plus specified clearances"
      - id: "c"
        text: "A random offcut"
      - id: "d"
        text: "The previous site only"
    correct_answer: "b"
    hint: "Openings are never perfect."
    explanation: "Measure the hole you have."
    xp_reward: 50
  - id: "carpentry-setout-wood-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Chiselling toward your body is:"
    options:
      - id: "a"
        text: "Faster"
      - id: "b"
        text: "A common way to get cut — work with the body out of line"
      - id: "c"
        text: "Required for dovetails"
      - id: "d"
        text: "A face mark"
    correct_answer: "b"
    hint: "If it slips."
    explanation: "Clamp, two hands, think where the edge goes."
    xp_reward: 50
  - id: "carpentry-setout-wood-fb1"
    type: "FILL_BLANK"
    prompt: "The marked good wide face used as a reference is the face ___."
    correct_answer: "side"
    hint: "Face side and face edge."
    explanation: "Face side is the datum surface."
    xp_reward: 50
  - id: "carpentry-setout-wood-scenario"
    type: "SCENARIO"
    prompt: "Your cutting list was copied from a drawing but the site opening is 12 mm narrower. You already cut. What now?"
    options:
      - id: "a"
        text: "Force it with a bigger hammer"
      - id: "b"
        text: "Remake to the measured opening; forcing splits jambs"
      - id: "c"
        text: "Plane the masonry with a tenon saw"
      - id: "d"
        text: "Ignore clearances forever"
    correct_answer: "b"
    hint: "Site wins."
    explanation: "Measure openings. Drawings are a start."
    xp_reward: 60
