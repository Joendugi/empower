briefing: 'Before refrigeration, salt and smoke preserved the meat and fish that fed
  civilisations across millennia. Combined correctly, they reduce water activity,
  inhibit enzymatic spoilage, and deposit antimicrobial phenolic compounds from smoke.
  This day teaches the biochemistry and practical protocols for dry salting, brine
  curing, and hot/cold smoking — applicable to goat, beef, fish, and even hides for
  leather.

  '
briefing_sw: 'Kabla ya jokofu, chumvi na moshi vilihifadhi nyama na samaki ambavyo
  vililisha ustaarabu kwa milenia. Ikijumuishwa vizuri, hupunguza shughuli ya maji,
  kuzuia uharibifu wa enzymes, na kuweka misombo ya antimicrobial kutoka kwa moshi.

  '
outline: '1. Mechanisms: Aᵥ reduction by salt, phenolic deposition by smoke

  2. Dry salting vs. wet brine curing — applications and ratios

  3. Nitrite curing (sodium nitrate/nitrite) — the botulism connection

  4. Hot smoking: temperature, time, and wood species

  5. Cold smoking: temperature control and extended shelf life

  6. Building a field smokehouse from clay, bricks, or sheet metal

  7. Charqui / biltong / nyama choma wa kukaushwa: combined salt-dry method

  8. Rancidity prevention: antioxidants and packaging'
content_md: "## How Salt Preserves\n\nSalt (NaCl) preserves by **osmotic dehydration**:\
  \ water moves from the high-water\nfood cells to the high-salt environment, reducing\
  \ Aᵥ. In parallel, Na⁺ and Cl⁻ ions\ndirectly inhibit many bacterial enzymes.\n\n\
  **Salt concentration effects on microorganisms:**\n\n| NaCl % in tissue | Effect\
  \ |\n|-----------------|--------|\n| 1–2 % | Minimal; only slightly slows growth\
  \ |\n| 6–10 % | Inhibits most gram-negative pathogens (*Salmonella*, *E. coli*)\
  \ |\n| > 10 % | Inhibits all non-halophilic bacteria |\n| 17–26 % (saturation) |\
  \ Only extreme halophiles survive — full preservation |\n\nCombined with drying\
  \ (↓ Aᵥ) and smoking (phenolics), even moderate salt levels\n(6–10 %) achieve safe,\
  \ shelf-stable products.\n\n## Dry Salting Protocol\n\nUsed for: beef brisket, goat\
  \ legs, fish fillets, nyama ya kukaushwa.\n\n**Ratio**: 250–300 g NaCl per 1 kg\
  \ fresh meat.\n\n### Step-by-Step\n1. **Trim** visible fat to < 5 mm (fat slows\
  \ salt penetration and turns rancid).\n2. **Score** thick muscles every 2 cm — allows\
  \ salt to reach the centre faster.\n3. **Rub** the full salt dose evenly over all\
  \ surfaces; work it into the scores.\n4. Place meat on a rack over a tray (do not\
  \ sit in the pooling brine that drains out).\n5. Refrigerate (4 °C) or keep in a\
  \ cool shade (< 22 °C) for:\n   - Thin cuts (< 2 cm): 12–18 hours\n   - Thick cuts\
  \ (3–5 cm): 24–48 hours\n   - Large pieces (leg of goat, brisket): 3–5 days\n6.\
  \ Rinse surface salt. Hang to air-dry 2–4 hours before smoking or sun-drying.\n\n\
  ## Wet Brine Curing\n\nUsed for: whole fish, poultry, large muscle meats.\n\n**Brine\
  \ ratios:**\n| Application | NaCl % (w/v) | Immersion time |\n|-------------|-------------|----------------|\n\
  | Light fish (omena, tilapia) | 10–15 % | 1–2 hours |\n| Whole chicken | 5–8 % |\
  \ 4–8 hours |\n| Pork/beef muscle | 8–12 % | 12–24 hours per 2.5 cm thickness |\n\
  \n**Brine calculation example** (10 %, 5 L):\n- 500 g NaCl dissolved in 5 L water\n\
  - Submerge meat fully; use a weight to keep it below brine surface\n- Brine penetrates\
  \ at ~ 1 cm per 8 hours in beef; faster in fish\n\nAlways brine under refrigeration\
  \ or in a cool place (< 15 °C). Warm brine is a\ngrowth medium for Clostridium until\
  \ salt penetrates.\n\n## Nitrite Curing: Why It Matters\n\nFor **cured products\
  \ kept at room temperature** (long-term storage without\nrefrigeration), salt alone\
  \ does not protect against *Clostridium botulinum* in\nthick, anaerobic meat environments.\
  \ Nitrite (NO₂⁻) does:\n\n- Reacts with haeme proteins → pink colour of cured meat\
  \ (nitrosylmyoglobin)\n- Directly inhibits C. botulinum vegetative cells and delays\
  \ spore germination\n- Standard: 100–120 ppm NO₂⁻ in finished meat product (equivalent\
  \ to adding\n  curing salt / Prague Powder #1 at 2.5 g per 1 kg meat)\n\n**Prague\
  \ Powder #1** (sodium nitrite 6.25 % + NaCl 93.75 %) is available from\nNairobi\
  \ butchery supply shops; it is dyed pink to prevent confusion with table salt.\n\
  \n**Never exceed 120 ppm NO₂⁻** — excess nitrite is toxic. Weigh precisely; do not\n\
  estimate. At correct levels, cured products are safe and have been used for centuries.\n\
  \n*For simple field preservation without specialist chemicals: use dry salting +\
  \ smoking\n(hot smoke at 70 °C for ≥ 30 minutes) as an equally effective alternative.*\n\
  \n## Hot Smoking\n\nHot smoking cooks and preserves simultaneously. Internal meat\
  \ temperature must reach:\n- **Fish**: 63 °C for 15 minutes (or 70 °C for 2 minutes)\n\
  - **Poultry**: 74 °C throughout\n- **Beef/goat**: 63 °C for 15 minutes\n\nUse a\
  \ probe thermometer (KSh 400–800).\n\n**Smokehouse temperatures**: 70–90 °C chamber\
  \ temperature; smoking time 2–6 hours\ndepending on product thickness.\n\n**Wood\
  \ species for smoking (Kenya):**\n\n| Wood | Smoke character | Suitable for |\n\
  |------|----------------|--------------|\n| Acacia (*Acacia mearnsii*) | Strong,\
  \ pungent — use sparingly | Red meats, wild game |\n| Guava (*Psidium guajava*)\
  \ | Mild, fruity, sweet | Fish, poultry, sausage |\n| Mango wood | Slightly fruity,\
  \ mild | Fish, chicken |\n| Olive (*Olea africana*) | Clean, aromatic, classic |\
  \ All meats, mursik gourd |\n| Eucalyptus | **Avoid** — releases terpenes and resins;\
  \ toxic compounds in smoke |  |\n\nUse dry (not green) wood. Green wood produces\
  \ too much steam and insufficient\nantimicrobial phenolics.\n\n## Building a Field\
  \ Smokehouse\n\n### Option A: Clay Pot Smoker (single batch, 5–10 kg)\n1. Large\
  \ clay pot (sufuria ya udongo) on three stones over a small fire.\n2. Suspend fish/meat\
  \ on a wire rack inside the pot.\n3. Lid loosely with a plate, leaving 2–3 cm gap\
  \ for smoke exit.\n4. Smoke 2–4 hours with hardwood chips scattered over low coals.\n\
  5. Check internal temperature with a probe.\n\n### Option B: Barrel Smoker (10–30\
  \ kg, community scale)\n1. 200-litre steel drum (oil drum, thoroughly cleaned —\
  \ 3× caustic soda wash + rinse).\n2. Cut a 20 cm × 20 cm door at the base for fuel\
  \ access.\n3. Weld or bolt wire mesh shelves inside at 30 cm intervals.\n4. Weld\
  \ or bolt a chimney tube (10 cm diameter, 40 cm long) at the top.\n5. Fire box below;\
  \ product racks above; smoke rises through the drum.\n6. Adjust temperature by controlling\
  \ fuel and chimney draft (partially cover chimney\n   with a tin lid to reduce draft\
  \ and lower temperature).\n\n### Option C: Clay Brick Smokehouse (permanent, 50–200\
  \ kg)\n- Simple single-chamber design: fire pit at one end, smoking chamber above,\
  \ chimney at far end\n- Cold smoking (15–30 °C chamber temperature): fire pit separated\
  \ by 2–3 m underground flue\n  so only cool smoke enters the chamber\n- Hot smoking:\
  \ fire pit directly below the chamber\n- This is the design used by commercial smoked\
  \ fish processors on Lake Victoria shores\n\n## Charqui / Biltong: Combined Salt-Dry\
  \ Method\n\n**No smoke required.** The combined effect of salt (10–12 % surface\
  \ concentration)\nand air-drying to < 20 % moisture produces shelf-stable meat.\n\
  \n### Biltong Protocol (goat / beef)\n1. Slice with the grain into strips 2–3 cm\
  \ thick, 3–5 cm wide, any length.\n2. Dip briefly in brown vinegar (5 % acetic acid)\
  \ — surface acidification inhibits\n   initial surface bacteria and adds flavour.\n\
  3. Sprinkle with dry spice mix: 30 g NaCl + 10 g coarsely ground coriander seed\
  \ +\n   5 g black pepper per kg meat.\n4. Layer strips in a container, meat to meat;\
  \ cover; refrigerate 12–24 hours.\n5. Hang on S-hooks in a well-ventilated, insect-proofed\
  \ area (muslin-covered frame).\n6. Dry 4–7 days at < 30 °C until meat is dark, firm,\
  \ and dry (15–20 % moisture).\n7. Shelf life: 1–3 months at room temperature; indefinitely\
  \ if vacuum-packed.\n\n## Rancidity and Antioxidants\n\nFats in smoked and dried\
  \ meat oxidise over time → rancid, off-flavour.\n\n**Prevention:**\n- Trim fat before\
  \ curing (fat oxidises faster than lean muscle)\n- Smoke provides natural antioxidants\
  \ (guaiacol, syringol compounds)\n- Pack in dark conditions (light catalyses oxidation)\n\
  - Add natural antioxidants at finishing: rub with ground rosemary or crushed dried\n\
  \  cloves (rich in eugenol — a potent antioxidant)\n- Vacuum-pack or wrap tightly\
  \ in wax paper; minimise headspace\n"
exercises:
- type: MULTIPLE_CHOICE
  id: fs4-q1
  options:
  - text: Remove the fish immediately — 58 °C is adequate and further cooking will
      dry them out too much
    correct: false
    explanation: Fish must reach 63 °C internal temperature for 15 minutes, or 70
      °C for 2 minutes, to kill Listeria and Salmonella. 58 °C is below the safety
      threshold regardless of chamber temperature.
  - text: Continue smoking until the internal temperature reaches at least 63 °C,
      then hold for 15 minutes
    correct: true
    explanation: Correct. Pathogen kill is based on the cold-point temperature inside
      the thickest piece, not the chamber. Continue smoking and verify with the probe
      before removing.
  - text: The chamber temperature is sufficient — internal temperature does not need
      to be measured for fish
    correct: false
    explanation: Chamber temperature and internal temperature are different. Thick
      fish can remain under-temperature for hours in a hot chamber. Internal probe
      measurement is mandatory for food safety.
  - text: Add more fuel to raise chamber temperature to 120 °C and finish in 30 minutes
    correct: false
    explanation: At 120 °C the fish surface will burn and dry out before the interior
      reaches temperature. Maintain 70–90 °C and allow adequate time.
  prompt: You are hot-smoking tilapia in a barrel smoker. After 3 hours the chamber
    temperature has been steady at 85 °C. You probe the thickest fish and read 58
    °C. What should you do?
  xp_reward: 30
  correct_answer: Continue smoking until the internal temperature reaches at least
    63 °C, then hold for 15 minutes
- type: FILL_BLANK
  id: fs4-q2
  prompt: Eucalyptus wood should NOT be used for smoking food because it releases
    toxic ___ and resins into the smoke.
  explanation: Eucalyptus contains high concentrations of eucalyptol (1,8-cineole)
    and other monoterpene compounds. When burned, these produce acrid smoke with compounds
    that are irritants and potentially carcinogenic at the concentrations produced
    by heavy smoking.
  xp_reward: 30
  correct_answer: terpenes
- type: MULTIPLE_CHOICE
  id: fs4-q3
  options:
  - text: It is ready — colour and firmness of the exterior indicate complete drying
    correct: false
    explanation: A soft centre means moisture is still above 20 % in the interior.
      Mould and potential pathogen growth can occur in the moist core. Continue drying.
  - text: Continue drying for 1–2 more days; the strips are not yet fully cured
    correct: true
    explanation: Correct. The drying endpoint is firmness throughout — no softness
      anywhere when pressed. A soft core means moisture and potential microbial activity
      remain. Extend drying time.
  - text: The softness is normal — biltong is always slightly moist in the centre
    correct: false
    explanation: Commercial biltong ranges from 'wet' (20 % moisture, refrigerate
      and consume in days) to 'dry' (< 15 % moisture, room-temperature stable). For
      unrefrigerated storage, you need the dry version.
  - text: Brush the surface with vinegar and refrigerate immediately to stop spoilage
    correct: false
    explanation: Refrigeration will slow spoilage but doesn't complete the drying
      process. You need to finish the dehydration, not arrest it.
  prompt: A batch of biltong has been hanging for 6 days. The exterior is dark and
    firm but when you press the thickest strip, the centre still feels slightly soft.
    What should you do?
  xp_reward: 30
  correct_answer: Continue drying for 1–2 more days; the strips are not yet fully
    cured
