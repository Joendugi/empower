id: food-security-day-4
title: 'Salt & Smoke Preservation: Meat, Fish, and Hides'
title_sw: 'Uhifadhi wa Chumvi na Moshi: Nyama, Samaki, na Ngozi'
week_number: 1
day_number: 4
level: beginner
