id: tvet-repair-w2
course_id: computer-repair
title: Week 2 — Disassemble, replace, reassemble, and ESD
title_sw: Wiki 2 — Bomoa, badilisha, kusanya, na ESD
briefing: 'Disassembly is a listed outcome with techniques: photograph, bag screws by length, disconnect power, then cables, then cards, then drives, then motherboard last if needed. Do not pry by the PCB. CPU coolers need even torque when they go back. Laptop work: disconnect battery internally before the keyboard/trackpad cable. Use plastic tools near clips.


  Replace versus repair: consumer RAM and SSDs are replaced; a dry capacitor on a PSU may be repaired only if you are competent and the PSU is designed to be serviced — many college rules are replace-the-PSU. Match spec: DDR4 is not DDR5; SATA data is not SATA power. Record serials for warranty.


  Reassembly is the reverse with cable management so fans are unobstructed and the side panel does not pinch SATA leads. Connect front-panel HD LED correctly or you will chase a “dead HDD” that is only a reversed LED. Ground yourself. Test-fit before all screws.


  Component testing: known-good swap, meter on PSU rails (5 V, 12 V), and vendor diagnostics. Write a replace/repair report: what was faulty, part number, and why. Assessors fail messy trays and “extra screws left over with no idea”.'
briefing_sw: Piga picha, weka skrubu kwenye mifuko. Zima betri ya laptop. DDR4 si DDR5. Kusanya kinyume cha kubomoa. Usibane kebo za SATA. Andika namba ya sehemu iliyobadilishwa.
