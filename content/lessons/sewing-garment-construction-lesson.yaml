id: "sewing-garment-construction-lesson"
course_id: "sewing-garment"
title: "Seams, pressing, and assembly order"
title_sw: "Mishono, pressing, na mpangilio wa kushona"
briefing: "Construction is a sequence, not a pile of random seams. A typical shirt or uniform blouse: shoulder seams, attach collar or neck facing, set sleeves (or join side seams then sleeves, depending on the method), then cuffs, then hem. If you hem first you often cannot set a sleeve. Write the order on your job card the way the assessor expects.\n\nPlain seams are sewn, pressed open, then neatened with zigzag, overlocker, or a turned edge as specified. Underpress every seam before you cross it with another. “Sew it all then iron at the end” is how collars twist and seam allowances get trapped. Use the ham and sleeve board for curves; do not crush a puff sleeve flat on the big board.\n\nClip inward curves and notch outward curves so they lie. Grade bulky seams (collar, waistband) so layers form a stair, not a ridge. For zips, a centred zip needs a basted opening, the zip face-down, and stitching an even distance from the teeth. Test on a scrap if the fabric is slippery.\n\nQuality at this stage: even seam width, matching notches, no puckers, and thread ends finished. Assessors put a ruler on your 1.5 cm — they are not guessing."
briefing_sw: "Fuata mpangilio: mabega, shingo, mikono, kisha hem. Press kila mshono kabla ya kuuvuka. Neatisha kwa zigzag au overlocker. Clip curves. Zip inahitaji basting. Upana wa mshono lazima uwe sawa — wakaguzi hupima."
estimated_minutes: 22
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/03/5"
exam_domain: "Garment construction"
exercises:
  - id: "sewing-garment-construction-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why underpress a seam before crossing it with another seam?"
    options:
      - id: "a"
        text: "To use electricity"
      - id: "b"
        text: "So allowances lie flat and the next seam is accurate"
      - id: "c"
        text: "Pressing is only for the shop window"
      - id: "d"
        text: "It shortens the grainline"
    correct_answer: "b"
    hint: "Bulk in a junction cannot be pressed out later."
    explanation: "Each seam is a foundation for the next. This is a scored finishing behaviour."
    xp_reward: 50
  - id: "sewing-garment-construction-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Notching an outward curve (e.g. a collar point area or convex seam) is done to:"
    options:
      - id: "a"
        text: "Remove bulk so the curve turns without a ridge"
      - id: "b"
        text: "Decorate the inside"
      - id: "c"
        text: "Weaken the stitch on purpose"
      - id: "d"
        text: "Mark the grainline"
    correct_answer: "a"
    hint: "Extra fabric in a curve has nowhere to go."
    explanation: "Clips on concave, notches on convex — both help the seam allowance sit after turning."
    xp_reward: 50
  - id: "sewing-garment-construction-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A professional open (plain) seam is usually:"
    options:
      - id: "a"
        text: "Sewn, pressed to one side untrimmed always"
      - id: "b"
        text: "Sewn at the planned allowance, pressed open, then neatened"
      - id: "c"
        text: "Glued"
      - id: "d"
        text: "Only 2 mm wide on uniforms"
    correct_answer: "b"
    hint: "Open and neatened is the default woven method."
    explanation: "Unless the spec says French or overlocked-together, press open and neaten both edges."
    xp_reward: 50
  - id: "sewing-garment-construction-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Why is assembly order written on a job card?"
    options:
      - id: "a"
        text: "To fill paper"
      - id: "b"
        text: "So sleeves, collars, and closures are attached while the garment can still be opened flat"
      - id: "c"
        text: "Assessors ignore order"
      - id: "d"
        text: "It replaces the pattern"
    correct_answer: "b"
    hint: "Some operations are impossible after a hem or a closed side seam."
    explanation: "Planning is part of competence, not extra theory."
    xp_reward: 50
  - id: "sewing-garment-construction-fb1"
    type: "FILL_BLANK"
    prompt: "Trimming layered seam allowances to different widths so they stack without a ridge is called seam ___."
    correct_answer: "grading"
    hint: "Also called layering the seam."
    explanation: "Grading reduces bulk in collars, cuffs, and waistbands."
    xp_reward: 50
  - id: "sewing-garment-construction-scenario"
    type: "SCENARIO"
    prompt: "You set a sleeve and the ease forms one big pleat at the cap. The spec is a smooth head. What do you do?"
    options:
      - id: "a"
        text: "Leave it; ease always looks like a pleat"
      - id: "b"
        text: "Unpick, redistribute ease with two rows of gather stitches, shrink with the iron if the cloth allows, and restitch"
      - id: "c"
        text: "Cut a dart out of the cap"
      - id: "d"
        text: "Glue the cap to the dummy"
    correct_answer: "b"
    hint: "Ease is tiny fullness, not a tuck."
    explanation: "Two rows of ease stitching, steam, and even distribution are the textbook fix. A pleat is a construction fault on a plain sleeve."
    xp_reward: 60
