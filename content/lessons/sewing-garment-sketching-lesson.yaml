id: "sewing-garment-sketching-lesson"
course_id: "sewing-garment"
title: "Week 6 — Fashion sketching and specifications"
title_sw: "Wiki 6 — Mchoro wa fashion na spec"
briefing: "CDACC fashion includes sketching figures and producing working drawings. A croquis is a proportioned template (often 8–9 heads for fashion, more realistic for school uniforms). Design sketches show silhouette, style lines, and fabric suggestion. They are not the same as a technical flat: flats are 2D, garment as if laid on a table, seams and topstitching visible, left and right consistent.\n\nA spec sheet / working drawing carries measurements (bust, waist, hip, length, sleeve, hem depth, seam allowance), stitch types, notions (zip length, button size), and fabric. Without it the machinist invents, and the assessor cannot mark against a standard. Callouts: “lockstitch 2.4 mm, 1.5 cm SA, 20 cm invisible zip”.\n\nShade for drape, but do not hide construction. Front and back views. If there is a lining, show it. Kenyan polytechnic practicals often ask for a school skirt or shirt — draw the actual garment, not a Paris gown, unless the brief says otherwise.\n\nPortfolio this week: one croquis illustration plus one flat plus a measurement table for a ladies’ blouse. That is how industry hands work to the sewing line."
briefing_sw: "Croquis ni kielelezo cha mwili. Flat ni mchoro wa kiufundi wa nguo. Spec sheet ina vipimo, stitch, zip, na kitambaa. Chora mbele na nyuma. Sare ya shule ni mradi halali."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/06/5"
exam_domain: "Fashion sketching"
exercises:
  - id: "sewing-garment-sketching-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A technical flat is best described as:"
    options:
      - id: "a"
        text: "A painted fashion pose only"
      - id: "b"
        text: "A 2D working drawing of the garment with seams, topstitch, and callouts"
      - id: "c"
        text: "A photo of the dummy"
      - id: "d"
        text: "A grainline on cloth"
    correct_answer: "b"
    hint: "Machinist document."
    explanation: "Illustration sells; flats instruct. You need both in the unit."
    xp_reward: 50
  - id: "sewing-garment-sketching-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Seam allowance belongs:"
    options:
      - id: "a"
        text: "Only in the machinist’s head"
      - id: "b"
        text: "On the spec/pattern, stated in millimetres or centimetres"
      - id: "c"
        text: "On the fashion illustration face"
      - id: "d"
        text: "Nowhere if you overlock"
    correct_answer: "b"
    hint: "Measurable."
    explanation: "1.5 cm is common for garments but must be written."
    xp_reward: 50
  - id: "sewing-garment-sketching-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Front and back flats should:"
    options:
      - id: "a"
        text: "Match style lines that continue around the body"
      - id: "b"
        text: "Be two unrelated garments"
      - id: "c"
        text: "Omit closures"
      - id: "d"
        text: "Use random proportions"
    correct_answer: "a"
    hint: "Same design."
    explanation: "A princess line that vanishes at the side is a drawing error."
    xp_reward: 50
  - id: "sewing-garment-sketching-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Button size on a spec is needed because:"
    options:
      - id: "a"
        text: "Buttons are decorative only"
      - id: "b"
        text: "The hole, spacing, and facing must match the notion"
      - id: "c"
        text: "NITA bans numbers"
      - id: "d"
        text: "It sets stitch length"
    correct_answer: "b"
    hint: "Notions."
    explanation: "A 15 mm button in a 10 mm hole fails the garment."
    xp_reward: 50
  - id: "sewing-garment-sketching-fb1"
    type: "FILL_BLANK"
    prompt: "A proportioned fashion figure template used for illustration is a ___."
    correct_answer: "croquis"
    hint: "From French “sketch”."
    explanation: "You design on a croquis; you manufacture from flats and patterns."
    xp_reward: 50
  - id: "sewing-garment-sketching-scenario"
    type: "SCENARIO"
    prompt: "A trainee submits a coloured croquis of a gown with no measurements, no SA, and no back view. For CDACC evidence you should:"
    options:
      - id: "a"
        text: "Pass it as complete design"
      - id: "b"
        text: "Require flats, spec measurements, and construction notes before sewing starts"
      - id: "c"
        text: "Cut fabric immediately"
      - id: "d"
        text: "Skip pattern making"
    correct_answer: "b"
    hint: "Working drawings."
    explanation: "Sketching in the OS is communication of a makeable garment."
    xp_reward: 60
