- type: MULTIPLE_CHOICE
  id: fs1-q4
  options:
  - id: a
    text: Remove glowing nuts and feed them to chickens — the toxin is less harmful to poultry
  - id: b
    text: Wash glowing nuts with clean water to remove the toxin
  - id: c
    text: Remove and destroy glowing nuts; do not consume or feed to animals
  - id: d
    text: Continue storage — UV glow only appears during the first days and disappears
  prompt: A UV torch shows blue-green glow on some groundnuts. What is the correct action?
  xp_reward: 30
  correct_answer: c
  explanation: 'UV fluorescence indicates Aspergillus mould. Destroy by burying deeply or burning. Never
    feed aflatoxin-contaminated grain to any animal.


    Why the other options are wrong: Aflatoxin accumulates in poultry liver and eggs. Contaminated eggs
    enter the human food chain. Do not feed to any livestock. Aflatoxin is bound to the grain matrix and
    is not water-soluble. Washing has no effect. Fluorescence persists as long as the mould is present.
    It does not fade and the toxin does not break down at room temperature.'
