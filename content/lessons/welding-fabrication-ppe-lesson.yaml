id: "welding-fabrication-ppe-lesson"
course_id: "welding-fabrication"
title: "Arc safety, PPE, and the bay"
title_sw: "Usalama wa arc, PPE, na bay"
briefing: "Welding is a high-risk trade. Shade 10–13 filters (follow electrode and process), leather gloves, apron or jacket, and closed boots are not optional. Cotton under-layers beat melting synthetics. Screens protect the next trainee. Chipping slag without eye protection is how “welder’s flash” and metal-in-eye cases fill the clinic every term.\n\nTreat cylinders, cables, and the workpiece as a system. Isolate the machine when changing electrodes if the procedure requires it; never coil cables around your body. The workpiece clamp must be on clean metal, not a painted bench edge that arcs randomly. Ventilate: zinc on galvanised steel produces fumes that make you ill; grind coatings off in a controlled way and extract.\n\nHousekeeping is part of safety: no water on the floor around MMA sets, no oily rags by grinders, fire extinguisher known and unblocked. Hot work needs a watcher if the college rule says so. Never weld on a closed tank that held fuel.\n\nAssessors watch helmet-down before the strike, not after you see the puddle. That habit is the first competence."
briefing_sw: "Kivuli 10–13, glavu za ngozi, na buti ni lazima. Usitazame arc. Ventilate; fume ya zinc ni hatari. Clamp iwe kwenye chuma safi. Usilehemu tanki la mafuta. Helmet inashuka kabla ya kugonga electrode."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/WEL/CR/01/5"
exam_domain: "Occupational safety"
media:
  - kind: "animation"
    preset: "weld"
    caption: "Arc flash — UV/IR, not just “bright light”."
exercises:
  - id: "welding-fabrication-ppe-media"
    type: "MEDIA"
    prompt: "Watch the arc simulation and confirm you will use a rated filter before answering."
    correct_answer: "watched"
    hint: "Play or watch the demonstration, then confirm."
    explanation: "You confirmed that the demonstration was completed."
    xp_reward: 20
    media:
      - kind: "animation"
        preset: "weld"
        mustFinish: true
        caption: "Confirm helmet discipline before questions."
  - id: "welding-fabrication-ppe-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why must a welder never look at the arc with the naked eye?"
    options:
      - id: "a"
        text: "It only wastes electrodes"
      - id: "b"
        text: "Arc flash (UV/IR) can burn the cornea (“welder’s flash”)"
      - id: "c"
        text: "It cools the metal too fast"
      - id: "d"
        text: "It is only a problem at night"
    correct_answer: "b"
    hint: "The arc is a UV source."
    explanation: "Photokeratitis is painful and preventable with a rated helmet filter."
    xp_reward: 50
  - id: "welding-fabrication-ppe-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "The earth / work clamp should be attached to:"
    options:
      - id: "a"
        text: "Painted bench tube"
      - id: "b"
        text: "Clean metal on the job so current returns through a short, sound path"
      - id: "c"
        text: "The helmet strap"
      - id: "d"
        text: "A wet floor"
    correct_answer: "b"
    hint: "Bad earth makes stray arcs."
    explanation: "A poor return path is a shock and quality problem."
    xp_reward: 50
  - id: "welding-fabrication-ppe-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Before welding galvanised sheet you should:"
    options:
      - id: "a"
        text: "Ignore the coating"
      - id: "b"
        text: "Remove coating in the weld zone and use extraction; know metal-fume fever risk"
      - id: "c"
        text: "Paint more zinc on first"
      - id: "d"
        text: "Use water as flux"
    correct_answer: "b"
    hint: "Zinc fumes."
    explanation: "Grind/strip as specified and ventilate. Do not breathe the plume."
    xp_reward: 50
  - id: "welding-fabrication-ppe-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A closed drum that once held petrol is:"
    options:
      - id: "a"
        text: "Safe if you whistle"
      - id: "b"
        text: "Not to be welded until made safe by a competent procedure — explosion risk"
      - id: "c"
        text: "Best preheated with oxy-fuel"
      - id: "d"
        text: "A good exam shortcut"
    correct_answer: "b"
    hint: "Vapour plus spark kills."
    explanation: "Tank welding is specialist. Polytechnic practice is: do not."
    xp_reward: 50
  - id: "welding-fabrication-ppe-fb1"
    type: "FILL_BLANK"
    prompt: "Painful UV burn of the eye from an arc is commonly called welder’s ___."
    correct_answer: "flash"
    hint: "Also photokeratitis."
    explanation: "Filter shade and helmet timing prevent it."
    xp_reward: 50
  - id: "welding-fabrication-ppe-scenario"
    type: "SCENARIO"
    prompt: "A classmate chips slag in a T-shirt, visor up, toward the next bay. What do you do?"
    options:
      - id: "a"
        text: "Film it for TikTok"
      - id: "b"
        text: "Stop the work, visor down or safety specs, leather on, screen the bay, then chip"
      - id: "c"
        text: "Turn up current so slag flies less"
      - id: "d"
        text: "Pour water on the weld"
    correct_answer: "b"
    hint: "Hot slag is a projectile."
    explanation: "Eye protection stays on for chipping. Supervisors fail this instantly."
    xp_reward: 60
