- id: vet-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why are Nzi and biconical tsetse fly traps constructed specifically from royal blue and black
    fabrics?

    '
  xp_reward: 50
  options:
  - id: a
    text: Tsetse flies possess specialized photoreceptors attracted from long distances to royal blue
      wavelengths, while matte black stimulates landing and upward entry into the collection cage
  - id: b
    text: Blue fabric absorbs heat, warming the trap to 37°C
  - id: c
    text: Because blue fabric repels mosquitoes
  - id: d
    text: To make the traps easy for pastoralists to find in the bush
  explanation: 'Extensive behavioral research confirms that tsetse flies are visually lured by royal blue
    (which mimics large host silhouettes) and instinctively land on black surfaces before flying up into
    transparent light traps.


    Why the other options are wrong: Tsetse flies are attracted visually, not by heat generated by fabric.
    The purpose is specifically attracting and killing tsetse flies. The color is chosen strictly for
    insect optical physiology.'
  correct_answer: a
- id: vet-d2-q5
  type: FILL_BLANK
  prompt: 'In a pastoral cow with chronic Trypanosomiasis (Nagana), the hallmark physical indicators include
    progressive emaciation with a ''razor-back'' spine, chalk-white mucous membranes, and a visible pulsing
    of the ___ vein in the lower neck.

    '
  xp_reward: 50
  correct_answer: jugular
  explanation: 'Severe hemolytic anemia thins the blood, causing turbulent venous regurgitation that produces
    a visible bounding jugular pulse in the neck furrow.

    '
