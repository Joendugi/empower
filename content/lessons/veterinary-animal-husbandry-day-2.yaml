  prompt: 'The brown ear tick that transmits East Coast Fever (*Theileria parva*) in East Africa is scientifically
    named ___ appendiculatus, while the tsetse fly vector that transmits Trypanosomiasis belongs to the
    genus ___.

    '
  xp_reward: 50
  correct_answer:
  - Rhipicephalus
  - Glossina
  explanation: 'Rhipicephalus appendiculatus vectors ECF; Glossina species (morsitans, pallidipes) vector
    Trypanosomiasis (Nagana).

    '
