id: "masonry-first-course-lesson"
course_id: "masonry"
title: "Mortar, bond, and the first course"
title_sw: "Chokaa, bond, na kozi ya kwanza"
briefing: "A wall is only as true as the first course. Level and line it until you are bored of checking. Any error is multiplied as you rise. Butter heads for full perpends; empty perpends leak and fail compressive paths.\n\nMortar: follow the job spec (a common teaching mix for general blockwork is in the region of 1:4 cement:sand — never invent a wetter mix to make laying “easy”). Too much water weakens and stains. Mix small enough to use before it dies. Do not retemper with extra water hours later if the spec forbids it.\n\nBond (stretcher, English, etc.) must run correctly so vertical joints do not align one above the other except where the bond requires. Quoins are your plumbing posts — get them up with a level and line pins.\n\nJoint thickness consistent. Fat joints on one course and hairline on the next is a fail even if the wall stands."
briefing_sw: "Kozi ya kwanza ni msingi. Level na line. Fuata mchanganyiko wa chokaa. Perpends zijazwe. Bond isizuie joints kuwa wima moja juu ya nyingine isipokuwa bond inavyosema."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/MAS/CR/02/5"
exam_domain: "Brick/block work"
exercises:
  - id: "masonry-first-course-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why is the first course critical?"
    options:
      - id: "a"
        text: "It uses leftover mortar"
      - id: "b"
        text: "Error in level or line is multiplied as the wall rises"
      - id: "c"
        text: "Paint hides it"
      - id: "d"
        text: "Blocks are cheaper at the bottom"
    correct_answer: "b"
    hint: "Foundation of the elevation."
    explanation: "A lean first course cannot be fixed higher without a visible correction."
    xp_reward: 50
  - id: "masonry-first-course-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Empty perpends typically cause:"
    options:
      - id: "a"
        text: "Faster curing always"
      - id: "b"
        text: "Weakness and water paths"
      - id: "c"
        text: "Perfect bond"
      - id: "d"
        text: "Automatic square"
    correct_answer: "b"
    hint: "Fill the heads."
    explanation: "Full mortar beds and perpends as specified."
    xp_reward: 50
  - id: "masonry-first-course-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Adding water to dying mortar hours later (if not allowed) is called retempering and often:"
    options:
      - id: "a"
        text: "Improves spec strength"
      - id: "b"
        text: "Weakens the mix"
      - id: "c"
        text: "Squares the quoin"
      - id: "d"
        text: "Replaces lime"
    correct_answer: "b"
    hint: "Chemistry has started."
    explanation: "Mix what you can use. Dump set mortar."
    xp_reward: 50
  - id: "masonry-first-course-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Aligned vertical joints up the wall (in stretcher bond) usually mean:"
    options:
      - id: "a"
        text: "Perfect work"
      - id: "b"
        text: "Broken bond / setting-out error"
      - id: "c"
        text: "Stronger perpends"
      - id: "d"
        text: "A type of damp-proof course"
    correct_answer: "b"
    hint: "Stagger the perpends."
    explanation: "Bond pattern is structural and visual."
    xp_reward: 50
  - id: "masonry-first-course-fb1"
    type: "FILL_BLANK"
    prompt: "The vertical mortar joint between block ends is a ___."
    correct_answer: "perpend"
    hint: "Also “head joint”."
    explanation: "Perpends should be full and aligned to the bond."
    xp_reward: 50
  - id: "masonry-first-course-scenario"
    type: "SCENARIO"
    prompt: "Your first course is 8 mm out of level across a 3 m wall. Trainee wants to “catch it up” over six courses. You should:"
    options:
      - id: "a"
        text: "Agree — nobody sees the DPC"
      - id: "b"
        text: "Take it up and relay the first course; do not pack errors into the elevation"
      - id: "c"
        text: "Use wooden wedges forever"
      - id: "d"
        text: "Flood the bed with water"
    correct_answer: "b"
    hint: "Reset now."
    explanation: "Catching up makes tapering joints and a drunk wall."
    xp_reward: 60
