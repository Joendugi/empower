id: cyber-sy0701-d5-w2
course_id: secplus-program
title: Week 2 — Compliance, privacy, and Kenya DPA with Security+
title_sw: Wiki 2 — Utiifu, faragha, na DPA ya Kenya
briefing: 'Privacy and compliance sit in Domain 5 and in Kenyan law. The Data Protection Act, 2019 (and regulations) require lawful basis, purpose limitation, minimisation, accuracy, storage limitation, integrity/confidentiality, and accountability. A data protection officer for entities that meet the threshold. Data subject rights: access, correction, deletion where applicable, and complaint to the Office of the Data Protection Commissioner. Cross-border transfer rules apply if the MIS is hosted abroad — contracts and adequacy, not “the cloud is magic”.


  Security+ privacy topics: PII, PHI (clinic), data inventory, impact assessments, notices, consent versus other lawful bases (public task, contract, legitimate interest — pick correctly for a public college). Retention schedules. Breach notification duties — know that you may need to inform the ODPC and affected students when the risk is high. Do not wait for the newspaper.


  CMCA 2018 still forbids unauthorised access — your pentest needs a letter. PCI is relevant if you take card payments for fees; most campuses should isolate that to a payment processor (reduce scope). Sector regulators (TVETA, CUE, CBK for student loan partners) may add duties.


  Semester close: write a one-page processing register for “student admissions data” — purpose, fields, system, retention, sharing, security measures. That is compliance as coursework, not a slogan.'
briefing_sw: 'DPA 2019: msingi halali, minimisation, haki za mtu. DPO. ODPC. Uhamisho nje ya nchi. CMCA: pentest na barua. PCI ikiwa kadi. Andika rejesta ya usindikaji wa data ya wanafunzi.'
