    practice. Ensure grid coordinates, compass bearings, or measured baseline paces are clearly documented
    in your notes.

    '
  xp_reward: 50
  correct_answer: null
  explanation: 'Photographic documentation of cartographic plotting, alidade sightlines, or pace count
    calibration records verifies practical field proficiency in terrestrial navigation independent of
    electronic satellite navigation.

    '
