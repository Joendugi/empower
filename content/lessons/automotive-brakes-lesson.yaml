id: "automotive-brakes-lesson"
course_id: "automotive"
title: "Brakes, fluid, and diagnosis path"
title_sw: "Breki, fluid, na diagnosis"
briefing: "Brake fluid is hygroscopic (it absorbs water) and it destroys paint. Wash spills immediately. Use the DOT spec on the cap. Do not mix DOT 5 silicone with DOT 3/4 systems. Bleed in the specified order until fluid is clean and firm.\n\nPads and discs: minimum thickness, even wear, no oil on friction material. A car that pulls left under braking is often one-sided: seized caliper, collapsed hose, contaminated pad — not “the engine is tired”.\n\nDiagnosis path: complaint, evidence (test drive if safe), inspect, measure, cause, correction, retest. Parts cannon without evidence wastes the customer and fails assessments.\n\nABS faults need scan data. Unplugging ABS “to make it stop pulling” is not a repair."
briefing_sw: "Brake fluid inaharibu rangi na inanyonya maji. Fuata DOT. Pull upande mmoja: kagua caliper, hose, pad. Diagnosis: malalamiko, ushahidi, sababu, ukarabati, jaribio."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AUT/CR/03/5"
exam_domain: "Brakes & diagnosis"
exercises:
  - id: "automotive-brakes-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Brake fluid on paint should be:"
    options:
      - id: "a"
        text: "Ignored; it improves gloss"
      - id: "b"
        text: "Washed off immediately; it damages paint and is hygroscopic in the system"
      - id: "c"
        text: "Mixed into engine oil"
      - id: "d"
        text: "Used on the windscreen"
    correct_answer: "b"
    hint: "Glycol fluids are aggressive."
    explanation: "Spill care plus the correct DOT type in the system."
    xp_reward: 50
  - id: "automotive-brakes-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A car pulls left when braking. Professional first path:"
    options:
      - id: "a"
        text: "Replace the engine"
      - id: "b"
        text: "Inspect tyres, pads/discs, calipers, and hoses for a one-sided problem"
      - id: "c"
        text: "Disconnect ABS permanently"
      - id: "d"
        text: "Add oil to the radiator"
    correct_answer: "b"
    hint: "Uneven braking is often one corner."
    explanation: "Evidence before parts."
    xp_reward: 50
  - id: "automotive-brakes-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Mixing DOT 5 (silicone) into a DOT 4 system is:"
    options:
      - id: "a"
        text: "Always fine"
      - id: "b"
        text: "Wrong — incompatible fluids"
      - id: "c"
        text: "Required annually"
      - id: "d"
        text: "A type of bleed"
    correct_answer: "b"
    hint: "Read the cap."
    explanation: "Incompatible fluids gel and fail."
    xp_reward: 50
  - id: "automotive-brakes-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "After brake work you must:"
    options:
      - id: "a"
        text: "Skip bleeding if you are late"
      - id: "b"
        text: "Ensure a firm pedal and a safe test before handover"
      - id: "c"
        text: "Disconnect a line for “feel”"
      - id: "d"
        text: "Paint the discs"
    correct_answer: "b"
    hint: "Pedal."
    explanation: "Soft pedal is air or failure. Do not release the car."
    xp_reward: 50
  - id: "automotive-brakes-fb1"
    type: "FILL_BLANK"
    prompt: "Brake fluid that absorbs water from the air is described as ___."
    correct_answer: "hygroscopic"
    hint: "Hydro-scopic in some papers; we use hygroscopic."
    explanation: "Water lowers boiling point and corrodes ABS units."
    xp_reward: 50
  - id: "automotive-brakes-scenario"
    type: "SCENARIO"
    prompt: "Pedal goes to the floor after a pad change. Trainee pumps it 40 times and wants to send the car. You:"
    options:
      - id: "a"
        text: "Send it — pumping is bleeding"
      - id: "b"
        text: "Do not release: find the leak or bleed properly until the pedal is firm"
      - id: "c"
        text: "Fit a wood block under the pedal"
      - id: "d"
        text: "Disconnect a caliper to raise the pedal"
    correct_answer: "b"
    hint: "Soft pedal."
    explanation: "A floor pedal is a danger. Stay on the job."
    xp_reward: 60
