id: "masonry-setout-lesson"
course_id: "masonry"
title: "Site safety and setting out"
title_sw: "Usalama wa site na setting out"
briefing: "Masonry starts with a safe site: boots, gloves, goggles when cutting, and no standing under a hoist. Scaffold and trestles must be complete; a stack of blocks is not a platform. Cement burns skin — wash splashes.\n\nSetting out: profiles, builder’s square or 3-4-5, diagonals equal for a rectangle. A wall built off a wrong line is demolished, not decorated. Check reduced levels if you have a dumpy or laser; do not assume the slab is true.\n\nStore cement dry and blocks on a clean base. Mixing on the soil fills mortar with clay and weakens it.\n\nThe assessor will ask you to explain how you know the corner is square. “It looks square” is not an answer."
briefing_sw: "Vaa PPE. Usisimame chini ya hoist. Square kwa 3-4-5 au diagonals. Usichanganye chokaa kwenye udongo. Cement inawasha ngozi."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/MAS/CR/01/5"
exam_domain: "Setting out"
exercises:
  - id: "masonry-setout-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A rectangle is square in plan when:"
    options:
      - id: "a"
        text: "One corner looks nice"
      - id: "b"
        text: "Diagonals are equal (and sides as drawn)"
      - id: "c"
        text: "All blocks are wet"
      - id: "d"
        text: "The mixer is loud"
    correct_answer: "b"
    hint: "Geometry."
    explanation: "Measure diagonals. That is craft, not theory only."
    xp_reward: 50
  - id: "masonry-setout-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "When cutting a concrete block you should:"
    options:
      - id: "a"
        text: "Hold it on your knee toward your face"
      - id: "b"
        text: "Use appropriate tools, eye protection, and a stable surface"
      - id: "c"
        text: "Soak it in petrol"
      - id: "d"
        text: "Leave random gaps instead"
    correct_answer: "b"
    hint: "Chips fly."
    explanation: "Goggles and a bench. Angle grinders need extra discipline."
    xp_reward: 50
  - id: "masonry-setout-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Mixing mortar on bare soil is bad because:"
    options:
      - id: "a"
        text: "It is faster"
      - id: "b"
        text: "Soil contaminates and weakens the mix"
      - id: "c"
        text: "Cement prefers clay"
      - id: "d"
        text: "It squares the building"
    correct_answer: "b"
    hint: "Dirty mix."
    explanation: "Use a board or mixer as specified."
    xp_reward: 50
  - id: "masonry-setout-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Standing on a dry-stack of blocks to lay the next lift is:"
    options:
      - id: "a"
        text: "Efficient"
      - id: "b"
        text: "Unsafe — use a proper platform"
      - id: "c"
        text: "Required by CDACC"
      - id: "d"
        text: "A type of profile"
    correct_answer: "b"
    hint: "Fall from height."
    explanation: "Access equipment is part of the unit."
    xp_reward: 50
  - id: "masonry-setout-fb1"
    type: "FILL_BLANK"
    prompt: "The 3-4-5 method is used to set a right ___."
    correct_answer: "angle"
    hint: "A square corner."
    explanation: "3-4-5 is a practical Pythagorean square."
    xp_reward: 50
  - id: "masonry-setout-scenario"
    type: "SCENARIO"
    prompt: "Rain is forecast and profiles are already knocked by a wheelbarrow. You should:"
    options:
      - id: "a"
        text: "Build anyway from memory"
      - id: "b"
        text: "Reset lines from datums, protect profiles, and only then lay"
      - id: "c"
        text: "Double the mortar water"
      - id: "d"
        text: "Remove all PPE to move faster"
    correct_answer: "b"
    hint: "Datums first."
    explanation: "A wall on a moved line is waste."
    xp_reward: 60
