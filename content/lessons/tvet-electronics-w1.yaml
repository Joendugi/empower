id: tvet-electronics-w1
course_id: basic-electronics
title: Week 1 — Circuits, quantities, and Ohm’s law
title_sw: Wiki 1 — Mizunguko, vipimo, na sheria ya Ohm
briefing: 'CDACC common unit Demonstrate Basic Electronics (IT/CU/ICT/CC/1/5, about 100 hours) starts with electric circuits before you ever open a PC. A circuit is a closed path that lets charge flow: source, conductors, load, and a return. Electromotive force (e.m.f.) is measured in volts, current in amperes, resistance in ohms, power in watts (P = VI), and energy in joules. If you mix those units in an oral, you fail the underpinning knowledge even if you can crimp an RJ45.


  Direct current (DC) from a PSU rail or battery is constant polarity. Alternating current (AC) from the wall reverses. Lab work is mostly DC on breadboards, but the PSU still converts AC. Series circuits share one current; voltages add. Parallel circuits share voltage; currents add. A blown series lamp kills the chain; a blown parallel lamp leaves the others on — that is how street lights and PC fans are thought about.


  Ohm’s law V = IR is the first calculation. If a 5 V rail feeds a 220 Ω resistor, current is about 23 mA. Power in the resistor is I²R. If you cannot estimate that, you will not size a current-limiting resistor for an LED and you will destroy the diode. Always draw the circuit, label polarity, then measure with the meter in the correct mode — voltage in parallel, current in series, resistance with power off.


  Workshop practice: isolate mains, use a current-limited bench supply, and never leave a shorted breadboard on a high-current PSU. Assessors watch meter discipline as much as the answer. A fused lead and a known-good ground are part of the competence, not extras.'
briefing_sw: Mzunguko una chanzo, mzigo, na njia ya kurudi. Volt, ampere, ohm, watt, na joule. DC ni polarity moja; AC inabadilika. Series hushiriki current; parallel hushiriki voltage. V = IR. Pima voltage sambamba, current mfululizo, resistance umeme ukiwa umezima.
