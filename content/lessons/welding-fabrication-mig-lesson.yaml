id: "welding-fabrication-mig-lesson"
course_id: "welding-fabrication"
title: "Week 5 — GMAW / MIG: gas, wire, and set-up"
title_sw: "Wiki 5 — GMAW/MIG: gesi, waya, na set-up"
briefing: "CDACC welding Level 5 includes GMAW (MIG) as a core separate from MMA. The electrode is a continuously fed solid wire. Shielding gas (often CO₂ or Ar/CO₂ mix for steel — follow the WPS) displaces air so the puddle does not nitride and porosity. No gas, or a blocked nozzle, looks like a “bad machine”. Clean the nozzle and contact tip; a fused tip is a feed fault, not a new inverter.\n\nSet voltage (or “trim”) and wire-speed together. Too little heat: ropey, lack of fusion. Too much: burn-through on thin sheet. Stick-out (contact tip to work) is typically about 10–15 mm as taught — long stick-out cools the arc and increases spatter. Earth clamp on clean metal, same as MMA. Push (forehand) for flatter beads on many steel fillets; drag if the WPS says so for a given transfer mode.\n\nTransfer modes you should name: short-circuit (thin sheet, more spatter), globular, spray (needs enough current and usually argon-rich mix). Do not run spray on 1 mm sheet. PPE still includes a filter; MIG is an arc. Spats burn through synthetic shirts — leather or flame-resistant cotton.\n\nPractical: fillet on 6 mm, then a butt on 2–3 mm with backing as specified. Assessors mark gas on before the strike, and a bead that fuses both toes."
briefing_sw: "MIG ni waya endelevu na gesi ya kinga. Nozzle safi. Voltage na wire-speed pamoja. Stick-out ~10–15 mm. Short-circuit kwa sheet; spray kwa sasa kubwa. PPE bado. Gesi iwe ON kabla ya arc."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/WEL/CR/05/5"
exam_domain: "GMAW / MIG"
media:
  - kind: "animation"
    preset: "weld"
    caption: "MIG: wire is the electrode; gas shields the puddle."
exercises:
  - id: "welding-fabrication-mig-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Porosity in a MIG bead with the gas cylinder closed is primarily:"
    options:
      - id: "a"
        text: "Too much grinding"
      - id: "b"
        text: "Loss of shielding — air in the puddle"
      - id: "c"
        text: "Correct spray transfer"
      - id: "d"
        text: "A good earth"
    correct_answer: "b"
    hint: "Shielding."
    explanation: "Open the cylinder, check flow, leaks, and wind. MIG outdoors needs screens."
    xp_reward: 50
  - id: "welding-fabrication-mig-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Contact-tip to work distance that is much too long typically:"
    options:
      - id: "a"
        text: "Improves fusion always"
      - id: "b"
        text: "Raises resistance, cools the arc, increases spatter"
      - id: "c"
        text: "Replaces gas"
      - id: "d"
        text: "Sharpens the wire"
    correct_answer: "b"
    hint: "Stick-out."
    explanation: "Hold the taught stick-out. Resting the nozzle off the job changes everything."
    xp_reward: 50
  - id: "welding-fabrication-mig-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Short-circuit transfer is chosen mainly for:"
    options:
      - id: "a"
        text: "Heavy spray on 20 mm plate only"
      - id: "b"
        text: "Thinner material and positional work at lower heat"
      - id: "c"
        text: "Oxy-fuel only"
      - id: "d"
        text: "TIG tungsten"
    correct_answer: "b"
    hint: "Heat input."
    explanation: "Spray needs current and usually a different mix. Know which mode you are in."
    xp_reward: 50
  - id: "welding-fabrication-mig-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A fused contact tip and bird-nested wire in the liner means:"
    options:
      - id: "a"
        text: "Buy a new welder first"
      - id: "b"
        text: "Clear the liner, replace the tip, check drive-roll tension and liner length"
      - id: "c"
        text: "Increase gas to 50 L/min"
      - id: "d"
        text: "Remove the earth"
    correct_answer: "b"
    hint: "Feed path."
    explanation: "Bird-nesting is mechanical. Forcing the trigger makes it worse."
    xp_reward: 50
  - id: "welding-fabrication-mig-fb1"
    type: "FILL_BLANK"
    prompt: "GMAW on steel commonly uses a shielding ___ such as CO₂ or an Ar/CO₂ mix."
    correct_answer: "gas"
    hint: "Not flux in basic solid-wire MIG."
    explanation: "FCAW is the flux-cored cousin. Do not mix the names in the oral."
    xp_reward: 50
  - id: "welding-fabrication-mig-scenario"
    type: "SCENARIO"
    prompt: "Trainee MIG-welds 1.2 mm sheet on spray-transfer settings copied from a 10 mm demo. Result?"
    options:
      - id: "a"
        text: "Perfect cosmetic beads"
      - id: "b"
        text: "Likely burn-through — drop to short-circuit / lower heat and a suitable WPS for thin sheet"
      - id: "c"
        text: "Stronger than the plate always"
      - id: "d"
        text: "Gas becomes optional"
    correct_answer: "b"
    hint: "Heat versus thickness."
    explanation: "GMAW is a set-up competence, not one-knob-fits-all."
    xp_reward: 60
