id: "electrical-installation-maintain-lesson"
course_id: "electrical-installation"
title: "Week 6 — Maintenance and breakdown: diagnose, isolate, restore"
title_sw: "Wiki 6 — Matengenezo na breakdown"
briefing: "After install and test, CDACC expects maintenance and breakdown competence. Planned maintenance: inspect, tighten (to torque, not “until it squeals”), clean, test RCDs at recommended intervals, IR sample, thermal scan if you have it, and record. A consumer unit full of dust and insects is a maintenance fail waiting to become a fire.\n\nBreakdown: take a symptom (no lights ring 2, RCD trip, burning smell). Isolate and prove dead. Then diagnose — lost neutral, overloaded circuit, failed lamp, moisture in an outside fitting, nuisance RCD from a leaking kettle. Replacing every MCB “to be sure” is not diagnosis. Use the test instruments from the testing week.\n\nRoot cause: if an RCD trips, find the leaking appliance or damp fitting; do not bridge the RCD. If a motor trips on overload, check mechanical lock and current, not only the starter coil. Restore: refit covers, re-test the affected circuit, and write the job card. Temporary tails hanging out of a CU are not a completed breakdown job.\n\nCompetence includes knowing the limit of your authorised work. Service heads and company meters are not yours to open. Escalate."
briefing_sw: "Matengenezo: kaza, safisha, jaribu RCD, andika. Breakdown: isolate, gundua sababu, usibadilishe kila MCB. Usiruke RCD. Job card. Usifungue meter ya kampuni."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "ENG/OS/EI/CR/04/6"
exam_domain: "Maintain electrical installation"
exercises:
  - id: "electrical-installation-maintain-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "An RCD that trips every time the kettle boils should first lead you to:"
    options:
      - id: "a"
        text: "Bridge the RCD with a link"
      - id: "b"
        text: "Isolate, test the kettle/circuit insulation, repair or replace the leaking load"
      - id: "c"
        text: "Fit a bigger RCD coil of unknown type"
      - id: "d"
        text: "Remove the earth from the kettle"
    correct_answer: "b"
    hint: "Find the leak."
    explanation: "Nuisance trips are often real leakage. Bridging is illegal and lethal."
    xp_reward: 50
  - id: "electrical-installation-maintain-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Planned maintenance records exist so that:"
    options:
      - id: "a"
        text: "The next technician and the assessor can see history and due tests"
      - id: "b"
        text: "Paper can fill a drawer"
      - id: "c"
        text: "IEE tables can be ignored"
      - id: "d"
        text: "You can skip isolation"
    correct_answer: "a"
    hint: "Evidence."
    explanation: "Breakdowns without history take longer and miss repeat faults."
    xp_reward: 50
  - id: "electrical-installation-maintain-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A burning smell at the CU. After isolation you find a loose incoming terminal. Correct completion includes:"
    options:
      - id: "a"
        text: "Leaving the cover off for cooling"
      - id: "b"
        text: "Repair to spec, torque, refit cover, re-test, record, and investigate why it loosened"
      - id: "c"
        text: "Painting the terminal black"
      - id: "d"
        text: "Upsizing the MCB only"
    correct_answer: "b"
    hint: "Restore to a tested state."
    explanation: "Heat from high resistance joints is a classic preventable fire."
    xp_reward: 50
  - id: "electrical-installation-maintain-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Opening the supply company’s sealed meter is:"
    options:
      - id: "a"
        text: "A normal first-year task"
      - id: "b"
        text: "Outside typical craft authority — escalate to the licensee"
      - id: "c"
        text: "Required for every lamp change"
      - id: "d"
        text: "How you prove dead"
    correct_answer: "b"
    hint: "Limits of work."
    explanation: "Competence includes stopping at the boundary of your authorisation."
    xp_reward: 50
  - id: "electrical-installation-maintain-fb1"
    type: "FILL_BLANK"
    prompt: "Work done after a failure, rather than on a schedule, is ___ maintenance."
    correct_answer: "breakdown"
    hint: "Also called corrective."
    explanation: "Planned (preventive) versus breakdown (corrective). Both are cores."
    xp_reward: 50
  - id: "electrical-installation-maintain-scenario"
    type: "SCENARIO"
    prompt: "Hostel ring “dead”. Trainee fits a 32 A MCB in place of a 16 A without measuring or finding the fault. You should:"
    options:
      - id: "a"
        text: "Approve the upgrade"
      - id: "b"
        text: "Stop: isolate, diagnose (continuity, IR, loads), repair, restore original correct rating unless a documented redesign"
      - id: "c"
        text: "Fit 63 A next"
      - id: "d"
        text: "Bypass the RCD too"
    correct_answer: "b"
    hint: "Diagnosis, not bigger fuses."
    explanation: "Breakdown maintenance is a thinking unit. Oversizing protection is how buildings burn."
    xp_reward: 60
