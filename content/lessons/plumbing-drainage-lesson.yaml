id: "plumbing-drainage-lesson"
course_id: "plumbing"
title: "Week 5 — Drainage: combined vs separate, falls, and vents"
title_sw: "Wiki 5 — Drainage: mifumo, fall, na vents"
briefing: "Drainage units cover above-ground waste you already did and underground systems. Combined systems carry foul and rain in one sewer (older towns). Separate systems keep foul and surface water apart — rain must not overload the septic tank. You should sketch both in plan as the curriculum asks.\n\nPipes: rigid plastics (PVC-U, PP) have largely replaced cast iron and glazed clay in new work, but you will still meet clay and CI on rehab. Bedding, cover, and haunching under roads matter. Fittings: rest bends, gulleys, inspection chambers, rodding eyes. Access is a legal/practical need — a run you cannot rod is a future excavation.\n\nFalls: too steep and solids race leaving paper; too flat and the drain silts. Follow the diameter tables you were taught (e.g. 100 mm around 1:40 as a starting teaching value — use the spec). Ventilation of the underground system prevents trap siphonage and sewer gas in the house. IC covers must be to load class (driveway vs garden).\n\nTesting: water test (fill to overflow, watch the level) or air test as permitted. Plug branches. Record. A drain that only “looks straight” is not tested. Keep soil tools off potable benches."
briefing_sw: "Combined dhidi ya separate. Mvua isizidishe septic. Chamber za inspection. Fall kwa jedwali. Vent. Jaribu maji. Cover ya barabara si ya bustani."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/05/4"
exam_domain: "Drainage systems"
exercises:
  - id: "plumbing-drainage-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A separate drainage system means:"
    options:
      - id: "a"
        text: "Foul and rainwater share one pipe always"
      - id: "b"
        text: "Foul sewage and surface water are piped independently"
      - id: "c"
        text: "No vents are allowed"
      - id: "d"
        text: "Only clay pipes"
    correct_answer: "b"
    hint: "Two networks."
    explanation: "Combined is one pipe. Know which the site has before you connect a downpipe."
    xp_reward: 50
  - id: "plumbing-drainage-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Inspection chambers exist mainly to:"
    options:
      - id: "a"
        text: "Decorate the lawn"
      - id: "b"
        text: "Provide access for inspection and rodding"
      - id: "c"
        text: "Increase fall infinitely"
      - id: "d"
        text: "Store PTFE"
    correct_answer: "b"
    hint: "Access."
    explanation: "Place them at changes of direction and long runs as the drawing shows."
    xp_reward: 50
  - id: "plumbing-drainage-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Connecting roof water into a septic tank typically:"
    options:
      - id: "a"
        text: "Improves treatment"
      - id: "b"
        text: "Hydraulically overloads the tank and washes solids out"
      - id: "c"
        text: "Is required by CDACC"
      - id: "d"
        text: "Replaces the vent"
    correct_answer: "b"
    hint: "Separate systems."
    explanation: "Rain belongs in surface water or a soakaway/harvest tank, not the digester."
    xp_reward: 50
  - id: "plumbing-drainage-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A water test on drainage is failed if:"
    options:
      - id: "a"
        text: "The sun is out"
      - id: "b"
        text: "The water level drops beyond the allowed amount in the test period"
      - id: "c"
        text: "The pipe is plastic"
      - id: "d"
        text: "There is a rodding eye"
    correct_answer: "b"
    hint: "Hold the head."
    explanation: "Curriculum practicals still list water/air tests before backfill."
    xp_reward: 50
  - id: "plumbing-drainage-fb1"
    type: "FILL_BLANK"
    prompt: "A chamber that lets you inspect and rod an underground drain is an ___ chamber."
    correct_answer: "inspection"
    hint: "IC."
    explanation: "Manholes/ICs are access. Do not backfill a bend with no access."
    xp_reward: 50
  - id: "plumbing-drainage-scenario"
    type: "SCENARIO"
    prompt: "New house: trainee drops the kitchen sink waste into the rainwater gully “because it was closer”. You should:"
    options:
      - id: "a"
        text: "Approve — water is water"
      - id: "b"
        text: "Redo: foul to foul system; keep rain separate unless a true combined design exists"
      - id: "c"
        text: "Add more fall to the gutter"
      - id: "d"
        text: "Seal the gully with cement forever"
    correct_answer: "b"
    hint: "Foul vs surface."
    explanation: "Wrong system connections fail inspections and public health."
    xp_reward: 60
