id: rebuild-000-4-3
course_id: the-rebuild-protocol
title: Setting Your Learning Goal
title_sw: Kuweka Lengo Lako la Kujifunza
briefing: 'MISSION BRIEFING: The Corps does not assign missions. You choose them. But the data is clear: learners who set specific goals complete 3x more content than those who do not.


  The most effective learning goals are specific and time-bound: not ''learn cybersecurity'' but ''complete the Digital Safety 101 node by the end of this week — 20 minutes a day, 5 days.'' CyberLearn''s daily goal system lets you set 5, 10, 15, or 20 minutes per day. You choose. The platform adapts the review schedule to your pace.


  The Rebuilder Corps uses streaks to track consistency: each day you complete at least one lesson counts as an active day. Missing a day resets your streak — but you have 2 streak freeze tokens per month for emergencies. Consistency beats intensity: 15 minutes every day outperforms a 3-hour session once a week for long-term retention.


  Right now: decide your daily goal. Enter it in the app. Your first mission briefing will be calibrated to that pace.'
briefing_sw: 'MISSION BRIEFING: Kikosi hachagui misheni yako — unachagua wewe mwenyewe. Kujifunza dakika 15 kila siku ni bora kuliko saa 3 mara moja kwa wiki. Weka lengo lako sasa hivi.'
estimated_minutes: 6
