id: cyber-sy0701-d2-w3
course_id: secplus-threats
title: Week 3 — Vulnerability types and mitigations
title_sw: Wiki 3 — Udhaifu na hatua za kukabiliana
briefing: 'Vulnerabilities: hardware (firmware, unpatched BIOS, side channel), operating system, virtualisation, cloud, supply chain, cryptographic (obsolete TLS, weak ciphers), misconfiguration, zero-day, and human. CVSS scores help prioritise but context matters — a 9.8 on an air-gapped trainer laptop is not the same as a 9.8 on the public MIS. Patch, but also compensate when you cannot patch a lab instrument.


  Mitigations in 2.5: segmentation, access control, encryption, monitoring, hardening/baselines, patching, secure SDLC, awareness, and isolation. Least privilege and disabling unused services close default-config surfaces. Application allow-listing beats endless antivirus theatre on a locked lab image. Isolation: VLAN, air-gap when the risk is real, sandbox for unknown files.


  Compensating control example: a vendor device that cannot be patched sits in a firewalled VLAN with no internet and jump-host access only. Document it (Domain 5). Do not hide it.


  Week task: take five campus findings (open port, old TLS, shared admin, unencrypted backup disk, no MFA) and write the mitigation that is actually feasible this term.'
briefing_sw: 'Udhaifu: firmware, OS, wingu, misconfig, zero-day, binadamu. CVSS. Mitigation: segmentation, patch, least privilege, encryption, awareness. Compensating control ikiwa huwezi kupatch.'
estimated_minutes: 32
