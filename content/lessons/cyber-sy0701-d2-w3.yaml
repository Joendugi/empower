    text: You already meet the requirement perfectly
  - id: b
    text: The primary control cannot be applied yet, so an alternative reduces risk
  - id: c
    text: You want to skip the exam
  - id: d
    text: CIA is repealed
  correct_answer: b
  hint: Alternative.
  explanation: Document residual risk. Compensating is also a Domain 1 control type.
  xp_reward: 50
- id: cyber-sy0701-d2-w3-fb1
  type: FILL_BLANK
  prompt: The industry score used to rank vulnerability severity is ___.
  correct_answer: CVSS
  hint: Common Vulnerability Scoring System.
  explanation: Prioritise internet-facing high CVSS first, then context.
  xp_reward: 50
- id: cyber-sy0701-d2-w3-scenario
  type: SCENARIO
  prompt: Lab CNC PC must run an unpatchable Win7 app. Best mitigation set?
  options:
  - id: a
    text: Put it on the student Wi-Fi with a public IP
  - id: b
    text: Isolate VLAN/firewall, block internet, jump host, application allow-list, offline AV, documented exception
  - id: c
    text: Give every student the local admin password
  - id: d
    text: Hash the PLC with MD5 and hope
  correct_answer: b
