exercises:
- id: cyber-sy0701-d2-w3-q1
  type: MULTIPLE_CHOICE
  prompt: 'A zero-day is:'
  options:
  - id: a
    text: A patch released on Monday
  - id: b
    text: A vulnerability without a vendor fix available yet
  - id: c
    text: A type of honeypot
  - id: d
    text: Always CVSS 0.0
  correct_answer: b
  hint: No patch yet.
  explanation: Mitigate with WAF, isolation, threat intel, and compensating controls.
  xp_reward: 50
- id: cyber-sy0701-d2-w3-q2
  type: MULTIPLE_CHOICE
  prompt: 'The most appropriate mitigation for a public WordPress with unused XML-RPC is:'
  options:
  - id: a
    text: Paint the server
  - id: b
    text: Disable the unused service / harden the baseline
  - id: c
    text: Buy a bigger UPS only
  - id: d
    text: Share the admin password more widely
  correct_answer: b
  hint: Attack surface reduction.
  explanation: Hardening is a Domain 2 mitigation and a Domain 4 operations task.
  xp_reward: 50
- id: cyber-sy0701-d2-w3-q3
  type: MULTIPLE_CHOICE
  prompt: 'Segmentation as a mitigation:'
  options:
  - id: a
    text: Puts finance and students on one flat LAN for simplicity
  - id: b
    text: Limits blast radius so ransomware in a lab VLAN is less likely to hit finance
  - id: c
    text: Replaces backups
  - id: d
    text: Is illegal under DPA
  correct_answer: b
  hint: Blast radius.
  explanation: Zero Trust and architecture (Domain 3) implement this idea.
  xp_reward: 50
- id: cyber-sy0701-d2-w3-q4
  type: MULTIPLE_CHOICE
  prompt: 'A compensating control is used when:'
  options:
