id: "electrical-installation-circuits-lesson"
course_id: "electrical-installation"
title: "Final circuits, cables, and conduit"
title_sw: "Circuits, kebo, na conduit"
briefing: "Final circuits are designed: load, length, grouping, insulation, and protective device. A 2.5 mm² radial or ring for sockets is common in examples you will meet — but you follow the drawing and calculation, not a rumour. Cooker and shower circuits are dedicated for a reason.\n\nRing final circuits need both legs continuous; a break turns them into two overloaded radials. Test continuity of ring (r1, rn, r2) as taught. Never spur a spur if the method forbids it.\n\nPVC conduit: cut square, deburr so insulation is not stripped, bend with a spring, and do not overfill. Draw wires with lubricant approved for PVC, not cooking oil. Leave draw wires in spare ways. Box entries must not have sharp edges.\n\nLabel circuits in the CU. The next electrician’s life depends on your marker pen."
briefing_sw: "Fuata drawing. Ring lazima iwe complete. Conduit kata sawa, deburr, usijaze kupita kiasi. Andika majina ya circuits kwenye CU."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/EIT/CR/03/5"
exam_domain: "Installation methods"
exercises:
  - id: "electrical-installation-circuits-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A broken ring final circuit becomes:"
    options:
      - id: "a"
        text: "Safer"
      - id: "b"
        text: "Two radials that may be overloaded"
      - id: "c"
        text: "An RCD"
      - id: "d"
        text: "A bonding conductor"
    correct_answer: "b"
    hint: "Continuity of the ring."
    explanation: "That is why ring tests exist."
    xp_reward: 50
  - id: "electrical-installation-circuits-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Conduit ends are deburred so that:"
    options:
      - id: "a"
        text: "The paint sticks"
      - id: "b"
        text: "Cable insulation is not cut when drawing in"
      - id: "c"
        text: "Earth becomes live"
      - id: "d"
        text: "MCBs trip faster"
    correct_answer: "b"
    hint: "Sharp PVC/metal cuts PVC insulation."
    explanation: "A sliced insulation is a future earth fault."
    xp_reward: 50
  - id: "electrical-installation-circuits-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Why are showers often on their own circuit?"
    options:
      - id: "a"
        text: "Fashion"
      - id: "b"
        text: "High load and diversity — sharing with lights is a fire/nuisance risk"
      - id: "c"
        text: "They need USB"
      - id: "d"
        text: "NITA bans 1.5 mm² everywhere"
    correct_answer: "b"
    hint: "Load."
    explanation: "Design, not tradition alone."
    xp_reward: 50
  - id: "electrical-installation-circuits-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Circuit schedules in the CU are for:"
    options:
      - id: "a"
        text: "Decoration"
      - id: "b"
        text: "Safe isolation and future work — identify the right device"
      - id: "c"
        text: "Hiding spare MCBs"
      - id: "d"
        text: "The painter"
    correct_answer: "b"
    hint: "Identify before isolate."
    explanation: "Unlabelled boards cause wrong isolation."
    xp_reward: 50
  - id: "electrical-installation-circuits-fb1"
    type: "FILL_BLANK"
    prompt: "A socket circuit that loops out and returns to the same MCB is a ___ final circuit."
    correct_answer: "ring"
    hint: "Opposite of radial."
    explanation: "Ring finals are tested for continuity of both legs."
    xp_reward: 50
  - id: "electrical-installation-circuits-scenario"
    type: "SCENARIO"
    prompt: "You find 1.0 mm² twin on a 32 A MCB feeding sockets in a kiosk. What do you do?"
    options:
      - id: "a"
        text: "Leave it — it has worked two weeks"
      - id: "b"
        text: "Treat as a dangerous mismatch; isolate and report/redesign to spec"
      - id: "c"
        text: "Fit a 63 A MCB to help the cable"
      - id: "d"
        text: "Paint the cable yellow"
    correct_answer: "b"
    hint: "Protective device must protect the cable."
    explanation: "Undersized conductors on big MCBs are fire starters."
    xp_reward: 60
