id: cyber-sy0701-d1-w3
course_id: secplus-concepts
title: Week 3 — Cryptography, PKI, and when to use which control
title_sw: Wiki 3 — Kriptografia na PKI
briefing: 'Objective 1.4: appropriate cryptographic solutions. Symmetric (same key, fast, AES) versus asymmetric (key pair, RSA/ECC, for exchange and signatures). Key exchange (Diffie–Hellman and modern variants) lets you agree a session key. Hashing is one-way integrity (SHA-256); salting defends password files; stretching (PBKDF2, bcrypt, scrypt, Argon2) slows guessing. Digital signatures need hashing plus the sender’s private key. Encryption levels: full disk, partition, file, volume, database, record, and transport (TLS).


  PKI: public/private keys, CAs, root of trust, CSR, certificates, wildcards, self-signed versus public CA, CRL and OCSP for revocation, key escrow. Tools: TPM (on the motherboard), HSM (appliance), KMS, secure enclave. Obfuscation is not encryption: steganography, tokenization, masking. Blockchain/open ledgers appear as integrity/timestamp use cases — not a substitute for access control on the MIS.


  Kenyan practice: HTTPS on student portals, disk encryption on laptops that leave campus, signed mail for finance, and M-Pesa PIN never stored as unsalted MD5. Self-signed certs on public portals train users to click through warnings — that is a program-management failure as well as crypto misuse.


  Exam trap: hashing is not encryption; you cannot decrypt a hash. Confidentiality of a file in transit is TLS or a file cipher, not SHA. Integrity of a download is a published hash or a signature.'
briefing_sw: AES ni symmetric; RSA/ECC ni asymmetric. Hash ni one-way; salt na stretching kwa nywila. TLS ni usafiri. CA, CSR, CRL/OCSP. TPM/HSM. Hash si encryption.
