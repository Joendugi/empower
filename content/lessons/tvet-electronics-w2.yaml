exercises:
- id: tvet-electronics-w2-q1
  type: MULTIPLE_CHOICE
  prompt: 'A silicon diode is forward biased when:'
  options:
  - id: a
    text: The N-side is more positive than the P-side
  - id: b
    text: The P-side is more positive than the N-side, around 0.7 V drop
  - id: c
    text: Both sides are at 0 V
  - id: d
    text: It is an inductor
  correct_answer: b
  hint: P to N, conventional current.
  explanation: Forward bias lets current flow. Reverse bias blocks until breakdown.
  xp_reward: 50
- id: tvet-electronics-w2-q2
  type: MULTIPLE_CHOICE
  prompt: Which component stores energy in an electric field and is often polarised?
  options:
  - id: a
    text: Carbon resistor
  - id: b
    text: Electrolytic capacitor
  - id: c
    text: Fuse only
  - id: d
    text: RJ45 jack
  correct_answer: b
  hint: Stripe or minus mark.
  explanation: Reverse an electrolytic and it can vent. Ceramics are usually non-polar.
  xp_reward: 50
- id: tvet-electronics-w2-q3
  type: MULTIPLE_CHOICE
  prompt: 'N-type semiconductor is created by doping that provides extra:'
  options:
  - id: a
    text: Holes only
  - id: b
    text: Free electrons
  - id: c
    text: Photons
  - id: d
    text: Neutrons as current
  correct_answer: b
  hint: Negative carriers.
  explanation: P-type has holes. N-type has electrons. That is the CDACC oral.
  xp_reward: 50
- id: tvet-electronics-w2-q4
  type: MULTIPLE_CHOICE
  prompt: 'Diode mode on a meter across a good silicon diode typically shows:'
  options:
  - id: a
    text: About 0.5–0.8 V one way and open the other way
  - id: b
    text: 0 Ω both ways
  - id: c
    text: OL both ways always if it is good
  - id: d
    text: Exactly 5 V
  correct_answer: a
  hint: One way conducts.
  explanation: Short both ways = dead. Open both ways = open diode (except some LEDs needing more voltage).
  xp_reward: 50
- id: tvet-electronics-w2-fb1
  type: FILL_BLANK
  prompt: The marked end of a through-hole diode is usually the ___.
  correct_answer: cathode
  hint: Band / stripe.
  explanation: Current in conventional notation enters the anode and leaves the cathode when forward biased.
  xp_reward: 50
- id: tvet-electronics-w2-scenario
  type: SCENARIO
  prompt: A replacement 7805 regulator runs scalding and the 5 V rail is 1.2 V. First electronics check?
  options:
  - id: a
    text: Increase the wall voltage
  - id: b
    text: Look for a shorted load or reversed polar capacitor on the 5 V rail, then confirm the regulator orientation
  - id: c
    text: Replace the CPU first
  - id: d
    text: Ignore heat — regulators should glow
  correct_answer: b
  hint: Heat plus low rail = too much current or wrong part.
  explanation: A shorted tantalum or backwards electrolytic will cook a regulator. Find the short.
  xp_reward: 60
