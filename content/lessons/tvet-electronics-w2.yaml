id: tvet-electronics-w2
course_id: basic-electronics
title: Week 2 — Components, semiconductors, and the P–N junction
title_sw: Wiki 2 — Vipengele, semiconductor, na P–N junction
briefing: 'Identify passive and active parts by symbol and body: resistor (colour code or printed value), capacitor (polar electrolytic vs non-polar ceramic), inductor, diode, LED, and transistor. Integrated circuits pack many junctions in one package. The colour code is still assessed: first bands are significant digits, then multiplier, then tolerance. A burnt resistor is often a symptom — find why current was high before you replace it.


  Semiconductor theory: silicon (and historically germanium) atoms share electrons in a crystal. Doping with impurities creates N-type (extra electrons) and P-type (holes). A P–N junction diode conducts when forward biased (P more positive than N, about 0.7 V for silicon) and blocks when reverse biased until breakdown. That is why a PSU diode oriented backwards does nothing useful, and why you must check polarity on electrolytics and LEDs.


  Bipolar transistors are NPN or PNP sandwiches. They act as switches or amplifiers: a small base current controls a larger collector current. In ICT repair you meet them as regulators, MOSFET switches on motherboards, and optocouplers. You do not need to design an RF amp, but you must know “open diode” versus “shorted MOSFET” on a meter in diode mode.


  ESD still applies: MOS inputs are fragile. Use the wrist strap from the safety unit. Store MOSFETs in foam. Assessors may ask you to identify a diode band (cathode) and to state forward voltage. Wrong polarity on a replacement rectifier is a classic fail.'
briefing_sw: Resistor, capacitor, diode, transistor, IC. Silicon ina P-type na N-type. Diode inapitisha mbele (~0.7 V) na kuzuia nyuma. Transistor ni swichi au amplifier. Band ya diode ni cathode. Polar electrolytic ina polarity.
