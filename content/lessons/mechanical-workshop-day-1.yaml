briefing: 'In mechanical fabrication and machine repair, visual estimation leads to loose bearings, vibrating
  shafts, and catastrophic equipment failure. A master mechanic works to strict tolerances using precision
  instruments: the vernier caliper (0.02 mm resolution), the outside micrometer (0.01 mm resolution),
  and optical dial indicators. This lesson covers reading vernier scales, correct zeroing, parallax avoidance,
  hand filing techniques, and engineer''s blue surface scraping for creating true mating surfaces.

  '
outline: 'Vernier caliper reading and internal/external/depth measurement; outside micrometer calibration,
  ratchet thimble use, and zero-error correction; dial test indicators (DTI) and runout measurement; layout
  tools (scriber, prick punch, engineer''s square, hermaphrodite calipers); file cuts (bastard, second
  cut, smooth), cross-filing, and draw-filing techniques; engineer''s blue surface scraping for flat bearing
  surfaces.

  '
content_md: "## The Hierarchy of Workshop Measurement\n\nFabrication tolerances determine the required\
  \ measuring instrument:\n\n| Instrument | Typical resolution | Primary use |\n|---|---|---|\n| Steel\
  \ rule | 0.5 mm – 1.0 mm | Rough stock sizing, general layout |\n| Vernier caliper | 0.02 mm (1/50 mm)\
  \ | Internal/external diameters, step depths |\n| Digital caliper | 0.01 mm | Fast workshop verification\
  \ |\n| Outside micrometer | 0.01 mm (0.001 mm with vernier) | Shaft diameters, bearing journals, shims\
  \ |\n| Dial Test Indicator (DTI) | 0.01 mm | Shaft runout, truing work in a lathe chuck |\n| Feeler\
  \ gauges | 0.03 – 1.00 mm | Spark plug gaps, valve clearances, bearing backlash |\n\n## Reading the\
  \ Vernier Caliper (0.02 mm Scale)\n\nA standard metric vernier caliper has 50 divisions on the slider\
  \ scale spanning\n49 mm on the main beam. Each vernier division equals `49 / 50 = 0.98 mm`.\nThe difference\
  \ between a main scale division (1.00 mm) and a vernier division\nis `1.00 - 0.98 = 0.02 mm`.\n\n###\
  \ Reading Steps:\n1. **Main Scale**: Read the whole millimetre line immediately to the left of the vernier\
  \ scale's `0` line.\n2. **Vernier Scale**: Locate the single vernier division line that aligns perfectly\
  \ with any main scale line.\n3. **Calculation**: Total reading = `Main scale (mm) + (Coinciding vernier\
  \ line number × 0.02 mm)`.\n\n*Example*: Main scale reads past 24 mm. Vernier line 17 aligns with a\
  \ main scale line.\nReading = `24.00 mm + (17 × 0.02 mm) = 24.34 mm`.\n\n## The Outside Micrometer (0.01\
  \ mm Resolution)\n\nThe micrometer uses a precision pitch screw (0.50 mm per complete revolution) and\n\
  a thimble divided into 50 equal increments.\nOne thimble division = `0.50 mm / 50 = 0.01 mm`.\n\n###\
  \ Essential Operating Rules:\n- **Always use the ratchet stop or friction thimble**: Never tighten using\
  \ the main thimble; excessive torque springs the C-frame, introducing 0.03–0.05 mm error.\n- **Zero\
  \ Error Check**: Clean anvil faces with clean paper, close gently using the ratchet (3 clicks). If zero\
  \ line does not align with the sleeve index line:\n  - **Positive error**: Reading is greater than zero;\
  \ subtract from final reading.\n  - **Negative error**: Reading is behind zero; add to final reading.\n\
  \  - Or adjust the sleeve using the supplied C-spanner.\n\n## Bench Layout Tools & Methods\n\nAccurate\
  \ machining begins with precise marking out on raw stock:\n- **Layout dye (Engineer's Blue or Dykem)**:\
  \ Thin, uniform coat provides high-contrast background for scribing.\n- **Tungsten Carbide Scriber**:\
  \ Held at 75° angle, pulled firmly once to cut through the blue layer into the metal. Never scribe multiple\
  \ times over the same line.\n- **Prick Punch (30° included angle)**: Used for precise layout intersections;\
  \ creates a tiny dimple to locate compasses or dividers.\n- **Center Punch (90° included angle)**: Follows\
  \ the prick punch to enlarge the dimple into a seat that prevents twist drills from wandering.\n- **Engineer's\
  \ Try Square**: Checked against a known granite surface plate. Light gap under the blade indicates non-perpendicular\
  \ edges.\n\n## Hand Filing Fundamentals\n\nFiling is not abrasive rubbing; each tooth is a miniature\
  \ cutting chisel that cuts only on the **forward stroke**.\n\n### File Classifications:\n- **Bastard\
  \ cut**: Coarse teeth; for rapid material removal (0.5 mm or more).\n- **Second cut**: Medium spacing;\
  \ for sizing within 0.1 mm of layout line.\n- **Smooth cut**: Fine teeth; for final sizing and surface\
  \ finish within 0.02 mm.\n\n### Techniques:\n- **Cross-filing**: Pushing the file diagonally across\
  \ the work at 45° with full forward body weight. Relieve pressure on the return stroke to prevent dulling\
  \ teeth.\n- **Draw-filing**: Holding the file flat with both hands at 90° to the stroke and sliding\
  \ back and forth along the workpiece. Removes file marks and leaves a satin finish.\n- **Pinning & File\
  \ Carding**: When soft metals (aluminium, brass) clog file teeth (pinning), they scratch the work. Clean\
  \ teeth frequently with a wire **file card** brushed parallel to tooth grooves. Rubbing chalk into the\
  \ file prevents chips from sticking.\n"
exercises:
- id: mech-d1-q1
  type: MULTIPLE_CHOICE
  prompt: 'A mechanic measures an electric motor shaft with a 0.02 mm vernier caliper. The vernier zero
    is past the 38 mm main scale line. The 34th division on the vernier slider aligns exactly with a main
    scale graduation. What is the measured diameter?

    '
  xp_reward: 50
  options:
  - id: a
    text: 38.34 mm
  - id: b
    text: 38.17 mm
  - id: c
    text: 38.68 mm
  - id: d
    text: 39.68 mm
  explanation: 'Reading = 38.00 mm + (34 × 0.02 mm) = 38.00 mm + 0.68 mm = 38.68 mm.


    Why the other options are wrong: This directly adds the division count without multiplying by the
    0.02 mm resolution factor. This improperly divides the 34 divisions by 2 instead of multiplying by
    0.02. The zero line has only passed 38 mm, not 39 mm.'
  correct_answer: c
- id: mech-d1-q2
  type: FILL_BLANK
  prompt: 'An outside micrometer has a screw spindle pitch of ___ mm per complete turn, and its thimble
    is divided into ___ equal graduations, yielding a measurement resolution of ___ mm.

    '
  xp_reward: 50
  correct_answer:
  - 0.5 mm
  - '50'
  - 0.01 mm
  explanation: 'A metric micrometer screw moves 0.5 mm per full 360-degree rotation. Dividing 0.5 mm by
    50 thimble marks produces 0.01 mm per division.

    '
- id: mech-d1-q3
  type: MATCH_PAIRS
  prompt: Match each workshop punch and file type to its correct engineering function.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Prick Punch (30 degree point)
    right:
      id: r-4eec50
      text: Creates precise tiny locator dimple at layout line intersections
  - left:
      id: l2
      text: Center Punch (90 degree point)
    right:
      id: r-317013
      text: Enlarges locator dimple to seat and guide twist drill tips
  - left:
      id: l3
      text: Bastard Cut File
    right:
      id: r-c8d8d5
      text: Heavy metal removal when working down rough stock to near size
  - left:
      id: l4
      text: Draw-filing
    right:
      id: r-768cb0
      text: Moving file sideways along work to produce smooth scratch-free finish
  correct_answer:
  - l1=r-4eec50
  - l2=r-317013
  - l3=r-c8d8d5
  - l4=r-768cb0
  explanation: 'Prick punches (30°) are sharp for accurate visual placement on scribed lines. Center punches
    (90°) match typical drill chisel edges. Bastard files remove stock, and draw-filing smooths the surface.

    '
- id: mech-d1-q4
  type: MULTIPLE_CHOICE
  prompt: 'When closing an outside micrometer onto a cylindrical workpiece, why is it critical to turn
    the ratchet speeder rather than rotating the main thimble?

    '
  xp_reward: 50
  options:
  - id: a
    text: The ratchet stop speeds up the measurement process by spinning freely
  - id: b
    text: The main thimble is locked during measurement and cannot be turned
  - id: c
    text: The ratchet slips at a calibrated torque (approx. 5-10 N), preventing frame flex and spindle
      deformation that cause false high or low readings
  - id: d
    text: Turning the thimble reverses the zero error on the barrel
  explanation: 'Gripping and turning the thimble by hand can easily exert 30-50 N of force, flexing the
    forged C-frame by 0.02-0.05 mm and giving inaccurate measurements or damaging the micro-threads.


    Why the other options are wrong: The purpose of the ratchet stop is precision torque control, not
    speed. The thimble is free to turn unless the locking lever is engaged. Zero error is adjusted using
    the barrel spanner, not by how the thimble is turned.'
  correct_answer: c
- id: mech-d1-q5
  type: FILL_BLANK
  prompt: 'When filing soft metals like aluminium, metal particles clog the file teeth in a defect called
    ___. This is prevented by rubbing ___ into the file face and cleared using a ___.

    '
  xp_reward: 50
  correct_answer:
  - pinning
  - chalk
  - file card
  explanation: 'Pinning occurs when soft chips weld into tooth gullets and gouge the work. Chalk fills
    gullets temporarily so chips cannot bond, and a brass/steel wire file card clears trapped pins.

    '
