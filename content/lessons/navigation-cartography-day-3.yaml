briefing: 'When you are lost in unfamiliar territory, the map and compass alone cannot save you unless
  you can answer the foundational question: ''Where on this map am I standing right now?'' Through the
  mathematical technique of Resection (triangulation from known landmarks), an explorer can determine
  their exact 8-figure map coordinate within 20 metres without electronics. This lesson covers identifying
  prominent topographic features, sighting magnetic bearings, converting to grid back-bearings, plotting
  lines of position, resolving the ''Triangle of Error'', and using linear features as handrails and catching
  features.

  '
outline: 'The geometric principle of resection (sighting unknown position from known points); identifying
  distinct landmarks on map and terrain (peaks, radio masts, water towers, road junctions); taking precision
  magnetic bearings with a prismatic compass; converting to Grid Back-Bearings; plotting lines of position
  (LOP) with protractor; the 2-point resection vs the gold-standard 3-point resection; resolving the ''Triangle
  of Error'' (cocked hat) using the rule of signs; using handrails, baselines, and catching features to
  prevent overshooting; aiming off technique.

  '
content_md: "## The Geometry of Resection\n\n**Resection** is the method of locating your unknown position\
  \ on a map by sighting\nbearings to two or more distant prominent landmarks whose locations are already\n\
  known and marked on your map sheet.\n\n```\n     Landmark A (Radio Mast)                 Landmark B\
  \ (Hill Peak)\n               ▲                                       ▲\n                \\        \
  \                             /\n                 \\                                   /\n         \
  \         \\   Back-Bearing A               /   Back-Bearing B\n                   \\              \
  \                /\n                    \\                            /\n                     \\   \
  \                       /\n                      \\                        /\n                     \
  \  \\                      /\n                        \\                    /\n                    \
  \     └───────[ X ]──────┘\n                             Your Position\n```\n\n### Theoretical Basis:\n\
  1. If you stand at point $X$ and measure a magnetic bearing to Landmark $A$, you know that Landmark\
  \ $A$ lies along that line.\n2. Conversely, looking from Landmark $A$ toward you, you lie along the\
  \ exact **Back-Bearing** line ($180^\\circ$ reverse).\n3. Sighting a second landmark ($B$) creates a\
  \ second line of position.\n4. **The Intersection Point ($X$) of the two lines defines your exact physical\
  \ position on the map!**\n\n## The 5-Step Resection Field Protocol\n\n### Step 1: Select 2 or 3 Distinct\
  \ Landmarks\n- Choose prominent, unmistakable features visible both on the ground and on the map (e.g.,\
  \ Mount Longonot crater rim, a cell tower, a concrete water reservoir, an isolated volcanic cone).\n\
  - **The Angle Rule**: The landmarks should be separated by **between 60° and 120°** (ideally 90° apart).\
  \ Avoid landmarks that are nearly in line ($< 30^\\circ$ apart), as small compass errors will slide\
  \ the intersection point hundreds of metres along the line.\n\n### Step 2: Take Precision Magnetic Bearings\n\
  - Hold the prismatic compass level.\n- Sight Landmark $A$ through the prism and wire; let the dial settle.\n\
  - Record the reading to the nearest **0.5 degree**: say, **$\\theta_A = 044^\\circ\\text{ Magnetic}$**.\n\
  - Sight Landmark $B$: say, **$\\theta_B = 136^\\circ\\text{ Magnetic}$**.\n- Sight Landmark $C$ (3rd\
  \ verification point): say, **$\\theta_C = 282^\\circ\\text{ Magnetic}$**.\n\n### Step 3: Convert to\
  \ Grid Bearings\nConvert field magnetic readings to map grid bearings using your local Grid Magnetic\
  \ Angle (GMA):\n- Suppose $\\text{GMA} = 2^\\circ\\text{ East}$.\n- Rule: *Mag to Grid with East declination:\
  \ ADD East*.\n- $\\text{Grid}_A = 44^\\circ + 2^\\circ = \\mathbf{046^\\circ\\text{ Grid}}$\n- $\\text{Grid}_B\
  \ = 136^\\circ + 2^\\circ = \\mathbf{138^\\circ\\text{ Grid}}$\n- $\\text{Grid}_C = 282^\\circ + 2^\\\
  circ = \\mathbf{284^\\circ\\text{ Grid}}$\n\n### Step 4: Calculate the Reverse Back-Bearings\n$$\\text{Back-Bearing}\
  \ = \\text{Bearing} \\pm 180^\\circ$$\n- $\\text{Back-Bearing}_A = 046^\\circ + 180^\\circ = \\mathbf{226^\\\
  circ}$\n- $\\text{Back-Bearing}_B = 138^\\circ + 180^\\circ = \\mathbf{318^\\circ}$\n- $\\text{Back-Bearing}_C\
  \ = 284^\\circ - 180^\\circ = \\mathbf{104^\\circ}$\n\n### Step 5: Plot on the Map with a Protractor\n\
  1. Place the center hole of a military service protractor directly over Landmark $A$ on the map, with\
  \ the 0° index aligned strictly with Grid North.\n2. Make a fine pencil tick mark at $226^\\circ$.\n\
  3. Draw a long, thin ray line through Landmark $A$ and the tick mark extending across your suspected\
  \ area.\n4. Repeat for Landmark $B$ (ray at $318^\\circ$) and Landmark $C$ (ray at $104^\\circ$).\n\n\
  ## Resolving the \"Triangle of Error\" (Cocked Hat)\n\nIn practical navigation, human sighting variance\
  \ and map scale drawing tolerances\nmean three back-bearing rays rarely intersect at a single microscopic\
  \ point.\nInstead, they form a small triangle called the **Triangle of Error** (or \"Cocked Hat\"):\n\
  \n```\n                       \\             /\n                        \\           /\n           \
  \              \\   Line A/\n                          \\       /\n                           ┌─────┐\n\
  \                           │  •  │ <── True Position\n                           │     │\n        \
  \                  /└─────┘\\\n                         /  Line B \\\n                        /    \
  \       \\\n```\n\n### Estimating True Position:\n- **Small Triangle ($< 3\\text{ mm}$ across on 1:50,000\
  \ / $< 150\\text{ m}$ on ground)**:\n  Mark your position at the **geometric center** of the triangle.\n\
  - **Large Triangle ($> 5\\text{ mm}$ across)**:\n  A reading error occurred!\n  1. Check if you added\
  \ GMA instead of subtracting.\n  2. Check if a nearby vehicle or rifle deflected the compass.\n  3.\
  \ Re-sight the landmarks.\n\n## Single-Point Resection (Using Linear Features)\n\nIf you only have **one\
  \ visible landmark**, you can still fix your position if you are\nstanding on a distinct **linear feature**\
  \ (road, riverbank, railway line, ridge crest,\nor transmission power line):\n1. Sight the single landmark;\
  \ calculate and plot the back-bearing ray.\n2. The point where the ray line cuts across the road/river\
  \ you are walking along is your **exact location**!\n\n## Tactical Movement: Handrails & Catching Features\n\
  \nExperienced bush navigators rarely walk on a pure compass bearing through thick bush\nwhen terrain\
  \ offers natural guidance:\n\n### 1. Handrails:\nA continuous linear feature running parallel to your\
  \ intended route of march (e.g., a river, a ridgeline, or an old wire fence).\n- Keep the handrail 100–200\
  \ metres to your left or right. It prevents lateral drift without requiring continuous compass checking.\n\
  \n### 2. Catching Features (Backstops):\nA prominent, unmistakable barrier lying perpendicular across\
  \ your path immediately **behind** your objective (e.g., a major tarmac road, a deep river gorge, or\
  \ a railway track).\n- If your objective is a small campsite at 3 km, and you suddenly hit the railway\
  \ track at 4 km, the catching feature immediately tells you: **\"You have overshot the camp—stop and\
  \ reverse!\"**\n\n### 3. Aiming Off:\nIf a destination lies along a linear feature (e.g., a bridge crossing\
  \ a stream in heavy fog), walking directly on a compass bearing risks hitting the stream bank without\
  \ knowing whether the bridge is to your left or right.\n- **The Technique**: Deliberately aim your compass\
  \ bearing **3° to 5° to the LEFT (or right)** of the bridge.\n- When you hit the stream, you know with\
  \ **100% certainty** that the bridge lies to your RIGHT. Turn right and follow the bank directly to\
  \ the crossing!\n"
exercises:
- id: nav-d3-q1
  type: MULTIPLE_CHOICE
  prompt: 'You are lost in scrubland. You sight a prominent telecommunications mast at 090° Magnetic and
    an isolated volcanic crater hill at 180° Magnetic. The local Grid Magnetic Angle is 2° East. What
    are the grid back-bearings you must plot on the map to find your position?

    '
  xp_reward: 50
  options:
  - id: a
    text: From the Mast plot 090°; from the Crater plot 180°
  - id: b
    text: From the Mast plot 268°; from the Crater plot 358°
  - id: c
    text: From the Mast plot 180°; from the Crater plot 090°
  - id: d
    text: From the Mast plot 272° Grid; from the Crater plot 002° Grid
  explanation: '1. Convert to Grid: Mag to Grid with East declination: ADD East: Mast Grid = 090° + 2°
    = 092°; Crater Grid = 180° + 2° = 182°. 2. Calculate Back-Bearings: Mast = 092° + 180° = 272°; Crater
    = 182° - 180° = 002°. Sighting back from these map features at 272° and 002° intersects at your location.


    Why the other options are wrong: This neglects both the declination correction and the 180° back-bearing
    reversal. This improperly subtracted the East declination instead of adding it. This simply swaps
    the two readings.'
  correct_answer: d
- id: nav-d3-q2
  type: FILL_BLANK
  prompt: 'When plotting back-bearings from three distant landmarks on a map, the small imperfect triangle
    formed by the three lines of position is called the Triangle of ___, and the navigator''s estimated
    position is taken at its geometric ___.

    '
  xp_reward: 50
  correct_answer:
  - Error
  - center
  explanation: 'The Triangle of Error (cocked hat) arises from small sighting and drawing variances. The
    estimated location lies at the geometric center of the triangle.

    '
- id: nav-d3-q3
  type: MATCH_PAIRS
  prompt: Match each terrain navigation technique to its practical strategic function.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Resection
    right:
      id: r-fb4257
      text: Sighting two or three known landmarks to pinpoint an unknown observer location
  - left:
