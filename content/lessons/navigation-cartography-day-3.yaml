briefing: >
  When you are lost in unfamiliar territory, the map and compass alone cannot save
  you unless you can answer the foundational question: 'Where on this map am I standing
  right now?' Through the mathematical technique of Resection (triangulation from
  known landmarks), an explorer can determine their exact 8-figure map coordinate
  within 20 metres without electronics. This lesson covers identifying prominent
  topographic features, sighting magnetic bearings, converting to grid back-bearings,
  plotting lines of position, resolving the 'Triangle of Error', and using linear
  features as handrails and catching features.

outline: >
  The geometric principle of resection (sighting unknown position from known points);
  identifying distinct landmarks on map and terrain (peaks, radio masts, water towers,
  road junctions); taking precision magnetic bearings with a prismatic compass;
  converting to Grid Back-Bearings; plotting lines of position (LOP) with protractor;
  the 2-point resection vs the gold-standard 3-point resection; resolving the
  'Triangle of Error' (cocked hat) using the rule of signs; using handrails,
  baselines, and catching features to prevent overshooting; aiming off technique.

content_md: |
  ## The Geometry of Resection

  **Resection** is the method of locating your unknown position on a map by sighting
  bearings to two or more distant prominent landmarks whose locations are already
  known and marked on your map sheet.

  ```
       Landmark A (Radio Mast)                 Landmark B (Hill Peak)
                 ▲                                       ▲
                  \                                     /
                   \                                   /
                    \   Back-Bearing A               /   Back-Bearing B
                     \                              /
                      \                            /
                       \                          /
                        \                        /
                         \                      /
                          \                    /
                           └───────[ X ]──────┘
                               Your Position
  ```

  ### Theoretical Basis:
  1. If you stand at point $X$ and measure a magnetic bearing to Landmark $A$, you know that Landmark $A$ lies along that line.
  2. Conversely, looking from Landmark $A$ toward you, you lie along the exact **Back-Bearing** line ($180^\circ$ reverse).
  3. Sighting a second landmark ($B$) creates a second line of position.
  4. **The Intersection Point ($X$) of the two lines defines your exact physical position on the map!**

  ## The 5-Step Resection Field Protocol

  ### Step 1: Select 2 or 3 Distinct Landmarks
  - Choose prominent, unmistakable features visible both on the ground and on the map (e.g., Mount Longonot crater rim, a cell tower, a concrete water reservoir, an isolated volcanic cone).
  - **The Angle Rule**: The landmarks should be separated by **between 60° and 120°** (ideally 90° apart). Avoid landmarks that are nearly in line ($< 30^\circ$ apart), as small compass errors will slide the intersection point hundreds of metres along the line.

  ### Step 2: Take Precision Magnetic Bearings
  - Hold the prismatic compass level.
  - Sight Landmark $A$ through the prism and wire; let the dial settle.
  - Record the reading to the nearest **0.5 degree**: say, **$\theta_A = 044^\circ\text{ Magnetic}$**.
  - Sight Landmark $B$: say, **$\theta_B = 136^\circ\text{ Magnetic}$**.
  - Sight Landmark $C$ (3rd verification point): say, **$\theta_C = 282^\circ\text{ Magnetic}$**.

  ### Step 3: Convert to Grid Bearings
  Convert field magnetic readings to map grid bearings using your local Grid Magnetic Angle (GMA):
  - Suppose $\text{GMA} = 2^\circ\text{ East}$.
  - Rule: *Mag to Grid with East declination: ADD East*.
  - $\text{Grid}_A = 44^\circ + 2^\circ = \mathbf{046^\circ\text{ Grid}}$
  - $\text{Grid}_B = 136^\circ + 2^\circ = \mathbf{138^\circ\text{ Grid}}$
  - $\text{Grid}_C = 282^\circ + 2^\circ = \mathbf{284^\circ\text{ Grid}}$

  ### Step 4: Calculate the Reverse Back-Bearings
  $$\text{Back-Bearing} = \text{Bearing} \pm 180^\circ$$
  - $\text{Back-Bearing}_A = 046^\circ + 180^\circ = \mathbf{226^\circ}$
  - $\text{Back-Bearing}_B = 138^\circ + 180^\circ = \mathbf{318^\circ}$
  - $\text{Back-Bearing}_C = 284^\circ - 180^\circ = \mathbf{104^\circ}$

  ### Step 5: Plot on the Map with a Protractor
  1. Place the center hole of a military service protractor directly over Landmark $A$ on the map, with the 0° index aligned strictly with Grid North.
  2. Make a fine pencil tick mark at $226^\circ$.
  3. Draw a long, thin ray line through Landmark $A$ and the tick mark extending across your suspected area.
  4. Repeat for Landmark $B$ (ray at $318^\circ$) and Landmark $C$ (ray at $104^\circ$).

  ## Resolving the "Triangle of Error" (Cocked Hat)

  In practical navigation, human sighting variance and map scale drawing tolerances
  mean three back-bearing rays rarely intersect at a single microscopic point.
  Instead, they form a small triangle called the **Triangle of Error** (or "Cocked Hat"):

  ```
                         \             /
                          \           /
                           \   Line A/
                            \       /
                             ┌─────┐
                             │  •  │ <── True Position
                             │     │
                            /└─────┘\
                           /  Line B \
                          /           \
  ```

  ### Estimating True Position:
  - **Small Triangle ($< 3\text{ mm}$ across on 1:50,000 / $< 150\text{ m}$ on ground)**:
    Mark your position at the **geometric center** of the triangle.
  - **Large Triangle ($> 5\text{ mm}$ across)**:
    A reading error occurred!
    1. Check if you added GMA instead of subtracting.
    2. Check if a nearby vehicle or rifle deflected the compass.
    3. Re-sight the landmarks.

  ## Single-Point Resection (Using Linear Features)

  If you only have **one visible landmark**, you can still fix your position if you are
  standing on a distinct **linear feature** (road, riverbank, railway line, ridge crest,
  or transmission power line):
  1. Sight the single landmark; calculate and plot the back-bearing ray.
  2. The point where the ray line cuts across the road/river you are walking along is your **exact location**!

  ## Tactical Movement: Handrails & Catching Features

  Experienced bush navigators rarely walk on a pure compass bearing through thick bush
  when terrain offers natural guidance:

  ### 1. Handrails:
  A continuous linear feature running parallel to your intended route of march (e.g., a river, a ridgeline, or an old wire fence).
  - Keep the handrail 100–200 metres to your left or right. It prevents lateral drift without requiring continuous compass checking.

  ### 2. Catching Features (Backstops):
  A prominent, unmistakable barrier lying perpendicular across your path immediately **behind** your objective (e.g., a major tarmac road, a deep river gorge, or a railway track).
  - If your objective is a small campsite at 3 km, and you suddenly hit the railway track at 4 km, the catching feature immediately tells you: **"You have overshot the camp—stop and reverse!"**

  ### 3. Aiming Off:
  If a destination lies along a linear feature (e.g., a bridge crossing a stream in heavy fog), walking directly on a compass bearing risks hitting the stream bank without knowing whether the bridge is to your left or right.
  - **The Technique**: Deliberately aim your compass bearing **3° to 5° to the LEFT (or right)** of the bridge.
  - When you hit the stream, you know with **100% certainty** that the bridge lies to your RIGHT. Turn right and follow the bank directly to the crossing!

exercises:
  - id: nav-d3-q1
    type: MULTIPLE_CHOICE
    prompt: >
      You are lost in scrubland. You sight a prominent telecommunications mast at 090° Magnetic
      and an isolated volcanic crater hill at 180° Magnetic. The local Grid Magnetic
      Angle is 2° East. What are the grid back-bearings you must plot on the map to find your position?
    xp_reward: 50
    options:
      - text: "From the Mast plot 272° Grid; from the Crater plot 002° Grid"
        correct: true
        explanation: "1. Convert to Grid: Mag to Grid with East declination: ADD East: Mast Grid = 090° + 2° = 092°; Crater Grid = 180° + 2° = 182°. 2. Calculate Back-Bearings: Mast = 092° + 180° = 272°; Crater = 182° - 180° = 002°. Sighting back from these map features at 272° and 002° intersects at your location."
      - text: "From the Mast plot 090°; from the Crater plot 180°"
        correct: false
        explanation: "This neglects both the declination correction and the 180° back-bearing reversal."
      - text: "From the Mast plot 268°; from the Crater plot 358°"
        correct: false
        explanation: "This improperly subtracted the East declination instead of adding it."
      - text: "From the Mast plot 180°; from the Crater plot 090°"
        correct: false
        explanation: "This simply swaps the two readings."

  - id: nav-d3-q2
    type: FILL_BLANK
    prompt: >
      When plotting back-bearings from three distant landmarks on a map, the small
      imperfect triangle formed by the three lines of position is called the
      Triangle of ___, and the navigator's estimated position is taken at its
      geometric ___.
    xp_reward: 50
    correct_answer: "Error; center"
    explanation: >
      The Triangle of Error (cocked hat) arises from small sighting and drawing variances.
      The estimated location lies at the geometric center of the triangle.

  - id: nav-d3-q3
    type: MATCH_PAIRS
    prompt: Match each terrain navigation technique to its practical strategic function.
    xp_reward: 50
    pairs:
      - left: Resection
        right: Sighting two or three known landmarks to pinpoint an unknown observer location
      - left: Handrail
        right: Linear feature (river, ridge, road) followed parallel to route of march
      - left: Catching Feature
        right: Prominent perpendicular barrier indicating a target destination has been overshot
      - left: Aiming Off
        right: Deliberately biasing a bearing to one side of a target located on a linear feature
    correct_answer: null
    explanation: >
      Resection fixes position; handrails guide travel; catching features stop overshooting;
      aiming off ensures you know which way to turn when reaching a linear target.

  - id: nav-d3-q4
    type: MULTIPLE_CHOICE
    prompt: >
      Why should the two distant landmarks chosen for a resection fix ideally be
      separated by approximately 60° to 120° (near 90°) relative to the observer?
    xp_reward: 50
    options:
      - text: "Perpendicular lines of position produce a clean, sharp, unambiguous intersection; lines crossing at shallow angles (e.g. 15°) cause small sighting errors to slide the position fix hundreds of metres along the line"
        correct: true
        explanation: "Geometry dictates that lines intersecting at 90° have maximum position certainty. Shallow intersection angles (< 30° or > 150°) magnify minute angular sighting errors into massive longitudinal displacement errors."
      - text: "Because compasses only function accurately when pointed east and north"
        correct: false
        explanation: "A compass functions equally in all 360 degrees."
      - text: "To avoid needing to use a protractor on the map"
        correct: false
        explanation: "A protractor is always required to plot bearings on a map."
      - text: "Because 90 degrees eliminates magnetic declination"
        correct: false
        explanation: "Declination is an atmospheric/geomagnetic constant independent of the landmark angle."

  - id: nav-d3-q5
    type: FILL_BLANK
    prompt: >
      If you are lost along a distinct, known dirt road printed on your topographic map,
      you need to sight only ___ prominent distant landmark to fix your exact coordinate,
      because your location is the point where the landmark's back-bearing crosses the ___.
    xp_reward: 50
    correct_answer: "one; road"
    explanation: >
      Standing on a linear feature provides one known line of position. Sighting a single
      landmark provides the intersecting cross-line, pinpointing the location.
