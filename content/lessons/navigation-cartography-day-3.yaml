      text: Prominent perpendicular barrier indicating a target destination has been overshot
  - left:
      id: l4
      text: Aiming Off
    right:
      id: r-d82344
      text: Deliberately biasing a bearing to one side of a target located on a linear feature
  correct_answer:
  - l1=r-fb4257
  - l2=r-ab75a8
  - l3=r-42e025
  - l4=r-d82344
  explanation: 'Resection fixes position; handrails guide travel; catching features stop overshooting;
    aiming off ensures you know which way to turn when reaching a linear target.

    '
- id: nav-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why should the two distant landmarks chosen for a resection fix ideally be separated by approximately
    60° to 120° (near 90°) relative to the observer?

    '
  xp_reward: 50
  options:
  - id: a
    text: Because compasses only function accurately when pointed east and north
  - id: b
    text: To avoid needing to use a protractor on the map
  - id: c
    text: Because 90 degrees eliminates magnetic declination
  - id: d
    text: Perpendicular lines of position produce a clean, sharp, unambiguous intersection; lines crossing
      at shallow angles (e.g. 15°) cause small sighting errors to slide the position fix hundreds of metres
      along the line
  explanation: 'Geometry dictates that lines intersecting at 90° have maximum position certainty. Shallow
    intersection angles (< 30° or > 150°) magnify minute angular sighting errors into massive longitudinal
    displacement errors.


    Why the other options are wrong: A compass functions equally in all 360 degrees. A protractor is always
    required to plot bearings on a map. Declination is an atmospheric/geomagnetic constant independent
    of the landmark angle.'
  correct_answer: d
- id: nav-d3-q5
  type: FILL_BLANK
  prompt: 'If you are lost along a distinct, known dirt road printed on your topographic map, you need
    to sight only ___ prominent distant landmark to fix your exact coordinate, because your location is
    the point where the landmark''s back-bearing crosses the ___.

    '
  xp_reward: 50
  correct_answer:
  - one
  - road
  explanation: 'Standing on a linear feature provides one known line of position. Sighting a single landmark
    provides the intersecting cross-line, pinpointing the location.

    '
