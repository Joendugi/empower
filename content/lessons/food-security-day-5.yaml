briefing: 'Every food system begins with seed. Saving seed from your best plants — selecting for local
  adaptation, yield, and flavour — is the original act of agriculture, practiced for 10,000 years before
  the seed industry existed. This day teaches selection criteria, extraction and drying protocols, viability
  testing, and long-term storage techniques that protect seed for multiple seasons. A community that controls
  its seed controls its food.

  '
briefing_sw: 'Kila mfumo wa chakula huanza na mbegu. Kuhifadhi mbegu kutoka kwa mimea yako bora — kuchagua
  kwa ajili ya urekebishaji wa ndani, mavuno, na ladha — ni tendo la asili la kilimo, kilichofanywa kwa
  miaka 10,000 kabla ya sekta ya mbegu kuwepo.

  '
outline: '1. Why seed saving matters: biodiversity, cost, and food sovereignty

  2. Open-pollinated varieties (OPV) vs. hybrids — which seeds you can save

  3. Isolation distances and preventing cross-pollination

  4. Selection criteria: 10 % rule, performance traits, and negative selection

  5. Extraction protocols: wet process (tomato, cucumber) vs. dry process (beans, maize)

  6. Drying seed to the target moisture content (≤ 8 % for long storage)

  7. Viability testing: germination test and tetrazolium (TZ) test

  8. Long-term storage: temperature, humidity, containers, and the Rule of 100'
content_md: "## Why Seed Saving Matters\n\nKenya's smallholder farmers spend 5–25 % of their input budget\
  \ on purchased seed\neach season. For subsistence farmers on < 1 acre, this is a critical financial\
  \ burden.\nBeyond cost, commercial seed is often:\n- Poorly adapted to local microclimates and soils\n\
  - Not available at the right time (distribution chain failures)\n- Hybrid — seed from a hybrid crop\
  \ grows poorly (F₂ segregation loss)\n\n**Locally saved seed:**\n- Free after the first season\n- Selected\
  \ over generations for local disease pressures, rainfall patterns, and flavour\n- Available when and\
  \ where you need it\n- Source of genetic diversity — critical for adaptation to changing climate\n\n\
  ## OPV vs. Hybrid Seeds\n\n| Property | Open-Pollinated Variety (OPV) | Hybrid (F₁) |\n|----------|-------------------------------|-------------|\n\
  | Pollination | Natural — wind, bees, insects | Controlled cross between two inbred lines |\n| Seed\
  \ saving | Yes — offspring are true-to-type | No — F₂ generation segregates, yields drop 20–50 % |\n\
  | Yield | Moderate; locally adapted | High (heterosis/hybrid vigour) in first generation only |\n| Examples\
  \ (Kenya) | Katumani maize, Kenyan Fahari bean, local cowpea landraces | DK8031, H614D, WH507 maize\
  \ hybrids |\n\n**Save seed only from OPV / landrace varieties.**\nHybrid varieties are clearly marked\
  \ on seed packaging. Traditional varieties passed\nwithin communities are almost always OPVs.\n\n##\
  \ Isolation Distances\n\nCross-pollination from different varieties of the same species contaminates\
  \ your seed.\nMinimum isolation distances between varieties of the same species:\n\n| Crop | Pollination\
  \ type | Minimum isolation |\n|------|-----------------|-------------------|\n| Maize (*Zea mays*) |\
  \ Wind | 200–400 m |\n| Sorghum (*Sorghum bicolor*) | Mainly self; some wind | 100–200 m |\n| Cowpea\
  \ (*Vigna unguiculata*) | Self-pollinating | 3–10 m |\n| Common bean (*Phaseolus vulgaris*) | Self-pollinating\
  \ | 3–10 m |\n| Tomato (*Solanum lycopersicum*) | Self-pollinating | 10–25 m |\n| Kale / sukuma wiki\
  \ (*Brassica oleracea*) | Insect | 300–1 000 m |\n| Onion (*Allium cepa*) | Insect | 300–1 000 m |\n\
  \nFor cross-pollinating crops in small gardens: use **time isolation** (stagger planting\nby 3–4 weeks\
  \ so flowering periods do not overlap) or **bagging** (enclose seed heads\nin paper bags before pollen\
  \ shed, pollinate by hand, re-bag until seed set).\n\n## Selection Criteria: The 10 % Rule\n\nSelect\
  \ seed parents from the **top 10 %** of your crop — never from the remaining 90 %.\n\n### Positive selection\
  \ traits:\n- **Early and uniform maturity** (even ripening → synchronised harvest)\n- **High yield**\
  \ relative to neighbours in the same field (same inputs, same soil)\n- **Pest and disease tolerance**\
  \ (fewer lesions, faster recovery)\n- **Desirable morphology**: size, shape, colour of the variety type\n\
  - **Flavour** (taste test from ripest plants; for staples: cooking quality, texture)\n\n### Negative\
  \ selection (what NOT to save):\n- Plants showing virus symptoms (mosaic patterns, stunting, distortion)\n\
  - Plants with nematode root galls (pull up a root and inspect)\n- Off-types (plants that don't look\
  \ like the rest of the variety)\n- Plants that are first to show water stress (may indicate poor root\
  \ systems)\n\n**Mark your seed-parent plants** at early growth stages with flagging tape or bamboo stakes\
  \ —\ndo not wait until harvest when the best plants may be accidentally picked.\n\n## Extraction Protocols\n\
  \n### Dry Process (beans, maize, cowpea, sorghum, sesame)\n1. Allow seed to fully mature on the plant\
  \ — pods should be dry and papery; maize husks\n   should be pulled back and the cob left on the plant\
  \ 2–3 weeks beyond eating maturity.\n2. Harvest and **thresh**: beat pods/cobs over a clean tarpaulin.\n\
  3. **Winnow**: pour grain between two containers on a breezy day; chaff blows away,\n   heavy seeds\
  \ fall.\n4. Spread on a clean tarp in the sun for **5–7 days** (not direct ground; elevated rack).\n\
  5. Moisture test (bite test): should snap cleanly; no bending.\n\n### Wet Process (tomato, cucumber,\
  \ watermelon, pumpkin)\n1. Select a **fully ripe** fruit from your best plant (overripe is fine — seed\
  \ is mature).\n2. Scoop seeds + gel into a clean jar; add an equal volume of water.\n3. Leave uncovered\
  \ at room temperature for **2–3 days** — a layer of mould forms.\n   This fermentation breaks down the\
  \ germination-inhibiting gel coat (*Byssochlamys* \n   and other fungi digest the gelatinous layer).\n\
  4. Add more water; viable seeds sink, hollow/non-viable seeds and debris float.\n5. Drain, rinse 3–4\
  \ times with clean water.\n6. Spread on a ceramic plate or wax paper (not paper towel — seeds stick)\
  \ to dry.\n7. Dry in shade (not direct sun — UV damages germplasm) for 1–2 weeks.\n8. Seeds are ready\
  \ when they snap off the plate cleanly and clack when stirred.\n\n## Drying Seed to Target Moisture\n\
  \n**Target**: ≤ 8 % seed moisture content (SMC) for tropical storage.\nBelow 8 %, metabolic rate drops\
  \ dramatically; enzyme activity and insect development slow.\n\n**The Rule of Thumb for shade-drying\
  \ duration:**\n- After harvest, place seeds in a single layer on a raised screen\n- Dry in a well-ventilated\
  \ shade for:\n  - Legume seeds: 2–3 weeks after initial threshing\n  - Cereal seeds: 2–4 weeks (maize:\
  \ up to 4 weeks for full cobs)\n  - Vegetable seeds: 2–4 weeks in shade\n\n**Indicator test**: place\
  \ a small sample in a sealed glass jar for 24 hours. If condensation\nforms on the inside of the jar,\
  \ seeds are still too wet. No condensation = ready to store.\n\n## Viability Testing\n\nBefore storing\
  \ a large quantity of seed (and again before planting), run a germination test.\n\n### Germination Test\
  \ (14 days)\n1. Count out **50 seeds** of the variety.\n2. Moisten two layers of newspaper or paper\
  \ towels with clean water (not soggy — just damp).\n3. Spread seeds in a single layer; roll loosely.\n\
  4. Keep at 25–30 °C (room temperature) in a plastic bag to retain moisture; check daily.\n5. Count germinated\
  \ seeds (radicle visible ≥ 2 mm) at:\n   - Day 3–5: first count (fast germinators)\n   - Day 14: final\
  \ count\n6. **Germination rate (%)** = (seeds germinated ÷ 50) × 100\n\n**Acceptable germination thresholds:**\n\
  \n| Rate | Interpretation | Action |\n|------|----------------|--------|\n| > 85 % | Excellent | Safe\
  \ to store and plant |\n| 70–85 % | Good | Increase seeding rate by 20 % at planting |\n| 50–70 % |\
  \ Poor | Increase seeding rate; source better seed |\n| < 50 % | Unacceptable | Do not use for critical\
  \ planting; source new seed |\n\n### Tetrazolium (TZ) Test (fast, 24 hours)\nCut seed in half longitudinally;\
  \ soak in 1 % tetrazolium chloride solution for 4–8 hours.\nViable tissue (living cells with active\
  \ dehydrogenase enzymes) stains bright red.\nDead tissue remains unstained. Used to test dormant seed\
  \ that won't germinate immediately.\n\nTetrazolium chloride available from laboratory suppliers in Nairobi\
  \ (KSh 1 200–2 000 per 100 g).\n\n## Long-Term Storage: The Rule of 100\n\n**The Rule of 100** (seed\
  \ storage principle, FAO):\n*The sum of the storage temperature (°F) and the relative humidity (%) should\
  \ not exceed 100\nfor the seed to remain viable beyond one season.*\n\n| Temperature (°F) | Max RH for\
  \ long-term storage |\n|-----------------|------------------------------|\n| 70 °F (21 °C) | < 30 %\
  \ RH |\n| 60 °F (16 °C) | < 40 % RH |\n| 50 °F (10 °C) | < 50 % RH |\n\nIn Kenya's highland areas (Nyeri,\
  \ Meru, Nandi), ambient conditions often allow natural\ncompliance. Lowland and coastal areas (Mombasa,\
  \ Kisumu) are warm and humid — storage\nmust compensate.\n\n### Storage containers:\n\n| Container |\
  \ Suitable for | Notes |\n|-----------|-------------|-------|\n| Sealed glass jars with rubber gasket\
  \ | All small seeds | Excellent; add 5 g silica gel sachet per 500 g seed |\n| Metal tins with tight\
  \ lids (sealed with wax) | All seeds | Rodent-proof; 10–20 year lifespan |\n| Plastic screw-top bottles\
  \ (PET) | Beans, maize | Check seal quality — some lids are not airtight |\n| Traditional clay pots\
  \ with ash layer | Grain seed | Ash desiccates and repels insects; moderate effectiveness |\n\n### Desiccants\n\
  - **Silica gel** (rechargeable): absorbs moisture; reactivate by heating at 150 °C for 1 hour when blue\
  \ indicator turns pink. KSh 150–300 per 100 g packet.\n- **Wood ash**: traditional desiccant and insect\
  \ deterrent; mix 10 % ash by volume with seed.\n- **Dried neem leaves** (*Azadirachta indica*): natural\
  \ insecticide; layer between seed portions.\n- **Dried chilli powder**: surface application; deters\
  \ weevils and rodents.\n\n### Storage Location\n- Cool, dark, dry room (north-facing store in the southern\
  \ hemisphere)\n- Off the floor on pallets or shelves\n- Away from walls (moisture migration)\n- Check\
  \ every 4 weeks: inspect for moisture (condensation, soft seeds), insect activity, or mould\n"
exercises:
- type: MULTIPLE_CHOICE
  id: fs5-q1
  options:
  - id: a
    text: Severe yield loss of 20–50 % due to F₂ genetic segregation — the hybrid vigour is lost
  - id: b
    text: Yields identical to the purchased hybrid — the plants will look the same
  - id: c
    text: Slight yield improvement — the seeds have been selected from the best plants
  - id: d
    text: No difference — hybrid and OPV seeds behave the same when saved
  prompt: A farmer saves seeds from her best-looking H614D maize hybrid plants. Next season she plants
    100 % saved seed. What outcome should she expect?
  xp_reward: 30
  correct_answer: a
  explanation: 'Correct. Hybrid vigour (heterosis) depends on the specific genetic combination of the
    F₁ cross. F₂ plants are genetically diverse and unpredictable. Save seed only from OPV or landrace
    varieties.


    Why the other options are wrong: H614D is an F₁ hybrid. Saved seed is F₂, which undergoes genetic
    segregation. The uniform trait combinations that create hybrid vigour break apart. Yield typically
    drops 20–50 % compared to purchased F₁ seed. Selecting the best-looking plants cannot overcome genetic
    segregation in hybrids. The loss of heterosis is a genetic consequence, not a management failure.
    This is the fundamental distinction in seed saving. Hybrids are specifically bred so that only the
    F₁ generation produces predictable, uniform, high-yielding plants.'
- type: FILL_BLANK
  id: fs5-q2
  prompt: The Rule of 100 states that the sum of storage temperature in °F and relative humidity % should
    not exceed ___ for long-term seed viability.
  explanation: 'This empirical rule from FAO seed storage research shows that at lower temperatures, higher
    humidity can be tolerated and vice versa. The key insight: cooling a seed store has the same viability-extending
    benefit as dehumidifying it.'
  xp_reward: 30
  correct_answer: '100'
- type: PHOTO_CAPTURE
  id: fs5-practical
  rubric:
  - criterion: Seeds arranged in single layer (not stacked)
    points: 2
  - criterion: Paper/towel is moist, not dripping
    points: 2
  - criterion: Label shows date and variety name or description
    points: 2
  - criterion: Minimum 25 seeds visible in photo
    points: 2
  - criterion: Setup is in a sealed or semi-sealed bag to retain moisture
    points: 2
  prompt: "Practical assessment: Seed viability test setup.\n\nUsing at least 25 seeds of any local bean,\
    \ maize, or cowpea variety:\n1. Moisten a paper towel or newspaper until damp (not dripping).\n2.\
    \ Arrange the seeds in a single layer; roll or fold the towel.\n3. Place in a labelled plastic bag\
    \ at room temperature.\n4. Photograph your test setup showing:\n   a) The labelled bag clearly\n \
    \  b) The date written on the label\n   c) The approximate count of seeds (count written on label\
    \ or paper)\n5. Upload this photo to record your Day 5 practical exercise.\n\nA field officer or peer\
    \ reviewer will verify your setup and prompt you\nto submit a follow-up photo of germination results\
    \ at Day 7 and Day 14.\n"
