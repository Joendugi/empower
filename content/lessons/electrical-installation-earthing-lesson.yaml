id: "electrical-installation-earthing-lesson"
course_id: "electrical-installation"
title: "Earthing, bonding, and protective devices"
title_sw: "Earthing, bonding, na vifaa vya ulinzi"
briefing: "The earth conductor exists so that a live-to-metal fault makes a large current (or an RCD imbalance) and the protective device disconnects. It is not a spare neutral. Combining earth and neutral incorrectly (wrong use of PEN, missing links, bootleg earths) is how cases stay live.\n\nKenya installations you meet may be TN-S, TN-C-S, or TT at the origin — follow the existing earthing arrangement and the spec; do not invent a mix. Main bonding of pipes and extra bonding in bathrooms follow the drawing and regulations you are taught.\n\nMCBs (or fuses) protect against overcurrent. RCDs protect against earth leakage / shock in many final circuits. An MCB will not always trip on a high-resistance earth fault that still can kill. That is why testing and correct device selection matter.\n\nNever “borrow” an earth from a neighbouring circuit’s sheath unless the design says so. Never disconnect earths to stop a nuisance trip without finding the fault."
briefing_sw: "Earth ni njia ya fault, si neutral. MCB hulinda overcurrent; RCD hulinda uvujaji. Usichanganye earth na neutral. Usikate earth ili “kutuliza” trip."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/EIT/CR/02/5"
exam_domain: "Protection"
exercises:
  - id: "electrical-installation-earthing-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "The earth wire exists primarily to:"
    options:
      - id: "a"
        text: "Carry current in normal use like the live"
      - id: "b"
        text: "Provide a low-impedance path so protective devices disconnect on a fault"
      - id: "c"
        text: "Make the cable look thicker"
      - id: "d"
        text: "Power the doorbell only"
    correct_answer: "b"
    hint: "Fault current needs a path."
    explanation: "Earthing lets the MCB/fuse/RCD clear a fault instead of leaving metalwork live."
    xp_reward: 50
  - id: "electrical-installation-earthing-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "An RCD is mainly intended to detect:"
    options:
      - id: "a"
        text: "Overload on a cooker only"
      - id: "b"
        text: "Imbalance between live and neutral (earth leakage)"
      - id: "c"
        text: "Whether the bulb is LED"
      - id: "d"
        text: "Wi-Fi strength"
    correct_answer: "b"
    hint: "Imbalance."
    explanation: "RCD ≠ MCB. They complement each other."
    xp_reward: 50
  - id: "electrical-installation-earthing-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Using the water pipe as the only earth without a proper electrode/arrangement is:"
    options:
      - id: "a"
        text: "Always excellent"
      - id: "b"
        text: "Dangerous and non-compliant in modern practice"
      - id: "c"
        text: "Required by all cookers"
      - id: "d"
        text: "A type of MCB"
    correct_answer: "b"
    hint: "Plastic pipes, disconnection."
    explanation: "Bonding is not a substitute for a designed earth."
    xp_reward: 50
  - id: "electrical-installation-earthing-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Nuisance RCD trips should be solved by:"
    options:
      - id: "a"
        text: "Removing the earth"
      - id: "b"
        text: "Insulation and leakage investigation, not defeating protection"
      - id: "c"
        text: "Fitting a bigger fuse in the RCD"
      - id: "d"
        text: "Wetting the CU"
    correct_answer: "b"
    hint: "Find the leak."
    explanation: "Defeating protection is how shocks happen later."
    xp_reward: 50
  - id: "electrical-installation-earthing-fb1"
    type: "FILL_BLANK"
    prompt: "A device that trips when live and neutral currents differ is an ___."
    correct_answer: "RCD"
    hint: "Residual Current Device. RCCB is also used."
    explanation: "RCD/RCCB detects imbalance. Store that abbreviation."
    xp_reward: 50
  - id: "electrical-installation-earthing-scenario"
    type: "SCENARIO"
    prompt: "A metal kettle case tingles. The socket earth pin is not connected. What is correct?"
    options:
      - id: "a"
        text: "Tell the user to wear rubber shoes and continue"
      - id: "b"
        text: "Take the kettle out of service and restore the earth at socket and flex"
      - id: "c"
        text: "Swap live and neutral only"
      - id: "d"
        text: "Paint the kettle"
    correct_answer: "b"
    hint: "Class I metal appliances need a working earth."
    explanation: "A missing earth on Class I gear is a serious defect. Isolate, tag, repair."
    xp_reward: 60
