id: "agriculture-chemicals-farm-lesson"
course_id: "agriculture"
title: "Agrochemicals, PPE, and spraying"
title_sw: "Dawa, PPE, na kunyunyiza"
briefing: "Pesticides are poisons with a label. Keep original labelled containers locked. A soda bottle of herbicide is how children die. Measure with dedicated equipment, not kitchen spoons that return to the canteen.\n\nPPE: gloves, boots, overall, and the mask specified for the product — not a handkerchief. Mix in air, not in a store. Triple-rinse containers as taught; do not dump washings in a river.\n\nDo not spray in wind toward people, water, or food. Buffer zones exist. Mixing two unlabelled leftovers is not IPM, it is gambling.\n\nRe-entry intervals: the time before people can enter a sprayed field. Ignore that and you poison the weeding gang."
briefing_sw: "Weka dawa kwenye chombo asili chenye lebo. PPE. Usiweke dawa kwenye chupa ya soda. Usinyunyize upepo kuelekea shule. Fuata muda wa kurudi shambani."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AGR/CR/02/5"
exam_domain: "Pesticide safety"
exercises:
  - id: "agriculture-chemicals-farm-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why should pesticide never be stored in a soda bottle?"
    options:
      - id: "a"
        text: "It tastes better in the jerrycan"
      - id: "b"
        text: "Someone may drink it; original labelled containers prevent poisoning"
      - id: "c"
        text: "NITA bans plastic"
      - id: "d"
        text: "It reduces nitrogen"
    correct_answer: "b"
    hint: "Tragic mix-ups."
    explanation: "Keep labels. Lock the store."
    xp_reward: 50
  - id: "agriculture-chemicals-farm-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "You are asked to spray on a windy afternoon next to a school. You:"
    options:
      - id: "a"
        text: "Spray extra so it carries further"
      - id: "b"
        text: "Postpone; do not spray in wind toward people, water, or food"
      - id: "c"
        text: "Remove the nozzle filter and spray anyway"
      - id: "d"
        text: "Mix two unlabelled chemicals to save a trip"
    correct_answer: "b"
    hint: "Drift."
    explanation: "Wind plus schoolgrounds is a stop condition."
    xp_reward: 50
  - id: "agriculture-chemicals-farm-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Triple-rinsing empty pesticide containers is to:"
    options:
      - id: "a"
        text: "Make them toys"
      - id: "b"
        text: "Reduce residue before disposal as instructed"
      - id: "c"
        text: "Collect drinking water"
      - id: "d"
        text: "Raise soil pH"
    correct_answer: "b"
    hint: "Residue."
    explanation: "Then dispose as hazardous, not in the household pit casually."
    xp_reward: 50
  - id: "agriculture-chemicals-farm-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Re-entry interval is:"
    options:
      - id: "a"
        text: "The length of the boom"
      - id: "b"
        text: "How long until people may enter the sprayed crop"
      - id: "c"
        text: "Rainfall in millimetres"
      - id: "d"
        text: "A type of fertiliser"
    correct_answer: "b"
    hint: "People vs residue."
    explanation: "Read the label. Keep people out until it is safe."
    xp_reward: 50
  - id: "agriculture-chemicals-farm-fb1"
    type: "FILL_BLANK"
    prompt: "Keeping pesticide in the factory bottle with the paper instructions still on it means keeping the original ___."
    correct_answer: "label"
    hint: "The label is the law of that bottle."
    explanation: "Unlabelled liquids are an emergency waiting."
    xp_reward: 50
  - id: "agriculture-chemicals-farm-scenario"
    type: "SCENARIO"
    prompt: "A classmate mixes leftover insecticide and herbicide in one sprayer “to save water”. You:"
    options:
      - id: "a"
        text: "Help shake it"
      - id: "b"
        text: "Stop: unknown tank mixes can be toxic and illegal; follow labels or agronomist advice"
      - id: "c"
        text: "Add petrol as a sticker"
      - id: "d"
        text: "Spray toward the river to dilute"
    correct_answer: "b"
    hint: "Tank mix."
    explanation: "Compatibility is a science. Unlabelled mixes are reckless."
    xp_reward: 60
