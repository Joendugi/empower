id: tvet-programming-w1
course_id: computer-programming
title: Week 1 — Concepts, translators, methodologies, and design tools
title_sw: Wiki 1 — Dhana, translators, mbinu, na zana za usanifu
briefing: 'Develop Computer Program (340 hours) starts with concepts. A program is a set of instructions a computer can execute. Programming is writing those instructions. Translators: compiler (whole program to machine code), interpreter (line by line), assembler for low level. Editors, linkers, and loaders complete the tool chain. Mixing “compiler” and “editor” in an oral loses marks.


  Approaches: structured/procedural, modular, object-oriented, functional. Methodologies: waterfall, Agile, RAD, spiral — CDACC lists Agile, Crystal, RAD among others. The program development cycle is still: problem, requirements, design, code, test, maintain. Agile repeats that in small increments. For a college practical, a mini waterfall with a test plan is acceptable if you document it.


  Design tools: pseudo-code, flowcharts, decision tables/trees, data-flow diagrams. Top-down design decomposes; bottom-up builds from known modules; data-driven starts from the records. Languages: low-level (assembly), high-level (C, Python, Java), 4GL, OOP, visual. Choose by domain, popularity, tools, and the exam — this unit requires basic C and basic internet programming.


  This week’s artefact: a problem statement (e.g. compute workshop job-card total), structured English, and a flowchart with start/end, process, decision. No code yet. Assessors want the design, because coding without design is the usual fail.'
briefing_sw: Compiler dhidi ya interpreter. Linker na loader. Agile, RAD, waterfall. Pseudo-code, flowchart, decision table. C ni high-level structured. Buni kabla ya kuandika msimbo.
estimated_minutes: 32
