exercises:
- id: tvet-programming-w1-q1
  type: MULTIPLE_CHOICE
  prompt: 'A compiler differs from an interpreter because a compiler:'
  options:
  - id: a
    text: Only colours the editor
  - id: b
    text: Translates the whole source to object/machine code before running
  - id: c
    text: Cannot produce errors
  - id: d
    text: Is a type of RAM
  correct_answer: b
  hint: Whole vs line by line.
  explanation: C is typically compiled. Many scripting languages are interpreted.
  xp_reward: 50
- id: tvet-programming-w1-q2
  type: MULTIPLE_CHOICE
  prompt: 'Pseudo-code is used to:'
  options:
  - id: a
    text: Replace the linker
  - id: b
    text: Describe algorithm logic in structured English before syntax
  - id: c
    text: Flash the BIOS
  - id: d
    text: Crimp cables
  correct_answer: b
  hint: Design tool.
  explanation: If you cannot pseudo-code a loop, you cannot code it in C.
  xp_reward: 50
- id: tvet-programming-w1-q3
  type: MULTIPLE_CHOICE
  prompt: 'In a flowchart, a diamond typically represents:'
  options:
  - id: a
    text: A decision / condition
  - id: b
    text: A magnetic tape only
  - id: c
    text: The compiler
  - id: d
    text: Ohm’s law
  correct_answer: a
  hint: Yes/no.
  explanation: Parallelogram often I/O, rectangle process, oval start/end.
  xp_reward: 50
- id: tvet-programming-w1-q4
  type: MULTIPLE_CHOICE
  prompt: 'Agile development emphasises:'
  options:
  - id: a
    text: One giant delivery after years with no feedback
  - id: b
    text: Short iterations, working software, and responding to change
  - id: c
    text: Avoiding tests
  - id: d
    text: Only assembly language
  correct_answer: b
  hint: Methodology list.
  explanation: Waterfall is linear. RAD/Agile trade documentation for speed — still test.
  xp_reward: 50
- id: tvet-programming-w1-fb1
  type: FILL_BLANK
  prompt: The tool that combines object files with libraries into an executable is the ___.
  correct_answer: linker
  hint: After compile.
  explanation: Compile → link → load. The loader places the program in memory.
  xp_reward: 50
- id: tvet-programming-w1-scenario
  type: SCENARIO
  prompt: 'A trainee opens Dev-C++ and types before writing requirements. For a CDACC portfolio you should:'
  options:
  - id: a
    text: Mark it complete
  - id: b
    text: Require problem statement, pseudo-code/flowchart, then code and test evidence
  - id: c
    text: Delete the compiler
  - id: d
    text: Convert it to hexadecimal by hand
  correct_answer: b
  hint: Outcomes 1–3 before 5.
  explanation: The unit is development methodology, not typing speed.
  xp_reward: 60
