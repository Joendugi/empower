id: "automotive-safety-lesson"
course_id: "automotive"
title: "Garage safety and lifting"
title_sw: "Usalama wa garage na kuinua"
briefing: "A jack lifts; axle stands hold. Never work under a vehicle supported only by a trolley jack. Level ground, chock wheels, rated stands under specified points — not the oil pan, not rust. Gearbox in park/gear, parking brake as the procedure says (know when you must release it).\n\nBatteries: acid, hydrogen when charging, and shorting a ring across terminals. Disconnect earth first on many negative-earth vehicles when the job needs isolation. Fuel vapour plus grinders is a fire. Spinning fans and belts take fingers.\n\nPPE: boots, eye protection on grinders and springs. Coil springs store energy. Exhaust work on a running engine in a closed bay is carbon monoxide poisoning — extract.\n\nOil and brake fluid on the floor are slip hazards. Clean as you go. That is assessed."
briefing_sw: "Jack inainua; axle stands zinashikilia. Chock. Usifanye kazi chini ya jack peke yake. Battery ina asidi. Usifanye exhaust kwenye garage iliyofungwa bila extraction."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AUT/CR/01/5"
exam_domain: "Workshop safety"
exercises:
  - id: "automotive-safety-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Before crawling under a car you must:"
    options:
      - id: "a"
        text: "Leave it on a trolley jack only"
      - id: "b"
        text: "Support it with rated axle stands on a level surface and chock wheels"
      - id: "c"
        text: "Run the engine in gear"
      - id: "d"
        text: "Remove the handbrake so it can roll"
    correct_answer: "b"
    hint: "Jacks fail."
    explanation: "Stands hold. Jacks lift. Non-negotiable in NITA/CDACC workshops."
    xp_reward: 50
  - id: "automotive-safety-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "When disconnecting a typical negative-earth battery you usually remove:"
    options:
      - id: "a"
        text: "Positive first always"
      - id: "b"
        text: "Earth/negative first to reduce short risk"
      - id: "c"
        text: "Both at once with one spanner across"
      - id: "d"
        text: "The alternator first always"
    correct_answer: "b"
    hint: "Last off, first on is the positive on many procedures."
    explanation: "Follow the vehicle data. The principle is not to short the spanner to earth on the live terminal."
    xp_reward: 50
  - id: "automotive-safety-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Running an engine in a closed workshop without extraction risks:"
    options:
      - id: "a"
        text: "Better idle"
      - id: "b"
        text: "Carbon monoxide poisoning"
      - id: "c"
        text: "Colder oil"
      - id: "d"
        text: "Automatic wheel chocks"
    correct_answer: "b"
    hint: "CO."
    explanation: "Use extract hoses. CO is colourless."
    xp_reward: 50
  - id: "automotive-safety-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A coil spring compressor job is dangerous because:"
    options:
      - id: "a"
        text: "Springs are light"
      - id: "b"
        text: "Stored energy can release violently"
      - id: "c"
        text: "NITA bans springs"
      - id: "d"
        text: "Oil likes springs"
    correct_answer: "b"
    hint: "Energy."
    explanation: "Use the correct tool. Never improvise with rope."
    xp_reward: 50
  - id: "automotive-safety-fb1"
    type: "FILL_BLANK"
    prompt: "After a jack lifts the car, the vehicle is held on axle ___."
    correct_answer: "stands"
    hint: "Rated supports."
    explanation: "Axle stands, not bricks, not spare wheels."
    xp_reward: 50
  - id: "automotive-safety-scenario"
    type: "SCENARIO"
    prompt: "A trainee crawls under a pickup on a jack on sloping ground to change oil. You:"
    options:
      - id: "a"
        text: "Film it"
      - id: "b"
        text: "Stop the job, move to level ground, stands, chocks, then drain"
      - id: "c"
        text: "Rev the engine to empty faster"
      - id: "d"
        text: "Kick the jack to test it"
    correct_answer: "b"
    hint: "Slope plus jack."
    explanation: "This is how vehicles come down. Reset the whole setup."
    xp_reward: 60
