id: automotive-safety-lesson
course_id: automotive
title: Garage safety and lifting
title_sw: Usalama wa garage na kuinua
briefing: 'A jack lifts; axle stands hold. Never work under a vehicle supported only
  by a trolley jack. Level ground, chock wheels, rated stands under specified points
  — not the oil pan, not rust. Gearbox in park/gear, parking brake as the procedure
  says (know when you must release it).


  Batteries: acid, hydrogen when charging, and shorting a ring across terminals. Disconnect
  earth first on many negative-earth vehicles when the job needs isolation. Fuel vapour
  plus grinders is a fire. Spinning fans and belts take fingers.


  PPE: boots, eye protection on grinders and springs. Coil springs store energy. Exhaust
  work on a running engine in a closed bay is carbon monoxide poisoning — extract.


  Oil and brake fluid on the floor are slip hazards. Clean as you go. That is assessed.'
briefing_sw: Jack inainua; axle stands zinashikilia. Chock. Usifanye kazi chini ya
  jack peke yake. Battery ina asidi. Usifanye exhaust kwenye garage iliyofungwa bila
  extraction.
