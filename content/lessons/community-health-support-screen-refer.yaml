title: 'Basic Observations And Referral: Vital Signs Recording, Muac Measurement,
  Danger Signs And Referral Documentation: Principles and Practical Application'
title_sw: 'Basic Observations And Referral: Vital Signs Recording, Muac Measurement,
  Danger Signs And Referral Documentation: Kanuni na Utendaji wa Vitendo'
briefing: 'In professional workshop practice, mastering Basic Observations and Referral:
  Vital Signs Recording, MUAC Measurement, Danger Signs and Referral Documentation
  requires strict adherence to safety standards and sequential execution. Always inspect
  personal protective equipment (PPE), ensure proper tool calibration, and verify
  that the workpiece is securely mounted before commencing. Observe manufacturer specifications
  and relevant standards. Maintain a clean work environment, store consumables dry,
  and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Basic Observations and Referral: Vital
  Signs Recording, MUAC Measurement, Danger Signs and Referral Documentation kunahitaji
  kufuata sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla
  ya kuanza kazi.'
