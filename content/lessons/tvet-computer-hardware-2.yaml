id: tvet-computer-hardware-2
course_id: computer-hardware
title: Storage, displays, and field replacement
title_sw: Hifadhi, skrini, na kubadilisha sehemu
briefing: 'After naming parts, you replace them without destroying the board. Storage: HDD is magnetic platters, SSD is flash. Cloning and imaging are how you preserve a lab image; deleting partitions is not “repair”. Know SATA vs NVMe physically so you do not force a drive.


  Displays: no picture can be cable, RAM, GPU onboard, or backlight. Test known-good monitor before condemning a motherboard. Laptops add DC jacks, batteries, and thermal paste — service manuals beat guesswork. Do not pry an LCD with a screwdriver through the matrix.


  Field path: visual, power rails, POST beeps/codes, then swap the least expensive likely part with evidence. Scatter-gun replacement of RAM, HDD, and PSU at once teaches nothing and costs the college.


  Document: serial numbers, what you found, what you fitted. The next duty technician should not start from zero.'
briefing_sw: 'HDD vs SSD. Usilazimishe NVMe. Jaribu monitor inayojulikana kabla ya kuhukumu board. Path: visual, power, POST, kisha sehemu. Andika serial na kazi uliyofanya.'
estimated_minutes: 18
