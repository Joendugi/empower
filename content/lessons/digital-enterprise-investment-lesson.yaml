id: "digital-enterprise-investment-lesson"
course_id: "digital-enterprise"
title: "Week 6 — Investment, compounding, diversification, and fraud checks"
title_sw: "Wiki 6 — Uwekezaji na hatari"
briefing: "Saving protects near-term needs; investing accepts risk for longer-term growth. Order matters: control high-cost debt, build an emergency reserve, insure catastrophic risks, then invest money that is not needed next month. Match the instrument to the goal and horizon. Working-capital cash should not be locked in a volatile five-year asset.\n\nCompounding means returns earn returns. Future value (simple annual example) = principal × (1 + rate)^years. KES 100,000 at 10% for three years becomes about KES 133,100 before tax/fees. Real return is approximately nominal return minus inflation: 10% return with 7% inflation grows purchasing power by only about 3% before costs. Fees reduce compounding every year.\n\nInstruments have different risk/liquidity: regulated bank/SACCO deposits, Treasury bills/bonds, licensed money-market or unit trusts, listed shares, property, business reinvestment, and pensions. Do not describe any as guaranteed unless the lawful issuer guarantees it. Diversification spreads issuer, asset, sector, and timing risk; owning five companies in one collapsing industry is not full diversification. Investment in your own workshop can have high return but concentrates livelihood and capital in one place.\n\nDue diligence: verify the provider and salesperson with the relevant Kenyan regulator (such as CMA, CBK, SASRA, RBA, or IRA depending on the product), read the prospectus/terms, know custody and withdrawal rules, understand return source, and keep statements. Scam signs: guaranteed unusually high monthly return, recruitment commissions, urgency, secrecy, personal mobile-money number, no audited information, and inability to explain the underlying asset. If you cannot explain how it earns money, do not invest. This curriculum is education, not personalised financial advice."
briefing_sw: "Akiba ni kwa muda mfupi; investment ina risk na muda. Emergency fund kwanza. Compound: principal × (1+rate)^years. Real return ni return minus inflation. Diversify. Hakikisha regulator (CMA/CBK/SASRA/RBA/IRA). Guaranteed high monthly return ni red flag."
estimated_minutes: 38
license: "CC-BY-SA-4.0"
exam_domain: "Financial literacy — saving and investment"
exercises:
  - id: "digital-enterprise-investment-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "KES 100,000 compounded annually at 10% for three years is approximately:"
    options:
      - id: "a"
        text: "KES 103,000"
      - id: "b"
        text: "KES 130,000 exactly"
      - id: "c"
        text: "KES 133,100"
      - id: "d"
        text: "KES 10,000"
    correct_answer: "c"
    hint: "100,000 × 1.1 × 1.1 × 1.1."
    explanation: "Compounding earns a return on prior returns. Fees and tax would reduce the result."
    xp_reward: 50
  - id: "digital-enterprise-investment-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "An investment returns 11% while inflation is 8%. Approximate real return before fees is:"
    options:
      - id: "a"
        text: "19%"
      - id: "b"
        text: "3%"
      - id: "c"
        text: "88%"
      - id: "d"
        text: "11% because inflation does not matter"
    correct_answer: "b"
    hint: "Nominal minus inflation is the quick approximation."
    explanation: "Purchasing power grows much less than the account balance."
    xp_reward: 50
  - id: "digital-enterprise-investment-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Which is strongest evidence of investment fraud risk?"
    options:
      - id: "a"
        text: "A regulated provider publishes audited reports"
      - id: "b"
        text: "Guaranteed 20% every month, urgency, recruitment rewards, and payment to a personal number"
      - id: "c"
        text: "Returns can fall and fees are disclosed"
      - id: "d"
        text: "Treasury auction results are public"
    correct_answer: "b"
    hint: "High guaranteed return plus secrecy/recruitment."
    explanation: "Verify licences independently; do not trust screenshots or celebrity promotion."
    xp_reward: 50
  - id: "digital-enterprise-investment-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Diversification primarily reduces:"
    options:
      - id: "a"
        text: "All risk including inflation and fraud"
      - id: "b"
        text: "Concentration risk from one issuer, asset, or sector"
      - id: "c"
        text: "The need for due diligence"
      - id: "d"
        text: "Every possible loss"
    correct_answer: "b"
    hint: "Do not put every egg in one basket."
    explanation: "Diversification cannot make a fraudulent product safe or guarantee profit."
    xp_reward: 50
  - id: "digital-enterprise-investment-fb1"
    type: "FILL_BLANK"
    prompt: "The return after accounting for inflation is the ___ return."
    correct_answer: "real"
    hint: "Nominal describes the printed percentage."
    explanation: "Financial goals are paid with purchasing power, so real return matters."
    xp_reward: 50
  - id: "digital-enterprise-investment-scenario"
    type: "SCENARIO"
    prompt: "A chama is offered “guaranteed 15% monthly” crypto mining, must recruit two members, and sends cash to a personal number. Best response?"
    options:
      - id: "a"
        text: "Invest the emergency fund before the deadline"
      - id: "b"
        text: "Do not invest; verify licensing and underlying assets, document red flags, and consider reporting"
      - id: "c"
        text: "Borrow digitally to maximise return"
      - id: "d"
        text: "Join because a cousin withdrew once"
    correct_answer: "b"
    hint: "Guaranteed extreme return plus recruitment is not normal investment risk."
    explanation: "Early withdrawals can be funded by later victims in a Ponzi scheme."
    xp_reward: 60
  - id: "digital-enterprise-investment-practical"
    type: "VIDEO_RECORD"
    prompt: "Present a three-bucket financial plan for a sample artisan: emergency reserve, medium-term equipment goal, and long-term investment. Explain horizon, liquidity, risk, diversification, inflation, fees, and regulator checks."
    correct_answer: "recorded"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Emergency funds remain liquid and low risk"
      - "Each goal has an amount and time horizon"
      - "Nominal and real returns are distinguished"
      - "Diversification and concentration risk are explained"
      - "Provider licensing and scam checks are demonstrated"
    min_seconds: 30
