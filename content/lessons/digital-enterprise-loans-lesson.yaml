id: "digital-enterprise-loans-lesson"
course_id: "digital-enterprise"
title: "Week 5 — Loans: true cost, affordability, collateral, and debt traps"
title_sw: "Wiki 5 — Mikopo na gharama yake"
briefing: "Borrow for a productive purpose with a repayment source—not because an app says “limit available”. Define the asset or working-capital gap, amount, timing, expected extra cash, and fallback. Compare SACCO, bank, asset finance, supplier credit, government programme, digital lender, and equity. The lowest instalment is not automatically cheapest; a longer term can produce a larger total cost.\n\nRead: principal, annual interest method, effective annual rate/APR where supplied, flat versus reducing balance, fees, insurance, taxes, grace period, instalment dates, late penalties, early-settlement charge, variable-rate clause, collateral, guarantor liability, and default process. Flat 12% on the original principal every year costs more than 12% on a reducing balance. Ask for the amortisation schedule and total amount payable in shillings.\n\nExample (simplified): borrow KES 120,000 for 12 months at 12% flat plus KES 3,000 fee. Interest = 120,000 × 12% = 14,400; total = 137,400; average instalment = 11,450. A reducing-balance offer at the same stated 12% produces less interest if there are no extra fees. Compare cash received after deducted fees as well as total paid.\n\nAffordability: debt-service coverage ratio (DSCR) = cash available for debt service ÷ required debt payments. A DSCR of 1.0 leaves no cushion; many businesses target above 1.2–1.5 depending on risk. Stress-test a 20% sales drop, delayed customer, exchange-rate increase, or machine downtime. Never borrow short-term expensive money to finance a long-term asset without a credible refinancing plan. Keep a debt register and pay on time to protect credit history."
briefing_sw: "Kopa kwa matumizi yanayozalisha cash. Linganisha principal, flat/reducing, APR, fees, insurance, penalty, collateral na total payable. Flat 12% si sawa na reducing 12%. DSCR = cash ya kulipa deni / instalment. Stress-test mauzo yakishuka."
estimated_minutes: 38
license: "CC-BY-SA-4.0"
exam_domain: "Financial literacy — responsible borrowing"
exercises:
  - id: "digital-enterprise-loans-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "KES 120,000 at 12% flat for one year plus KES 3,000 fee has simplified total repayment of:"
    options:
      - id: "a"
        text: "KES 120,000"
      - id: "b"
        text: "KES 134,400"
      - id: "c"
        text: "KES 137,400"
      - id: "d"
        text: "KES 14,400"
    correct_answer: "c"
    hint: "Principal + 14,400 interest + 3,000 fee."
    explanation: "Always compare the total shillings paid and cash actually received."
    xp_reward: 50
  - id: "digital-enterprise-loans-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Why can a flat-rate loan cost more than a reducing-balance loan at the same stated rate?"
    options:
      - id: "a"
        text: "Flat interest is calculated on the original principal throughout"
      - id: "b"
        text: "Reducing loans have no contracts"
      - id: "c"
        text: "Flat loans cannot have fees"
      - id: "d"
        text: "Reducing balance increases principal monthly"
    correct_answer: "a"
    hint: "What balance attracts interest?"
    explanation: "Reducing-balance interest falls as principal is repaid. Flat interest does not."
    xp_reward: 50
  - id: "digital-enterprise-loans-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A business has KES 60,000 monthly cash available for debt and instalments of KES 50,000. DSCR is:"
    options:
      - id: "a"
        text: "0.83"
      - id: "b"
        text: "1.2"
      - id: "c"
        text: "10"
      - id: "d"
        text: "KES 110,000"
    correct_answer: "b"
    hint: "60,000 ÷ 50,000."
    explanation: "1.2 has a 20% cushion, but stress testing may show whether that is enough."
    xp_reward: 50
  - id: "digital-enterprise-loans-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A guarantor should sign only after understanding:"
    options:
      - id: "a"
        text: "The borrower’s social-media following"
      - id: "b"
        text: "That the guarantor may be required to repay and may risk savings/assets"
      - id: "c"
        text: "That guarantees are never enforced"
      - id: "d"
        text: "Only the first instalment"
    correct_answer: "b"
    hint: "A guarantee is a legal obligation."
    explanation: "Independent advice may be appropriate before risking SACCO shares or property."
    xp_reward: 50
  - id: "digital-enterprise-loans-fb1"
    type: "FILL_BLANK"
    prompt: "The schedule showing how each instalment splits into interest and principal is an ___ schedule."
    correct_answer: "amortisation"
    hint: "Loan table over time."
    explanation: "It reveals the balance after each payment and the true interest pattern."
    xp_reward: 50
  - id: "digital-enterprise-loans-scenario"
    type: "SCENARIO"
    prompt: "Digital lender offers KES 50,000, deducts KES 5,000 upfront, and demands KES 60,000 in 30 days. Best decision process?"
    options:
      - id: "a"
        text: "Accept because the advert says 20%"
      - id: "b"
        text: "Calculate cost on KES 45,000 actually received, test 30-day cash, compare alternatives, and reject if unaffordable"
      - id: "c"
        text: "Use another loan automatically to repay it"
      - id: "d"
        text: "Ignore late fees"
    correct_answer: "b"
    hint: "Net proceeds, total repayment, term."
    explanation: "Upfront deductions make the effective cost much higher than the headline suggests."
    xp_reward: 60
  - id: "digital-enterprise-loans-practical"
    type: "AUDIO_RECORD"
    prompt: "Record a client explanation comparing two loan quotations. State net cash received, total repayment, rate method, fees, collateral, monthly instalment, DSCR, and your recommendation."
    correct_answer: "spoken"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Both offers are compared in total shillings"
      - "Flat versus reducing balance is identified"
      - "Fees, penalties, security, and guarantor risk are included"
      - "Repayment is tested against forecast cash flow"
      - "Recommendation states risks and an alternative"
    min_seconds: 25
