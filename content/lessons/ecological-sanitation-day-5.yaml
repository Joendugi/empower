briefing: 'Greywater (kitchen and laundry wastewater) represents 60-75% of a household''s wastewater and
  is far easier to treat than blackwater. Constructed wetlands — engineered shallow gravel beds planted
  with Phragmites or Canna — provide passive, low-energy treatment of greywater and secondary effluent,
  producing water safe for irrigation while building soil carbon and habitat.

  '
outline: 'Greywater composition and typical contaminants; simple treatment train (screening, settling,
  wetland); HSSF wetland design; vertical flow wetland for higher-rate treatment; plant selection (Phragmites,
  Canna, Typha); sizing calculations (hydraulic loading rate, BOD5 removal); overflow management and mosquito
  control; photo capture — field wetland assessment.

  '
content_md: "## Greywater Characteristics\n\nGreywater comes from sinks, showers, laundry — but NOT toilets\
  \ (blackwater).\n\n| Source | Volume share | Key contaminants |\n|---|---|---|\n| Kitchen sink | 20-30%\
  \ | Food particles, fats, oils, grease (FOG), detergents |\n| Bathroom/shower | 30-40% | Soap, personal\
  \ care products, hair |\n| Laundry | 25-35% | Detergents, phosphates, pathogens (low) |\n\n**Typical\
  \ greywater quality:**\n\n| Parameter | Value |\n|---|---|\n| BOD5 (Biochemical Oxygen Demand) | 50-300\
  \ mg/L |\n| Total Suspended Solids (TSS) | 50-200 mg/L |\n| Total Nitrogen | 5-20 mg/L |\n| Total Phosphorus\
  \ | 1-15 mg/L |\n| Faecal coliforms | 0-10^4 CFU/100mL |\n\nFor context, raw domestic sewage has BOD5\
  \ of 200-400 mg/L and\nfaecal coliforms of 10^6-10^8 CFU/100mL. Greywater is much lower risk.\n\n##\
  \ Simple Treatment Train\n\nA three-stage system handles typical household greywater:\n\n1. **Grease\
  \ trap / settling chamber** (50-200 L buried tank):\n   - Allows fats to float and solids to settle\n\
  \   - Retention time 2-4 hours\n   - Clean out every 2-4 weeks (floating grease layer)\n\n2. **Horizontal\
  \ Subsurface Flow (HSSF) Wetland:**\n   - Main biological treatment stage\n   - Gravel bed 0.5-0.8 m\
  \ deep, planted with reeds\n   - Water flows horizontally through gravel, never pools on surface\n \
  \  - No mosquito breeding because surface stays dry\n\n3. **Polishing pond or reuse** (optional):\n\
  \   - Further clarification, UV disinfection by sunlight\n   - Effluent suitable for orchard/tree irrigation\
  \ (not direct food crop contact)\n\n## HSSF Wetland Design\n\n### Sizing Using Hydraulic Loading Rate\
  \ (HLR)\n\nFor greywater treatment, design HLR = 20-50 L/m2/day.\n\n**Example:**\n- Household of 6 generates\
  \ 6 x 50 L/day greywater = 300 L/day\n- At HLR = 30 L/m2/day: required area = 300 / 30 = **10 m2**\n\
  - Bed dimensions: 4 m long x 2.5 m wide x 0.6 m gravel depth\n\n### BOD5 First-Order Removal Model\n\
  \nBOD5 removal in a HSSF wetland follows first-order kinetics:\n\nCe/Ci = exp(-k x A / Q)\n\nWhere:\n\
  - Ce = effluent BOD5 (mg/L)\n- Ci = influent BOD5 (mg/L)\n- k = areal rate constant (typically 0.1-0.2\
  \ m/day for HSSF at 20 °C)\n- A = wetland area (m2)\n- Q = flow rate (m3/day)\n\nAt k = 0.15 m/day,\
  \ Q = 0.3 m3/day, A = 10 m2:\nCe/Ci = exp(-0.15 x 10 / 0.3) = exp(-5) = 0.0067\n\nIf Ci = 200 mg/L,\
  \ Ce = 200 x 0.0067 = **1.3 mg/L BOD5** — excellent removal.\n\n## Vertical Flow (VF) Wetland\n\nVF\
  \ wetlands are dosed intermittently from the top — wastewater percolates\ndown through fine sand/gravel\
  \ media. They provide:\n\n- Better oxygenation (air fills pores between doses) → better nitrification\n\
  - Higher loading rate: 50-100 L/m2/day\n- Smaller footprint needed\n- Disadvantage: require a dosing\
  \ siphon or pump; more construction complexity\n\nUse VF wetlands when space is limited or when ammonia\
  \ removal is critical.\n\n## Plant Selection\n\n| Species | Local name | Best use | Notes |\n|---|---|---|---|\n\
  | Phragmites australis | Common reed | HSSF primary treatment | Very robust, rapid root growth, tolerates\
  \ high BOD5 |\n| Canna indica | Canna lily | HSSF or polishing | Attractive flowering; good P uptake;\
  \ edible rhizome |\n| Typha latifolia | Cattail/bulrush | High-nutrient greywater | Fast-growing; harvest\
  \ leaves for basket-making |\n| Vetiver grass | Vetiver | Greywater edges/overflow | Erosion control;\
  \ drought tolerant; no water clogging |\n\n**Plant spacing**: 0.5-1.0 m apart in rows across the flow\
  \ direction.\nFull establishment takes 2-3 months. Harvest stems at end of growing season\nto remove\
  \ accumulated nutrients from the system.\n\n## Mosquito Control\n\nThe main risk with any greywater\
  \ system is creating stagnant water pools.\n\nPrevention measures:\n1. **HSSF design**: gravel surface\
  \ stays dry — mosquitoes cannot breed\n2. **Dosing uniformity**: even distribution prevents short-circuiting\
  \ and surface pooling\n3. **Polishing pond**: if used, stock with mosquitofish (Gambusia) or Nile tilapia\
  \ fry\n4. **Overflow**: pipe any overflow to infiltration trench — never allow ponding beside the bed\n\
  5. **Inlet inspection**: check inlet distribution pipe weekly for blockages\n\n## Annual Maintenance\
  \ Schedule\n\n| Task | Frequency | Notes |\n|---|---|---|\n| Grease trap desludging | Every 2-4 weeks\
  \ | Remove floating grease layer manually |\n| Inlet pipe inspection | Weekly | Clear any blocked distribution\
  \ holes |\n| Plant harvest | Annually (dry season) | Cut stems to 0.2 m above surface; compost cuttings\
  \ |\n| Gravel bed inspection | Every 2 years | Check for clogging; replace surface gravel if needed\
  \ |\n| Effluent quality check | Quarterly | BOD5 and faecal coliform test strips |\n"
exercises:
- id: ecos-d5-q1
  type: MULTIPLE_CHOICE
  prompt: 'A household HSSF wetland has influent BOD5 of 180 mg/L, flow = 0.4 m3/day, area = 12 m2, and
    areal rate constant k = 0.15 m/day. What is the approximate effluent BOD5?

    '
  xp_reward: 50
  options:
  - id: a
    text: About 18 mg/L — adequate for tree irrigation only
  - id: b
    text: About 90 mg/L — only 50% removal
  - id: c
    text: About 0.1 mg/L — complete sterilisation
  - id: d
    text: About 1.8 mg/L — excellent treatment
  explanation: 'Ce/Ci = exp(-0.15 x 12 / 0.4) = exp(-4.5) = 0.011. Ce = 180 x 0.011 = 1.98 mg/L, approximately
    1.8-2.0 mg/L. This meets WHO effluent standards for restricted irrigation.


    Why the other options are wrong: 18 mg/L would require exp(-k*A/Q) = 0.1, meaning k*A/Q = 2.3. With
    these values k*A/Q = 4.5, giving much better than 18 mg/L removal. 50% removal would occur if Ce/Ci
    = 0.5. Constructed wetlands at these design parameters achieve far greater than 50% BOD5 removal.
    The first-order model gives approximately 2 mg/L, not 0.1 mg/L. Complete sterilisation does not occur
    in a biological treatment wetland.'
  correct_answer: d
- id: ecos-d5-q2
  type: FILL_BLANK
  prompt: 'A household of 8 people generates 50 L greywater per person per day. At a hydraulic loading
    rate of 25 L/m2/day, the required HSSF wetland area is ___ m2. A rectangular bed 4 m wide would be
    ___ m long.

    '
  xp_reward: 50
  correct_answer:
  - 16 m2
  - 4 m
  explanation: 'Total flow = 8 x 50 = 400 L/day. Area = 400 / 25 = 16 m2. Length = 16 m2 / 4 m width =
    4 m long. The bed would be 4 m x 4 m x 0.6 m gravel depth — a compact footprint achievable on a standard
    homestead plot.

    '
