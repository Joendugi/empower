    '
- id: ecos-d5-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why does a horizontal subsurface flow (HSSF) wetland pose a lower mosquito breeding risk than
    a surface-flow pond?

    '
  xp_reward: 50
  options:
  - id: a
    text: The plants in the wetland release insecticide-like compounds that repel mosquitoes
  - id: b
    text: Gravel is too coarse for mosquito larvae to survive in
  - id: c
    text: HSSF wetlands are treated with chlorine which kills larvae
  - id: d
    text: Water flows entirely below the gravel surface — the top of the bed stays dry so mosquitoes cannot
      lay eggs
  explanation: 'In HSSF design, water level is maintained 50-100 mm below the gravel surface. Mosquitoes
    require standing water on an accessible surface to lay eggs. The dry gravel surface prevents breeding.


    Why the other options are wrong: Wetland plants do not produce insecticide compounds. The mosquito
    control comes from the physical design (subsurface flow), not chemical repellence. Mosquito larvae
    are aquatic and need standing water — they cannot survive in unsaturated gravel regardless of pore
    size. The key is keeping water below the surface. HSSF wetlands are biological treatment systems.
    Adding chlorine would kill the beneficial microbes that provide treatment. No disinfectant is used.'
  correct_answer: d
- id: ecos-d5-q5
  type: PHOTO_CAPTURE
  prompt: 'Walk to a greywater discharge point near your household or community (kitchen drain, laundry
    area, or roadside). Photograph the area and assess it against the five criteria in the rubric below.
    Submit your best-quality photo with a written assessment.

    '
  xp_reward: 50
  correct_answer: null
  explanation: 'Unmanaged greywater creates mosquito habitat, nutrient runoff to water bodies, and slipping
    hazards. This exercise builds the habit of seeing greywater as a resource to capture rather than a
    waste to dump.

    '
