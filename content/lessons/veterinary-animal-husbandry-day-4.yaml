briefing: 'Calving, lambing, and kidding season is the most critical period in the pastoral calendar.
  A calf or lamb lost to dystocia (difficult, obstructed birth) is a lost year of milk and herd reproduction;
  an untreated uterine prolapse or infected hyena bite kills a productive dam. A competent paravet must
  master internal vaginal exploration, correcting abnormal fetal presentations (head deviations, leg flexions,
  breech deliveries), applying obstetric calving chains, administering epidural anesthesia, and cleaning
  and suturing deep traumatic lacerations.

  '
outline: 'The three normal stages of ruminant parturition (cervical dilation, fetal expulsion, placental
  expulsion); normal anterior presentation (two front hooves pointing downward, head resting on knees);
  defining Dystocia causes (maternal-fetal disproportion, uterine inertia, fetal malpresentation); internal
  examination hygiene (chlorhexidine/soap, copious methylcellulose lubricant); correcting leg flexions
  (carpal/shoulder) and head back deviations; calving ropes/chains placement (double half-hitch above
  and below fetlock); traction timing with maternal labor contractions; caudal epidural anesthesia (lignocaine
  into Co1-Co2 space); post-partum uterine prolapse replacement; traumatic wound management (debridement,
  povidone-iodine flushing, interrupted mattress sutures, fly strike/myiasis treatment).

  '
content_md: "## The Stages of Normal Parturition (Calving)\n\nUnderstanding normal labor prevents premature,\
  \ damaging interventions:\n\n| Stage of Labor | Physiological Action | Duration (Cattle) | Clinical\
  \ Signs |\n|---|---|---|---|\n| **Stage 1: Dilation** | Cervix dilates; myometrial contractions begin;\
  \ fetus rotates into birth canal | 2 to 6 hours (up to 12h in heifers) | Restlessness, separating from\
  \ herd, kicking at belly, tail raising, clear mucus discharge |\n| **Stage 2: Fetal Expulsion** | Amniotic\
  \ water bag bursts; fetus passes through birth canal | **30 minutes to 2 hours** | Strong abdominal\
  \ straining in lateral recumbency; appearance of feet |\n| **Stage 3: Placental Expulsion**| Separation\
  \ and delivery of afterbirth | 4 to 8 hours | Placenta hangs from vulva; considered **retained** if\
  \ not passed within 12 hours |\n\n*Intervention Rule*: If Stage 2 active abdominal straining continues\
  \ for **more than 2 hours** with no progress, or if feet appear and then disappear, **intervene immediately**!\n\
  \n## Normal vs Abnormal Fetal Presentation\n\nThe only safe presentation for unassisted vaginal birth\
  \ is:\n**Normal Anterior Longitudinal Presentation, Dorso-Sacral Position, Extended Posture**:\n- Two\
  \ front feet emerge first, with the **pads of the hooves pointing DOWNWARD toward the ground**.\n- The\
  \ calf's muzzle rests flat between and slightly behind the two front knees.\n\n```\n   NORMAL PRESENTATION:\
  \                  HEAD RETRACTED (DYSTOCIA):\n      (Hooves Down + Head)                  (Two Legs,\
  \ No Head)\n      ┌──────┐   ╭───╮                      ┌──────┐   \n      │ Nose │   │ █ │ Upper Knee\
  \           │      │   ╭───╮\n      └──────┘   ╰───╯                      │ Neck │   │ █ │\n    ═══════════════════════\
  \               ──┴──────┴───╰───╯\n      [ Hoof ]   [ Hoof ]                   [ Hoof ]   [ Hoof ]\n\
  \     (Soles Downward)                      (Soles Downward)\n```\n\n### Identifying Anterior (Front)\
  \ vs Posterior (Back) Legs:\nIn the dark birth canal, feel the first two joints above the hoof:\n- **Front\
  \ Leg**: The first joint (fetlock) and second joint (**knee / carpus**) both bend in the **SAME direction**.\n\
  - **Back Leg**: The second joint (**hock / tarsus**) bends in the **OPPOSITE direction** to the fetlock,\
  \ and the pads of the rear hooves point **UPWARD toward the dam's tail**.\n\n## The 5 Rules of Internal\
  \ Obstetric Examination\n\n1. **Extreme Hygiene**: Wash the cow's perineum, vulva, and tail with warm\
  \ water and chlorhexidine or mild soap. Wash your arms up to the shoulders with antiseptic.\n2. **Copious\
  \ Lubrication**: Apply **minimum 1 to 2 litres of non-irritating veterinary lubricant (methylcellulose)**\
  \ or sterile cooking oil into the birth canal. Dry friction causes vaginal tears and fatal hemorrhage.\n\
  3. **Repulsion before Rotation**: You cannot turn a tangled leg or head inside the narrow birth canal.\
  \ Push the fetus **backward** into the spacious abdominal cavity first, then rotate the limb, and pull\
  \ forward.\n4. **Cup the Hooves in Your Palm**: When pulling a flexed leg forward, always cup the sharp\
  \ pointed hoof inside your palm. An uncovered sharp hoof rakes across the thin uterine wall, puncturing\
  \ it and causing fatal peritonitis.\n5. **Double Half-Hitch with Calving Ropes**:\n   - Never tie a\
  \ single slipknot around a leg (slips and fractures delicate fetal bones).\n   - Place the first loop\
  \ of the cotton calving rope **above the fetlock joint**, and the second half-hitch loop **below the\
  \ fetlock joint around the pastern**. This distributes pulling force across two skeletal points.\n\n\
  ## Calving Traction Protocols\n\n- **Never use a tractor, 4x4 vehicle, or winch to pull a calf!** Mechanical\
  \ pulling rips the cow's pelvis apart, tearing the uterus and killing both dam and calf.\n- **Human\
  \ Power Limit**: Maximum **two adult men** pulling on ropes.\n- **Sync with Contractions**: Pull **only\
  \ when the cow strains**. When the cow rests between labor contractions, stop pulling and hold the tension.\n\
  - **The Angle of Pull**:\n  - Pull straight outward until the head and chest clear the vulva.\n  - Once\
  \ the chest is out, pull **downward toward the cow's hocks (45° angle)** to allow the calf's hips to\
  \ slide smoothly through the widest pelvic opening.\n\n## Caudal Epidural Anesthesia\n\nWhen a cow strains\
  \ violently against the paravet during manipulation, or to replace a\npainful uterine prolapse, an epidural\
  \ stops abdominal straining while allowing the cow to stand:\n- **Anatomical Site**: The first inter-coccygeal\
  \ space (**Co1 – Co2**) at the base of the tail head.\n  - Raise and lower the tail like a pump handle;\
  \ feel for the first flexible joint behind the sacrum.\n- **Technique**: Insert an 18-gauge 38 mm needle\
  \ vertically into the midline depression.\n- **The Hanging Drop Test**: Place a drop of 2% Lignocaine\
  \ / Lidocaine in the open needle hub. As the needle enters the negative-pressure epidural space, the\
  \ drop is sucked cleanly into the needle!\n- **Dose**: Inject **5.0 mL of 2% Lignocaine**.\n- **Effect**:\
  \ Within 5 minutes, the tail goes limp, straining stops completely, but the cow remains standing on\
  \ her legs for 2 hours.\n\n## Emergency Wound Care & Fly Strike (Myiasis)\n\nPastoral livestock suffer\
  \ severe lacerations from predator attacks (hyenas, leopards),\nbarbed wire, and horn gouges:\n\n###\
  \ 1. Debridement & Antiseptic Lavage:\n- Restrain animal securely.\n- Clip hair 50 mm around wound edges.\n\
  - Lavage wound aggressively with **sterile 0.9% saline or 0.1% dilute povidone-iodine solution** using\
  \ a 50 mL syringe to blast out dirt, hair, and necrotic tissue.\n\n### 2. Surgical Closure (Horizontal\
  \ Mattress Suture):\n- In thick, mobile cattle skin, simple stitches pull through under tension.\n-\
  \ Use **Horizontal Mattress Sutures** with non-absorbable braided polyamide (nylon) or synthetic suture\
  \ (USP 2 or 3) on a heavy reverse-cutting curved needle.\n- Mattress stitches distribute tension across\
  \ a wide skin bridge, everting skin edges for rapid primary healing.\n- Leave the bottom 15 mm of the\
  \ wound open (or insert a penrose rubber drain) to allow drainage of inflammatory fluids.\n\n### 3.\
  \ Fly Strike (Myiasis / Maggots):\n- In hot tropical regions, blowflies (*Chrysomya bezziana*) lay eggs\
  \ in wounds within hours, hatching thousands of flesh-eating maggots.\n- **Treatment**:\n  - Pour **5%\
  \ hydrogen peroxide or diluted diazinon / chlorfenvinphos** into the wound cavity. Maggots will writhe\
  \ and crawl out immediately.\n  - Mechanically remove all maggots with thumb forceps.\n  - Dust wound\
  \ generously with **Sulfanilamide antibiotic powder** or spray with **Oxytetracycline topical blue spray**.\n\
  \  - Apply a thick layer of pine tar or grease mixed with liquid pyrethroid to repel flies for 7 days.\n"
exercises:
- id: vet-d4-q1
  type: MULTIPLE_CHOICE
  prompt: 'A paravet conducts an internal vaginal examination on a cow in prolonged labor. Two legs are
    felt in the birth canal, but the pads of the hooves are pointing UPWARD toward the cow''s tail head,
    and the second joint above the fetlock bends in the OPPOSITE direction to the fetlock. What presentation
    is this?

    '
  xp_reward: 50
  options:
  - id: a
    text: Posterior presentation (the back legs are presenting, meaning the calf is coming backwards /
      breech orientation)
  - id: b
    text: Normal anterior presentation (front legs)
  - id: c
    text: Twins delivering simultaneously
  - id: d
    text: Uterine torsion (twisted uterus)
  explanation: 'In anterior (front) legs, hooves point downward and knee and fetlock bend in the same
    direction. In posterior (rear) legs, hooves point upward and the hock bends opposite to the fetlock.
    The calf is positioned backward.


    Why the other options are wrong: Front legs have soles pointing downward, not upward. The anatomy
    of the two joints confirms these are the two hind legs of a single calf. Uterine torsion presents
    with a corkscrew vaginal spiral that blocks entry of the hand, not clearly palpated rear limbs.'
  correct_answer: a
- id: vet-d4-q2
  type: FILL_BLANK
  prompt: 'When applying obstetric calving ropes to an extended calf leg, a ___ half-hitch must be used,
    placing one loop above the fetlock joint and the second loop below the fetlock, to prevent concentrated
    force from ___ the calf''s leg bones.

    '
  xp_reward: 50
  correct_answer:
  - double
  - fracturing
  explanation: 'A single loop acts like a garrote and snaps fragile cannon bones under pull. A double
    half-hitch distributes tension across two separate joints.

    '
