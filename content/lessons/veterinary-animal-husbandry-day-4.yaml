  - l3=r-fa335a
  - l4=r-1a14c9
  explanation: 'Repulsion creates working room; cupping protects the uterus; hanging drop verifies epidurals;
    mattress stitches hold tension on thick cattle hide.

    '
- id: vet-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why is it strictly forbidden in veterinary obstetrics to use a 4x4 motor vehicle, tractor,
    or mechanical winch to pull a stuck calf during dystocia?

    '
  xp_reward: 50
  options:
  - id: a
    text: Because vehicles emit exhaust fumes that poison the calf
  - id: b
    text: Because ropes break under mechanical tension
  - id: c
    text: It causes the milk to sour immediately
  - id: d
    text: Mechanical traction exerts uncontrolled tons of pulling force, crushing the calf's ribcage,
      rupturing the maternal pelvis, and causing fatal uterine artery avulsion
  explanation: 'Mechanical pulling generates thousands of pounds of force. If the fetus is locked by wide
    hips, winches will snap the maternal pelvis, tear the birth canal open, and cause immediate fatal
    internal hemorrhage. Traction must never exceed two adult men.


    Why the other options are wrong: While fumes are unpleasant, the immediate catastrophic danger is
    mechanical trauma and structural tearing. The ropes hold, but the cow''s body tears apart. This is
    a myth; the danger is maternal and fetal death from physical trauma.'
  correct_answer: d
- id: vet-d4-q5
  type: FILL_BLANK
  prompt: 'To stop violent maternal abdominal straining while manipulating a difficult calving or replacing
    a prolapsed uterus, a caudal epidural injection of 5 mL of 2% ___ is injected into the first inter-coccygeal
    space at the base of the tail head.

    '
  xp_reward: 50
  correct_answer: lignocaine
  explanation: 'Lignocaine (Lidocaine) 2% blocks sensory and motor nerves to the reproductive tract, stopping
    straining while allowing the cow to maintain motor function in her legs.

    '
