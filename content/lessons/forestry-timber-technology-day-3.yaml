    causes boards to cup.

    '
- id: for-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'When stacking green timber for air seasoning, why must the thin wooden spacer strips (''stickers'')
    be placed in dead vertical alignment directly above each other?

    '
  xp_reward: 50
  options:
  - id: a
    text: To make the stack easier to climb
  - id: b
    text: To keep termites from walking across the boards
  - id: c
    text: Misaligned stickers cause the immense weight of the stacked lumber to act as an un-supported
      bending load on the wet boards, permanently bending and warping the timber into wavy sags as it
      dries
  - id: d
    text: To change the color of the lumber
  explanation: 'Wet wood is plastic and deforms easily under load. If stickers are staggered, downward
    weight bends the planks between supports. Once dry, the wavy bends set permanently into the wood,
    ruining structural flatness.


    Why the other options are wrong: Climbing lumber stacks is a safety violation; stickers are purely
    for airflow and support. Stickers provide no termite barrier; foundation elevation achieves that.
    Stickers actually risk leaving ''sticker stain'' marks if wet; alignment is purely for mechanical
    straightness.'
  correct_answer: c
- id: for-d3-q5
  type: FILL_BLANK
  prompt: 'A small test block of green timber weighs 360 grams. After baking in an oven at 103°C until
    all moisture is driven out, its constant dry weight is 200 grams. The moisture content (MC %) of the
    timber was ___ percent.

    '
  xp_reward: 50
  correct_answer: '80'
  explanation: 'MC % = [(360 - 200) / 200] × 100 = (160 / 200) × 100 = 0.80 × 100 = 80%.

    '
