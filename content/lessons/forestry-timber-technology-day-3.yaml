briefing: 'Building a house or bridge with freshly milled ''green'' lumber guarantees disaster: as the
  wood dries, doors jam, wall joints pull apart, trusses twist into corkscrews, and severe fungal rot
  sets in. Freshly cut wood contains up to 100% moisture by dry weight. Timber does not shrink uniformly;
  it shrinks twice as much tangentially along growth rings as it does radially, creating massive internal
  drying stresses. This lesson covers wood cell anatomy, Free Water vs Bound Water, the Fiber Saturation
  Point (FSP at ~28%), calculating Moisture Content (MC%), stacking protocols with stickers, and building
  a low-cost passive greenhouse Solar Lumber Kiln that seasons timber to 12% MC in 3 weeks.

  '
outline: 'Wood microstructure: Heartwood (dead, durable, dense) vs Sapwood (living, sap-filled, vulnerable
  to beetles); microscopic tracheids and vessels; the physics of wood moisture: Free Water (inside cell
  cavities) vs Bound Water (adsorbed chemically in cell walls); the Fiber Saturation Point (FSP = 28%
  to 30% MC) where shrinkage begins; Moisture Content formula: MC% = [(Wet Weight - Dry Weight) / Dry
  Weight] * 100; differential shrinkage ratio (Tangential 8% vs Radial 4% vs Longitudinal 0.1%); air drying
  stacking architecture (level foundation, 25 mm square stickers aligned vertically, overhang roofs, weighted
  stacks); greenhouse solar kiln construction (semi-transparent corrugated poly roof, black heat-absorber
  baffle wall, solar-powered 12V circulation fans).

  '
content_md: "## The Cellular Anatomy of Timber\n\nWood is not a uniform solid; it is an anisotropic bundle\
  \ of hollow cellulose tubes\nglued together with lignin:\n\n```\n                        TRANSVERSE\
  \ LOG CROSS-SECTION\n               ┌──────────────────────────────────────┐\n               │     \
  \  Outer Bark & Living Phloem      │\n               │   ┌──────────────────────────────┐   │\n    \
  \           │   │     Sapwood (Active Xylem)   │   │  ◄── High moisture, rot-prone\n               │\
  \   │   ┌──────────────────────┐   │   │\n               │   │   │     HEARTWOOD        │   │   │  ◄──\
  \ Natural extractives,\n               │   │   │   (Dense, Durable)   │   │   │      rot-resistant,\
  \ stable\n               │   │   │         (•)          │   │   │\n               │   │   │        Pith\
  \          │   │   │\n```\n\n1. **Sapwood**: The outer pale ring of living wood that conducts water\
  \ from roots to leaves. Highly porous, packed with starches and sugars that attract wood-boring beetles\
  \ and fungal spores.\n2. **Heartwood**: The dark, dense central core. As the tree matures, inner sapwood\
  \ cells die and plug with natural preservative extractives (tannins, terpenes, resins). Heartwood is\
  \ **naturally rot-resistant and dimensionally stable**; it is the only wood that should be used for\
  \ ground-contact structural posts.\n\n## The Physics of Wood Moisture: Free Water vs Bound Water\n\n\
  A living tree trunk can contain **80% to 150% moisture** (it can weigh more than double\nits bone-dry\
  \ weight!). Water exists in two distinct physical states:\n\n```\n       GREEN LUMBER (80% - 120% MC)\n\
  \       ┌──────────────────────────────┐\n       │ Cell Cavities FULL of Water  │ ◄── FREE WATER (Leaves\
  \ first; causes ZERO shrinkage)\n       │ Cell Walls SATURATED         │\n       └──────────────┬───────────────┘\n\
  \                      │ Drying down to 28%\n                      ▼\n       FIBER SATURATION POINT\
  \ (FSP = 28% - 30% MC)\n       ┌──────────────────────────────┐\n       │ Cell Cavities EMPTY of Water\
  \ │ ◄── ALL FREE WATER GONE\n       │ Cell Walls REMAIN SATURATED  │ ◄── SHRINKAGE BEGINS HERE!\n  \
  \     └──────────────┬───────────────┘\n                      │ Drying down to 12%\n               \
  \       ▼\n       SEASONED STRUCTURAL TIMBER (10% - 12% MC)\n       ┌──────────────────────────────┐\n\
  \       │ Bound Water Removed from     │ ◄── BOUND WATER (Evaporation pulls cell\n       │ Cell Walls\
  \ (Walls Shrink)    │     walls together, causing shrinkage and warping)\n       └──────────────────────────────┘\n\
  ```\n\n### 1. Free Water (Liquid in Cell Cavities):\n- Water held by capillary action inside the hollow\
  \ tubes (lumens).\n- Evaporates first during drying.\n- **Crucial Rule**: The loss of free water causes\
  \ **ZERO volumetric shrinkage** in the wood! It only reduces the physical weight of the board.\n\n###\
  \ 2. The Fiber Saturation Point (FSP):\n- The critical tipping point, occurring universally at approximately\
  \ **28% to 30% Moisture Content**.\n- All hollow cell lumens are empty, but the cellulose cell walls\
  \ remain 100% saturated with chemically bound water.\n\n### 3. Bound Water (Moisture Inside Cell Walls):\n\
  - Water chemically adsorbed between the cellulose microfibrils in cell walls.\n- When timber dries below\
  \ FSP (< 28%), bound water evaporates.\n- **As bound water leaves, the cell walls collapse closer together,\
  \ triggering dimensional SHRINKAGE, CUPPING, and WARPING.**\n\n## Calculating Moisture Content (MC%)\n\
  \nMoisture content is always expressed as a percentage of the **oven-dry weight** of the wood:\n\n$$\\\
  text{Moisture Content (MC \\%)} = \\frac{\\text{Wet Green Weight} - \\text{Oven-Dry Weight}}{\\text{Oven-Dry\
  \ Weight}} \\times 100$$\n\n*Example*: A test sample of green cedar weighs **420 grams**. After baking\
  \ in an oven at 103°C for 24 hours until its weight stops changing, the bone-dry block weighs **250\
  \ grams**:\n$$\\text{MC \\%} = \\frac{420 - 250}{250} \\times 100 = \\frac{170}{250} \\times 100 = \\\
  mathbf{68.0\\%}$$\n\n### Equilibrium Moisture Content (EMC):\nWood is hygroscopic; it breathes, absorbing\
  \ and releasing moisture until it matches the surrounding air humidity:\n- In Nairobi / Kenyan Highlands:\
  \ Average outdoor **$\\text{EMC} = 12\\text{ to } 14\\%$**.\n- In Mombasa / Coast: **$\\text{EMC} =\
  \ 15\\text{ to } 18\\%$**.\n- In Lodwar / Garissa Arid Zones: **$\\text{EMC} = 8\\text{ to } 10\\%$**.\n\
  - **Rule of Seasoning**: Never install lumber until it has reached the local **Equilibrium Moisture\
  \ Content (EMC)**!\n\n## Differential Shrinkage: Why Boards Warp\n\nWood does not shrink equally in\
  \ all directions as it dries below 28% MC:\n- **Longitudinal (Along grain length)**: **0.1%** (Negligible;\
  \ a 4-metre beam shrinks by only 4 mm).\n- **Radial (Across growth rings, from center to bark)**: **3.5%\
  \ to 5.0%**.\n- **Tangential (Along the growth rings)**: **7.0% to 10.0%** (Roughly **TWICE the radial\
  \ shrinkage**!).\n\n### The Cause of Cupping:\nBecause the outer bark side of a flat-sawn board has\
  \ longer growth rings than the inner heart side, the outer face shrinks twice as much, curling the edges\
  \ upward into a trough (**cupping**).\n\n## Stacking Protocols for Air Drying\n\nBefore building with\
  \ timber, green boards must be seasoned in properly engineered stacks:\n\n```\n                    \
  \ [ Corrugated Metal Roof Overhang ]\n                     ══════════════════════════════════\n    \
  \                 ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░  ◄── Heavy Concrete Weights (50 kg)\n         \
  \            [Board]   [Board]   [Board]   [Board]\n                     ══════════════════════════════════\
  \  ◄── Stickers (25mm x 25mm Dry Battens)\n                     [Board]   [Board]   [Board]   [Board]\n\
  \                     ══════════════════════════════════  ◄── Stickers Placed in Strict Vertical Line\n\
  \                     [Board]   [Board]   [Board]   [Board]\n                  ═══╧═════════╧═════════╧═════════╧═══\
  \  ◄── Level Heavy Foundation (45 cm Above Ground)\n```\n\n1. **Elevated Level Foundation**: Set heavy\
  \ concrete piers or treated logs **minimum 45 cm above ground**. Clear all grass and weeds underneath\
  \ (ground moisture and fungi destroy bottom boards).\n2. **Stickers (Separation Spacers)**:\n   - Place\
  \ dry, uniform wooden strips (**25 mm × 25 mm**) between every layer of boards, spaced **45 cm to 60\
  \ cm apart**.\n   - **The Golden Alignment Rule**: Stickers must sit in **dead vertical alignment directly\
  \ over each other and directly over the foundation piers**. Misaligned stickers create permanent wavy\
  \ dips in drying boards under the stack's weight!\n3. **Stack Weighting**: Place 100 kg to 200 kg of\
  \ heavy stones or concrete blocks on top of the stack. This downward pressure forces boards to stay\
  \ dead flat as they shrink, preventing cupping and twisting.\n4. **Overhanging Roof**: Cover stack with\
  \ a corrugated metal sheet overhanging 30 cm on all sides to shed rain and shield boards from direct\
  \ tropical sun (which bakes the surface, causing severe honeycomb splitting).\n\n## The Greenhouse Solar\
  \ Lumber Kiln\n\nOpen-air drying in humid zones takes **6 to 12 months** and rarely drops below 16%\
  \ MC.\nA low-cost **Passive Solar Kiln** seasons lumber to **10%–12% MC in 3 to 4 weeks**:\n\n### Construction\
  \ Architecture:\n- **Frame**: A timber shed oriented facing **True North or South** (tilted toward the\
  \ Equator).\n- **Glazing Roof**: Clear corrugated polycarbonate or heavy UV-resistant greenhouse plastic\
  \ tilted at an angle equal to **Latitude + 10°**.\n- **The Solar Absorber Baffle**: A black-painted\
  \ corrugated sheet metal baffle hung 30 cm below the roof. Sunlight strikes the black metal, heating\
  \ the air to **55°C – 65°C**.\n- **Air Circulation**: Two 12V automotive radiator cooling fans (powered\
  \ by a single 100W solar panel) blow air down through the heated baffle, across the stickered lumber\
  \ pile, and back up the rear wall in a continuous convective loop.\n- **Controlled Venting**: Adjustable\
  \ moisture vents at the top let out hot, humid air while pulling in fresh dry air.\n"
exercises:
- id: for-d3-q1
  type: MULTIPLE_CHOICE
  prompt: 'A woodworker mills green eucalyptus lumber at 80% moisture content. As the wood dries down
    from 80% to 30%, what happens to the physical dimensions of the boards?

    '
  xp_reward: 50
  options:
  - id: a
    text: The boards shrink by half their width
  - id: b
    text: The boards swell and become thicker
  - id: c
    text: The boards lose physical weight but experience virtually zero dimensional shrinkage, because
      only 'free water' in the hollow cell cavities is evaporating, while cell walls remain fully saturated
  - id: d
    text: The boards develop severe internal honeycomb cracks
  explanation: 'Between initial green moisture (>80%) and the Fiber Saturation Point (approx. 28-30%),
    water leaves only the open lumens. Dimensional shrinkage begins strictly when ''bound water'' starts
    leaving the cell walls below 28% MC.


    Why the other options are wrong: Shrinkage does not occur above the Fiber Saturation Point. Drying
    never causes swelling; water loss causes weight loss and subsequent shrinkage. Honeycombing occurs
    during rapid high-heat drying below FSP, not during initial free-water loss.'
  correct_answer: c
- id: for-d3-q2
  type: FILL_BLANK
  prompt: 'The critical threshold in timber seasoning where all free water has left the cell cavities
    but the cell walls remain fully saturated with bound water—occurring at approximately 28% to 30% moisture
    content—is called the Fiber ___ Point.

    '
  xp_reward: 50
  correct_answer: Saturation
  explanation: 'The Fiber Saturation Point (FSP, ~28% MC) is the exact physical boundary where all wood
    shrinkage and strength gains begin.

    '
