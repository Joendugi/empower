id: "caregiving-assistance-mobility-lesson"
course_id: "caregiving-assistance"
title: "Week 2 — Safe mobility, personal care, nutrition, and records"
title_sw: "Wiki 2 — Movement salama, usafi, na lishe"
briefing: "Use the mobility plan and the correct aid. Check brakes on wheelchairs, clear the route, fit footwear, and ask the person to participate. Do not lift a dependent adult alone because you are in a hurry; use a hoist or second trained worker where required. Reposition immobile clients on the schedule and inspect pressure areas without massaging damaged skin.\n\nPersonal care uses clean-to-dirty technique and protects dignity. Food and fluids follow prescribed texture, allergies, diabetes, and swallowing plans. Coughing, wet voice, or choking while eating is a stop-and-escalate sign. Medication assistance follows the care plan; never crush tablets or change doses without authority.\n\nThe daily record states intake, output if required, skin changes, mobility, mood, and incidents. Never pre-sign a task. A falsified care record puts a vulnerable person at risk."
briefing_sw: "Wiki 2 — Movement salama, usafi, na lishe: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "caregiving-assistance-mobility-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for safe caregiving?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "caregiving-assistance-mobility-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that safe caregiving was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "caregiving-assistance-mobility-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "caregiving-assistance-mobility-scenario"
    type: "SCENARIO"
    prompt: "A client starts coughing and has a wet voice during a meal. The schedule says they must finish. What should you do?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
