exercises:
- id: tvet-software-w1-q1
  type: MULTIPLE_CHOICE
  prompt: Which list is system software rather than an application?
  options:
  - id: a
    text: LibreOffice, Chrome, GIMP
  - id: b
    text: Kernel, device drivers, and the file system manager
  - id: c
    text: A student game only
  - id: d
    text: A PDF of the timetable
  correct_answer: b
  hint: Runs the machine.
  explanation: Applications sit on top of the OS. Drivers and the kernel are system software.
  xp_reward: 50
- id: tvet-software-w1-q2
  type: MULTIPLE_CHOICE
  prompt: 'A real-time OS is chosen when:'
  options:
  - id: a
    text: You need a pretty theme
  - id: b
    text: Tasks must meet strict timing (lab instruments, some industrial controllers)
  - id: c
    text: You refuse to licence Windows
  - id: d
    text: RAM is unlimited
  correct_answer: b
  hint: Deadlines.
  explanation: Batch OS queues jobs. Real-time guarantees timing. Desktop OS is interactive.
  xp_reward: 50
- id: tvet-software-w1-q3
  type: MULTIPLE_CHOICE
  prompt: 'Before reinstalling an OS on a staff PC that holds student marks, you must:'
  options:
  - id: a
    text: Skip backup to save time
  - id: b
    text: Back up and protect personal data, then install from legal media
  - id: c
    text: Copy a cracked ISO from WhatsApp
  - id: d
    text: Format and hope
  correct_answer: b
  hint: Data protection plus licence.
  explanation: CDACC lists existing data protection and legal installation as outcomes.
  xp_reward: 50
- id: tvet-software-w1-q4
  type: MULTIPLE_CHOICE
  prompt: 'A GUI differs from a CLI in that a GUI:'
  options:
  - id: a
    text: Cannot start programs
  - id: b
    text: Uses graphical controls; a CLI uses typed commands
  - id: c
    text: Is illegal in Kenya
  - id: d
    text: Replaces the need for drivers
  correct_answer: b
  hint: Interface types in the unit.
  explanation: Technicians still need CLI for repair (Safe Mode, recovery console, bash).
  xp_reward: 50
- id: tvet-software-w1-fb1
  type: FILL_BLANK
  prompt: Software you can legally inspect and modify under its licence is called ___ source.
  correct_answer: open
  hint: Opposite of closed proprietary.
  explanation: Open source still has a licence (GPL, MIT). It is not “no rules”.
  xp_reward: 50
- id: tvet-software-w1-scenario
  type: SCENARIO
  prompt: HOD asks you to image one licensed Windows disk onto 40 lab PCs. Correct professional response?
  options:
  - id: a
    text: Do it — imaging is always allowed
  - id: b
    text: Refuse unless a volume/site licence or KMS covers those machines; propose legal options
  - id: c
    text: Change the product key sticker only
  - id: d
    text: Install and hide the banner
  correct_answer: b
  hint: Licence math.
  explanation: Unlicensed cloning is a fail in industry and in the unit’s legal requirements.
  xp_reward: 60
