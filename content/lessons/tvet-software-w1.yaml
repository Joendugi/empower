id: tvet-software-w1
course_id: software-install
title: Week 1 — Classify software, licences, and OS families
title_sw: Wiki 1 — Aina za programu, leseni, na familia za OS
briefing: 'Install Computer Software (IT/CU/ICT/CR/2/5, 260 hours) begins with identification, not clicking Next. Software is system (OS, drivers, utilities) or application (office, browser, college MIS). Acquisition is commercial off-the-shelf, open source, site licence, or in-house. Selection criteria: hardware compatibility, licence legality, vendor support, and the college acceptable-use policy. Installing a cracked copy is a CMCA and copyright fail, not a cost-saving tip.


  Operating systems are single or multi-user, single or multitasking, batch, real-time, or distributed. Interfaces are CLI, menu, or GUI. OS functions you will be asked: process, memory, device, storage, and security management. Windows, Linux, and mobile OS differ in driver models and update channels, but the install decision is the same: 64-bit vs 32-bit, disk layout, and whether the machine is domain-joined.


  Legal requirements: keep licence keys in the inventory, match OEM vs retail vs volume, and do not clone a Windows image onto five lab PCs unless the licence allows it. Data protection: back up user profiles before an OS reload — Kenya Data Protection Act duties apply to student records on that disk.


  Deliverable this week: a software specification sheet for a lab PC — OS edition, office suite licence, browser, antivirus, and drivers — with sources. Assessors mark the sheet, not a screenshot of a wallpaper.'
briefing_sw: Programu ya mfumo dhidi ya programu ya matumizi. Leseni halali, si crack. OS inaweza kuwa multi-user, real-time, au distributed. CLI, menyu, au GUI. Hifadhi data kabla ya kufunga upya. Andika orodha ya programu na leseni.
estimated_minutes: 30
