- id: sec-d1-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why is it tactically counterproductive to mount unshielded, high-intensity floodlights directly
    above the front door of a defensive building?

    '
  xp_reward: 50
  options:
  - id: a
    text: Floodlights consume too much diesel fuel
  - id: b
    text: Insects attracted to the light will short-circuit the electrical panel
  - id: c
    text: The bright glare blinds defenders looking out through windows into the dark yard, while casting
      deep protective shadows immediately adjacent to the building where intruders can hide
  - id: d
    text: Floodlights attract lightning strikes
  explanation: 'Light shining directly into the eyes of defenders ruins their night vision and creates
    visual glare. Tactical lighting should point outward from the perimeter into the clear buffer zone,
    keeping defenders in darkness while silhouetting intruders.


    Why the other options are wrong: Modern LED floodlights use minimal power (10-30W); the problem is
    tactical optical glare. Insects are an annoyance, but the primary failure mode is tactical blindness
    of the occupants. Wall-mounted lights do not attract lightning any more than other metal fittings.'
  correct_answer: c
- id: sec-d1-q5
  type: FILL_BLANK
  prompt: 'In defensible settlement geometry, grouping homesteads in a clustered circular boma layout
    is superior to scattered dwellings because dwellings provide mutual ___ of one another''s perimeters
    and internal livestock can be protected inside a central common ___.

    '
  xp_reward: 50
  correct_answer:
  - surveillance
  - courtyard
  explanation: 'Clustered circular compounds eliminate isolated blind spots, provide overlapping fields
    of view, and protect vital assets (cattle, water cisterns) within an enclosed central courtyard.

    '
