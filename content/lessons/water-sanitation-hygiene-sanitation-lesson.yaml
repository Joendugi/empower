id: "water-sanitation-hygiene-sanitation-lesson"
course_id: "water-sanitation-hygiene"
title: "Week 2 — Sanitation inspection and handwashing facilities"
title_sw: "Wiki 2 — Ukaguzi wa vyoo na handwashing"
briefing: "Sanitation breaks faecal–oral transmission. Inspect the slab for cracks, privacy and safety, flies/odour, a washable surface, a child-safe opening, and distance from water sources according to local public-health rules. A full, collapsing, or flood-prone pit is an emergency to isolate and escalate—not a place for a trainee to enter.\n\nHandwashing stations need reliable water, soap or approved alternative, drainage that does not form a mosquito pool, and a design children and persons with disabilities can use. Tippy taps work only if refilled and repaired. Assign responsibility.\n\nFaecal sludge emptying requires trained, equipped operators and lawful disposal. Never enter a pit or septic tank: toxic gases and oxygen deficiency kill rescuers too."
briefing_sw: "Wiki 2 — Ukaguzi wa vyoo na handwashing: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "water-sanitation-hygiene-sanitation-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for a sanitation inspection?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "water-sanitation-hygiene-sanitation-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that a sanitation inspection was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "water-sanitation-hygiene-sanitation-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "water-sanitation-hygiene-sanitation-scenario"
    type: "SCENARIO"
    prompt: "A pit latrine wall is cracking after rain and children still use it. What is the correct immediate response?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
