id: cyber-sy0701-d1-w1
course_id: secplus-concepts
title: Week 1 — CIA, AAA, Zero Trust, and control types
title_sw: Wiki 1 — CIA, AAA, Zero Trust, na aina za udhibiti
briefing: 'Security+ SY0-701 Domain 1 is 12% of the exam but it is the vocabulary for the whole semester. Confidentiality is authorised eyes only (encryption, least privilege). Integrity is authorised change only (hashes, signed firmware, backups that detect tampering). Availability is usable when needed (redundancy, backups, DDoS defence). Non-repudiation means a sender cannot credibly deny a signed action. If you mix confidentiality with integrity in a scenario, you lose easy marks.


  AAA is authentication (who), authorisation (what they may do), accounting (what they did). You authenticate people (password, passkey, biometrics) and systems (certificates, machine identity). Authorisation models include RBAC, ABAC, MAC, and DAC — Kenyan colleges usually run RBAC (role = registrar, lecturer, student). Gap analysis compares current controls with a required baseline (ISO, CBK, or campus policy).


  Zero Trust assumes breach: the control plane (policy engine, policy administrator, adaptive identity, threat-scope reduction) decides; the data plane (policy enforcement point, implicit trust zones) enforces. There is no “inside the LAN therefore trusted”. A student laptop on Wi-Fi is a subject that still needs policy. Physical security remains in 1.2: bollards, access-control vestibules, fences, guards, badges, lighting, and sensors (IR, pressure, microwave, ultrasonic). Deception: honeypot, honeynet, honeyfile, honeytoken.


  Control types you must classify: preventive, deterrent, detective, corrective, compensating, directive — and technical, managerial, operational, physical categories. A CCTV that nobody watches is a weak detective control. A locked server cage is physical preventive. Write examples from campus: turnstiles, AUPs, MFA on webmail.'
briefing_sw: 'CIA: siri, uadilifu, upatikanaji. AAA: thibitisha, ruhusu, kumbuka. Zero Trust: usiamini LAN. RBAC ni majukumu. Honeypot ni udanganyifu. Dhibiti: preventive, detective, physical.'
