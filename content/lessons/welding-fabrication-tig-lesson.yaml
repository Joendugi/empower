exam_domain: "GTAW / TIG"
exercises:
  - id: "welding-fabrication-tig-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "If the tungsten touches the puddle you should:"
    options:
      - id: "a"
        text: "Keep welding to burn it clean"
      - id: "b"
        text: "Stop, break off/regrind the tungsten, clean the weld as specified"
      - id: "c"
        text: "Increase oxygen"
      - id: "d"
        text: "Switch to oil on the regulator"
    correct_answer: "b"
    hint: "Inclusions."
    explanation: "Tungsten in the weld is a defect. Restart with a clean electrode."
    xp_reward: 50
  - id: "welding-fabrication-tig-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Stainless TIG that is black and sugared on the root often lacked:"
    options:
      - id: "a"
        text: "Enough mill scale"
      - id: "b"
        text: "Argon coverage / purge / post-flow as specified"
      - id: "c"
        text: "Water on the joint"
      - id: "d"
        text: "A bigger earth on painted steel only"
    correct_answer: "b"
    hint: "Oxidation."
    explanation: "Stainless needs gas on both sides for sanitary work. Follow the WPS."
    xp_reward: 50
  - id: "welding-fabrication-tig-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Tungsten is ground:"
    options:
      - id: "a"
        text: "Across the diameter like a match"
      - id: "b"
        text: "Lengthwise to a concentric point (for DC) as taught"
      - id: "c"
        text: "With oily shop rags"
      - id: "d"
        text: "Never — factory balls only always"
    correct_answer: "b"
    hint: "Along the axis."
    explanation: "Cross-grinding makes the arc wander."
    xp_reward: 50
  - id: "welding-fabrication-tig-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "TIG filler metal should be:"
    options:
      - id: "a"
        text: "The same as MIG drive rolls"
      - id: "b"
        text: "A matching specified rod, kept clean, dipped into the puddle not the tungsten"
      - id: "c"
        text: "Any rusty rebar"
      - id: "d"
        text: "Oil-coated electrode stubs"
    correct_answer: "b"
    hint: "Separate rod."
    explanation: "Contaminated filler becomes porosity and inclusions."
    xp_reward: 50
  - id: "welding-fabrication-tig-fb1"
    type: "FILL_BLANK"
    prompt: "GTAW is commonly called ___ welding in the workshop."
    correct_answer: "TIG"
    hint: "Tungsten Inert Gas."
    explanation: "GTAW is the process name; TIG is the shop name. Both appear in papers."
    xp_reward: 50
  - id: "welding-fabrication-tig-scenario"
    type: "SCENARIO"
    prompt: "Food-plant stainless pipe, no purge, trainee TIG-welds from one side. Inspector sees black root. Your call?"
    options:
      - id: "a"
        text: "Paint it silver"
      - id: "b"
        text: "Reject: purge/backing gas as specified, cut out, re-weld to procedure"
      - id: "c"
        text: "It is only cosmetic"
      - id: "d"
        text: "Switch to MMA 6013 inside the pipe"
    correct_answer: "b"
    hint: "Sanitary stainless."
    explanation: "TIG competence includes gas backing where the WPS and hygiene require it."
    xp_reward: 60
