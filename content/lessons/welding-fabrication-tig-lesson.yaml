id: "welding-fabrication-tig-lesson"
course_id: "welding-fabrication"
title: "Week 6 — GTAW / TIG: tungsten, gas, and cleanliness"
title_sw: "Wiki 6 — TIG: tungsten, gesi, na usafi"
briefing: "TIG (GTAW) is a CDACC core because stainless tanks, food plant, and thin aluminium (where taught) need a clean, controllable arc. The tungsten is not consumed as filler — you add a separate rod. Shielding is usually argon. Contaminated tungsten (dipped in the puddle) is reground; a dirty tip wanders and spatters tungsten inclusions into the weld — a test fail.\n\nGrind tungsten along its length (not across) to a point for DC on steel/stainless; AC on aluminium uses a different balance/blob as taught. Polarity: DCEN (electrode negative) is common for steel TIG. Gas post-flow protects the cooling tungsten and the crater. No post-flow = oxidised tip and a sugared stainless root.\n\nCleanliness is the process: stainless brushed with a stainless-only brush, joints degreased, no mill scale if the WPS forbids it. Filler is added to the leading edge of the puddle, not stabbed through the arc onto cold metal. Foot pedal or torch amp control lets you taper out to avoid a crater crack.\n\nPPE: TIG is still UV. Thin gloves for dexterity but cover skin. Practical: autogenous fusion on stainless sheet, then a fillet with filler. Assessors watch gas pre-flow and a shiny, not black, stainless face."
briefing_sw: "Tungsten si filler — ongeza fimbo. Argon. Kama tungsten ichafuliwa, saga upya. DCEN kwa chuma. Post-flow. Stainless brush tofauti. Usichome crater. Uso wa stainless uwe shiny."
estimated_minutes: 28
