exercises:
- id: r000-23-q1
  type: MULTIPLE_CHOICE
  prompt: What is the "Defender's Dilemma" in cybersecurity?
  options:
  - id: a
    text: Defenders do not know which operating system to install
  - id: b
    text: Attackers only need to find a single flaw to succeed, while defenders must secure every vulnerability continuously
  - id: c
    text: Defenders are not allowed to use computers during an attack
  - id: d
    text: Antivirus software is too expensive for most companies
  correct_answer: b
  hint: Think about the asymmetry between attack and defense.
  explanation: The asymmetry of cybersecurity means defenders face thousands of potential targets while attackers can focus resources on testing for a single weak link. Understanding this teaches us why defense-in-depth is essential.
  xp_reward: 50
- id: r000-23-match
  type: MATCH_PAIRS
  prompt: Match each defensive pillar of the Rebuilder Corps to its definition.
  pairs:
  - left:
      id: depth
      text: Defense in Depth
    right:
      id: def-depth
      text: Multiple overlapping defensive layers rather than a single perimeter
  - left:
      id: intel
      text: Threat Sharing
    right:
      id: def-intel
      text: Promptly notifying partner organisations and national CERTs about indicators of compromise
  - left:
      id: hygiene
      text: Security Hygiene
    right:
      id: def-hygiene
      text: Consistent daily adherence to strong passphrases, 2FA, and prompt patching
  - left:
      id: resilience
      text: Resilience
    right:
      id: def-resil
      text: Designing systems that can absorb damage and maintain core services during outages
  correct_answer:
  - depth=def-depth
  - intel=def-intel
  - hygiene=def-hygiene
  - resilience=def-resil
  hint: Match each principle to its practical application.
  explanation: Defenders succeed by implementing multiple defensive layers, sharing threat intelligence, practicing daily hygiene, and engineering for resilience.
  xp_reward: 50
- id: r000-23-q3
  type: FILL_BLANK
  prompt: In Kenya, organisations report cyber incidents and coordinate national defense through the National ___ (National Computer Emergency Response Team).
  correct_answer: KE-CIRT
  hint: The national computer emergency response team coordinated by the Communications Authority of Kenya.
  explanation: KE-CIRT/CC (Kenya Computer Incident Response Team Coordination Centre) monitors cyber threats nationally and alerts institutions to emerging attacks.
  xp_reward: 50
- id: r000-23-q4
  type: SCENARIO
  prompt: A technician discovers an unpatched critical flaw on an internal water utility server. Instead of keeping it secret, what should an ethical Rebuilder do?
  options:
  - id: a
    text: Post the flaw on social media to embarrass the organisation
  - id: b
    text: Report it immediately to the security team and follow responsible disclosure to patch it before attackers exploit it
  - id: c
    text: Attempt to sell the exploit on an underground hacker forum
  - id: d
    text: Ignore it because no attack has happened yet
  correct_answer: b
  hint: Responsible, prompt remediation protects the community.
  explanation: Responsible disclosure and internal reporting ensure vulnerabilities are patched before malicious actors discover them. Ethical defenders act with integrity to shield their communities.
  xp_reward: 60
