id: tvet-repair-w3
course_id: computer-repair
title: Week 3 — Functional testing and hardware/software upgrades
title_sw: Wiki 3 — Majaribio ya kazi na uboreshaji
briefing: 'Testing after repair: power on, POST, BIOS/UEFI sees RAM and disks at expected size, OS boots, device manager/lspci clean, soak test (memtest, disk SMART, GPU stress if relevant). Generate a status report. If you replaced storage, confirm the user data restore. Do not return a machine that POSTs but overheats in twenty minutes.


  Upgrades are a separate outcome: reasons (performance, capacity, compatibility, security), procedure, then test. RAM upgrade: check max per slot, dual-channel matching. SSD upgrade: clone or clean install, enable AHCI/NVMe as required, align partitions. GPU/PSU: wattage and physical clearance. Firmware: backup, correct file, do not power-off a BIOS flash.


  Software upgrade versus hardware: more RAM will not fix a dying HDD. A new OS will not fix a shorted MOSFET. Choose the upgrade that matches the bottleneck you measured (Task Manager, `free -h`, SMART). Record before/after benchmarks in the portfolio.


  Handback: explain what changed, what not to do (warranty stickers, blocked vents), and get sign-off. That closes the 280-hour unit loop: troubleshoot, repair, test, upgrade, report.'
briefing_sw: 'POST, kiasi cha RAM, SMART, na soak test. Uboreshaji: RAM, SSD, GPU/PSU, firmware. Pima bottleneck kwanza. Usizime umeme wakati wa kusasisha BIOS. Mteja atie sahihi.'
estimated_minutes: 30
