id: cyber-law-kenya-2
course_id: cyber-law-kenya
title: Data protection, evidence, and disclosure
title_sw: Ulinzi wa data, ushahidi, na disclosure
briefing: 'The Data Protection Act, 2019 sits beside the Computer Misuse and Cybercrimes Act. Personal data (IDs, student marks, health, location) has rules on collection, storage, and sharing. “I found it on an open share so I copied 40,000 rows to study Excel” can still be unlawful processing.


  Evidence: if you discover a crime, your job is not to become a hacker detective. Preserve what policy allows (screenshots of URLs, logs), do not alter systems, and hand over to supervisors, police, or KE-CIRT as directed. Imaging someone’s phone “for proof” without authority is another offence stacked on the first.


  Disclosure: vendors and government have channels. Public shaming on Twitter with live data dumps harms the people in the database. Coordinated disclosure through the organisation is the professional path.


  Workplace: acceptable-use policies, monitoring notices, and not using the college firewall hole you found for personal torrents. Privilege is observed.'
briefing_sw: 'Data Protection Act 2019. Usiibe data ya watu “kwa ajili ya Excel”. Ushahidi: hifadhi kama policy inavyosema, usibadilishe mifumo. Usichapishe database Twitter. Fuata AUP ya chuo.'
