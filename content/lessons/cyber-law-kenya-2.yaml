exercises:
- id: law2-q1
  type: MULTIPLE_CHOICE
  prompt: 'Copying a spreadsheet of student ID numbers from an open lab share to your USB “to practise Excel” is:'
  options:
  - id: a
    text: Always fine because it was open
  - id: b
    text: Likely unlawful / against policy processing of personal data
  - id: c
    text: Required by CDACC
  - id: d
    text: A type of encryption
  correct_answer: b
  hint: Personal data.
  explanation: Availability is not permission. Use dummy data for practice.
  xp_reward: 50
- id: law2-q2
  type: FILL_BLANK
  prompt: Kenya’s 2019 law on personal data is the Data ___ Act.
  correct_answer: protection
  hint: Data Protection Act.
  explanation: It sits with CMCA in professional practice.
  xp_reward: 50
- id: law2-q3
  type: SCENARIO
  prompt: You find live medical records on a misconfigured bucket. Best action?
  options:
  - id: a
    text: Download all of it to prove severity on GitHub
  - id: b
    text: Stop access, record the URL per policy, report to supervisor / DPO / KE-CIRT path — do not exfiltrate the records
  - id: c
    text: Message patients one by one on WhatsApp
  - id: d
    text: Sell access to a journalist only
  correct_answer: b
  hint: Minimise data you touch.
  explanation: Proof of existence ≠ copying the whole population.
  xp_reward: 60
- id: law2-q4
  type: MULTIPLE_CHOICE
  prompt: 'Changing log timestamps on a college server to “clean” your mistake is:'
  options:
  - id: a
    text: Good hygiene
  - id: b
    text: Integrity violation and likely an offence / serious misconduct
  - id: c
    text: Required before KE-CIRT calls
  - id: d
    text: The same as patching
  correct_answer: b
  hint: Evidence tampering.
  explanation: Report the mistake. Do not forge logs.
  xp_reward: 50
