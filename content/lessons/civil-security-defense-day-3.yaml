    '
- id: sec-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why are the vertical support legs of a 4-pole wooden watchtower built with a ''battered'' (inward-sloping
    1:10) geometry rather than standing completely vertical?

    '
  xp_reward: 50
  options:
  - id: a
    text: To make it easier for sentries to climb the outside poles without a ladder
  - id: b
    text: The wider base footprint significantly increases structural resistance to overturning moments
      caused by high wind loads and lateral seismic or dynamic movements
  - id: c
    text: Because bent poles are cheaper to purchase than straight poles
  - id: d
    text: To shed rain away from the center of the tower
  explanation: 'A battered tower forms a truncated pyramid. The broad base stance resists high wind shear
    and lateral sway far better than parallel vertical poles, preventing tower toppling.


    Why the other options are wrong: Climbing outside poles is a severe safety hazard; towers use internal
    stairs or caged ladders. Poles used are straight, but set at an angle in the foundations. Rain shedding
    is the function of the roof, not the support legs.'
  correct_answer: b
- id: sec-d3-q5
  type: FILL_BLANK
  prompt: 'To protect an elevated watchtower sentry from direct rifle fire, the perimeter parapet wall
    should be lined up to 1.1 metres height with double ___ or a 150 mm thick ballast layer of crushed
    ___.

    '
  xp_reward: 50
  correct_answer:
  - sandbags
  - rock
  explanation: 'Double sandbags or a 150 mm thick timber-retained crushed rock ballast barrier absorb
    and defeat high-velocity small arms ammunition, protecting the sentry.

    '
