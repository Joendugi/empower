briefing: 'Aquaponics represents the ultimate closed-loop food production system: fish and plants sustain
  each other in a coupled cycle where fish metabolic waste fertilizes plant roots, and plants biologically
  purify the water that returns clean to the fish. This eliminates the primary problem of standalone aquaculture
  — the costly, environmentally destructive discharge of nitrate-rich effluent. Simultaneously, plants
  receive a complete mineral nutrient solution with zero synthetic chemical fertilizer input. Well-designed
  aquaponic systems in tropical climates achieve fish yields of 40 to 60 kg per cubic metre per cycle
  alongside vegetable yields of 15 to 20 kg/m²/month. This final lesson covers media bed design with bell
  siphons, deep water culture (DWC) raft configuration, nutrient film technique (NFT), fish-to-plant ratio
  design rules, system cycling protocols, and the annual production economics of integrated aquaponic
  enterprises.

  '
outline: 'The nitrogen cycle in aquaponics as the biological foundation: TAN → nitrite → nitrate via biofilm
  nitrification; plant roots assimilate nitrate (NO3-), ammonium (NH4+), phosphate (PO43-), potassium,
  calcium, magnesium, iron, and trace minerals; pH management (6.8 to 7.2 — the ''aquaponic sweet spot''
  balancing fish health and plant nutrient availability); plant production subsystems: (1) media beds
  — gravel or expanded clay (LECA) filled 30 cm deep, flood-and-drain using Affnan bell siphon auto-siphon;
  (2) Deep Water Culture (DWC) rafts: 25 mm polystyrene sheets floating on a 30 cm water channel, net
  pots holding plant root masses; (3) Nutrient Film Technique (NFT): thin film of nutrient solution flowing
  over bare roots in PVC half-pipes; fish-to-plant biomass ratio calculation (stocking 5-7 kg fish per
  m² of media bed as general rule of thumb); iron supplementation (chelated Fe-EDTA or iron filings in
  media bed); calcium and potassium deficiencies in fish-dominated systems; the Affnan bell siphon mechanics
  (standpipe height sets flood level, bell cap traps air, snorkel breaks siphon at drain level); PHOTO_CAPTURE
  practical assessment.

  '
content_md: "## Aquaponics: Closing the Nutrient Loop\n\nStandalone aquaculture's critical weakness is\
  \ effluent: water must be drained and replaced\nto manage nitrate accumulation, wasting water and nutrients.\
  \ Aquaponics closes this loop\nentirely. The Coupled System Logic:\n\n```\nTHE AQUAPONICS NUTRIENT CYCLE\n\
  ┌─────────────────────────────────────────────────────────────────────────────┐\n│                 \
  \                                                            │\n│   ┌──────────────┐    TAN (NH3/NH4+)\
  \     ┌─────────────────────────────┐   │\n│   │   FISH TANK  │ ─────────────────────► │  BIOFILTER\
  \ / MEDIA BED     │   │\n│   │              │                         │  Nitrosomonas: NH4+ → NO2- │\
  \   │\n│   │  Feed Input  │ ◄─────────────────────  │  Nitrobacter:  NO2- → NO3- │   │\n│   │  (Protein)\
  \   │   CLEAN OXYGENATED WATER│                             │   │\n│   └──────────────┘            \
  \             └───────────┬─────────────────┘   │\n│                                               \
  \          │                     │\n│                                               NO3- Rich Water\
  \                 │\n│                                                         ↓                   \
  \  │\n│                                          ┌──────────────────────────────┐     │\n│         \
  \                                 │  PLANT GROW BED (DWC / NFT) │     │\n│                         \
  \                 │  Roots absorb: NO3-, NH4+,  │     │\n│                                         \
  \ │  PO4, K, Ca, Mg, Fe, Zn... │     │\n│                                          └──────────────────────────────┘\
  \     │\n└─────────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\
  \n## pH: The Aquaponic Sweet Spot\n\nFish and beneficial bacteria thrive in neutral to slightly alkaline\
  \ conditions, while plants\nachieve optimal micronutrient availability at slightly acidic to neutral\
  \ pH. Aquaponics requires\nmanaging this conflict:\n\n```\npH PREFERENCES IN THE AQUAPONIC SYSTEM\n\
  │────────────────────────────────────────────────────────────────────────│\n│ pH 5.0──────pH 6.5────\
  \ pH 6.8 ─────── pH 7.2 ────pH 7.5──────pH 9.0 │\n│        [Plant     ◄─────────────────────────────►\
  \ Nitrifying           │\n│         Micronutrients  AQUAPONIC SWEET SPOT      Bacteria & Fish]     │\n\
  │         Best]                 TARGET                  [Best]           │\n│────────────────────────────────────────────────────────────────────────│\n\
  ```\n* **Target Range**: 6.8 to 7.2.\n* **pH Correction**:\n  * **Too Low (< 6.5)**: Add potassium bicarbonate\
  \ (KHCO₃) or calcium carbonate (CaCO₃ — seashells/limestone chips in media) to raise pH.\n  * **Too\
  \ High (> 7.5)**: Add food-grade phosphoric acid or dilute hydrochloric acid slowly, monitoring with\
  \ a calibrated pH meter.\n\n---\n\n## Plant Production Subsystems\n\n### 1. Media Bed with Affnan Bell\
  \ Siphon (Flood-and-Drain)\nThe media bed is the simplest aquaponic grow bed. It combines biofiltration,\
  \ solids\nmineralization, and plant cultivation in a single unit.\n\n```\nAFFNAN BELL SIPHON ANATOMY\
  \ & OPERATION\n┌────────────────────────────────────────────────────────────────────────┐\n│     [GROW\
  \ BED — Filled to 30 cm with Expanded Clay (LECA)]            │\n│                                 \
  \                                       │\n│                    ┌─────────────┐  ← Bell Cap (Inverted\
  \ Cup)         │\n│                    │  ┌───────┐  │     Traps air to start siphon      │\n│     \
  \               │  │Standpipe│  │     when water reaches bell rim   │\n│      Water Inlet   │  │(Drain\
  \  │  │  ← Protective Screen guards       │\n│    (From Fish Tank)│  │ level) │  │     against media\
  \ blockage        │\n│    →→→→→→→→→→→→ │  │ F  L  │  │                                    │\n│  Water\
  \ slowly rises│  │ O  O  │  │                                    │\n│  until it reaches  │  │ O  O \
  \ │  │                                    │\n│  bell rim — siphon │  │ D  D  │  │                  \
  \                  │\n│  pulls ALL water   │  └───┬───┘  │                                    │\n│ \
  \ DOWN instantly    │      │Snorkel│ ← Snorkel tube set at drain level │\n│                    └──────┴───────┘\
  \   breaks siphon (admits air) when │\n│                           │           water drops below snorkel\
  \ lip    │\n└───────────────────────────┼────────────────────────────────────────────┘\n           \
  \                  ↓  To Fish Tank (gravity return)\n```\n\n**Flood-and-Drain Timing**:\n* Flood phase:\
  \ Water pumped into media bed over approximately 15 to 30 minutes.\n* The bell siphon triggers automatically\
  \ when water reaches the standpipe rim.\n* Drain phase: Entire bed drains in 3 to 8 minutes through\
  \ the standpipe.\n* The snorkel tube located 2 to 3 cm below the standpipe top admits air into the siphon\
  \ at drain completion, breaking the vacuum and stopping the drain.\n* Full cycle repeats every 30 to\
  \ 45 minutes, delivering oxygen-flush to root zones.\n\n### 2. Deep Water Culture (DWC) Floating Raft\n\
  DWC is the highest-yielding aquaponic system for leafy vegetables and herbs (basil, lettuce,\nspinach,\
  \ watercress):\n\n```\nDWC RAFT CROSS-SECTION\n─────────────────────────────────────────────────────────\n\
  \     [Net Pot with Plant]   [Net Pot]   [Net Pot]\n            │                   │           │\n\
  \ ═══════════╪═══════════════════╪═══════════╪═══════════  ← Polystyrene Raft (25 mm)\n            │\
  \                   │           │                  Floating on water surface\n            │  Plant Roots\
  \ Hanging           │\n            │  Submerged in Nutrient Water   │\n ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─\
  \ ─ ─ ─ ─ ─ ─ ─  ← Water Surface (30 cm depth DWC channel)\n ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓\n\
  \ [NITRATE-RICH WATER — Continuous flow from biofilter / media bed]\n ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓\n\
  ```\n\n* **DWC Channel Design**: PVC guttering or concrete trough, 30 cm deep, 60 cm wide, up to 30\
  \ m long.\n* **Plant Spacing**: Lettuce at 20 × 20 cm centers; Basil at 25 × 25 cm; Spinach at 15 ×\
  \ 15 cm.\n* **Aeration**: Air stones every 2 m of channel to maintain DO at root zone.\n* **Planting-to-Harvest**:\
  \ Leafy greens: 28 to 35 days; Herbs: 45 to 60 days.\n\n### 3. Nutrient Film Technique (NFT)\n* Water\
  \ flows as a thin film (2 to 3 mm depth) through 100 mm diameter PVC pipes at a 2° slope.\n* Net pots\
  \ inserted into holes cut every 20 cm hold plant crowns above the channel while roots hang into the\
  \ film.\n* NFT suits fruiting crops (tomatoes, cucumbers, peppers) when combined with supplemental potassium\
  \ and phosphate dosing.\n\n---\n\n## Fish-to-Plant Ratio Design Rule\n\nThe key design relationship\
  \ in aquaponics is matching fish feed input to plant nutrient demand:\n\n$$\\text{Daily Feed Input (g)}\
  \ = \\frac{\\text{Plant Grow Bed Area (m}^2\\text{)} \\times 60\\text{ g}}{1\\text{ m}^2}$$\n\n* **60\
  \ to 100 g of feed per m² of grow bed per day** is the practical rule for balanced nutrient cycling.\n\
  * Example: A 10 m² DWC raft system requires 600 to 1000 g of fish feed daily → supports 15 to 25 kg\
  \ of fish biomass at a 3–4% feed rate.\n* **Too Many Fish**: Nitrate and TAN overwhelm plant capacity;\
  \ water turns yellow-green; pH crashes.\n* **Too Few Fish**: Nitrate deficiency; plants yellow from\
  \ nitrogen starvation (chlorosis).\n\n---\n\n## Iron, Calcium & Potassium Supplementation\n\nPure fish\
  \ excretion provides excellent levels of nitrogen (nitrate), phosphorus, and trace minerals,\nbut three\
  \ nutrients are commonly deficient in fish-dominated systems:\n\n| Deficiency | Visual Symptom | Remedy\
  \ |\n| :--- | :--- | :--- |\n| **Iron (Fe)** | Interveinal chlorosis on young leaves (yellow between\
  \ green veins) | Chelated Fe-EDTA: 2 mg Fe/L added weekly |\n| **Potassium (K)** | Leaf tip and margin\
  \ necrosis (brown edge scorching) | Potassium bicarbonate or potassium sulfate dosing |\n| **Calcium\
  \ (Ca)** | Blossom end rot in tomatoes and peppers; distorted growing tips | Calcium carbonate (crushed\
  \ coral/limestone) in media |\n\n---\n\n## System Cycling Protocol\n\nBefore stocking fish, a new aquaponic\
  \ system must complete a biological cycling process:\n1. **Add ammonia source**: 2–5 mg/L ammonia from\
  \ ammonium chloride or small piece of decaying organic material.\n2. **Monitor daily**: Test TAN, NO₂⁻,\
  \ NO₃⁻, and pH each morning.\n3. **Week 1–2**: TAN rises, then Nitrosomonas establish and TAN peaks.\
  \ Nitrite (NO₂⁻) begins rising rapidly.\n4. **Week 3–4**: Nitrobacter colonize; NO₂⁻ falls; NO₃⁻ steadily\
  \ accumulates. This confirms a fully functioning nitrogen cycle.\n5. **System Ready**: TAN < 1.0 mg/L\
  \ AND NO₂⁻ < 0.5 mg/L after adding a large ammonia spike. Fish can now be stocked safely at partial\
  \ capacity.\n"
exercises:
- id: aqua-d5-q1
  type: MULTIPLE_CHOICE
  prompt: 'Why must the target pH in an integrated aquaponic system be maintained strictly in the range
    of 6.8 to 7.2 — a compromise narrower than the individual optima for fish, nitrifying bacteria, and
    plants separately?

    '
  xp_reward: 50
  options:
  - id: a
    text: The 6.8 to 7.2 range is ideal because it prevents all types of fish disease
  - id: b
    text: Below pH 6.8 nitrifying bacteria activity collapses sharply and iron and manganese precipitate
      out of solution; above pH 7.2 plant micronutrient availability is severely restricted and toxic
      un-ionized ammonia (NH3) fraction rises, so 6.8 to 7.2 is the only viable overlap zone for all three
      components simultaneously
  - id: c
    text: Plants cannot grow below pH 8.0 and fish cannot survive below pH 9.0
  - id: d
    text: The pH sweet spot of 6.8 to 7.2 ensures maximum TAN toxicity for algae control
  explanation: 'Fish tolerate 6.5 to 8.5; nitrifiers are optimal at 7.5 to 8.0 but function above 6.5;
    plants access iron and manganese best below 6.8. The sweet spot 6.8 to 7.2 is the compromise where
    all three system components remain functional without critically compromising any component.


    Why the other options are wrong: pH management reduces stress but does not prevent all bacterial or
    parasitic fish diseases. Most aquaponic plants grow well at pH 5.5 to 7.5; fish typically need pH
    6.0 to 8.5. At pH 6.8 to 7.2, NH3 fraction is actually very low, not maximized. Algae control is unrelated.'
  correct_answer: b
- id: aqua-d5-q2
  type: FILL_BLANK
  prompt: 'In the Affnan bell siphon flood-and-drain media bed system, the siphon suction is automatically
    broken and the drain cycle is stopped when the water level falls below the open end of the small ___
    tube, which admits atmospheric air into the siphon vacuum and terminates the drain cycle.

    '
  xp_reward: 50
  correct_answer: snorkel
  explanation: 'The snorkel tube (a small pipe penetrating the bell cap at a height 2-3 cm below the standpipe
    top) admits air into the siphon bell vacuum when water drops below its open end, breaking the siphon
    and stopping the drain automatically without any electrical timer.

    '
- id: aqua-d5-q3
  type: MATCH_PAIRS
  prompt: Match each aquaponic plant nutrient deficiency to its characteristic visible symptom in growing
    plants.
  xp_reward: 50
  pairs:
  - left:
      id: l1
      text: Iron (Fe) Deficiency
    right:
      id: r-e63ad0
      text: Interveinal chlorosis — yellow tissue between distinctly green veins on youngest leaves
  - left:
      id: l2
      text: Potassium (K) Deficiency
    right:
      id: r-955cbe
      text: Marginal leaf scorch — brown tip and edge necrosis spreading inward on older leaves
  - left:
      id: l3
      text: Calcium (Ca) Deficiency
    right:
      id: r-15a85d
      text: Blossom end rot on tomato fruits and distorted/blackened growing tips on lettuce
  - left:
      id: l4
      text: Nitrogen (N) Deficiency
    right:
      id: r-38f030
      text: Uniform pale yellowing of all older lower leaves while young leaves remain green
  correct_answer:
  - l1=r-e63ad0
  - l2=r-955cbe
  - l3=r-15a85d
  - l4=r-38f030
  explanation: 'Iron deficiency causes interveinal yellowing on young leaves; potassium causes leaf edge
    scorching; calcium causes blossom end rot; nitrogen deficiency causes uniform lower-leaf yellowing.

    '
- id: aqua-d5-q4
  type: MULTIPLE_CHOICE
  prompt: 'Using the standard aquaponics fish-to-plant feed ratio rule, a farmer operating a 15 m² Deep
    Water Culture raft system should feed approximately how many grams of fish feed per day to maintain
    a balanced nitrogen budget?

    '
  xp_reward: 50
  options:
  - id: a
    text: 50 to 100 grams per day in total for the entire 15 m² raft
  - id: b
    text: 900 to 1500 grams per day (at 60 to 100 g of feed per m² of grow bed), supporting approximately
      20 to 35 kg of fish biomass at a 4% daily feed rate
  - id: c
    text: 3000 to 5000 grams per day because larger raft systems require intensified feeding
  - id: d
    text: Feed input is irrelevant; plants regulate nitrogen automatically regardless of fish stocking
  explanation: 'The design rule is 60 to 100 g of feed per m² of grow bed per day. For 15 m²: 15 × 60
    = 900 g minimum; 15 × 100 = 1500 g maximum. At 4% feed rate (feed per day / fish biomass): 900/0.04
    = 22.5 kg fish; 1500/0.04 = 37.5 kg fish — roughly 20 to 35 kg standing stock.


    Why the other options are wrong: This dose is far too low — only 3 to 7 g/m²/day — creating severe
    nitrogen starvation in the plants. 200 to 333 g/m²/day would overwhelm the system, causing ammonia
    and nitrate accumulation. Plant nitrogen uptake is directly determined by fish feed input, which is
    the system''s only external nutrient source.'
  correct_answer: b
