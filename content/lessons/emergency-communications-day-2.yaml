briefing: 'Dual-band VHF/UHF handheld transceivers (such as the Baofeng UV-5R and UV-82 series)

  cost under KSh 4,000 in Nairobi and are ubiquitous among community patrols, wildlife

  rangers, and agricultural cooperatives. However, improper configuration (wrong squelch,

  misconfigured repeater offsets, or inadvertent CTCSS blocking) renders them useless

  during crises. This day teaches transceiver architecture, simplex direct vs repeater

  duplex operation, CTCSS/DCS sub-audible tones, standard international radio etiquette

  (ICAO phonetic alphabet), distress protocols (MAYDAY vs PAN-PAN), and power management.

  '
briefing_sw: 'Redio za mkono za VHF/UHF (kama Baofeng UV-5R) zinapatikana kwa bei nafuu Nairobi na

  zinatumika sana na walinzi na wakulima. Lakini bila kuelewa jinsi ya kurekebisha squelch,

  repeater offsets, na CTCSS tones, mawasiliano ya dharura yatakwama. Siku hii inafundisha

  uendeshaji sahihi, kanuni za simu za dharura (MAYDAY na PAN-PAN), na kutumia sauti ya ICAO.

  '
outline: '1. Handheld transceiver architecture: Antenna port (SMA), PTT button, volume/power, squelch

  2. Simplex communication: Direct radio-to-radio on a single shared frequency

  3. Repeater Duplex operation: Transmit offsets (+/- 600 kHz on 2m VHF; +/- 5.0 MHz on 70cm UHF)

  4. Squelch mechanisms: Carrier squelch threshold vs CTCSS/DCS sub-audible tone decoders

  5. The PTT (Push-To-Talk) technique: Press, pause one second, speak across the mic, release

  6. Emergency message traffic: MAYDAY (life distress) vs PAN-PAN (urgency) vs SECURITE (safety)

  7. The ICAO international phonetic alphabet and standard prowords (ROGER, OVER, OUT, SAY AGAIN)

  8. Battery preservation: 1W Low-power discipline, 12V battery eliminators, and field solar charging

  '
content_md: "## Transceiver Architecture & Key Controls\n\nCommon handhelds (e.g. Baofeng UV-5R, TYT,\
  \ Quansheng) operate across two primary bands:\n- **VHF (136 – 174 MHz):** Exceptional range in rural,\
  \ open terrain and water.\n- **UHF (400 – 480 MHz):** Shorter wavelength (~70 cm); penetrates concrete\
  \ buildings and dense forest canopies.\n\n### Critical Knobs and Menu Settings:\n- **Power / Volume\
  \ Knob:** Rotary switch on top.\n- **PTT (Push-To-Talk):** Large rubber side switch. Press firmly to\
  \ transmit; release to receive.\n- **SQL (Squelch Level, Menu 0):** Sets the background noise threshold.\n\
  \  - Set to **Level 2 or 3**: Mutes ambient atmospheric static while remaining sensitive to distant\
  \ signals.\n  - Setting to Level 8 or 9 requires an overwhelmingly strong signal to open the audio gate,\
  \ deafening your radio to weak emergency transmissions!\n- **TXP (Transmit Power, Menu 2):**\n  - **LOW\
  \ (1 Watt):** Extends battery life by 400%; sufficient for line-of-sight comms up to 3 km.\n  - **HIGH\
  \ (4–8 Watts):** Use only when communicating through obstacles or over long distances.\n\n## Simplex\
  \ vs Repeater Duplex Operation\n\n### 1. Simplex Operation (Direct Radio-to-Radio)\nBoth transceivers\
  \ transmit and receive on the exact same frequency.\n- Example: Unit A and Unit B both set to `145.500\
  \ MHz`.\n- Simple, requires zero infrastructure, but range is limited by terrain and curvature of the\
  \ Earth (typically 3–15 km from ground level).\n\n### 2. Duplex Repeater Operation (Overcoming Mountains\
  \ & Distance)\nA **repeater** is a high-power transceiver mounted on an elevated tower or mountain ridge\
  \ (e.g. Ngong Hills, Mount Longonot). It listens on one frequency (**Input**) and instantaneously re-broadcasts\
  \ on another frequency (**Output**) with 50–100 Watts:\n- **Standard 2-Meter VHF Offset:** $\\pm 600\\\
  text{ kHz (0.6 MHz)}$.\n- **Standard 70-Centimeter UHF Offset:** $\\pm 5.0\\text{ MHz}$.\n\n### CTCSS\
  \ / DCS Tones (Continuous Tone-Coded Squelch)\nRepeaters and community nets often require a sub-audible\
  \ tone (e.g. `100.0 Hz` CTCSS) transmitted alongside your voice to open their receiver:\n- **Tone does\
  \ NOT encrypt your transmission.** Anyone on the frequency can still hear you.\n- If you transmit without\
  \ the correct tone, the repeater ignores your transmission.\n- In community simplex nets, setting receive\
  \ CTCSS blocks interference from neighboring users.\n\n## International Radio Etiquette & Discipline\n\
  \nIn emergencies, panicked rambling blocks frequencies. Communications must be crisp and standardized:\n\
  \n### The Golden PTT Rule:\n> **Think before you key.** Press PTT $\\rightarrow$ Wait **1 full second**\
  \ (allows tone and repeater carrier to settle) $\\rightarrow$ Speak clearly across the microphone (not\
  \ directly into it) $\\rightarrow$ Release PTT immediately.\n\n### Standard Prowords:\n| Proword | Meaning\
  \ |\n|---------|---------|\n| **ROGER** | \"I have received and understood your last transmission.\"\
  \ |\n| **SAY AGAIN** | \"Repeat your last transmission.\" (Never say 'repeat' — 'repeat' means artillery\
  \ barrage in military doctrine!) |\n| **AFFIRMATIVE / NEGATIVE** | \"Yes\" / \"No\" (clearer over noisy\
  \ channels) |\n| **STANDBY** | \"Acknowledge call; pause for more info.\" |\n| **OVER** | \"I have finished\
  \ speaking; response expected.\" |\n| **OUT** | \"Conversation ended; channel clear.\" (Never say 'Over\
  \ and Out' together!) |\n\n### Emergency Distress Calls:\n- **MAYDAY (Repeated 3 times):** Immediate\
  \ life-or-death emergency (sinking boat, catastrophic bleed, armed attack). Clears all non-essential\
  \ traffic immediately.\n- **PAN-PAN (Repeated 3 times):** Urgent situation concerning safety of a person\
  \ or vehicle (broken vehicle in wilderness, severe injury with stable vitals).\n- **SECURITE (Repeated\
  \ 3 times):** Safety bulletin (approaching flash flood, fallen high-voltage power lines).\n"
exercises:
- id: ec2-q1
  type: MULTIPLE_CHOICE
  prompt: You are attempting to reach a mountain repeater with an output frequency of 145.600 MHz and
    a standard negative offset of 600 kHz (-0.6 MHz). What frequency should your radio transmit on when
    you press the PTT button?
  xp_reward: 35
  options:
  - id: a
    text: 145.600 MHz (same frequency)
  - id: b
    text: 146.200 MHz
  - id: c
    text: 145.000 MHz
  - id: d
    text: 433.000 MHz
  correct_answer: c
  explanation: 'Correct! With a -600 kHz (-0.600 MHz) offset, your radio listens on the repeater''s output
    (145.600 MHz) and shifts down to transmit on the repeater''s input: 145.600 - 0.600 = 145.000 MHz.


    Why the other options are wrong: Transmitting on the same frequency is simplex; repeaters operate
    duplex on different transmit and receive frequencies. 146.200 MHz would be a positive (+0.600 MHz)
    offset, not a negative offset. This jumps to a completely different band (UHF instead of VHF).'
- id: ec2-q2
  type: FILL_BLANK
  prompt: The highest-priority international radio distress call, used strictly when life is in immediate,
    grave danger, is spoken as the word ___ repeated three times.
  xp_reward: 20
  correct_answer: MAYDAY
  explanation: MAYDAY (from the French 'venez m'aider' - come help me) is the universal distress signal.
    It halts all other radio traffic on the channel to prioritize the emergency casualty or craft.
- id: ec2-q3
  type: MATCH_PAIRS
  prompt: Match each transceiver control or setting to its function.
  xp_reward: 30
  pairs:
  - left:
      id: l1
      text: Squelch (SQL Level 2-3)
    right:
      id: r-f1cf06
      text: Silences continuous background static while allowing weak signals to open speaker
  - left:
      id: l2
      text: CTCSS Sub-audible Tone
    right:
      id: r-2d5f06
      text: Inaudible low-frequency audio tone required to open repeater receiver gates
  - left:
      id: l3
      text: 'Transmit Power: LOW (1W)'
    right:
      id: r-6c7d27
      text: Preserves 80% battery capacity during short-range line-of-sight communication
  - left:
      id: l4
      text: Battery Eliminator
    right:
      id: r-7560d9
      text: Replaces the Li-ion battery pack with a DC cable to run directly from a 12V car battery
  correct_answer:
  - l1=r-f1cf06
  - l2=r-2d5f06
  - l3=r-6c7d27
  - l4=r-7560d9
