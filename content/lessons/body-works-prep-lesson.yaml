id: "body-works-prep-lesson"
course_id: "body-works"
title: "Panel beating, cleanliness, and filler"
title_sw: "Panel beating, usafi, na filler"
briefing: "Body repair is metalwork before chemistry. Knock and file to get the panel close. Filler is for skim, not to rebuild a wing in one lump. Degrease with the specified solvent, abrade (key) the surface, and apply filler in thin layers, allowing cure. Thick filler cracks and sinks.\n\nGuide coat shows hollows when you sand. Work through grits as taught so scratches are finer than the next paint layer will hide. Bare metal needs the right primer — not random emulsion from the building store.\n\nDust from sanding is a lung hazard. Extraction, mask, and housekeeping beat sweeping clouds onto the next car."
briefing_sw: "Rekebisha chuma kwanza. Filler ni tabaka nyembamba kwenye uso uliosafishwa na kuabrade. Guide coat inaonyesha mashimo. Vumbi linahitaji mask na extraction."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/ABR/CR/01/5"
exam_domain: "Metal & filler"
exercises:
  - id: "body-works-prep-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Before body filler, metal should be:"
    options:
      - id: "a"
        text: "Oily so filler slides"
      - id: "b"
        text: "Clean, dry, and keyed as specified"
      - id: "c"
        text: "Painted with bitumen"
      - id: "d"
        text: "Soaking wet"
    correct_answer: "b"
    hint: "Adhesion."
    explanation: "Contamination causes lifting. Prep is most of the job."
    xp_reward: 50
  - id: "body-works-prep-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Thick single-application filler often:"
    options:
      - id: "a"
        text: "Stays flexible forever"
      - id: "b"
        text: "Cracks, sinks, or pinholes"
      - id: "c"
        text: "Replaces welding always"
      - id: "d"
        text: "Cures without hardener"
    correct_answer: "b"
    hint: "Thin layers."
    explanation: "Build in coats. Follow mixing ratio of filler to hardener."
    xp_reward: 50
  - id: "body-works-prep-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A guide coat is used to:"
    options:
      - id: "a"
        text: "Colour the customer’s house"
      - id: "b"
        text: "Reveal remaining high and low spots while sanding"
      - id: "c"
        text: "Lubricate the file"
      - id: "d"
        text: "Replace primer"
    correct_answer: "b"
    hint: "See the shape."
    explanation: "Dark dust in scratches/lows tells you where to work."
    xp_reward: 50
  - id: "body-works-prep-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Sanding dust should be:"
    options:
      - id: "a"
        text: "Blown into the canteen"
      - id: "b"
        text: "Extracted and the operator masked to the grit/chemical risk"
      - id: "c"
        text: "Eaten for calcium"
      - id: "d"
        text: "Ignored on 2K jobs only"
    correct_answer: "b"
    hint: "Lungs."
    explanation: "Body filler and paint dust are occupational hazards."
    xp_reward: 50
  - id: "body-works-prep-fb1"
    type: "FILL_BLANK"
    prompt: "Abrading a surface so the next coat can grip is called giving it a ___."
    correct_answer: "key"
    hint: "Also “mechanical key”."
    explanation: "Smooth glossy paint is a poor base without a key."
    xp_reward: 50
  - id: "body-works-prep-scenario"
    type: "SCENARIO"
    prompt: "Filler mixed with too little hardener is still tacky after the slot time. Trainee adds a handful more powder. What is correct?"
    options:
      - id: "a"
        text: "Keep adding random powder"
      - id: "b"
        text: "Discard, remix to the specified ratio, and check workshop temperature"
      - id: "c"
        text: "Heat with a cutting torch"
      - id: "d"
        text: "Paint over tacky filler"
    correct_answer: "b"
    hint: "Ratio is chemistry."
    explanation: "Wrong mix never “catches up”. Scrap it."
    xp_reward: 60
