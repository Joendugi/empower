id: "carpentry-hanging-lesson"
course_id: "carpentry"
title: "Hanging, ironmongery, and movement"
title_sw: "Kuning’iniza, ironmongery, na kupanuka"
briefing: "Hanging a door: plane to clearance (often about 2–3 mm as taught — follow the spec), mark hinge gains from the hanging stile, chop or router to the leaf thickness so the hinge sits flush. Screws in the frame must bite — pack or longer screws into studs if the lining is hollow.\n\nLocks: mortise at the right height, keep aligned, and do not split the stile. Handle sets have a backset. Test the latch before you call it done.\n\nMoisture movement: a door hung in the rains on wet timber binds at the head the next week. Ease the high spot after checking hinges have not sunk. Advise sealing all faces, including the bottom edge, or the job comes back.\n\nIronmongery on exterior work should be the specified corrosion resistance. Bright mild screws on a coastal door rust and seize."
briefing_sw: "Weka hinge flush. Clearance kama spec. Fungua lock kwa urefu sahihi. Mbao yenye unyevu inasogea — seal pande zote. Test latch kabla ya kuondoka."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/CRP/CR/03/5"
exam_domain: "Site joinery"
exercises:
  - id: "carpentry-hanging-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A door binds at the head after a rainy night. Timber was not dry. You should:"
    options:
      - id: "a"
        text: "Plane the high spot after checking hinges and moisture, and advise sealing"
      - id: "b"
        text: "Force it with a bigger hammer"
      - id: "c"
        text: "Pour water on the other side"
      - id: "d"
        text: "Replace the house foundation"
    correct_answer: "a"
    hint: "Timber moves."
    explanation: "Ease and seal. Do not destroy the latch."
    xp_reward: 50
  - id: "carpentry-hanging-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Hinge leaves that sit proud of the gain:"
    options:
      - id: "a"
        text: "Look traditional"
      - id: "b"
        text: "Throw the door out of line and strain screws"
      - id: "c"
        text: "Increase clearance automatically"
      - id: "d"
        text: "Replace locks"
    correct_answer: "b"
    hint: "Flush."
    explanation: "Gains are chopped to the leaf thickness."
    xp_reward: 50
  - id: "carpentry-hanging-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "The bottom edge of an exterior door should be:"
    options:
      - id: "a"
        text: "Left raw for “breathing”"
      - id: "b"
        text: "Sealed like the other faces to limit moisture uptake"
      - id: "c"
        text: "Drilled for drainage always"
      - id: "d"
        text: "Planed after painting only"
    correct_answer: "b"
    hint: "All faces."
    explanation: "Unsealed end grain drinks water."
    xp_reward: 50
  - id: "carpentry-hanging-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A latch that does not enter the keep may need:"
    options:
      - id: "a"
        text: "A longer door"
      - id: "b"
        text: "Keep alignment / strike adjustment, not a bigger hammer on the handle"
      - id: "c"
        text: "Removal of all hinges"
      - id: "d"
        text: "Wetting the lock"
    correct_answer: "b"
    hint: "Geometry of keep."
    explanation: "Move the keep or plane the meeting stile as appropriate."
    xp_reward: 50
  - id: "carpentry-hanging-fb1"
    type: "FILL_BLANK"
    prompt: "The recess chopped for a hinge leaf is called a hinge ___."
    correct_answer: "gain"
    hint: "Also hinge recess / housing."
    explanation: "Gains let the hinge sit flush."
    xp_reward: 50
  - id: "carpentry-hanging-scenario"
    type: "SCENARIO"
    prompt: "You hung a door with 8 mm clearance at the head and 0 mm at the latch. It slams or will not close. Fix?"
    options:
      - id: "a"
        text: "Leave it as character"
      - id: "b"
        text: "Rehang/plane to even specified clearances and reset the keep"
      - id: "c"
        text: "Remove two hinges"
      - id: "d"
        text: "Oil the floor instead"
    correct_answer: "b"
    hint: "Even gaps."
    explanation: "Uneven clearance is a hanging fault, not a lock fault only."
    xp_reward: 60
