id: "community-health-support-screen-refer-lesson"
course_id: "community-health-support"
title: "Week 2 — Basic observations, referral, and health promotion"
title_sw: "Wiki 2 — Vipimo, rufaa, na elimu"
briefing: "Basic observations include temperature, pulse, breathing rate, and blood pressure only when trained and using maintained equipment. Verify identity, explain the measurement, position the person correctly, record units, repeat an unexpected result, and clean the device. A number without context is not a diagnosis.\n\nUse approved referral pathways. State what you observed, when it began, relevant history volunteered by the client, and what first aid was given. Do not promise outcomes. Health promotion should be practical and respectful: safe water, immunisation information, nutrition, mosquito control, medication adherence, maternal danger signs, and clinic follow-up.\n\nSafeguarding concerns involving children, vulnerable adults, violence, or exploitation follow the institution’s escalation policy. Do not investigate alone or confront a suspected abuser in a way that increases danger."
briefing_sw: "Wiki 2 — Vipimo, rufaa, na elimu: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "community-health-support-screen-refer-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for community referral?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "community-health-support-screen-refer-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that community referral was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "community-health-support-screen-refer-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "community-health-support-screen-refer-scenario"
    type: "SCENARIO"
    prompt: "A client has severe breathing difficulty but asks you to keep the visit secret and leave. What should you do?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
