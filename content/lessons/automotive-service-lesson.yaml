id: "automotive-service-lesson"
course_id: "automotive"
title: "Service to manufacturer data"
title_sw: "Servisi kulingana na data"
briefing: "Service is not “black oil out, any oil in”. Use the manufacturer grade (viscosity and spec), the filter that fits, and torque on the drain plug and filter. Over-torque strips the sump. Under-torque weeps. Replace crush washers when specified.\n\nSequence: protect the vehicle, record mileage, inspect leaks and tyres, then fluids. Dispose of oil as hazardous waste. Air filters and plugs follow the schedule, not the customer’s cousin.\n\nOn modern vehicles, a service light and torque-to-yield bolts need data. If you do not have the book or a trusted information system, you do not invent a torque.\n\nRoad test or at least start and check the oil level again after the first run — filters fill and the level drops."
briefing_sw: "Tumia grade ya mafuta iliyoainishwa. Torque kwenye plug. Badilisha washer. Tupa mafuta kama hatari. Kagua level baada ya kuwasha injini."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AUT/CR/02/5"
exam_domain: "Routine service"
exercises:
  - id: "automotive-service-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Engine oil should be selected from:"
    options:
      - id: "a"
        text: "Whatever is cheapest that day"
      - id: "b"
        text: "Manufacturer viscosity and specification"
      - id: "c"
        text: "Brake fluid bottles"
      - id: "d"
        text: "Cooking oil if it is 20W"
    correct_answer: "b"
    hint: "The handbook wins."
    explanation: "Wrong spec oil damages aftertreatment and bearings."
    xp_reward: 50
  - id: "automotive-service-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Drain plug torque matters because:"
    options:
      - id: "a"
        text: "It is fashion"
      - id: "b"
        text: "Stripped sumps and oil-on-road both start here"
      - id: "c"
        text: "Oil likes loose plugs"
      - id: "d"
        text: "Filters replace plugs"
    correct_answer: "b"
    hint: "Aluminium sumps."
    explanation: "Use a torque wrench. New washer when specified."
    xp_reward: 50
  - id: "automotive-service-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Used engine oil goes:"
    options:
      - id: "a"
        text: "Down rainwater drains"
      - id: "b"
        text: "Into designated waste oil storage"
      - id: "c"
        text: "Into the radiator"
      - id: "d"
        text: "On the canteen dust to keep it down"
    correct_answer: "b"
    hint: "Hazardous."
    explanation: "Illegal dumping is not a workshop skill."
    xp_reward: 50
  - id: "automotive-service-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "After an oil and filter change you should:"
    options:
      - id: "a"
        text: "Never start the engine"
      - id: "b"
        text: "Run, recheck level and leaks"
      - id: "c"
        text: "Fill to the brim of the filler cap"
      - id: "d"
        text: "Disable the oil pressure switch"
    correct_answer: "b"
    hint: "Filter volume."
    explanation: "Dry filters take a litre. Check again."
    xp_reward: 50
  - id: "automotive-service-fb1"
    type: "FILL_BLANK"
    prompt: "The turning force specified for a drain plug is measured as ___."
    correct_answer: "torque"
    hint: "N·m on the chart."
    explanation: "Torque is not “tight enough”."
    xp_reward: 50
  - id: "automotive-service-scenario"
    type: "SCENARIO"
    prompt: "Customer wants “thicker oil” because the engine knocks. Compression is low. You should:"
    options:
      - id: "a"
        text: "Pour 40W into a 5W-30 petrol engine and call it a repair"
      - id: "b"
        text: "Diagnose the knock; do not hide wear with the wrong oil"
      - id: "c"
        text: "Remove the oil pump"
      - id: "d"
        text: "Disconnect the knock sensor and add 2-stroke mix"
    correct_answer: "b"
    hint: "Oil is not a mechanical repair."
    explanation: "Explain options. Wrong oil can damage catalysts and still knock."
    xp_reward: 60
