id: community-health-support-hygiene
course_id: community-health-support
title: 'Infection Prevention For Community Health Workers: Hand Hygiene, Ppe Use,
  Sharps Safety And Home Visit Protocol: Principles and Practical Application'
title_sw: 'Infection Prevention For Community Health Workers: Hand Hygiene, Ppe Use,
  Sharps Safety And Home Visit Protocol: Kanuni na Utendaji wa Vitendo'
briefing: 'In professional workshop practice, mastering Infection Prevention for Community
  Health Workers: Hand Hygiene, PPE Use, Sharps Safety and Home Visit Protocol requires
  strict adherence to safety standards and sequential execution. Always inspect personal
  protective equipment (PPE), ensure proper tool calibration, and verify that the
  workpiece is securely mounted before commencing. Observe manufacturer specifications
  and relevant standards. Maintain a clean work environment, store consumables dry,
  and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Infection Prevention for Community
  Health Workers: Hand Hygiene, PPE Use, Sharps Safety and Home Visit Protocol kunahitaji
  kufuata sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla
  ya kuanza kazi.'
