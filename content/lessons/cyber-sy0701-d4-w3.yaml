id: cyber-sy0701-d4-w3
course_id: secplus-operations
title: Week 3 — Incident response, forensics hygiene, and recovery
title_sw: Wiki 3 — Majibu ya tukio na urejeshaji
briefing: 'Incident steps (know the order): preparation; detection and analysis; containment, eradication, recovery; lessons learned. Preparation is playbooks, contacts (KE-CIRT/CC, campus DPO), and tool access before 02:00. Containment may be isolating a VLAN or disabling an account — decide short-term vs long-term. Do not power off a live ransomware host if memory forensics is required and you have the skill; do isolate it. Evidence: chain of custody, hashes of images, volatile then disk.


  Legal: Computer Misuse and Cybercrimes Act — you need authorisation to “hack back”. Preservation for police/KE-CIRT may be required. Communication: one spokesperson, no WhatsApp rumours. Recovery: rebuild from golden image, restore from offline backup, rotate credentials, hunt for persistence, then monitor harder.


  Lessons learned is a meeting with actions: missing MFA, missing segmentation, missing backup. If the report is only “virus was removed” you will repeat the incident at the next graduation.


  Tabletop this week: ransomware on a lab, MIS still up. Who isolates? Who talks to the principal? What is the RTO? Write it as a one-page playbook.'
briefing_sw: 'Andaa, gundua, zuia, komesha, rejea, funza. KE-CIRT. Usishambulie nyuma. Hash ya picha. Chain of custody. Rejea kutoka backup ya nje. Somo: MFA, segmentation.'
