      text: Sugars and amino acids from complex polymers
  - left:
      id: l2
      text: Acidogenesis
    right:
      id: r-fe1367
      text: Volatile fatty acids, hydrogen and CO2
  - left:
      id: l3
      text: Methanogenesis
    right:
      id: r-4c96dc
      text: Methane and carbon dioxide (biogas)
  correct_answer:
  - l1=r-36fb57
  - l2=r-fe1367
  - l3=r-4c96dc
  explanation: 'The three-stage cascade is sequential. If any stage is blocked (e.g., methanogens inhibited
    by low pH), the preceding products accumulate and further suppress the system.

    '
- id: ecos-d3-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why is a fixed-dome (Deenbandhu) digester preferred over a floating-drum (KVIC) design for
    off-grid East Africa?

    '
  xp_reward: 50
  options:
  - id: a
    text: Produces higher methane percentage than floating-drum designs
  - id: b
    text: Operates at thermophilic temperatures without external heating
  - id: c
    text: Delivers constant gas pressure through a mechanical regulator
  - id: d
    text: Built entirely from local brick and cement with no moving parts; lifespan exceeds 20 years and
      requires no steel maintenance
  explanation: 'The fixed-dome uses locally available materials, has no rusting steel parts, and has a
    lifespan of 20+ years. The floating drum corrodes and must be repainted every few years — a significant
    maintenance burden in remote areas.


    Why the other options are wrong: Biogas composition depends on feedstock and microbial conditions,
    not digester geometry. Both designs produce similar gas quality. Fixed-dome digesters are usually
    mesophilic (20-37 C). They do not self-heat to thermophilic range (50-65 C) without an external heat
    source. Fixed-dome pressure is variable (it rises as gas accumulates and slurry is pushed to the expansion
    chamber). Constant pressure is the advantage of the floating-drum design.'
  correct_answer: d
- id: ecos-d3-q5
  type: FILL_BLANK
  prompt: 'Biogas is approximately ___% methane and ___% carbon dioxide by volume. Its calorific value
    is approximately ___ kWh per cubic metre.

    '
  xp_reward: 50
  correct_answer:
  - 60%
  - 40%
  - 6 kWh
  explanation: 'Typical biogas is 55-70% CH4 (commonly quoted as 60%) and 30-45% CO2. At 65% CH4 the calorific
    value is approximately 6 kWh/m3, compared to 10 kWh/m3 for pure methane. H2S at 0.1-1% contributes
    to corrosion of metal appliances if not scrubbed.

    '
