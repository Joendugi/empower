id: "refrigeration-recovery-lesson"
course_id: "refrigeration"
title: "Refrigerant law, recovery, and nitrogen"
title_sw: "Sheria ya gesi, recovery, na nitrogen"
briefing: "Venting refrigerant to air is environmentally harmful and may be illegal. Recover into a proper cylinder with recovery equipment. Label cylinders. Mixing refrigerants in one bottle is a later technician’s nightmare.\n\nPressure tests use dry nitrogen, never oxygen or compressed air from an oily workshop compressor. Oxygen plus oil in a system is an explosion risk. Use a regulator and know the test pressure from the manufacturer — do not “pump until it feels hard”.\n\nGoggles and gloves when opening systems. Liquid refrigerant on skin is a freeze burn. Evacuate to the required vacuum before charging; moisture plus refrigerant plus oil makes acids and sludge.\n\nSDS and cylinder colours: know what is in your hand. R600a (isobutane) in many domestic fridges is flammable — no smoking, no sparks, follow hydrocarbon procedures."
briefing_sw: "Usitoe gesi hewani — fanya recovery. Jaribu shinikizo kwa nitrogen, si oxygen. Vacuum kabla ya charge. R600a ni kuwaka; fuata taratibu za hydrocarbon."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/RAC/CR/02/5"
exam_domain: "Environment & safety"
exercises:
  - id: "refrigeration-recovery-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Why recover refrigerant instead of releasing it?"
    options:
      - id: "a"
        text: "It is slower"
      - id: "b"
        text: "Legal and environmental duty — many refrigerants harm climate and may be illegal to vent"
      - id: "c"
        text: "It makes ice cream freeze faster"
      - id: "d"
        text: "NITA requires open vents for luck"
    correct_answer: "b"
    hint: "Climate and law."
    explanation: "Recovery is competent RAC practice, not optional kindness."
    xp_reward: 50
  - id: "refrigeration-recovery-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Systems should be strength/leak tested with:"
    options:
      - id: "a"
        text: "Oxygen"
      - id: "b"
        text: "Dry nitrogen (regulated)"
      - id: "c"
        text: "Petrol vapour"
      - id: "d"
        text: "Workshop air from an oily compressor"
    correct_answer: "b"
    hint: "Inert, dry."
    explanation: "Oxygen + oil is dangerous. Moisture in air is also unwelcome."
    xp_reward: 50
  - id: "refrigeration-recovery-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "R600a in domestic cabinets is a concern because it is:"
    options:
      - id: "a"
        text: "Always non-flammable"
      - id: "b"
        text: "A hydrocarbon — flammable; needs spark-aware procedure"
      - id: "c"
        text: "The same as water"
      - id: "d"
        text: "Only used in cars"
    correct_answer: "b"
    hint: "Isobutane."
    explanation: "Treat HC systems as flammable. Charge masses are small but ignition is real."
    xp_reward: 50
  - id: "refrigeration-recovery-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A deep vacuum before charging is mainly to:"
    options:
      - id: "a"
        text: "Paint the pipes"
      - id: "b"
        text: "Remove air and moisture"
      - id: "c"
        text: "Increase oil acidity on purpose"
      - id: "d"
        text: "Cool the room"
    correct_answer: "b"
    hint: "Non-condensables and water."
    explanation: "Air raises head pressure; moisture damages the system chemically."
    xp_reward: 50
  - id: "refrigeration-recovery-fb1"
    type: "FILL_BLANK"
    prompt: "Putting used refrigerant into a recovery cylinder instead of the atmosphere is called ___."
    correct_answer: "recovery"
    hint: "Opposite of venting."
    explanation: "Recovery, recycle, reclaim — know which your equipment actually does."
    xp_reward: 50
  - id: "refrigeration-recovery-scenario"
    type: "SCENARIO"
    prompt: "A trainee wants to find a leak with a cigarette lighter on a hydrocarbon fridge. Your response?"
    options:
      - id: "a"
        text: "Approve — flames show leaks"
      - id: "b"
        text: "Stop immediately; use approved leak detection, isolate ignition, follow HC rules"
      - id: "c"
        text: "Open all windows and still use the lighter"
      - id: "d"
        text: "Add oxygen to make the flame clearer"
    correct_answer: "b"
    hint: "Fuel plus flame."
    explanation: "Electronic or bubble methods, not naked flames on HC systems."
    xp_reward: 60
