id: "plumbing-storage-lesson"
course_id: "plumbing"
title: "Week 7 — Water storage tanks, overflow, and maintenance"
title_sw: "Wiki 7 — Tanki, overflow, na matengenezo"
briefing: "Water storage is a plumber core: loft tanks, roof tanks, and ground tanks feeding gravity or pumps. Structure first — a full tank is heavy. Support as the manufacturer and the builder specify. A tank on two skinny timber across a span is how ceilings collapse. Inlet via a float/ball valve set so the waterline leaves air gap and overflow capacity.\n\nOverflow (warning pipe) must discharge where someone will notice — not silently into a void. Covers keep out light, insects, and debris; screened vents. Potable tanks are cleaned on a schedule; biofilm and drowned rodents are public-health failures. Do not use a waste-water drum as a drinking tank.\n\nIsolation: every tank should have valves so you can work without draining the whole site. Maintenance: replace perished ball-valve washers, check overflow, inspect for UV-brittle plastic, and chlorinate after cleaning as instructed. Pumps: isolate electrically as well as hydraulically — you already know that from isolation week.\n\nTest: fill, confirm shut-off, overflow trial, no weep at unions, and the cover back on. Record the clean date. That is storage competence, not “fit and forget”."
briefing_sw: "Tanki ni nzito — msaada wa muundo. Ball valve, overflow inayoonekana, kifuniko dhidi ya mbu. Usitumie drum ya taka kwa maji ya kunywa. Valve za isolation. Safisha na rekodi. Pampu: zima umeme pia."
estimated_minutes: 26
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/PLB/CR/07/4"
exam_domain: "Water storage"
exercises:
  - id: "plumbing-storage-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A warning/overflow pipe should discharge:"
    options:
      - id: "a"
        text: "Into a sealed ceiling void"
      - id: "b"
        text: "Where the leak is visible so the fault is noticed"
      - id: "c"
        text: "Into the soil stack without a design"
      - id: "d"
        text: "Into the electrical CU"
    correct_answer: "b"
    hint: "Warning."
    explanation: "Silent overflows flood for weeks. Visibility is the point."
    xp_reward: 50
  - id: "plumbing-storage-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "A potable storage tank without a lid is wrong because:"
    options:
      - id: "a"
        text: "It cools better"
      - id: "b"
        text: "Contamination and mosquito breeding"
      - id: "c"
        text: "Ball valves need sunlight"
      - id: "d"
        text: "IEE requires open tanks"
    correct_answer: "b"
    hint: "Hygiene."
    explanation: "Covers and screens are part of the appliance."
    xp_reward: 50
  - id: "plumbing-storage-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Before working on a roof tank outlet you should:"
    options:
      - id: "a"
        text: "Open every tap in the estate"
      - id: "b"
        text: "Isolate inlet and outlet valves and drain as needed, with electrical isolation if a pump is present"
      - id: "c"
        text: "Hit the ball valve with a hammer only"
      - id: "d"
        text: "Connect the overflow to the kettle"
    correct_answer: "b"
    hint: "Same isolation mindset."
    explanation: "Stored water plus a pump is a flood and a shock risk."
    xp_reward: 50
  - id: "plumbing-storage-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "A ball valve that does not shut at the waterline will:"
    options:
      - id: "a"
        text: "Save water"
      - id: "b"
        text: "Overflow continuously and can collapse a poorly supported ceiling"
      - id: "c"
        text: "Sterilise the tank"
      - id: "d"
        text: "Increase fall on gutters"
    correct_answer: "b"
    hint: "Float setting."
    explanation: "Washer, seating, and arm setting are maintenance items."
    xp_reward: 50
  - id: "plumbing-storage-fb1"
    type: "FILL_BLANK"
    prompt: "The float-operated valve that stops the tank filling is a ___ valve."
    correct_answer: "ball"
    hint: "Ball valve / float valve."
    explanation: "Set the waterline below the overflow. That is the adjustment."
    xp_reward: 50
  - id: "plumbing-storage-scenario"
    type: "SCENARIO"
    prompt: "Plastic tank on a roof, no overflow, ball valve stuck open, water staining the bedroom ceiling. Immediate actions?"
    options:
      - id: "a"
        text: "Advise more silicone in the bedroom"
      - id: "b"
        text: "Isolate supply, drain/make safe, repair/replace the valve, add a working overflow, check structure, then restore"
      - id: "c"
        text: "Fit a bigger inlet only"
      - id: "d"
        text: "Connect the stain to the soil stack"
    correct_answer: "b"
    hint: "Stop the water, then engineer the tank."
    explanation: "Storage maintenance is isolation, hygiene, and overflow — the whole unit."
    xp_reward: 60
