id: tvet-software-w3
course_id: software-install
title: Week 3 — Testing, user training, and software maintenance
title_sw: Wiki 3 — Majaribio, mafunzo, na matengenezo ya programu
briefing: 'Testing is a listed learning outcome: the software must meet the specification, not merely show a desktop. Smoke-test: boots, logs on, prints or exports, opens the curriculum apps, and survives a reboot. Check disk space, activation, Windows Update / apt upgrade, and that a standard user cannot install random .exe. Record results in a test report — date, machine ID, tester, pass/fail, defects.


  User training is not optional in the unit. Show the staff member or class captain: login, how to save to the approved folder, how to update, and what not to download. Leave a one-page handout. If antivirus alerts, they must know who to call. Training reduces “the computer has a virus” tickets that are actually toolbar installs.


  Maintenance: patch on a schedule, remove unused packages, renew licences, and re-image when drift is cheaper than repair. Use WSUS, Intune, or apt unattended-upgrades as the college standard. Document the golden image version. When a new printer arrives, add the driver to the image so the next 40 installs do not repeat the hunt.


  Portfolio: test report + training attendance + maintenance log. That is how 260 hours is evidenced — not a single Next-Next-Finish screenshot.'
briefing_sw: Jaribu kuingia, kuchapisha, na kuwasha upya. Mtumiaji wa kawaida asiweke .exe. Funza stafu. Patch kwa ratiba. Andika ripoti ya majaribio na logi ya matengenezo.
