briefing: 'Felling a 20-ton hardwood tree is one of the most hazardous operations in field engineering;
  an uncontrolled fall will crush workers, smash equipment, shatter valuable sawlogs, or trigger deadly
  ''barber-chair'' trunk splits. True forestry is not about hacking at a stump; it is the precision science
  of internal hinge engineering—using an open-face directional notch, a calculated holding wood hinge
  (10% of trunk diameter), wedges, and an established 45-degree retreat path. This lesson covers chainsaw
  kickback zone physics, chainsaw chain sharpening geometry, directional felling mechanics, and sawlog
  scaling/grading formulas.

  '
outline: 'Personal protective equipment (PPE: ballistic kevlar chaps, steel-toe boots, mesh visor helmet,
  hearing protection); chainsaw anatomy and safety features (inertia chain brake, chain catcher, throttle
  interlock); kickback physics: the upper quadrant of the guide bar tip (rotational energy vector); chain
  filing geometry (30° cutter top-plate angle, 0.025-inch depth gauge / raker height); assessing tree
  hazards (dead snags, rot, lean, crown weight distribution, wind speed); directional felling cuts: the
  Open-Face notch (70° opening, depth 20-25% diameter), the Bore Cut (plunge cut) to prevent barber-chairing
  on heavy leaning trees, and the Back Cut; holding wood hinge thickness rule (10% of DBH); felling wedges;
  establishing the 45° escape retreat route; sawlog grading and volume calculation (Huber''s and Smalian''s
  cubic volume formulas).

  '
content_md: "## The Danger of Tree Felling & Chainsaw Physics\n\nA mature 70 cm diameter tree weighs between\
  \ **15,000 kg and 25,000 kg**.\nWhen it falls, potential energy converts into devastating kinetic momentum.\n\
  Logging fatalities stem primarily from four phenomena:\n1. **Barber-Chairing**: A leaning tree splits\
  \ vertically up the trunk before the back-cut is complete, catapulting the rear slab upward like a giant\
  \ spring into the sawyer's chest.\n2. **Widow-Makers**: Dead branches (*snags*) in the canopy dislodged\
  \ by vibrations that plunge vertically onto the logger's head.\n3. **Kickback**: The tip of the guide\
  \ bar contacts wood, throwing the running saw upward into the operator's neck at 25 metres per second.\n\
  4. **Springpoles**: Saplings pinned under fallen logs that whip back with bone-shattering force when\
  \ cut.\n\n## Chainsaw Safety Architecture & Kickback Physics\n\n```\n                     [ UPPER QUADRANT\
  \ = KICKBACK ZONE ]\n                                ╭──────────╮\n                              ╭─╯\
  \   ▲ ▲    ╰─╮  ◄── NEVER TOUCH WOOD HERE!\n                              │    ◄─┴─┴─►   │\n   ═══════════════════════════╧══════════════╪════════════════════\n\
  \    GUIDE BAR (Cutting with Bottom Edge = Pulls Forward)\n   ═══════════════════════════════════════════════════════════════\n\
  ```\n\n### 1. The Kickback Zone:\n- The **upper 90° quadrant of the guide bar tip**.\n- When rotating\
  \ cutters strike wood in this zone, the chain stops instantaneously.\n- Newton's third law drives the\
  \ entire bar and spinning engine backward and upward in a violent rotational arc directly toward the\
  \ operator's face in less than **100 milliseconds**.\n- **Defense**: The **Inertia Chain Brake** (stops\
  \ chain rotation within 0.05 seconds if a kickback wrist impact occurs) and maintaining a **firm wrap-around\
  \ thumb grip** on the front handlebar at all times.\n\n### 2. Cutter Tooth Sharpening Geometry:\nA dull\
  \ chain produces powdery sawdust, overheats the bar, and tempts the sawyer to force the tool. A sharp\
  \ chain pulls itself into the wood, throwing long, curled shavings:\n- **Top-Plate Filing Angle**: File\
  \ at **30°** using a round file matched to pitch (e.g., 5.5 mm file for 3/8\" chain; 4.8 mm for .325\"\
  \ chain).\n- **Depth Gauge (Raker) Height**: The unsharpened fin in front of the cutting tooth controls\
  \ bite depth. Maintain at **0.025 inches (0.65 mm)** below the cutting tooth using a flat file and depth\
  \ gauge tool. (Too low = severe violent grabbing; too high = teeth skate without cutting).\n\n## The\
  \ Mechanics of Directional Felling\n\nDirectional felling uses three cuts to create an **internal wooden\
  \ hinge** that guides\nthe tree to the ground like a swinging barn door:\n\n```\n             [ TREE\
  \ TRUNK (Side View) ]\n                       │   │\n                       │   │\n      Back Cut (3)\
  \     │   │\n      ───────────────► │ █ │ ◄── Top Notch Cut (1)  (45° to 70° Angle)\n   (Slightly higher)\
  \   │ H │  \\\n                       │ I │   \\\n                       │ N │    \\\n             \
  \          │ G │     \\\n                       │ E │ ◄──── Bottom Flat Cut (2)\n                  \
  \     │   │\n                      ══╧═══╧══ Ground Level\n```\n\n### 1. The Open-Face Notch (Directional\
  \ Face Cut):\nThe notch faces the **exact target landing zone**:\n- **Top Cut**: Angle downward at **50°\
  \ to 70°**.\n- **Bottom Cut**: Cut horizontally flat (or angled upward at 20° for a 90° Humboldt notch).\n\
  - **Depth**: Cut **20% to 25% of trunk diameter** (never exceed 30%, which weakens support).\n- The\
  \ two cuts must meet at a clean, sharp horizontal line (**the apex**). Never bypass cuts (over-cutting\
  \ weakens the hinge).\n\n### 2. The Holding Wood Hinge:\n- The hinge is the uncut strip of wood between\
  \ the notch apex and the back cut.\n- **Thickness Rule**: Hinge thickness must equal **10% of Tree Diameter\
  \ at Breast Height (DBH)**.\n  - *Example*: For a 60 cm tree, the hinge must be exactly **6 cm thick**.\n\
  - **Hinge Width**: Equals 80% to 90% of trunk width.\n- **The Hinge Controls the Tree**: As the tree\
  \ tips, the fibers in the hinge bend under tension, holding the trunk on track until the canopy hits\
  \ the ground.\n\n### 3. The Back Cut & Wedging:\n- Cut horizontally from the rear toward the notch,\
  \ **2.5 cm to 5.0 cm HIGHER than the notch apex** (the \"stump step\").\n- The step prevents the falling\
  \ trunk from kicking backward off the stump toward the sawyer.\n- Stop cutting the instant the 10% hinge\
  \ thickness is reached!\n- Drive **impact-resistant plastic or aluminum felling wedges** into the back\
  \ cut kerf behind the bar to lift the tree's center of gravity forward.\n\n## Preventing the \"Barber-Chair\"\
  \ on Heavy Leaning Trees\n\nTrees with a heavy forward lean carry massive tension in the rear fibers.\
  \ Standard\nrear-entry back cuts will snap the wood prematurely upward into a fatal barber-chair.\n\n\
  ### The Bore Cut (Plunge Cut) Protocol:\n1. Complete the open-face directional notch on the front.\n\
  2. Plunge the tip of the chainsaw directly through the center of the trunk **behind the hinge**, using\
  \ the lower quadrant of the tip to avoid kickback.\n3. Bore entirely through the tree, establishing\
  \ the **10% hinge** from the *inside*.\n4. Saw backward toward the rear, leaving a **5 cm to 8 cm solid\
  \ \"trigger strap\"** of uncut wood on the extreme back of the tree.\n5. The tree is now completely\
  \ neutralized: the hinge is pre-cut, but the rear trigger holds all tension safely.\n6. Insert felling\
  \ wedges; verify escape paths.\n7. Sever the rear trigger strap from the outside with a single downward\
  \ cut. The tree falls smoothly without splitting!\n\n## The 45-Degree Escape Retreat Path\n\nBefore\
  \ touching a saw to wood, clear the ground:\n- Clear brush and tripping roots in a **45-degree angle\
  \ path diagonally backward** away from the expected line of fall (never step directly behind the stump).\n\
  - The moment the tree begins to tip:\n  - Engage the chain brake; step immediately down the 45° retreat\
  \ path.\n  - Walk backward **minimum 6 to 10 metres**, keeping your eyes fixed upward on the falling\
  \ canopy to dodge falling overhead branches.\n\n## Sawlog Scaling & Volume Calculation\n\nWhen logs\
  \ arrive at the processing landing, lumber yield is calculated using\ngeometric volume formulas:\n\n\
  ### Smalian's Cubic Volume Formula:\n$$V = \\frac{A_{\\text{small}} + A_{\\text{large}}}{2} \\times\
  \ L = \\frac{\\pi \\times (D_s^2 + D_l^2)}{8} \\times L$$\n\nWhere:\n- $V$ = Solid log volume in cubic\
  \ metres ($\\text{m}^3$)\n- $D_s$ = Small-end diameter inside bark (m)\n- $D_l$ = Large-end diameter\
  \ inside bark (m)\n- $L$ = Log length (m)\n\n*Example*: A 4.0-metre sawlog has a small-end diameter\
  \ of 40 cm ($0.40\\text{ m}$) and a large-end diameter of 50 cm ($0.50\\text{ m}$):\n$$V = \\frac{3.1416\
  \ \\times (0.40^2 + 0.50^2)}{8} \\times 4.0 = \\frac{3.1416 \\times (0.16 + 0.25)}{8} \\times 4.0 =\
  \ \\frac{3.1416 \\times 0.41}{2} \\approx \\mathbf{0.644\\text{ m}^3}$$\nAt an average green hardwood\
  \ density of $900\\text{ kg/m}^3$, this single log weighs **580 kg**.\n"
exercises:
- id: for-d1-q1
  type: MULTIPLE_CHOICE
  prompt: 'A certified logger is preparing to fell a 50 cm diameter cypress tree using an open-face notch.
    What is the required thickness of the uncut holding wood hinge, and what is its mechanical function
    during the fall?

    '
  xp_reward: 50
  options:
  - id: a
    text: 15 cm thick (30% of trunk diameter)
  - id: b
    text: 0.5 cm thick (1% of trunk diameter)
  - id: c
    text: 5 cm thick (10% of trunk diameter); the hinge acts as an internal wooden pivot that guides the
      tree along the planned path while preventing lateral twisting or premature backward kickoff
  - id: d
    text: Cut completely through with zero hinge
  explanation: 'The universal forestry rule: Hinge thickness = 10% of DBH (50 cm × 0.10 = 5 cm). The hinge
    wood holds the falling trunk in tension and compression, preventing the tree from rolling off course
    into power lines or workers.


    Why the other options are wrong: A 15 cm hinge is too thick; the tree will hang up or tear wood fibers,
    refusing to fall. A 0.5 cm hinge snaps instantly, losing all directional control. Cutting through
    completely produces an uncontrolled free-falling tree that can crush the sawyer.'
  correct_answer: c
