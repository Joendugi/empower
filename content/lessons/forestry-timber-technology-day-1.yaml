    paths save lives.

    '
- id: for-d1-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why is the ''Bore Cut'' (plunging the chainsaw bar through the trunk behind the hinge) strictly
    required when felling trees with a severe forward lean?

    '
  xp_reward: 50
  options:
  - id: a
    text: To save two-stroke fuel during felling
  - id: b
    text: Heavy forward-leaning trees carry extreme tension in their rear wood fibers; a standard rear
      cut triggers a violent 'barber-chair' vertical trunk explosion, whereas a bore cut leaves a rear
      strap that holds the tree safely until released
  - id: c
    text: Because leaning trees are always hollow in the center
  - id: d
    text: To make the chain teeth dull evenly on both sides
  explanation: 'In leaning trees, tension in rear fibers is massive. Starting from the outside back causes
    the trunk to split vertically upwards (barber-chair), killing the logger. The bore cut builds the
    hinge safely from the inside, leaving a rear strap of wood that is severed last.


    Why the other options are wrong: Bore cutting consumes more power and fuel; its sole purpose is survival
    and safety. Leaning trees are usually solid wood; the issue is severe mechanical tension. Bore cuts
    test chain sharpness, but the technique is for fracture prevention.'
  correct_answer: b
- id: for-d1-q5
  type: FILL_BLANK
  prompt: 'Using Smalian''s cubic volume formula V = [π × (Ds² + Dl²) / 8] × L, a 5.0-metre sawlog with
    small-end diameter of 0.40 m and large-end diameter of 0.60 m has a solid log volume of approximately
    ___ cubic metres.

    '
  xp_reward: 50
  correct_answer: '1.02'
  explanation: 'V = [3.1416 × (0.40² + 0.60²) / 8] × 5.0 = [3.1416 × (0.16 + 0.36) / 8] × 5.0 = [3.1416
    × 0.52 / 8] × 5.0 = 0.2042 × 5.0 ≈ 1.021 m³.

    '
