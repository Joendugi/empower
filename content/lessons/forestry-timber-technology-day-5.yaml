    struts push in compression.

    '
- id: for-d5-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why are large heavy timber framing members (e.g. 200 mm × 200 mm posts and beams) considered
    to possess superior fire resistance compared to unprotected light structural steel?

    '
  xp_reward: 50
  options:
  - id: a
    text: Heavy timbers burn slowly from the outside inward, forming a dense insulating charcoal crust
      (0.6 mm/min) that shields the interior load-bearing core, while structural steel rapidly softens
      and buckles at 500°C
  - id: b
    text: Because heavy timber cannot catch fire under any circumstances
  - id: c
    text: Because wood releases nitrogen gas when heated
  - id: d
    text: Because timber frames are filled with concrete
  explanation: 'Unprotected steel beams lose 50% of structural yield strength at 500°C and collapse catastrophically
    within 15 minutes of a building fire. Massive heavy timber chars at 0.6 mm per minute; the insulating
    char blocks heat, preserving a solid load-bearing core for hours.


    Why the other options are wrong: Wood is combustible, but massive cross-sections char slowly and predictably.
    Wood releases combustible pyroligneous gases, not inert nitrogen. Timber framing is solid wood, not
    filled with concrete.'
  correct_answer: a
