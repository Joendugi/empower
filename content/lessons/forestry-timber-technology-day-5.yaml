briefing: 'Steel gusset plates and threaded bolts are convenient, but in isolated wilderness installations
  where metal hardware is unavailable, buildings must stand on the timeless engineering of Heavy Timber
  Joinery. For thousands of years, monumental cathedrals, covered bridges, and Japanese temples stood
  without a single metallic nail, held together by interlocking mortise-and-tenon joints, draw-bored hardwood
  pegs, and timber scarf splices. This capstone lesson covers structural stress vectors (tension, compression,
  shear), classic joinery geometry, layout using the Square Rule, draw-boring physics, King Post roof
  truss engineering, and field inspection rubrics.

  '
outline: 'Structural forces in timber frames: tension (pulling apart), compression (pushing together),
  and horizontal shear parallel to grain; the classic Mortise-and-Tenon joint (1/3 thickness rule, cheek
  layout, shoulder cutting); Draw-Boring mechanics (offset peg hole by 2-3 mm, tapered dry oak/acacia
  peg pulling the joint permanently tight under tension); the Scarf Joint (halved and bladed scarf with
  key) for splicing short logs into 12-metre ridge beams; the King Post Roof Truss (tie beam, principal
  rafters, king post in tension, compressive struts); birdsmouth rafter seat cuts; PHOTO_CAPTURE assessment
  rubric of timber joinery, truss framing, or solar kiln.

  '
content_md: "## The Philosophy of Heavy Timber Framing\n\nUnlike modern light-frame \"stick\" construction\
  \ (which uses thousands of small 2x4s\nnailed together and sheathed in plywood), **Heavy Timber Framing\
  \ (Post-and-Beam)**\nuses large solid timbers (150 mm × 150 mm to 250 mm × 250 mm) spaced 3 to 4 metres\n\
  apart, joined by precision interlocking wooden connections:\n- **Longevity**: Survives for 300 to 500+\
  \ years.\n- **Fire Resistance**: Heavy timbers char on the outside at a predictable rate of 0.6 mm/min,\
  \ forming an insulating carbon layer that protects the interior core long after steel beams have softened\
  \ and collapsed.\n- **Zero Hardware Requirement**: Entire frameworks can be erected using only hand\
  \ saws, chisels, auger bits, and wooden pegs (*trunnels*).\n\n## Structural Forces: Tension, Compression\
  \ & Shear\n\nEvery timber in a building experiences specific structural stresses:\n\n```\n   COMPRESSION\
  \ (Posts, Rafters)             TENSION (Tie Beams, King Post)\n   ════►                  ◄════     \
  \        ◄════                  ════►\n    Pushes wood fibers together              Pulls wood fibers\
  \ apart (risks tearing)\n```\n\n- **Compression (Parallel to Grain)**: Wood is exceptionally strong\
  \ in compression (20 to 40 MPa). End-grain wood can support tons with minimal joint complexity.\n- **Tension\
  \ (Parallel to Grain)**: Wood has high tensile strength, but **joining members in tension is the hardest\
  \ task in carpentry** because bolts or pegs tend to shear out along the grain.\n- **Shear (Parallel\
  \ to Grain)**: The weakest property of wood. Wood splits along its longitudinal grain like string cheese\
  \ under modest shear loads. Joint shoulders must provide generous \"relish\" (wood distance behind peg\
  \ holes, minimum 50 mm).\n\n## The Mortise-and-Tenon: The Sovereign Joint\n\nThe fundamental connection\
  \ of all heavy timber architecture:\n\n```\n           [ TENON (Male Member) ]\n                   \
  \ │   │\n                    │ █ │  Tenon Tongue (1/3 Thickness)\n               ┌────┘   └────┐\n \
  \              │  Shoulder   │ ◄── Bears 100% of compressive load\n               └─────────────┘\n\
  \                      │\n                      ▼\n               ┌─────────────┐\n               │\
  \ ┌─────────┐ │\n               │ │ MORTISE │ │  Chiseled Pocket Socket\n               │ └─────────┘\
  \ │\n               └─────────────┘\n           [ MORTISE (Female Member) ]\n```\n\n### The 1/3 Thickness\
  \ Rule:\nFor a 150 mm thick timber beam:\n- **Tenon Thickness**: Exactly **one-third of the timber thickness**:\n\
  \  $$\\text{Tenon Thickness} = \\frac{150\\text{ mm}}{3} = \\mathbf{50\\text{ mm}}$$\n- **Mortise Width**:\
  \ Chiseled to match: **50 mm wide**.\n- **Tenon Length**: Typically **100 mm to 125 mm deep**.\n- **The\
  \ Shoulders**: The flat perpendicular ledges flanking the tenon. **The shoulders must be cut dead square**:\
  \ they bear 100% of the compressive load, seating flush against the mortise face.\n\n## The Genius of\
  \ \"Draw-Boring\" with Hardwood Pegs\n\nIn traditional timber framing, joints are not clamped with steel\
  \ bolts or glue.\nThey are pulled together with irreversible mechanical force using **Draw-Boring**:\n\
  \n```\n                     [ MORTISE CHEEK ]\n                    ┌─────────────────┐\n           \
  \         │   (•) Peg Hole  │ ◄── Hole through Mortise Cheeks\n                    │    │          \
  \  │\n                    │ ┌──┼──────────┐ │\n                    │ │  ▼ (x)      │ │ ◄── Hole through\
  \ Tenon Offset by 2.5 mm\n                    │ │   Tenon     │ │     (Drawn deeper into pocket)\n \
  \                   │ └─────────────┘ │\n                    └─────────────────┘\n```\n\n### The 3-Step\
  \ Draw-Boring Execution:\n1. Bore a **19 mm (3/4-inch) hole** straight through both cheeks of the mortise\
  \ using a hand T-auger.\n2. Insert the tenon into the mortise and push it in tight. Insert the auger\
  \ into the hole to mark the center on the tenon tongue; remove the tenon.\n3. **The Offset (The Draw)**:\n\
  \   - Bore the hole through the tenon **2.5 mm to 3.0 mm CLOSER TO THE SHOULDER** than the mark!\n4.\
  \ Drive a tapered, dry, octagonal hardwood peg (riven from dense heartwood like Acacia, Olive, or White\
  \ Oak) through the misaligned holes:\n   - As the tapered peg forces its way through the 2.5 mm offset,\
  \ it acts as a powerful mechanical cam.\n   - **The peg stretches slightly in tension and violently\
  \ sucks the tenon shoulder deep into the mortise with thousands of pounds of force!**\n   - The joint\
  \ is permanently locked tight. As the structure flexes in wind storms, the draw-bored peg continuously\
  \ pulls the joint tighter.\n\n## The Scarf Joint: Splicing Long Beams\n\nWhen building a 12-metre long\
  \ building, finding a single 12-metre straight, defect-free\ntree is often impossible. Two 6-metre timbers\
  \ are joined using a **Bladed & Keyed Scarf Joint**:\n\n```\n Timber A                             \
  \                     Timber B\n ─────────────────┐                                  ┌─────────────────\n\
  \                  │   \\        [ HARDWOOD ]        / │\n                  │     \\        [  KEY \
  \  ]      /   │\n                  └───────┴────────────────────┴─────┘\n```\n\n- The two beams are\
  \ cut with mating interlocking lightning-bolt steps and hooks.\n- A square tapered wedge (**hardwood\
  \ folding key**) is driven into the center slot.\n- Driving the key drives the opposing hooks into one\
  \ another, creating a spliced beam capable of resisting both bending deflection and tension across long\
  \ spans.\n\n## The King Post Roof Truss\n\nThe King Post truss spans open spaces up to **10 to 12 metres**\
  \ without interior\nsupport columns:\n\n```\n                               [ APEX ]\n             \
  \                     ▲\n                                 /│\\\n            Principal Rafter    / │\
  \ \\   Principal Rafter\n                               /  │  \\\n                              /  \
  \ │   \\\n                             /    │    \\\n                            /  Strut   \\\n   \
  \                        /   /  │  \\  \\\n[ WALL ]                  /  ▼    │   ▼  \\             \
  \     [ WALL ]\n═════════════════════════[────────────────]═════════════════════════\n             \
  \               TIE BEAM (Carries Tensile Outward Thrust)\n                                  ▲\n   \
  \                               │\n                       KING POST (Suspended in TENSION,\n       \
  \                pulls center of tie beam upward!)\n```\n\n### How Forces Flow in a King Post Truss:\n\
  1. **Principal Rafters**: Experience heavy **compression** from roof weight (iron sheets, wind, rain).\n\
  2. **The Tie Beam**: Prevents the rafters from spreading outward and pushing the masonry walls down;\
  \ the tie beam is in **pure horizontal tension**.\n3. **The King Post (Vertical Center)**:\n   - Beginners\
  \ think the King Post sits on the tie beam like a pillar. **WRONG!**\n   - The King Post does NOT support\
  \ the rafters; **the rafters support the King Post!**\n   - The King Post is **suspended in tension\
  \ from the apex**, hanging down like a plumb-line.\n   - A heavy tenon and iron stirrup at the bottom\
  \ of the King Post pulls the center of the 10-metre tie beam **UPWARD**, preventing the tie beam from\
  \ sagging under its own weight!\n4. **Compressive Struts**: Angle upward from the base of the King Post\
  \ to support the mid-span of the principal rafters.\n"
exercises:
- id: for-d5-q1
  type: MULTIPLE_CHOICE
  prompt: 'In traditional heavy timber framing, what is the mechanical purpose of ''Draw-Boring'' a mortise-and-tenon
    joint with an offset peg hole?

    '
  xp_reward: 50
  options:
  - id: a
    text: To make the peg easier to remove with fingers
  - id: b
    text: Because drilling straight through assembled wood splits the auger bit
  - id: c
    text: To allow the joint to slide back and forth in earthquakes
  - id: d
    text: Boring the hole through the tenon 2.5 mm closer to the shoulder forces the tapered hardwood
      peg to act as a powerful mechanical cam, pulling the tenon shoulders permanently tight against the
      mortise face with thousands of pounds of tension
  explanation: 'Draw-boring eliminates the need for clamps or glue. The 2.5 mm offset creates a mechanical
    wedging action as the peg is driven, sucking the joint faces together into an indestructible, airtight
    structural connection that self-tightens under load.


    Why the other options are wrong: Draw-bored pegs are locked permanently under tension; they cannot
    be removed by hand. Auger bits drill through assembled wood easily, but straight holes provide zero
    pulling tension. The purpose of draw-boring is rigid structural lockup, not sliding.'
  correct_answer: d
- id: for-d5-q2
  type: FILL_BLANK
  prompt: 'According to the universal rule of heavy timber mortise-and-tenon joinery, the thickness of
    the central tenon tongue should be exactly ___ of the total timber beam thickness.

    '
  xp_reward: 50
  correct_answer: one-third
  explanation: 'The 1/3 rule balances strength equally between the tenon tongue in bending and the two
    female mortise cheeks in shear.

    '
