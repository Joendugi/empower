id: "water-sanitation-hygiene-safe-water-lesson"
course_id: "water-sanitation-hygiene"
title: "Week 1 — Safe-water chain from source to cup"
title_sw: "Wiki 1 — Maji salama kutoka chanzo hadi kikombe"
briefing: "Safe water can become unsafe after treatment. Inspect the source for latrines uphill, animal access, flood paths, cracked aprons, and standing water. Collect with clean containers that are not dipped by dirty cups. Household treatment may use boiling, approved chlorine dose/contact time, or filtration—follow public-health guidance and product instructions.\n\nChlorine is not guessed by smell. Dose depends on concentration, turbidity, and volume. Very cloudy water may need settling and filtration first. Store treated water in a covered, narrow-neck container with a tap. Do not put hands or cups inside.\n\nA sanitary inspection records hazards and corrective actions. Water testing and health authorities confirm microbiological safety; a clear-looking spring is not proof."
briefing_sw: "Wiki 1 — Maji salama kutoka chanzo hadi kikombe: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "water-sanitation-hygiene-safe-water-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for safe water treatment?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "water-sanitation-hygiene-safe-water-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that safe water treatment was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "water-sanitation-hygiene-safe-water-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "water-sanitation-hygiene-safe-water-scenario"
    type: "SCENARIO"
    prompt: "A household treats water correctly, then scoops it with an unwashed communal cup. What should change?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
