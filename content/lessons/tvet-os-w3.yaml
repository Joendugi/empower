id: tvet-os-w3
course_id: operating-systems
title: Week 3 — Process, memory, and file management (OS internals)
title_sw: Wiki 3 — Mchakato, kumbukumbu, na faili
briefing: 'Manage Operating System (210 hours) goes beyond installing Windows. Fundamentals: kernel versus shell, system calls, monolithic versus layered versus microkernel/client-server versus virtual-machine structures. Types: batch, time-sharing, real-time, distributed, mobile. Installation you already practised; this week is how the OS shares the machine.


  Process management: a process is a program in execution with a process control block (PCB). States: new, ready, running, waiting, terminated. Threads share the process address space. Scheduling (FCFS, SJF, round robin, priority) decides who runs. Concurrency control: race conditions, critical sections, semaphores, monitors, message passing. Deadlock: four Coffman conditions — know prevention versus detection at theory level.


  Memory: contiguous allocation, paging, segmentation, virtual memory, and thrashing when the working set does not fit. I/O: device drivers, interrupts, buffering. File systems: directories, allocation (FAT, NTFS, ext4), permissions you met in Linux essentials. Emerging: containers, TPM-backed secure boot, and 64-bit only images.


  Practical: use Task Manager / `top` / `ps` to identify a runaway process, `free` for memory, and Event Viewer. Tie a freeze to memory pressure rather than “Windows is bad”. That is the technician translation of this unit.'
briefing_sw: Kernel dhidi ya shell. PCB, hali za process, threads. Scheduling. Semaphore. Paging na virtual memory. Thrashing. FAT, NTFS, ext4. top/ps na Task Manager.
estimated_minutes: 32
