id: "digital-enterprise-costing-lesson"
course_id: "digital-enterprise"
title: "Week 1 — Costing, pricing, records, and mobile-money controls"
title_sw: "Wiki 1 — Gharama, bei, rekodi, na M-Pesa"
briefing: "A trade enterprise fails when price covers materials but not labour, rent, electricity, transport, defects, and tool replacement. Build a job-cost sheet: direct material, direct labour hours, overhead allocation, contingency, then margin. Cash received is not profit. Record deposits and balances against a numbered job card.\n\nMobile-money security: separate business and personal till where possible, never share PIN/OTP, verify prompts on the handset, and reconcile the platform statement to the sales book. A screenshot is not final proof if the handset did not receive the transaction. Refunds follow a controlled process.\n\nCustomer records contain personal data. Collect only what fulfilment requires, protect it, and set a retention period. Kenya DPA applies to a tailor’s WhatsApp list too."
briefing_sw: "Wiki 1 — Gharama, bei, rekodi, na M-Pesa: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "digital-enterprise-costing-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for a job-cost sheet?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "digital-enterprise-costing-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that a job-cost sheet was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "digital-enterprise-costing-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "audit"
    hint: "A planned check, not an opinion."
    explanation: "A quality audit provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "digital-enterprise-costing-scenario"
    type: "SCENARIO"
    prompt: "A customer sends a fake M-Pesa screenshot and pressures the apprentice to release a finished gate. What should happen?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
