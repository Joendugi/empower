exercises:
- id: tvet-database-w3-q1
  type: MULTIPLE_CHOICE
  prompt: 'SELECT students who scored below 40 in a unit is best done with:'
  options:
  - id: a
    text: Deleting the table
  - id: b
    text: SELECT … FROM enrolment JOIN student WHERE grade < 40
  - id: c
    text: Printing the ER only
  - id: d
    text: Ohm’s law
  correct_answer: b
  hint: Query objects.
  explanation: Filtering is a query, not a new database.
  xp_reward: 50
- id: tvet-database-w3-q2
  type: MULTIPLE_CHOICE
  prompt: 'A form in Access/MySQL app stacks is for:'
  options:
  - id: a
    text: Controlled data entry onto tables
  - id: b
    text: Replacing the DBMS
  - id: c
    text: BIOS setup
  - id: d
    text: Crimping
  correct_answer: a
  hint: Object list.
  explanation: Forms, tables, queries, reports are the teaching object set.
  xp_reward: 50
- id: tvet-database-w3-q3
  type: MULTIPLE_CHOICE
  prompt: 'The safest way to put user input into SQL is:'
  options:
  - id: a
    text: String concatenation of whatever they typed
  - id: b
    text: Bound parameters / prepared statements
  - id: c
    text: Disable the network forever
  - id: d
    text: All-caps table names
  correct_answer: b
  hint: Injection.
  explanation: 'CDACC testing plus cyber: never trust concatenated SQL.'
  xp_reward: 50
- id: tvet-database-w3-q4
  type: MULTIPLE_CHOICE
  prompt: 'A backup you have never restored is:'
  options:
  - id: a
    text: Proven
  - id: b
    text: Unverified — restore-test it
  - id: c
    text: A primary key
  - id: d
    text: BCD
  correct_answer: b
  hint: Testing outcome.
  explanation: Database testing includes recoverability, not only SELECT.
  xp_reward: 50
- id: tvet-database-w3-fb1
  type: FILL_BLANK
  prompt: The SQL command that retrieves rows is ___.
  correct_answer: SELECT
  hint: Not INSERT.
  explanation: SELECT is the core of query testing and reports.
  xp_reward: 50
- id: tvet-database-w3-scenario
  type: SCENARIO
  prompt: 'Practical: the report of “all ICT L5 females in 2026” prints 0 rows but the table has data. First query test?'
  options:
  - id: a
    text: Drop the database
  - id: b
    text: Check JOIN conditions, filters (gender/year codes), and whether the form filter contradicts the query
  - id: c
    text: Buy SQL Server immediately
  - id: d
    text: Print the ER in landscape
  correct_answer: b
  hint: Query testing.
  explanation: Wrong JOIN or coded values like F versus Female is the usual cause. Prove it with a simpler SELECT.
  xp_reward: 60
