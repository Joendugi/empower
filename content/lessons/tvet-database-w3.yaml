id: tvet-database-w3
course_id: database-systems
title: Week 3 — SQL objects, queries, testing, and printables
title_sw: Wiki 3 — SQL, maswali, majaribio, na print
briefing: 'Objects: tables, queries/views, forms, reports, indexes, and users. CREATE TABLE with types and keys. INSERT, UPDATE, DELETE, SELECT with WHERE, JOIN, GROUP BY. Access uses QBE grids; MySQL uses the mysql client or Workbench. Parameter queries avoid concatenating user text — that links to the SQL injection lesson in cybersecurity.


  Testing: integration (forms write to the right tables), query testing (known input, expected row counts), and referential tests (orphan insert must fail). Generate a test report. Sample data should include the awkward cases: two students with similar names, a unit with zero enrolments, a deleted draft.


  Printing: the unit still lists print of tables, queries, reports, and forms. In a modern MIS you export PDF, but for CDACC practicals you produce a readable report with headings, date, and filters (e.g. “failed students in ICT L5 2026”). Page setup, not a screenshot of datasheet chaos.


  Security: least-privilege accounts, hashed passwords if you ever store them (you should not store PINs in plaintext), and backups (mysqldump / Access compact and repair plus file copy). A database without a restore test is a rumour.'
briefing_sw: CREATE TABLE, INSERT, SELECT JOIN. Forms na reports. Jaribu orphan INSERT ishindwe. Chapisha ripoti yenye kichwa na tarehe. Backup na least privilege. Usiunganishe SQL na maandishi ya mtumiaji.
