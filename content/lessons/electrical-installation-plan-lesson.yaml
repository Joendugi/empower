id: "electrical-installation-plan-lesson"
course_id: "electrical-installation"
title: "Week 5 — Plan the installation: survey, load, and drawings"
title_sw: "Wiki 5 — Panga ufungaji: survey, mzigo, na michoro"
briefing: "CDACC electrical cores begin with planning, not with a coil of twin-and-earth. Conduct a site survey: construction type, routes, existing supply capacity, and hazards (wet, flammable, overhead lines). Take measurements. Write a survey note the supervisor can use. “It looked fine” is not a survey.\n\nLoad estimation: list luminaires, sockets (diversified as taught), cookers, motors, and future spare. Size cables and protective devices to IEE/IEC practice as in your college tables — current-carrying capacity, voltage drop, and fault protection must all pass. An MCB bigger than the cable is a fire design. Record system sizes and share them.\n\nDrawings: obtain the design, produce a working drawing and a materials list (cables, accessories, glands, trunking). Logistics: access, storage, permits to work, isolation of the existing supply, and a team with named roles. Raising a permit is an element of the unit, not bureaucracy you skip.\n\nThis week’s artefact: a one-page load schedule for a two-bedroom staff house plus a materials list and a simple lighting/power layout. That is how  the installation unit is evidenced before you chase conduits."
briefing_sw: "Survey wa site, hatari, na vipimo. Kadiria mzigo. Ukubwa wa kebo na MCB kwa IEE — voltage drop na fault. Mchoro wa kazi, orodha ya vifaa, permit. Usianze conduit bila mpango."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
cdacc_unit_id: "ENG/OS/EI/CR/01/6"
exam_domain: "Plan electrical installation"
exercises:
  - id: "electrical-installation-plan-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A 32 A MCB protecting 1.5 mm² lighting cable is wrong because:"
    options:
      - id: "a"
        text: "MCBs must always be 6 A"
      - id: "b"
        text: "The device will not protect the conductor — fire risk"
      - id: "c"
        text: "Lighting cannot use MCBs"
      - id: "d"
        text: "IEE requires aluminium only"
    correct_answer: "b"
    hint: "Device vs cable."
    explanation: "Planning includes matching protection to CCC of the cable."
    xp_reward: 50
  - id: "electrical-installation-plan-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Voltage drop checks exist so that:"
    options:
      - id: "a"
        text: "Lamps and motors at the far end still receive adequate voltage"
      - id: "b"
        text: "The earth can be omitted"
      - id: "c"
        text: "You can undersize everything"
      - id: "d"
        text: "Surveys are optional"
    correct_answer: "a"
    hint: "Length plus current."
    explanation: "Long small cables fail voltage drop even if CCC looks fine in a short run."
    xp_reward: 50
  - id: "electrical-installation-plan-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A permit to work on a live installation board is used to:"
    options:
      - id: "a"
        text: "Decorate the CU"
      - id: "b"
        text: "Control who isolates, when, and under which conditions"
      - id: "c"
        text: "Replace IEE tables"
      - id: "d"
        text: "Increase diversity"
    correct_answer: "b"
    hint: "Planning element 7."
    explanation: "Identify the issuer. Do not invent isolation."
    xp_reward: 50
  - id: "electrical-installation-plan-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Diversity in load estimation means:"
    options:
      - id: "a"
        text: "Assume every socket at 13 A forever without rules"
      - id: "b"
        text: "Apply taught factors so not all loads are assumed at 100% simultaneous use"
      - id: "c"
        text: "Ignore cookers"
      - id: "d"
        text: "Count only lights"
    correct_answer: "b"
    hint: "Estimation, not fantasy."
    explanation: "Follow the method in your IEE guidance notes / college tables."
    xp_reward: 50
  - id: "electrical-installation-plan-fb1"
    type: "FILL_BLANK"
    prompt: "Comparing design current, cable capacity, and voltage drop is part of system ___."
    correct_answer: "sizing"
    hint: "Element: perform system sizing."
    explanation: "Sizing is recorded and shared — it is not a private guess at the counter."
    xp_reward: 50
  - id: "electrical-installation-plan-scenario"
    type: "SCENARIO"
    prompt: "Client wants ten 3 kW heaters on one 2.5 mm² radial “because the shop sold the cable”. Planning response?"
    options:
      - id: "a"
        text: "Install it — heaters are diversity 0"
      - id: "b"
        text: "Refuse that circuit: recalculate load, split circuits, upsize cable/protection, document"
      - id: "c"
        text: "Fit a 63 A MCB on 2.5 mm²"
      - id: "d"
        text: "Skip the survey"
    correct_answer: "b"
    hint: "Load estimation."
    explanation: "Planning exists to stop fires designed on a till receipt."
    xp_reward: 60
