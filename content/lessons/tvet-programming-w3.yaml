id: tvet-programming-w3
course_id: computer-programming
title: Week 3 — Testing C programs and basic internet programming
title_sw: Wiki 3 — Majaribio ya C na programu ya intaneti
briefing: 'Testing is not “it ran once on my laptop”. Dry-run the flowchart, then unit-test functions with known inputs (average of 2, 4, 6 is 4). Boundary tests: zero items, negative where forbidden, maximum array size. Syntax errors versus logic errors versus runtime (divide by zero, NULL pointer). Use a test table in the portfolio.


  Internet programming in this unit is introductory: HTML structure (`html`, `head`, `body`, headings, links, forms), maybe CSS, and a simple client-side or server-side script as the college lab allows (JavaScript validation, or a tiny PHP/Python form that must not concatenate SQL). HTTP is request/response. GET versus POST. Never put passwords in a GET query string.


  Connect the tracks: a C program can write a `.html` report; a form can post to a backend that inserts with parameters into MySQL (database unit). That is how a semester project looks: design, C or web module, database, test report.


  Industrial attachment (360 hours in the ICT L5 gross total) expects you to have this discipline: requirements, versioned source, tests, and a README. Git is not named in the 2018 PDF but is professional practice — use it if the lab has it.'
briefing_sw: 'Jaribu mipaka na jedwali la majaribio. HTML, fomu, GET dhidi ya POST. Usitie nywila kwenye URL. Usiunganishe SQL. Mradi wa semester: buni, C au wavuti, hifadhidata, ripoti.'
