id: "community-health-support-hygiene-lesson"
course_id: "community-health-support"
title: "Week 1 — Infection prevention and safe home visits"
title_sw: "Wiki 1 — Kuzuia maambukizi"
briefing: "Community support workers reduce harm but do not diagnose beyond their competence. Before a home visit, identify the household, explain your role, obtain consent, and protect privacy. Hand hygiene follows the moments taught by health authorities: before contact, before a clean task, after body-fluid risk, after contact, and after touching surroundings.\n\nSelect PPE for the task; gloves do not replace handwashing. Never recap or transport loose needles. Clean reusable equipment between households using the approved product and contact time. Separate clean and dirty items in the field bag. Record only what is necessary and do not discuss a client in a WhatsApp group without a lawful, approved process.\n\nRed flags—difficulty breathing, severe bleeding, altered consciousness, convulsions, chest pain, danger signs in pregnancy or a child—require urgent referral, not herbal advice or social-media diagnosis."
briefing_sw: "Wiki 1 — Kuzuia maambukizi: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "community-health-support-hygiene-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for infection prevention?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "community-health-support-hygiene-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that infection prevention was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "community-health-support-hygiene-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "audit"
    hint: "A planned check, not an opinion."
    explanation: "A quality audit provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "community-health-support-hygiene-scenario"
    type: "SCENARIO"
    prompt: "A neighbour asks you to post a patient’s wound photo in a public group to get advice. What should you do?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
