id: "digital-enterprise-market-lesson"
course_id: "digital-enterprise"
title: "Week 2 — Product media, truthful marketing, and cooperative fulfilment"
title_sw: "Wiki 2 — Picha, matangazo ya kweli, na ushirika"
briefing: "A product listing needs clear light, neutral background, scale, multiple angles, material, dimensions, lead time, delivery area, care, and truthful price. Ask permission before showing a client, vehicle plate, house location, or child. Do not claim “CDACC certified” unless the product or worker actually holds that status.\n\nCooperative selling lets small workshops share photography, buying, transport, and large orders. Define who owns the customer, quality standard, payment split, deadlines, returns, and dispute process before accepting money. Use a sample and checklist so five tailors produce one uniform standard.\n\nMeasure conversion, returns, late jobs, and customer complaints—not only likes. A business serves society when it delivers what it promised and pays contributors transparently."
briefing_sw: "Wiki 2 — Picha, matangazo ya kweli, na ushirika: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "digital-enterprise-market-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for a product listing?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "digital-enterprise-market-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that a product listing was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "digital-enterprise-market-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "check"
    hint: "A planned check, not an opinion."
    explanation: "A quality check provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "digital-enterprise-market-scenario"
    type: "SCENARIO"
    prompt: "A cooperative receives a 500-uniform order but has no shared size chart or quality sample. What should happen before cutting?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
