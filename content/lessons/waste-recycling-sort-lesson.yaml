id: "waste-recycling-sort-lesson"
course_id: "waste-recycling"
title: "Week 1 — Waste audit, segregation, and collection safety"
title_sw: "Wiki 1 — Ukaguzi na kutenganisha taka"
briefing: "Start with a waste audit: source, type, mass or volume, contamination, collection frequency, and destination. Segregate at source because a clean PET bottle has value and a PET bottle mixed with food and sharps is a hazard. Use locally understood labels and colours; train users and inspect bins.\n\nPPE depends on risk: gloves resistant to puncture, boots, high-visibility clothing, and respiratory protection where dust requires it. Never hand-sort closed bags that may contain needles. Medical waste, batteries, chemicals, oil, and e-waste need authorised routes; do not burn them in an open pit. Collection routes protect workers from traffic and overfilled containers.\n\nRecord weights and rejected loads. Data proves diversion from landfill and whether the enterprise is profitable."
briefing_sw: "Wiki 1 — Ukaguzi na kutenganisha taka: usalama, utaratibu sahihi, ukaguzi wa ubora, na huduma kwa jamii."
estimated_minutes: 28
license: "CC-BY-SA-4.0"
exam_domain: "Community-supporting trade practice"
exercises:
  - id: "waste-recycling-sort-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Which action is the safest professional starting point for a waste audit?"
    options:
      - id: "a"
        text: "Start immediately without inspecting the site or client"
      - id: "b"
        text: "Assess hazards and needs, select PPE/tools, explain the plan, then begin"
      - id: "c"
        text: "Copy a social-media clip without checking local conditions"
      - id: "d"
        text: "Let an untrained bystander make every technical decision"
    correct_answer: "b"
    hint: "Plan before tools."
    explanation: "A competent craft worker assesses risk, scope, people, tools, and standards before starting."
    xp_reward: 50
  - id: "waste-recycling-sort-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the strongest evidence that a waste audit was completed well?"
    options:
      - id: "a"
        text: "The worker says it is fine"
      - id: "b"
        text: "A documented inspection or functional test against the job specification"
      - id: "c"
        text: "The cheapest material was used"
      - id: "d"
        text: "The work was hidden before testing"
    correct_answer: "b"
    hint: "Test against a requirement."
    explanation: "Quality is demonstrated with a repeatable inspection, measurement, or functional test."
    xp_reward: 50
  - id: "waste-recycling-sort-fb1"
    type: "FILL_BLANK"
    prompt: "The documented check used to prove this work meets its requirements is a quality ___."
    correct_answer: "audit"
    hint: "A planned check, not an opinion."
    explanation: "A quality audit provides evidence for the client, trainer, and next technician."
    xp_reward: 50
  - id: "waste-recycling-sort-scenario"
    type: "SCENARIO"
    prompt: "A mixed bag contains a visible needle among bottles. A sorter is paid by the kilogram. What should happen?"
    options:
      - id: "a"
        text: "Continue and conceal the problem"
      - id: "b"
        text: "Stop, make the area safe, explain the defect, correct it, then test and document"
      - id: "c"
        text: "Ask the client to sign before seeing the work"
      - id: "d"
        text: "Remove the safety device so the job appears complete"
    correct_answer: "b"
    hint: "Safety and honesty before handover."
    explanation: "Community trades carry public consequences. Defects are corrected and tested, never concealed."
    xp_reward: 60
