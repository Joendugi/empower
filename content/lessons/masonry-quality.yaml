- id: masonry-masonry-quality-control-plumb-and-level-checking-perpend-alignment-curing-times-and-weather-protection-q1
  type: MULTIPLE_CHOICE
  prompt: 'What is the first step a technician must take before starting Masonry Quality
    Control: Plumb and Level Checking, Perpend Alignment, Curing Times and Weather
    Protection?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
    text: Inspect PPE, workspace ventilation, and machine guards
  - id: c
    text: Disable circuit breakers to save power
  - id: d
    text: Paint the workpiece
  correct_answer: b
  hint: Safety and equipment inspection always precede tool contact.
  explanation: Workplace health and safety regulations require pre-operational checks
    of all tools and PPE.
