id: tvet-repair-w1
course_id: computer-repair
title: Week 1 — Troubleshooting method and probable cause
title_sw: Wiki 1 — Uchunguzi na sababu inayowezekana
briefing: 'Perform Computer Repair and Maintenance (280 hours) is not “open the PC and guess”. The curriculum outcome is: identify the problem, form a theory of probable cause, test the theory, then act. Gather: what changed, error messages, beep codes, POST LEDs, and whether the fault is hardware, software, or both. Reproduce if safe. A burning smell is not a reproduce-and-hope case — isolate power first (safety unit).


  Tools: screwdriver set, anti-static, multimeter, POST card if available, known-good RAM/PSU, boot USB, cable tester. Assemble the kit before you start so you do not walk across the workshop with an open chassis. Document the original configuration — RAM slots, cable routing, and jumper settings — because reassembly is a later outcome.


  Theories must be testable and ordered by likelihood and risk. No display: check power, then video cable, then RAM reseat, then GPU, then motherboard. Do not start by replacing the CPU. Test one change at a time. If the theory fails, document and form a new one. That is professional troubleshooting, and it is what CompTIA also expects.


  Write a ticket: asset tag, symptoms, theories, tests, result. Assessors mark the method. A lucky reboot without notes is not competence.'
briefing_sw: 'Tambua tatizo, unda nadharia, jaribu, kisha tengeneza. Nguvu kwanza, kisha POST, RAM, hifadhi. Chombo kimoja kwa wakati. Andika dalili na majaribio. Harufu ya moto: zima umeme.'
