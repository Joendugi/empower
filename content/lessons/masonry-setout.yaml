- id: masonry-masonry-site-safety-and-setting-out-ppe-profile-boards-string-lines-datum-and-checking-for-square-q2
  type: FILL_BLANK
  prompt: Personal protective equipment (PPE) must always be worn to prevent ___ in
    the workshop.
  correct_answer: injury
  hint: Physical harm or accident.
  explanation: Rated PPE shields the operator from electrical, chemical, and physical
    hazards.
  xp_reward: 50
- id: masonry-masonry-site-safety-and-setting-out-ppe-profile-boards-string-lines-datum-and-checking-for-square-q3
