title_sw: 'Masonry Site Safety And Setting Out: Ppe, Profile Boards, String Lines,
  Datum And Checking For Square: Kanuni na Utendaji wa Vitendo'
briefing: 'In professional workshop practice, mastering Masonry Site Safety and Setting
  Out: PPE, Profile Boards, String Lines, Datum and Checking for Square requires strict
  adherence to safety standards and sequential execution. Always inspect personal
  protective equipment (PPE), ensure proper tool calibration, and verify that the
  workpiece is securely mounted before commencing. Observe manufacturer specifications
  and relevant standards. Maintain a clean work environment, store consumables dry,
  and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Masonry Site Safety and Setting Out:
  PPE, Profile Boards, String Lines, Datum and Checking for Square kunahitaji kufuata
  sheria za usalama na mpangilio sahihi. Kagua vifaa vya kujikinga (PPE) kabla ya
  kuanza kazi.'
