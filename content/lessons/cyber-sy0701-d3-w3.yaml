id: cyber-sy0701-d3-w3
course_id: secplus-architecture
title: Week 3 — Resilience, backups, and data protection architecture
title_sw: Wiki 3 — Ustahimilivu, backup, na ulinzi wa data
briefing: 'Resilience: high availability, clustering, load balancing, UPS/generator, redundant ISPs, and geographic diversity. RTO is how fast you must be back; RPO is how much data you can lose. A college that backs up once a month has a 30-day RPO whether they admit it or not. RAID is availability of a disk, not a backup — ransomware encrypts the array too.


  Backups: full, incremental, differential, snapshots, and the 3-2-1 idea (three copies, two media, one off-site/offline). Test restores. Immutable / WORM backups defeat ransomware. Encrypt backup media — stolen tapes are a confidentiality incident. Power: UPS for clean shutdown; generator for long outages. Document the order of recovery: identity, DNS, MIS, then labs.


  Data types: regulated (DPA personal data, exam integrity, health in the clinic), public, and intellectual property. Classification labels drive encryption and sharing. Data in use, in transit, at rest — different controls (TLS vs disk vs DLP). Retention and destruction: do not keep student IDs forever “just in case”.


  Architecture diagram this week: where backups live, who can write, who can delete, and the offline copy. If the same domain admin can wipe production and backups, ransomware has won.'
briefing_sw: 'RTO na RPO. RAID si backup. 3-2-1, offline, immutable. Ficha backup. UPS. Data at rest, in transit, in use. DPA: usihifadhi milele. Admin mmoja asifute production na backup.'
