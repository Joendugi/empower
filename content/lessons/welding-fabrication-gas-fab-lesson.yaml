id: "welding-fabrication-gas-fab-lesson"
course_id: "welding-fabrication"
title: "Oxy-fuel, leaks, and simple fabrication"
title_sw: "Gesi, uvujaji, na fabrication"
briefing: "Oxy-acetylene is still taught for cutting, heating, and braze-welding. Cylinders stay chained. Open oxygen slowly. Acetylene: keep cylinders upright, and know the 15 psi (about 1 bar) working-pressure caution taught in class — follow the college chart. Flashback arrestors and correct hose colours (red fuel, blue oxygen in many Kenyan shops — confirm local standard) are not decorations.\n\nLeak test with approved solution, never a flame. An icy fitting can mean a leaking gas expanding. If you smell acetylene: shut cylinders, no sparks, ventilate, and fetch the instructor.\n\nFabrication: measure twice, square with a builder’s square or 3-4-5, tack opposite corners, check, then weld. Distortion is controlled by sequence, not by hoping. Cut with a clean piercing method off the line, then run the cut; slag on the floor is hot.\n\nA square gate that is diamond-shaped after welding was tacked out of square. Fit-up is most of fabrication."
briefing_sw: "Mitungi imefungwa. Arrestors ni lazima. Jaribu uvujaji kwa soap, si moto. Tack kisha kagua square kabla ya weld kamili. Distortion inadhibitiwa na mpangilio."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/WEL/CR/04/5"
exam_domain: "Oxy-fuel & fabrication"
exercises:
  - id: "welding-fabrication-gas-fab-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "You smell acetylene and a hose fitting feels icy. You should:"
    options:
      - id: "a"
        text: "Light a match to find the leak"
      - id: "b"
        text: "Shut cylinders, keep ignition away, ventilate, and leak-test with solution — never flame"
      - id: "c"
        text: "Increase pressure to blow it clear"
      - id: "d"
        text: "Ignore it if the cut still looks shiny"
    correct_answer: "b"
    hint: "Gas plus spark."
    explanation: "Flame tests have caused workshop explosions."
    xp_reward: 50
  - id: "welding-fabrication-gas-fab-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Flashback arrestors are fitted to:"
    options:
      - id: "a"
        text: "The helmet"
      - id: "b"
        text: "Stop a flame travelling back into hoses/regulators"
      - id: "c"
        text: "Hold drawings"
      - id: "d"
        text: "Cool the workpiece only"
    correct_answer: "b"
    hint: "They are safety devices on the gas train."
    explanation: "Missing arrestors are a serious non-compliance."
    xp_reward: 50
  - id: "welding-fabrication-gas-fab-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "To keep a frame square during welding you should:"
    options:
      - id: "a"
        text: "Weld one corner fully first every time"
      - id: "b"
        text: "Tack, measure diagonals, then use a balanced welding sequence"
      - id: "c"
        text: "Hammer it after painting"
      - id: "d"
        text: "Skip tacks"
    correct_answer: "b"
    hint: "Diagonals equal means square."
    explanation: "Sequence fights shrinkage. Tacks let you correct before heat locks the error."
    xp_reward: 50
  - id: "welding-fabrication-gas-fab-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Acetylene cylinders in the workshop should be:"
    options:
      - id: "a"
        text: "On their side under a bench"
      - id: "b"
        text: "Upright, secured, away from heat and oil"
      - id: "c"
        text: "Inside the electrode oven"
      - id: "d"
        text: "Used as rollers"
    correct_answer: "b"
    hint: "Acetone and valves."
    explanation: "Upright and chained is the basic rule."
    xp_reward: 50
  - id: "welding-fabrication-gas-fab-fb1"
    type: "FILL_BLANK"
    prompt: "Checking joints with soapy water instead of a flame is a ___ test."
    correct_answer: "leak"
    hint: "You are looking for bubbles."
    explanation: "Leak testing is mandatory before lighting up."
    xp_reward: 50
  - id: "welding-fabrication-gas-fab-scenario"
    type: "SCENARIO"
    prompt: "A trainee wants to free a stuck oxygen regulator with oil. What do you say?"
    options:
      - id: "a"
        text: "Oil makes oxygen friendly"
      - id: "b"
        text: "Stop — oil/grease plus oxygen is a fire/explosion risk; use approved procedures only"
      - id: "c"
        text: "Heat the cylinder with the torch"
      - id: "d"
        text: "Hit the gauge with a chipping hammer"
    correct_answer: "b"
    hint: "Oxygen and hydrocarbons."
    explanation: "Oxygen equipment stays oil-free. This is a classic fatal error."
    xp_reward: 60
