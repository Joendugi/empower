id: cyber-sy0701-d4-w1
course_id: secplus-operations
title: Week 1 — Baselines, hardening, and vulnerability management
title_sw: Wiki 1 — Baseline, hardening, na udhaifu
briefing: 'Domain 4 is 28% — the largest. Operations establish a secure baseline: CIS-style images, disable unused services, firmware updates, default passwords gone, time sync (NTP) so logs match. Given vs established: you receive a vendor image, then you harden it to the college baseline. Configuration management (GPO, Ansible, Intune) keeps drift down. The golden image from the software-install unit belongs here with a version number.


  Vulnerability management: asset inventory, scan (authenticated when you can), prioritise (CVSS + exposure), patch or compensate, rescan, report. Do not scan the ICS VLAN with aggressive plugins on production day. Maintenance windows (Domain 1) apply. Tickets must close with evidence.


  Application security operations: input validation, WAF, dependency scanning, secrets not in Git. Host security: EDR, host firewall, disk encryption, USB policy. Wireless: WPA3/Enterprise, disable WPS, separate staff/student/IoT SSIDs — that is operations implementing architecture.


  This week’s artefact: a baseline checklist for a lab PC (20 items) and a vuln-scan report with three findings, owners, and due dates.'
briefing_sw: 'Baseline: zima huduma, nenosiri chaguomsingi, NTP. GPO/Intune. Scan, patch, scan tena. EDR, bitlocker. WPA3. Orodha ya asset kwanza.'
estimated_minutes: 32
