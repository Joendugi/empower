id: "carpentry-machines-lesson"
course_id: "carpentry"
title: "Workshop machines and joints"
title_sw: "Mashine za warsha na viungo"
briefing: "Circular saws, bandsaws, and thicknessers remove fingers faster than any other college machine. Guards on, riving knife on, push sticks for short pieces, and never stand in the kickback line. Unplug to change blades. Dust extraction is health, not comfort.\n\nJoints: housing, mortise and tenon, haunch, dovetail as taught. Dry fit. Shoulders must seat. Glue is not gap-filler for a 4 mm error. Cramp with protection blocks; check square as you tighten — frames rack.\n\nMark waste with hatching. Cut on the waste side of the line. A tenon that is too tight will split the mortise; too loose will fail when the glue dries.\n\nStop the machine fully before you clear offcuts. That sentence is in every accident report."
briefing_sw: "Guards na push sticks. Usisimame kwenye mstari wa kickback. Dry fit viungo. Gundi si filler. Zima mashine kabisa kabla ya kuondoa offcuts."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/CRP/CR/02/5"
exam_domain: "Machines & joints"
exercises:
  - id: "carpentry-machines-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "The safest way to feed a short piece on a table saw is:"
    options:
      - id: "a"
        text: "Fingers over the blade"
      - id: "b"
        text: "Push stick / push block with guards in place"
      - id: "c"
        text: "Remove the riving knife always"
      - id: "d"
        text: "Stand in line with the board so kickback hits your chest"
    correct_answer: "b"
    hint: "Hands never over the blade."
    explanation: "Kickback and contact injuries are common in college shops."
    xp_reward: 50
  - id: "carpentry-machines-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Glue in a 4 mm gap on a tenon shoulder:"
    options:
      - id: "a"
        text: "Is structural magic"
      - id: "b"
        text: "Does not replace a fitted joint"
      - id: "c"
        text: "Replaces the face mark"
      - id: "d"
        text: "Sharpens the saw"
    correct_answer: "b"
    hint: "Fit first."
    explanation: "Recut or pack only as the spec allows — usually recut."
    xp_reward: 50
  - id: "carpentry-machines-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "You change a bandsaw blade:"
    options:
      - id: "a"
        text: "With the machine running slowly"
      - id: "b"
        text: "Isolated / unplugged, tracking set, guards replaced"
      - id: "c"
        text: "By holding the pulley with a rag while powered"
      - id: "d"
        text: "After removing all dust extraction"
    correct_answer: "b"
    hint: "Isolation."
    explanation: "Energy isolation applies to wood machines too."
    xp_reward: 50
  - id: "carpentry-machines-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Checking square during glue-up matters because:"
    options:
      - id: "a"
        text: "Clamps always keep square"
      - id: "b"
        text: "Frames rack as you tighten"
      - id: "c"
        text: "Glue sets square automatically"
      - id: "d"
        text: "NITA bans squares"
    correct_answer: "b"
    hint: "Measure diagonals."
    explanation: "Correct while the glue is wet."
    xp_reward: 50
  - id: "carpentry-machines-fb1"
    type: "FILL_BLANK"
    prompt: "A stick used so fingers stay away from a saw blade is a ___ stick."
    correct_answer: "push"
    hint: "Push stick or push block."
    explanation: "They are not optional for short stock."
    xp_reward: 50
  - id: "carpentry-machines-scenario"
    type: "SCENARIO"
    prompt: "Kickback just threw a board. The saw still runs. Trainee reaches over the blade for the offcut. You:"
    options:
      - id: "a"
        text: "Let them — the board is expensive"
      - id: "b"
        text: "Stop them, power off, wait for stop, then use a stick to clear"
      - id: "c"
        text: "Speed the saw up"
      - id: "d"
        text: "Remove the guard so they can see"
    correct_answer: "b"
    hint: "Wait for stop."
    explanation: "Most injuries are after the cut, grabbing waste."
    xp_reward: 60
