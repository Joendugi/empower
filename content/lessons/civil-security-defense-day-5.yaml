    shelter civilians, medics treat injuries.

    '
- id: sec-d5-q4
  type: MULTIPLE_CHOICE
  prompt: 'Why must the emergency VHF/UHF radio antenna inside a safe room be secretly routed to a disguised
    or remote antenna outside?

    '
  xp_reward: 50
  options:
  - id: a
    text: To allow the radio to operate without a 12V battery
  - id: b
    text: Because antennas inside small rooms explode when transmitting at 50W
  - id: c
    text: To convert VHF signals directly into FM commercial radio
  - id: d
    text: Dense masonry, sandbag walls, and sheet metal door cladding create a Faraday cage that attenuates
      radio signals; an external antenna ensures distress calls reach distant emergency channels
  explanation: 'Thick concrete, steel door sheeting, and earth-filled walls heavily block RF electromagnetic
    signals. Without an external antenna feed, radio transmissions from inside the room will have a range
    of only a few metres.


    Why the other options are wrong: The antenna transmits signals; it does not provide electrical power.
    Antennas do not explode; they simply suffer severe RF reflection and signal blockage. The purpose
    is two-way emergency communications on tactical frequencies.'
  correct_answer: d
- id: sec-d5-q5
  type: PHOTO_CAPTURE
  prompt: 'Photograph a physical perimeter gate, heavy door lock installation, watchtower structure, or
