briefing: 'When physical barriers and perimeter sentries are overwhelmed by an armed breach, panic and
  disorganization are fatal. Surviving an attack or violent civil unrest demands pre-planned Community
  Quick Reaction Protocols (QRP), clear acoustic alarm signals, sector muster rosters, and structural
  hardening of an interior Panic Room (Safe Haven). This capstone lesson covers emergency alert sirens,
  internal door hardening, ballistic earth-filled walls, safe room life support supplies, redundant VHF
  emergency radio protocols, and field inspection rubrics.

  '
outline: 'Community defense organizational structure (watch commander, quick-reaction patrol, medical
  responders, civilian shelter marshals); acoustic alarm codes (siren / horn blasts for fire, medical,
  perimeter breach); internal safe room hardening: outward-opening steel-reinforced doors, continuous
  heavy hinge pins, three-point deadbolts, ballistic sandbag/gravel wall retrofits; safe room life support
  (independent water supply, N95 smoke respirators, chemical toilet, trauma first aid, secondary battery
  power, VHF radio with concealed antenna); rehearsed evacuation drills; PHOTO_CAPTURE assessment rubric
  of a hardened entrance or perimeter.

  '
content_md: "## The Community Quick Reaction Structure\n\nIn an emergency, spontaneous volunteer groups\
  \ without defined roles get trapped\nin crossfire or run into ambush. A resilient settlement establishes\
  \ an Incident\nCommand Structure with pre-assigned duties:\n\n```\n                      [ Community\
  \ Security Coordinator ]\n                                     │\n          ┌──────────────────────────┼──────────────────────────┐\n\
  \          │                          │                          │\n   [Sentry & Watch]           [Quick\
  \ Reaction]          [Civilian Shelter]\n   - Watchtowers              - 3-4 Mobile Defenders    - Marshals\
  \ & Caregivers\n   - Perimeter Gates          - Arm & Intercept         - Safe Room Lockdown\n   - Early\
  \ Warning Alarms     - Reinforce Breached Area - Accountability Roster\n```\n\n### Defined Roles:\n\
  - **Sentry Team**: Stationed on towers/gates; detects, sounds alarms, illuminates breach quadrant.\n\
  - **Quick Reaction Team (QRT)**: 3 to 5 trained, designated defenders who immediately deploy to the\
  \ breached sector to contain and delay attackers.\n- **Civilian Marshals**: Lead elders, children, and\
  \ non-combatants directly into hardened safe rooms, locking doors and verifying accountability.\n- **Medical\
  \ Triage**: Stationed inside the safe room to treat wounded and manage shock.\n\n## Acoustic Siren &\
  \ Horn Alert Codes\n\nPower and cellular networks will fail during attacks. Simple mechanical air horns,\n\
  hand-crank sirens, or vehicle horns deliver universal settlement commands:\n\n| Horn / Siren Signal\
  \ | Meaning | Required Immediate Action |\n|---|---|---|\n| **One Long Continuous Blast (30 sec)** |\
  \ **Wildfire Alert** | Fire response teams deploy to Zone 3 firebreaks; activate roof sprinklers |\n\
  | **Three Short Rapid Blasts (repeated)** | **Medical Emergency** | First aid team responds to location\
  \ with trauma kit and stretcher |\n| **Continuous Intermittent Siren (Wail)**| **Perimeter Security\
  \ Breach** | Non-combatants lockdown in Safe Rooms; QRT arms and reports to command post |\n| **Two\
  \ Long Blasts followed by Silence** | **All Clear** | Lockdown released; muster for roll-call and damage\
  \ assessment |\n\n## Hardening the Safe Room (Panic Room)\n\nWhen outer compound walls fail, a hardened\
  \ interior safe room provides a fortress\nthat buys hours or days for outside assistance to arrive.\n\
  \n### Ideal Safe Room Location:\n- An interior windowless room (e.g., pantry, masonry storeroom, or\
  \ central hallway).\n- Ground floor with direct access to a solid concrete slab foundation.\n\n### 1.\
  \ Structural Wall Hardening:\nStandard interior drywall or mud-brick can be kicked through in seconds\
  \ and offers zero ballistic protection:\n- **Ballistic Armor Retrofit**: Line the interior walls with\
  \ **double-layer sandbags** or construct an interior wooden retaining frame filled with **150 mm to\
  \ 200 mm of compacted dry sand or crushed granite ballast**.\n- A 150 mm thick dry sand wall stops standard\
  \ high-velocity rifle rounds (7.62×39 mm, 5.56 mm) and pistol rounds completely!\n\n### 2. Door & Frame\
  \ Hardening (The Entryway):\n- **Door Construction**: Solid-core hardwood (minimum 45 mm thick) sheathed\
  \ on both sides with **1.6 mm (16-gauge) galvanized sheet steel** screwed with 50 mm heavy wood screws\
  \ at 100 mm intervals.\n- **Outward Opening**: The door must swing **OUTWARD toward the hallway**. An\
  \ outward-opening door cannot be kicked in; the impact forces transfer directly into the heavy structural\
  \ door jamb rebate.\n- **Hinges**: Three or four heavy 100 mm steel ball-bearing hinges fastened with\
  \ **75 mm (3-inch) hardened steel screws that bite deep into the structural wall studs**, not just the\
  \ decorative trim.\n- **Deadbolts**: Minimum two commercial Grade 1 deadbolts (with 25 mm hardened steel\
  \ throw bolts) spaced 60 cm apart, plus two interior heavy drop-bars (steel channel or hardwood 50×100\
  \ mm) resting in welded steel wall brackets.\n\n## Safe Room Life Support Architecture\n\nA safe room\
  \ is useless if occupants must leave after 2 hours because they run out\nof air, water, or communication:\n\
  \n### Essential Safe Room Loadout (for 10 persons, 48 hours):\n1. **Potable Water**: 10 persons $\\\
  times 3\\text{ L/day} \\times 2\\text{ days} =$ **60 Litres** sealed in food-grade jerrycans.\n2. **Emergency\
  \ Air & Filtration**:\n   - Battery-powered 12V bilge blower fan pulling fresh air through an intake\
  \ pipe equipped with a **HEPA filter and activated charcoal canister** (filters smoke and tear gas).\n\
  \   - Individual N95 or P100 smoke particulate respirators for all occupants.\n3. **Sanitation**:\n\
  \   - Sealed 20-litre bucket chemical toilet with sawdust, wood ash, and heavy contractor trash bags.\n\
  4. **Communications (The Lifeline)**:\n   - Independent 12V 50Ah LiFePO4 battery running a **50W VHF/UHF\
  \ base radio**.\n   - Coaxial cable routed secretly inside walls to a **low-profile omni-directional\
  \ antenna** disguised as a plumbing vent or hidden in a nearby tree canopy.\n   - S.O.S. distress frequency\
  \ pre-programmed into channels.\n5. **Emergency Escape Hatch**:\n   - A concealed floor trapdoor leading\
  \ into a crawlspace, drainage culvert, or tunnel exiting 20 metres outside the building into a vegetated\
  \ swale.\n\n## Family & Settlement Emergency Drills\n\nA defense plan that has never been practiced\
  \ will fail under panic:\n- **The 60-Second Lockdown Drill**:\n  Conduct an unannounced drill twice\
  \ a year. Sound the alarm horn; all family members must reach the safe room, seal the steel door, engage\
  \ the drop-bars, and confirm radio contact with the watchtower **within 60 seconds**.\n- **Accountability\
  \ Protocol**: The marshal counts heads immediately. If a member is missing, the QRT is notified via\
  \ radio to sweep the sector.\n"
exercises:
- id: sec-d5-q1
  type: MULTIPLE_CHOICE
  prompt: 'Why should the reinforced security door of a hardened panic room / safe room always be mounted
    to swing OUTWARD into the hallway rather than inward into the room?

    '
  xp_reward: 50
  options:
  - id: a
    text: It saves floor space inside the safe room
  - id: b
    text: To make it easier for attackers to enter if a fire occurs
  - id: c
    text: An outward-opening door cannot be kicked in or rammed open from the outside; impact forces press
      the solid door leaf directly against the heavy masonry jamb rebate, transferring the shock into
      the walls
  - id: d
    text: Building codes require all doors in a house to swing the same direction
  explanation: 'Inward-opening doors rely entirely on the small strike plate screws, which shear off easily
    when kicked or hit with a sledgehammer. Outward-opening doors transfer all ramming energy into the
    massive structural rebate of the door frame, making dynamic entry nearly impossible.


    Why the other options are wrong: While it does save space, the overriding engineering reason is ballistic
    and mechanical ramming resistance. The purpose is to keep attackers out, not assist their entry. Internal
    doors normally swing inward; safe room doors are deliberately reversed for physical security.'
  correct_answer: c
- id: sec-d5-q2
  type: FILL_BLANK
  prompt: 'To stop standard high-velocity small arms rifle fire (7.62 mm / 5.56 mm), internal panic room
    walls should be retrofitted with double sandbags or an interior wooden retaining frame filled with
    at least ___ mm of compacted dry sand or crushed rock ballast.

    '
  xp_reward: 50
  correct_answer: '150'
  explanation: '150 mm (6 inches) of dense dry sand or crushed stone dissipates and captures high-velocity
    rifle bullets through friction and particle deformation, preventing penetration.

    '
