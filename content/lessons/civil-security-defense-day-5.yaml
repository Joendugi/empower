briefing: >
  When physical barriers and perimeter sentries are overwhelmed by an armed breach,
  panic and disorganization are fatal. Surviving an attack or violent civil unrest
  demands pre-planned Community Quick Reaction Protocols (QRP), clear acoustic
  alarm signals, sector muster rosters, and structural hardening of an interior
  Panic Room (Safe Haven). This capstone lesson covers emergency alert sirens,
  internal door hardening, ballistic earth-filled walls, safe room life support
  supplies, redundant VHF emergency radio protocols, and field inspection rubrics.

outline: >
  Community defense organizational structure (watch commander, quick-reaction
  patrol, medical responders, civilian shelter marshals); acoustic alarm codes
  (siren / horn blasts for fire, medical, perimeter breach); internal safe room
  hardening: outward-opening steel-reinforced doors, continuous heavy hinge pins,
  three-point deadbolts, ballistic sandbag/gravel wall retrofits; safe room life
  support (independent water supply, N95 smoke respirators, chemical toilet, trauma
  first aid, secondary battery power, VHF radio with concealed antenna); rehearsed
  evacuation drills; PHOTO_CAPTURE assessment rubric of a hardened entrance or perimeter.

content_md: |
  ## The Community Quick Reaction Structure

  In an emergency, spontaneous volunteer groups without defined roles get trapped
  in crossfire or run into ambush. A resilient settlement establishes an Incident
  Command Structure with pre-assigned duties:

  ```
                        [ Community Security Coordinator ]
                                       │
            ┌──────────────────────────┼──────────────────────────┐
            │                          │                          │
     [Sentry & Watch]           [Quick Reaction]          [Civilian Shelter]
     - Watchtowers              - 3-4 Mobile Defenders    - Marshals & Caregivers
     - Perimeter Gates          - Arm & Intercept         - Safe Room Lockdown
     - Early Warning Alarms     - Reinforce Breached Area - Accountability Roster
  ```

  ### Defined Roles:
  - **Sentry Team**: Stationed on towers/gates; detects, sounds alarms, illuminates breach quadrant.
  - **Quick Reaction Team (QRT)**: 3 to 5 trained, designated defenders who immediately deploy to the breached sector to contain and delay attackers.
  - **Civilian Marshals**: Lead elders, children, and non-combatants directly into hardened safe rooms, locking doors and verifying accountability.
  - **Medical Triage**: Stationed inside the safe room to treat wounded and manage shock.

  ## Acoustic Siren & Horn Alert Codes

  Power and cellular networks will fail during attacks. Simple mechanical air horns,
  hand-crank sirens, or vehicle horns deliver universal settlement commands:

  | Horn / Siren Signal | Meaning | Required Immediate Action |
  |---|---|---|
  | **One Long Continuous Blast (30 sec)** | **Wildfire Alert** | Fire response teams deploy to Zone 3 firebreaks; activate roof sprinklers |
  | **Three Short Rapid Blasts (repeated)** | **Medical Emergency** | First aid team responds to location with trauma kit and stretcher |
  | **Continuous Intermittent Siren (Wail)**| **Perimeter Security Breach** | Non-combatants lockdown in Safe Rooms; QRT arms and reports to command post |
  | **Two Long Blasts followed by Silence** | **All Clear** | Lockdown released; muster for roll-call and damage assessment |

  ## Hardening the Safe Room (Panic Room)

  When outer compound walls fail, a hardened interior safe room provides a fortress
  that buys hours or days for outside assistance to arrive.

  ### Ideal Safe Room Location:
  - An interior windowless room (e.g., pantry, masonry storeroom, or central hallway).
  - Ground floor with direct access to a solid concrete slab foundation.

  ### 1. Structural Wall Hardening:
  Standard interior drywall or mud-brick can be kicked through in seconds and offers zero ballistic protection:
  - **Ballistic Armor Retrofit**: Line the interior walls with **double-layer sandbags** or construct an interior wooden retaining frame filled with **150 mm to 200 mm of compacted dry sand or crushed granite ballast**.
  - A 150 mm thick dry sand wall stops standard high-velocity rifle rounds (7.62×39 mm, 5.56 mm) and pistol rounds completely!

  ### 2. Door & Frame Hardening (The Entryway):
  - **Door Construction**: Solid-core hardwood (minimum 45 mm thick) sheathed on both sides with **1.6 mm (16-gauge) galvanized sheet steel** screwed with 50 mm heavy wood screws at 100 mm intervals.
  - **Outward Opening**: The door must swing **OUTWARD toward the hallway**. An outward-opening door cannot be kicked in; the impact forces transfer directly into the heavy structural door jamb rebate.
  - **Hinges**: Three or four heavy 100 mm steel ball-bearing hinges fastened with **75 mm (3-inch) hardened steel screws that bite deep into the structural wall studs**, not just the decorative trim.
  - **Deadbolts**: Minimum two commercial Grade 1 deadbolts (with 25 mm hardened steel throw bolts) spaced 60 cm apart, plus two interior heavy drop-bars (steel channel or hardwood 50×100 mm) resting in welded steel wall brackets.

  ## Safe Room Life Support Architecture

  A safe room is useless if occupants must leave after 2 hours because they run out
  of air, water, or communication:

  ### Essential Safe Room Loadout (for 10 persons, 48 hours):
  1. **Potable Water**: 10 persons $\times 3\text{ L/day} \times 2\text{ days} =$ **60 Litres** sealed in food-grade jerrycans.
  2. **Emergency Air & Filtration**:
     - Battery-powered 12V bilge blower fan pulling fresh air through an intake pipe equipped with a **HEPA filter and activated charcoal canister** (filters smoke and tear gas).
     - Individual N95 or P100 smoke particulate respirators for all occupants.
  3. **Sanitation**:
     - Sealed 20-litre bucket chemical toilet with sawdust, wood ash, and heavy contractor trash bags.
  4. **Communications (The Lifeline)**:
     - Independent 12V 50Ah LiFePO4 battery running a **50W VHF/UHF base radio**.
     - Coaxial cable routed secretly inside walls to a **low-profile omni-directional antenna** disguised as a plumbing vent or hidden in a nearby tree canopy.
     - S.O.S. distress frequency pre-programmed into channels.
  5. **Emergency Escape Hatch**:
     - A concealed floor trapdoor leading into a crawlspace, drainage culvert, or tunnel exiting 20 metres outside the building into a vegetated swale.

  ## Family & Settlement Emergency Drills

  A defense plan that has never been practiced will fail under panic:
  - **The 60-Second Lockdown Drill**:
    Conduct an unannounced drill twice a year. Sound the alarm horn; all family members must reach the safe room, seal the steel door, engage the drop-bars, and confirm radio contact with the watchtower **within 60 seconds**.
  - **Accountability Protocol**: The marshal counts heads immediately. If a member is missing, the QRT is notified via radio to sweep the sector.

exercises:
  - id: sec-d5-q1
    type: MULTIPLE_CHOICE
    prompt: >
      Why should the reinforced security door of a hardened panic room / safe room
      always be mounted to swing OUTWARD into the hallway rather than inward into the room?
    xp_reward: 50
    options:
      - text: "An outward-opening door cannot be kicked in or rammed open from the outside; impact forces press the solid door leaf directly against the heavy masonry jamb rebate, transferring the shock into the walls"
        correct: true
        explanation: "Inward-opening doors rely entirely on the small strike plate screws, which shear off easily when kicked or hit with a sledgehammer. Outward-opening doors transfer all ramming energy into the massive structural rebate of the door frame, making dynamic entry nearly impossible."
      - text: "It saves floor space inside the safe room"
        correct: false
        explanation: "While it does save space, the overriding engineering reason is ballistic and mechanical ramming resistance."
      - text: "To make it easier for attackers to enter if a fire occurs"
        correct: false
        explanation: "The purpose is to keep attackers out, not assist their entry."
      - text: "Building codes require all doors in a house to swing the same direction"
        correct: false
        explanation: "Internal doors normally swing inward; safe room doors are deliberately reversed for physical security."

  - id: sec-d5-q2
    type: FILL_BLANK
    prompt: >
      To stop standard high-velocity small arms rifle fire (7.62 mm / 5.56 mm),
      internal panic room walls should be retrofitted with double sandbags or an interior
      wooden retaining frame filled with at least ___ mm of compacted dry sand or
      crushed rock ballast.
    xp_reward: 50
    correct_answer: "150"
    explanation: >
      150 mm (6 inches) of dense dry sand or crushed stone dissipates and captures
      high-velocity rifle bullets through friction and particle deformation, preventing penetration.

  - id: sec-d5-q3
    type: MATCH_PAIRS
    prompt: Match each community defense team role to its immediate tactical responsibility.
    xp_reward: 50
    pairs:
      - left: Quick Reaction Team (QRT)
        right: Rapidly arms, intercepts, and contains breaches to protect civilians
      - left: Civilian Marshals
        right: Directs elders and children into safe rooms and conducts headcount rosters
      - left: Tower Sentries
        right: Detects incoming threats, sounds siren codes, and illuminates breach sectors
      - left: Medical Responders
        right: Manages trauma triage and shock stabilization within the safe room
    correct_answer: null
    explanation: >
      Organized defense requires division of labor: sentries detect, QRT fights/delays,
      marshals shelter civilians, medics treat injuries.

  - id: sec-d5-q4
    type: MULTIPLE_CHOICE
    prompt: >
      Why must the emergency VHF/UHF radio antenna inside a safe room be secretly
      routed to a disguised or remote antenna outside?
    xp_reward: 50
    options:
      - text: "Dense masonry, sandbag walls, and sheet metal door cladding create a Faraday cage that attenuates radio signals; an external antenna ensures distress calls reach distant emergency channels"
        correct: true
        explanation: "Thick concrete, steel door sheeting, and earth-filled walls heavily block RF electromagnetic signals. Without an external antenna feed, radio transmissions from inside the room will have a range of only a few metres."
      - text: "To allow the radio to operate without a 12V battery"
        correct: false
        explanation: "The antenna transmits signals; it does not provide electrical power."
      - text: "Because antennas inside small rooms explode when transmitting at 50W"
        correct: false
        explanation: "Antennas do not explode; they simply suffer severe RF reflection and signal blockage."
      - text: "To convert VHF signals directly into FM commercial radio"
        correct: false
        explanation: "The purpose is two-way emergency communications on tactical frequencies."

  - id: sec-d5-q5
    type: PHOTO_CAPTURE
    prompt: >
      Photograph a physical perimeter gate, heavy door lock installation, watchtower
      structure, or safe room entryway from your community defense and workshop practice.
      Ensure the image clearly demonstrates hinge security, deadbolts, barrier anchoring,
      or clear sightlines, and include your written security audit report.
    xp_reward: 50
    correct_answer: null
    explanation: >
      Photographic verification of physical security details confirms proper hinge
      pin inversion, deadbolt throw depth, frame reinforcement, and unobstructed
      defensive sightlines in accordance with CPTED and physical defense standards.
    rubric:
      - criterion: "Photograph clearly shows reinforced gate, door deadbolts, hinge security, or watchtower observation structure"
        points: 15
      - criterion: "Structural fastening (3-inch frame screws, inverted pins, drop-bars, or anchor bolts) is clearly visible and inspected"
        points: 15
      - criterion: "Written report details defense zone assignment (Zone 1-4), potential attack vectors, and delay-time estimate"
        points: 10
      - criterion: "Image is well-lit, in sharp focus, showing clean structural fitment and hardware installation"
        points: 10
