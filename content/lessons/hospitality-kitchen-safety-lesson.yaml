id: "hospitality-kitchen-safety-lesson"
course_id: "hospitality"
title: "Knives, fire, and kitchen hazards"
title_sw: "Visu, moto, na hatari jikoni"
briefing: "A chip-pan / fat fire is fought by turning off heat if safe, covering with a lid, and using the correct extinguisher. Never water — it explodes the oil into a fireball. Know the extinguisher types in your kitchen.\n\nKnives: carry point down, pass handle first, cut on a stable board with fingers tucked. A falling knife is not caught. Sharp knives are safer than dull ones because they do not slip.\n\nFloors: clean spills immediately. “I’ll mop at close” is how ankles break mid-service. Lids on pots, handles inward, and dry cloths on hot handles.\n\nFirst aid box and burns protocol. Oil burns are serious. Cool with running water as trained, then report."
briefing_sw: "Usitumie maji kwenye moto wa mafuta. Funika na zima moto. Chukua kisu ncha chini. Futa mafuriko mara moja. Visu vikali ni salama kuliko butu."
estimated_minutes: 18
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FBP/CR/02/5"
exam_domain: "Kitchen safety"
exercises:
  - id: "hospitality-kitchen-safety-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "A chip-pan fire should be fought by:"
    options:
      - id: "a"
        text: "Throwing a mug of water"
      - id: "b"
        text: "Turning off heat if safe, covering, correct extinguisher — never water"
      - id: "c"
        text: "Carrying the pan through the dining room"
      - id: "d"
        text: "Blowing on it"
    correct_answer: "b"
    hint: "Water plus hot oil."
    explanation: "Steam expansion spreads burning fat."
    xp_reward: 50
  - id: "hospitality-kitchen-safety-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "You should carry a knife:"
    options:
      - id: "a"
        text: "Swinging at shoulder height"
      - id: "b"
        text: "Point down, close to your side"
      - id: "c"
        text: "In your teeth"
      - id: "d"
        text: "Hidden in a towel with the point out"
    correct_answer: "b"
    hint: "If you trip."
    explanation: "Point down. Announce “back” in a crowded pass."
    xp_reward: 50
  - id: "hospitality-kitchen-safety-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A dull knife is more dangerous because it:"
    options:
      - id: "a"
        text: "Is heavier"
      - id: "b"
        text: "Slips off the food into your hand"
      - id: "c"
        text: "Cools the stove"
      - id: "d"
        text: "Sanitises boards"
    correct_answer: "b"
    hint: "Force and slip."
    explanation: "Hone and sharpen. Do not saw tomatoes with a spoon-edge."
    xp_reward: 50
  - id: "hospitality-kitchen-safety-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Oil on the pass floor should be:"
    options:
      - id: "a"
        text: "Left as seasoning"
      - id: "b"
        text: "Cleaned immediately and the area signed if needed"
      - id: "c"
        text: "Covered with more flour only"
      - id: "d"
        text: "Ignored until tomorrow"
    correct_answer: "b"
    hint: "Slips."
    explanation: "Service speed does not outrank a broken arm."
    xp_reward: 50
  - id: "hospitality-kitchen-safety-fb1"
    type: "FILL_BLANK"
    prompt: "Putting a lid on a pan of burning fat starves the fire of ___."
    correct_answer: "oxygen"
    hint: "Fire triangle."
    explanation: "Covering is the first move if it is safe."
    xp_reward: 50
  - id: "hospitality-kitchen-safety-scenario"
    type: "SCENARIO"
    prompt: "A pan of oil has ignited. A commis reaches for a jug of water. You:"
    options:
      - id: "a"
        text: "Help pour"
      - id: "b"
        text: "Stop them, lid on, heat off if reachable, alarm if it grows"
      - id: "c"
        text: "Carry the pan to the dining room"
      - id: "d"
        text: "Add flour explosively"
    correct_answer: "b"
    hint: "No water."
    explanation: "Take over the procedure. Water is the wrong reflex."
    xp_reward: 60
