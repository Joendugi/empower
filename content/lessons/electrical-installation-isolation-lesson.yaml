id: "electrical-installation-isolation-lesson"
course_id: "electrical-installation"
title: "Safe isolation and proving dead"
title_sw: "Isolation salama na kuthibitisha kifo cha current"
briefing: "Treat every circuit as live until you prove it dead. The sequence taught in competent installation practice is: identify, isolate, lock/tag, test your tester on a known live source (or proving unit), test the circuit conductors, then test the tester again. A dead lamp on a tester with a flat battery has killed people.\n\nThe consumer unit is not a junk drawer. Stand on dry footing, use insulated tools, and do not lean on earth pipes. Remove loads, then isolate. Single-pole isolation of a circuit that still has a borrowed neutral is a trap — understand the wiring before you trust a switch.\n\nPermits and college lock-out boards exist because “I thought it was off” is not a defence. If you cannot lock, you must still control the device and put a warning. Never use the installation’s own socket as the only proof that your tester works while you are already inside the CU.\n\nFirst aid: you do not become the second casualty. Isolate, then help. That order is part of the unit."
briefing_sw: "Chukulia waya kuwa hai. Isolate, funga, jaribu tester, jaribu circuit, jaribu tester tena. Usitumie tester na betri mbovu. Elewa neutral. Usijaribu kuokoa mtu kabla ya kuzima umeme."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/EIT/CR/01/5"
exam_domain: "Safe isolation"
media:
  - kind: "animation"
    preset: "wave"
    caption: "Live — dead — live. Never skip the proving unit."
exercises:
  - id: "electrical-installation-isolation-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the first action before opening a consumer unit for work?"
    options:
      - id: "a"
        text: "Tighten every screw you see"
      - id: "b"
        text: "Isolate the supply and prove dead with a proving unit / known live source"
      - id: "c"
        text: "Stand in water for better earth"
      - id: "d"
        text: "Remove the earth first"
    correct_answer: "b"
    hint: "Safe isolation sequence."
    explanation: "Proving dead prevents electrocution. Never use the circuit itself as the only proof that the tester works."
    xp_reward: 50
  - id: "electrical-installation-isolation-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Why test the tester before and after proving a circuit dead?"
    options:
      - id: "a"
        text: "To waste time"
      - id: "b"
        text: "A failed tester can read dead on a live conductor"
      - id: "c"
        text: "NITA requires three testers"
      - id: "d"
        text: "It charges the MCB"
    correct_answer: "b"
    hint: "Live-dead-live."
    explanation: "The proving unit (or known live) confirms the instrument still works."
    xp_reward: 50
  - id: "electrical-installation-isolation-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Working on a circuit with only a sticky note on the main switch is risky because:"
    options:
      - id: "a"
        text: "Paper is recyclable"
      - id: "b"
        text: "Someone can re-energise the board while you are on the conductors"
      - id: "c"
        text: "Sticky notes improve isolation"
      - id: "d"
        text: "MCBs dislike ink"
    correct_answer: "b"
    hint: "Lock and tag."
    explanation: "Control of the isolating device is the point of lock-out."
    xp_reward: 50
  - id: "electrical-installation-isolation-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "If a person is still in contact with a live part you should first:"
    options:
      - id: "a"
        text: "Pull them with both wet hands"
      - id: "b"
        text: "Isolate the supply, then give first aid"
      - id: "c"
        text: "Pour water on both of you"
      - id: "d"
        text: "Take a photo for the incident book"
    correct_answer: "b"
    hint: "Do not become casualty two."
    explanation: "Break the circuit, then help."
    xp_reward: 50
  - id: "electrical-installation-isolation-fb1"
    type: "FILL_BLANK"
    prompt: "The live-dead-live method is also called ___ dead."
    correct_answer: "proving"
    hint: "You prove the circuit is not live."
    explanation: "Proving dead is a scored practical."
    xp_reward: 50
  - id: "electrical-installation-isolation-scenario"
    type: "SCENARIO"
    prompt: "Your voltage tester shows 0 V on a circuit. You did not check the tester on a proving unit first. What is correct?"
    options:
      - id: "a"
        text: "Start work — zero is zero"
      - id: "b"
        text: "Stop, prove the instrument, then re-test the circuit; do not trust an unproven 0 V"
      - id: "c"
        text: "Lick the conductor to confirm"
      - id: "d"
        text: "Tighten the MCB and assume"
    correct_answer: "b"
    hint: "Unproven zero is meaningless."
    explanation: "This is the classic exam and mortuary scenario."
    xp_reward: 60
