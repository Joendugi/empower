  prompt: 'What is the first step a technician must take before starting Cooling and
    Lubrication Systems: Coolant Circuit, Thermostat Operation, Oil Pump, Oil Galleries
    and Service Intervals?'
  options:
  - id: a
    text: Begin operation immediately without inspection
  - id: b
