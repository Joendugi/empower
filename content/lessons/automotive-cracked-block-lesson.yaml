id: "automotive-cracked-block-lesson"
course_id: "automotive"
title: "Week 4 — Cracked engine block: prove, classify, repair or replace"
title_sw: "Wiki 4 — Engine block iliyopasuka"
briefing: "A cracked block is a diagnosis, not a guess made because coolant disappears. First rule out hoses, water pump, radiator, heater core, core plugs, head gasket, warped head, and porous gasket surfaces. Record the complaint: external leak, coolant in oil (“mayonnaise”), oil in coolant, white exhaust smoke, overheating, low compression, or combustion gas in the expansion tank. Never open a hot pressurised cooling system.\n\nClean and inspect. Cooling-system pressure test at the cap/manufacturer rating—not above it. Use UV dye if permitted. Combustion-leak/block-test fluid detects exhaust gas in coolant. Compression and leak-down help separate rings, valves, head gasket, head, and block. With the engine stripped, dye penetrant finds surface cracks on non-porous material; magnetic-particle inspection is for ferrous cast iron, not aluminium. A machine shop can pressure-test the bare casting and measure deck flatness.\n\nClassify location and material. Cast-iron cracks in a non-critical water jacket may be repaired by cold metal stitching: drill stop holes as specified, install overlapping locks/pins, peen and seal, then pressure-test and machine if needed. Specialist hot welding of cast iron requires complete stripping, controlled preheat, compatible nickel filler, slow cooling, and post-machining; an unheated bead often creates a new crack beside the weld. Aluminium blocks may be TIG repaired only by a specialist after contamination is removed and distortion control planned. Cracks through main-bearing webs, cylinder bores beyond repair limit, multiple freeze fractures, or a badly distorted deck often make replacement or a remanufactured short block safer and cheaper.\n\nChemical “stop leak” is not a structural repair. It can block heater cores and radiator tubes. It may be an emergency measure only when the product/manufacturer permits and the customer understands the limitation. Final proof: pressure test cold and hot, check oil/coolant separation, verify compression, cooling-fan operation, torque records, and road test while monitoring temperature. Quote repair versus replacement with labour, machining, gaskets, fluids, warranty, and downtime."
briefing_sw: "Usikisie block imepasuka. Pressure-test mfumo, block test ya gesi, compression/leak-down, na inspect. Cast iron inaweza kushonwa kwa metal stitching au ku-weldiwa na specialist; aluminium TIG na specialist. Crack kwenye main-bearing web mara nyingi inahitaji replacement. Stop-leak si repair ya muundo."
estimated_minutes: 34
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/AUT/CR/04/5"
exam_domain: "Engine block diagnosis & repair decision"
exercises:
  - id: "automotive-cracked-block-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "Coolant disappears and oil turns milky. Before condemning the block, the technician should:"
    options:
      - id: "a"
        text: "Pour stop-leak and sell the car"
      - id: "b"
        text: "Pressure-test, test combustion gas, inspect the head gasket/head/block, and document evidence"
      - id: "c"
        text: "Weld the outside while the engine runs"
      - id: "d"
        text: "Replace the radiator cap only and guarantee it"
    correct_answer: "b"
    hint: "Several faults mix oil and coolant."
    explanation: "A failed oil cooler, head gasket, cracked head, or block can produce similar symptoms. Evidence determines the repair."
    xp_reward: 50
  - id: "automotive-cracked-block-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "Why is a short cold weld bead on cast iron risky?"
    options:
      - id: "a"
        text: "Cast iron cannot melt"
      - id: "b"
        text: "Uneven thermal expansion and rapid cooling can create hard zones and a new crack"
      - id: "c"
        text: "Nickel filler is always plastic"
      - id: "d"
        text: "Coolant makes every weld stronger"
    correct_answer: "b"
    hint: "Heat control."
    explanation: "Specialist procedures use preheat/slow cooling or cold stitching to manage brittle cast iron."
    xp_reward: 50
  - id: "automotive-cracked-block-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "A crack through a main-bearing web should normally lead to:"
    options:
      - id: "a"
        text: "Silicone on the outside"
      - id: "b"
        text: "Engineering assessment and usually replacement/remanufactured block"
      - id: "c"
        text: "A bigger radiator cap"
      - id: "d"
        text: "Grinding the bearing shell thinner"
    correct_answer: "b"
    hint: "Structural alignment."
    explanation: "The main web locates the crankshaft under high cyclic load. Casual welding can destroy alignment and safety."
    xp_reward: 50
  - id: "automotive-cracked-block-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "The final acceptance test after a water-jacket repair includes:"
    options:
      - id: "a"
        text: "Paint only"
      - id: "b"
        text: "Pressure test, hot run, fluid-contamination check, temperature/fan check, and documented road test"
      - id: "c"
        text: "One idle minute with no cap"
      - id: "d"
        text: "Adding extra stop-leak"
    correct_answer: "b"
    hint: "Prove the leak and overheating are gone."
    explanation: "A repair is incomplete until it holds pressure and the root cause of overheating is corrected."
    xp_reward: 50
  - id: "automotive-cracked-block-fb1"
    type: "FILL_BLANK"
    prompt: "The cold cast-iron repair that installs overlapping pins or locks across a crack is metal ___."
    correct_answer: "stitching"
    hint: "It avoids a large heat-affected zone."
    explanation: "Metal stitching can repair selected non-critical cast-iron cracks after engineering assessment."
    xp_reward: 50
  - id: "automotive-cracked-block-scenario"
    type: "SCENARIO"
    prompt: "A block has a 70 mm external water-jacket crack after freezing; main webs and bore are sound. Customer wants the cheapest permanent option. Best professional path?"
    options:
      - id: "a"
        text: "Smear epoxy over coolant and hand it back"
      - id: "b"
        text: "Strip and inspect; obtain a machine-shop quote for approved cold stitching versus replacement, then pressure-test"
      - id: "c"
        text: "Arc-weld it cold with 6013 while assembled"
      - id: "d"
        text: "Raise the radiator-cap pressure"
    correct_answer: "b"
    hint: "Repairability depends on location and verification."
    explanation: "A non-structural cast-iron water-jacket crack may be stitchable, but only after inspection and with a final pressure test."
    xp_reward: 60
  - id: "automotive-cracked-block-practical"
    type: "VIDEO_RECORD"
    prompt: "Record a diagnostic demonstration on a training engine or mock-up: identify three possible coolant-loss sources, show safe pressure-tester setup, explain the maximum test pressure, and state repair-versus-replace criteria. Do not work on a hot engine."
    correct_answer: "recorded"
    hint: "Show the procedure safely and check every rubric item before submitting."
    explanation: "Practical evidence saved locally for trainer review."
    xp_reward: 80
    rubric:
      - "Engine is cold and PPE is visible"
      - "Tester and cap rating are identified before pressurising"
      - "At least three alternative leak causes are checked"
      - "Crack location/material and repair limits are explained"
      - "Final pressure and contamination checks are stated"
    min_seconds: 20
