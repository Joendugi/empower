  xp_reward: 50
  correct_answer:
  - '1.5'
  - zero
  explanation: 'Zone 1 (0 to 1.5 m) is the non-combustible apron. Any dry leaf, wooden planter, or mulch
    within this zone can ignite from falling embers and directly burn the wall.

    '
