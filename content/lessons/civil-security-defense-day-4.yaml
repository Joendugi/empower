- id: sec-d4-q4
  type: MULTIPLE_CHOICE
  prompt: 'What mesh material and aperture size should be installed over building eave and soffit vents
    to prevent wind-borne wildfire embers from entering attic spaces?

    '
  xp_reward: 50
  options:
  - id: a
    text: 3 mm (1/8-inch) stainless steel or bronze metal wire mesh (standard plastic insect screening
      melts under ember heat)
  - id: b
    text: 15 mm galvanized diamond chicken wire
  - id: c
    text: Nylon mosquito netting coated in vegetable oil
  - id: d
    text: Solid sheet metal with zero ventilation holes
  explanation: 'Plastic or nylon fly screens melt instantly when contacted by a 600°C ember, leaving an
    open hole. 3 mm stainless steel or bronze mesh blocks embers while maintaining necessary attic ventilation.


    Why the other options are wrong: 15 mm mesh is far too coarse; small glowing embers blow directly
    through. Nylon melts and oil is highly flammable, worsening the hazard. Sealing vents entirely traps
    humidity, causing roof timber rot and mold during normal weather.'
  correct_answer: a
- id: sec-d4-q5
  type: FILL_BLANK
  prompt: 'To stop advancing ground fire, an engineered firebreak must be scraped down to bare ___ soil
    with zero organic turf, and its width should equal at least ___ times the expected flame length.

    '
  xp_reward: 50
  correct_answer:
  - mineral
  - '2.5'
  explanation: 'A firebreak must expose raw mineral subsoil (sand, clay, rock) with no dead roots. A width
    of 2.5 times the flame length prevents direct flame reach across the break.

    '
