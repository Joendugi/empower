- id: aqua-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'What critical physical boundary dictates when 17α-methyltestosterone (MT) treatment must be
    initiated to successfully achieve 98%+ phenotypic male tilapia?

    '
  xp_reward: 50
  options:
  - id: a
    text: Fry must weigh at least 50 grams before hormones can be tolerated
  - id: b
    text: Fry must be swim-up stage and less than 11 mm in total length, because gonadal differentiation
      begins after this size and later treatment fails to reverse ovaries
  - id: c
    text: Hormone feeding is only administered to mature 1-year-old broodstock
  - id: d
    text: Hormones must be injected directly into each individual fry's eye
  explanation: 'Tilapia fry must be under 11 mm (swim-up stage, typically under 14 days post-hatch) for
    oral MT therapy. Once fry exceed 11 to 14 mm, gonadal differentiation has already started, making
    hormonal sex reversal ineffective.


    Why the other options are wrong: At 50 grams, fish are already sexually mature and sex reversal is
    impossible. Broodstock are not fed MT; MT is fed exclusively to early post-larval fry. MT is administered
    orally in feed mash, never by micro-injection into eyes.'
  correct_answer: b
