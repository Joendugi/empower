  correct_answer:
  - l1=r-695926
  - l2=r-5a8bf6
  - l3=r-a5aec0
  - l4=r-05c465
  explanation: 'Trace marks stable emulsification before casting; superfatting ensures skin safety; salting
    out precipitates soap; curing cures and hardens the bar.

    '
- id: chem-d2-q4
  type: MULTIPLE_CHOICE
  prompt: 'In off-grid lye production, wood ash leachate produces primarily soft liquid soap. What chemical
    reagent is added to convert crude wood-ash potassium carbonate (K2CO3) into sodium hydroxide (NaOH)
    for hard bars?

    '
  xp_reward: 50
  options:
  - id: a
    text: Sulfuric acid to neutralize the potassium
  - id: b
    text: Slaked lime [Ca(OH)2] to convert carbonate to caustic hydroxide, followed by common salt (NaCl)
      brine to exchange potassium ions for sodium ions
  - id: c
    text: Charcoal dust to absorb the excess potassium
  - id: d
    text: Hydrogen peroxide to oxidize the ash liquid
  explanation: 'Causticization with Ca(OH)2 yields soluble KOH while precipitating CaCO3 chalk. Introducing
    NaCl salt brine to the boiling soap batch exchanges K+ for Na+ via the common-ion effect, precipitating
    hard sodium soap.


    Why the other options are wrong: Acid destroys alkali, turning it into neutral potassium sulfate which
    cannot make soap. Charcoal filters colour and organics, but does not chemically convert potassium
    ions. Peroxide is a bleaching and oxidizing agent, not a cation-exchange or causticizing reagent.'
  correct_answer: b
- id: chem-d2-q5
  type: FILL_BLANK
  prompt: 'When testing the concentration of wood-ash lye with an uncooked egg, the egg should float with
    an exposed crown roughly the diameter of a ___ (approx. 20 mm), indicating a specific gravity of approximately
    ___ to 1.10 g/cm3.

    '
  xp_reward: 50
  correct_answer:
  - coin
  - '1.08'
  explanation: 'An egg floats at a specific gravity of approx 1.08 g/cm3 when the solution contains about
    10%-12% dissolved potassium salts, the optimal strength for saponification.

    '
