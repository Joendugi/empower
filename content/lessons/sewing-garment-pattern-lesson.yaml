id: "sewing-garment-pattern-lesson"
course_id: "sewing-garment"
title: "Pattern, grain, and cutting"
title_sw: "Pattern, grain, na kukata"
briefing: "A garment is decided on the table before a single stitch. Patterns carry grainlines, notches, drill holes, size, and cutting instructions. The grainline must sit parallel to the selvedge (or to the warp on a folded length). Off-grain collars twist; off-grain trousers twist around the leg.\n\nStandard woven seam allowance in many TVET practicals is 1.5 cm (sometimes 1 cm on necklines after staystitching — follow the pattern). Hem allowances are larger and must be planned, not guessed at the floor. Fold fabric right sides together unless the lay plan says otherwise. Pin inside the allowance, not on the stitch line, and cut with the shears resting on the table — don’t lift the cloth and chew it in the air.\n\nNotches match pieces: one notch often means a front, two a back, or they mark ease. Transfer markings with tailor’s tacks, chalk, or a tracing wheel as taught. Staystitch curved necks and armholes 5 mm from the edge, in the direction that stops stretch, before you handle the piece a lot.\n\nAssessors look at a clean lay: little waste, all pieces facing the planned nap/print direction, and no missing facings. Count pieces against the pattern chart before you move the waste."
briefing_sw: "Grainline inafaa kuwa sambamba na selvedge. Seam allowance ya kawaida ni 1.5 cm. Kata kitambaa mezani, si hewani. Notches zinalinganisha vipande. Staystitch shingo kabla ya kushughulikia. Hesabu vipande kulingana na chart kabla ya kutupa waste."
estimated_minutes: 20
license: "CC-BY-SA-4.0"
cdacc_unit_id: "CU/FAS/CR/02/5"
exam_domain: "Pattern & cutting"
exercises:
  - id: "sewing-garment-pattern-q1"
    type: "MULTIPLE_CHOICE"
    prompt: "What is the usual seam allowance for most woven garments in TVET practicals?"
    options:
      - id: "a"
        text: "0.3 cm"
      - id: "b"
        text: "1.5 cm"
      - id: "c"
        text: "5 cm"
      - id: "d"
        text: "10 cm"
    correct_answer: "b"
    hint: "About a finger joint, not a hem."
    explanation: "1.5 cm is the common woven construction allowance before fitting changes."
    xp_reward: 50
  - id: "sewing-garment-pattern-q2"
    type: "MULTIPLE_CHOICE"
    prompt: "If a grainline is not parallel to the selvedge, the garment may:"
    options:
      - id: "a"
        text: "Sew faster"
      - id: "b"
        text: "Twist or hang crooked after pressing"
      - id: "c"
        text: "Never need notches"
      - id: "d"
        text: "Become waterproof"
    correct_answer: "b"
    hint: "Fabric wants to return to true grain."
    explanation: "Off-grain cutting is a classic cause of twisting trousers, rolling hems, and collars that will not sit."
    xp_reward: 50
  - id: "sewing-garment-pattern-q3"
    type: "MULTIPLE_CHOICE"
    prompt: "Staystitching on a neckline is done to:"
    options:
      - id: "a"
        text: "Decorate the inside"
      - id: "b"
        text: "Stabilise a bias or curved edge so it does not stretch before joining"
      - id: "c"
        text: "Replace the facing"
      - id: "d"
        text: "Shorten the grainline"
    correct_answer: "b"
    hint: "Curves stretch on the bias."
    explanation: "A row of stitching just inside the seam line keeps the neck the drafted size."
    xp_reward: 50
  - id: "sewing-garment-pattern-q4"
    type: "MULTIPLE_CHOICE"
    prompt: "Why pin inside the seam allowance rather than through the stitch line?"
    options:
      - id: "a"
        text: "Pins on the stitch line can leave holes and shift the seam when you sew over them"
      - id: "b"
        text: "Pins are illegal in CDACC exams"
      - id: "c"
        text: "It uses more pins"
      - id: "d"
        text: "It hides notches"
    correct_answer: "a"
    hint: "The needle should not fight metal on the stitch path if you can avoid it."
    explanation: "Many trainers require pins removed as you sew. Never sew over a pin if the rule is “remove as you go”."
    xp_reward: 50
  - id: "sewing-garment-pattern-fb1"
    type: "FILL_BLANK"
    prompt: "The arrow printed on a pattern piece that must run parallel to the selvedge is the ___."
    correct_answer: "grainline"
    hint: "It controls how the cloth hangs."
    explanation: "Grainline alignment is a scored cutting criterion."
    xp_reward: 50
  - id: "sewing-garment-pattern-scenario"
    type: "SCENARIO"
    prompt: "You have cut a school-shirt back on the fold but the fold was not on the straight grain. What is correct?"
    options:
      - id: "a"
        text: "Sew it anyway; pressing will hide twist"
      - id: "b"
        text: "Recut from remaining cloth on true grain, or recut a new length — do not construct a twisted back"
      - id: "c"
        text: "Clip the hem until it looks straight on the dummy"
      - id: "d"
        text: "Glue a second back on top"
    correct_answer: "b"
    hint: "You cannot press grain into a piece that was cut wrong."
    explanation: "An off-grain back will never hang. Recut. That is cheaper than a failed practical garment."
    xp_reward: 60
