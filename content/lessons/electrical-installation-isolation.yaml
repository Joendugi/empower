briefing: 'In professional workshop practice, mastering Safe Electrical Isolation:
  Proving Dead with a Voltage Indicator, Lockout/Tagout, Permit to Work and Test Equipment
  Checks requires strict adherence to safety standards and sequential execution. Always
  inspect personal protective equipment (PPE), ensure proper tool calibration, and
  verify that the workpiece is securely mounted before commencing. Observe manufacturer
  specifications and relevant standards. Maintain a clean work environment, store
  consumables dry, and double-check your alignment.'
briefing_sw: 'Katika mazoezi ya warsha, kuelewa Safe Electrical Isolation: Proving
  Dead with a Voltage Indicator, Lockout/Tagout, Permit to Work and Test Equipment
  Checks kunahitaji kufuata sheria za usalama na mpangilio sahihi. Kagua vifaa vya
  kujikinga (PPE) kabla ya kuanza kazi.'
