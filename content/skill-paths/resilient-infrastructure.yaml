  - id: potable-water-engineering
    title: Potable Water Engineering
    title_sw: Uhandisi wa Maji Safi
    description: 5-Day comprehensive intensive on biological sand filtration, plant flocculation, solar sterilization, and maintenance.
    outline: |
      Day 1: Slow sand gravity filter sizing and gravel stratification
      Day 2: Biofilm Schmutzdecke biological layer and constant head maintenance
      Day 3: Botanical coagulants (Moringa oleifera) and jar testing
      Day 4: Solar UV disinfection (SODIS) and WSO pasteurization thresholds
      Day 5: Hydraulic scraping, bed rejuvenation, and pathogen testing
