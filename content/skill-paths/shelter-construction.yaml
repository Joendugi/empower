id: shelter-construction
title: Shelter, Natural Building & Structural Engineering
title_sw: Makazi, Ujenzi wa Asili na Uhandisi wa Miundo
description: 'Five-day hands-on unit on resilient shelter and low-carbon structural engineering for East
  African terrains: soil ribbon and jar sedimentation testing, stabilized compressed earth blocks (CEB),
  earthbag (Superadobe) compressive domes, timber roof trusses and passive thermal insulation, and ferro-cement
  construction for water cisterns and storm shelter.

  '
description_sw: 'Kitengo cha siku tano cha vitendo kuhusu makazi thabiti na uhandisi wa miundo kwa maeneo
  ya Afrika Mashariki: upimaji wa udongo, matofali ya udongo yaliyoshindiliwa (CEB), mifuko ya udongo
  (Superadobe), nguzo za paa za mbao na ujenzi wa ferro-cement kwa matanki ya maji na dhoruba.

  '
