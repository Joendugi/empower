id: first-aid-trauma
title: "First Aid & Trauma Care"
title_sw: "Msaada wa Kwanza na Utunzaji wa Majeraha"
description: >
  Five-day hands-on unit on evidence-based first aid for East African contexts:
  haemorrhage control and tourniquet application, airway and breathing management,
  burns and scalds treatment, fracture immobilisation and improvised splinting,
  and patient assessment with improvised stretcher construction. Each day equips
  community first responders with life-saving skills applicable in rural and
  peri-urban Kenya where EMS response times can exceed 60 minutes.
description_sw: >
  Kitengo cha siku tano cha vitendo cha msaada wa kwanza unaotegemea ushahidi
  kwa muktadha wa Afrika Mashariki: udhibiti wa kutoka damu na utumiaji wa
  tourniquet, usimamizi wa njia ya hewa na kupumua, matibabu ya kuungua,
  kuweka splint kwa mifupa iliyovunjika, na tathmini ya mgonjwa na ujenzi
  wa machela ya kubuni.
level: beginner
tags: [first-aid, trauma, health, emergency, kenya, community]
