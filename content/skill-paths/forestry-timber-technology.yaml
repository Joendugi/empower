id: forestry-timber-technology
title: Silviculture, Timber Engineering & Wood Technology
titleSw: Misitu, Uhandisi wa Mbao na Teknolojia ya Mbao
description: >
  Master the essential forestry, logging, timber conversion, and structural wood
  engineering skills required to manage community forest reserves sustainably and
  transform raw logs into durable structural beams — from chain saw safety and felling
  mechanics (face cuts, back cuts, hinge wood) and two-man pit sawing to solar kiln
  timber seasoning (equilibrium moisture content), natural borate wood preservation,
  and traditional timber joinery (mortise-and-tenon, scarf joints) for heavy framing.
level: intermediate
category: engineering
estimatedHours: 10
xpTotal: 1250
license: CC-BY-SA-4.0
