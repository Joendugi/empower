id: electrical-power-systems
title: Electrical Power Systems & Grid Resilience
titleSw: Mifumo ya Umeme na Uimara wa Gridi
description: >
  Master the essential electrical engineering skills required to generate, regulate,
  distribute, and protect AC/DC power in autonomous off-grid communities — from
  single-phase and 3-phase AC circuit analysis and alternator rewinding to transformer
  fabrication, circuit breaker sizing, earthing systems, and smart micro-grid load management.
level: intermediate
category: engineering
