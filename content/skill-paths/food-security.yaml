id: food-security
title: "Food Security & Preservation"
title_sw: "Usalama wa Chakula na Uhifadhi"
description: >
  Five-day hands-on unit on post-harvest food preservation for East African
  contexts: hermetic grain storage, solar drying, lacto-fermentation, salt
  and smoke curing, and seed saving. Each day builds practical skills that
  reduce food loss and extend nutritional reach across seasons.
description_sw: >
  Kitengo cha siku tano cha vitendo kuhusu uhifadhi wa chakula baada ya mavuno
  kwa muktadha wa Afrika Mashariki.
level: beginner
tags: [food-security, preservation, fermentation, agriculture, kenya]
