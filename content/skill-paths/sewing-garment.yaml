id: "sewing-garment"
title: "Fashion design & garment making"
title_sw: "Ushonaji na ubunifu wa nguo"
description: "Semester-style CDACC fashion cores: machine, textiles, sketching, pattern, grading, construction, ladies wear, gents wear, then fitting and finishing — about a year of workshop units plus attachment later."
description_sw: "Mtaala wa semester wa fashion: mashine, nguo, mchoro, pattern, grading, ujenzi, nguo za wanawake na wanaume, kisha fitting."
certification_target: "CDACC / NITA — Fashion design & garment making"
track: "trades"
content_version: "1"
