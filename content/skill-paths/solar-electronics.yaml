id: solar-electronics
title: Solar Energy & Basic Electronics
title_sw: Nishati ya Jua na Elektroniki ya Msingi
description: 'Five-day hands-on unit on off-grid photovoltaic systems for East Africa: panel selection
  and tilt, battery bank design, charge controller wiring, DC load circuits and safe wiring practice,
  and system commissioning with multimeter fault-finding. Designed for technicians serving rural and peri-urban
  households in Kenya, Tanzania, and Uganda.

  '
description_sw: 'Kitengo cha siku tano cha vitendo kuhusu mifumo ya umeme wa jua nje ya gridi kwa Afrika
  Mashariki: uchaguzi wa paneli na pembe, muundo wa benki ya betri, uwiring wa kidhibiti cha chaji, mizunguko
  ya mzigo wa DC na usalama wa waya, na uanzishaji wa mfumo na utambuzi wa hitilafu kwa multimeter.

  '
