id: the-rebuild-protocol
title: The Rebuild Protocol
title_sw: Itifaki ya Ujenzi Mpya
description: 'REBUILD-000: The foundational module for all CyberLearn learners. Set in the world of The Blackout — a civilisation-scale cyberattack on East Africa in 2031. Learn how digital infrastructure works, how it fails, and how to defend yourself. No prerequisites. Awards the Rebuilder Initiate badge.'
description_sw: Moduli ya msingi kwa wanafunzi wote wa CyberLearn. Hadithi ya Giza Kuu — shambulio la mtandao lililoathiri Afrika Mashariki mwaka 2031. Jifunze miundombinu ya kidijitali na jinsi ya kujilindia. Hakuna mahitaji ya awali.
certification_target: Rebuilder Initiate Badge · Digital Citizenship
track: cybersecurity
