id: ecological-sanitation
title: Ecological Sanitation & Waste Systems
titleSw: Usafi wa Mazingira na Mfumo wa Taka
description: >
  Design and operate closed-loop sanitation systems — from urine-diversion dry
  toilets to biogas digesters and constructed wetlands — that turn human waste
  into safe compost and energy while protecting groundwater.
