id: wind-microhydro
title: Wind Energy & Micro-Hydropower Systems
title_sw: Nishati ya Upepo na Mifumo ya Umeme wa Mto Mdogo
description: 'End-to-end engineering manual for designing, building, and operating off-grid wind turbines
  and micro-hydropower systems: wind resource analysis, HAWT blade aerodynamics, alternator winding, micro-hydro
  head/flow measurement, Pelton wheel construction, penstock hydraulics, and power electronics integration.'
category: ENERGY_TECHNOLOGY
target_audience: Off-grid rural electrification engineers, smallholder homesteaders, community energy
  co-operatives, and solar-plus-wind hybrid system operators.
estimated_hours: 15
difficulty: INTERMEDIATE
prerequisites:
- solar-photovoltaic
- electrical-power-systems
