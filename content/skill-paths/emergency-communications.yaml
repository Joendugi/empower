id: emergency-communications
title: "Off-Grid Communications, Radio & Mesh Networks"
title_sw: "Mawasiliano Nje ya Gridi, Redio na Mitandao ya Mesh"
description: >
  Five-day hands-on unit on resilient emergency communications for decentralized
  communities across East Africa: radio wave propagation, handheld VHF/UHF transceiver
  operation (Baofeng / Simplex / Repeaters), regional HF Near Vertical Incidence
  Skywave (NVIS), decentralized solar LoRa packet mesh networks (Meshtastic), and
  antenna engineering with lightning ground protection.
description_sw: >
  Kitengo cha siku tano cha vitendo kuhusu mawasiliano ya dharura nje ya gridi
  kwa jamii za Afrika Mashariki: fizikia ya mawimbi ya redio, uendeshaji wa redio
  za mkono za VHF/UHF, mawasiliano ya masafa marefu ya HF (NVIS), mitandao ya kidijitali
  ya LoRa (Meshtastic) bila intaneti, na ujenzi wa minara na kuzuia radi.
level: beginner
tags: [communications, radio, mesh, lora, vhf, uhf, emergency, tvet, kenya]
