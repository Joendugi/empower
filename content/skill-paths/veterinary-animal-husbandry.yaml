id: veterinary-animal-husbandry
title: Veterinary Medicine & Pastoral Animal Husbandry
titleSw: Tiba ya Mifugo na Ufugaji Bora
description: >
  Master the essential clinical, nutritional, and surgical skills required to maintain
  the health, productivity, and biosecurity of livestock in pastoral and smallholder
  communities — from vital sign triage and ruminant digestive physiology to East Coast
  Fever / Trypanosomiasis diagnosis, vaccine cold chain management, dystocia obstetrics,
  and tick acaricide plunge-dip management.
level: intermediate
category: agriculture
estimatedHours: 10
xpTotal: 1250
license: CC-BY-SA-4.0
