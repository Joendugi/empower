id: metallurgy-foundry
title: Metallurgy, Blacksmithing & Sand Casting
titleSw: Ufundi Chuma, Uhunzi na Uyahushaji wa Vyuma (Foundry)
description: >
  Master the ancient and essential science of extracting, refining, forging,
  heat-treating, and casting metals in remote workshops — from building charcoal-fired
  bloomery furnaces and blacksmithing forge hearths to tool steel heat treatment
  (quenching/tempering), greensand foundry pattern molding, and scrap bronze/aluminium
  crucible melting for precision machine components.
level: intermediate
category: engineering
estimatedHours: 10
xpTotal: 1250
