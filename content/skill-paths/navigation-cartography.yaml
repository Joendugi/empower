id: navigation-cartography
title: Expedition Cartography, Land Navigation & Geodesy
titleSw: Ramani za Ardhi, Uelekezaji Njia na Jiografia
description: >
  Master the essential terrestrial navigation, field surveying, and cartographic
  skills required to explore, map, and navigate unfamiliar landscapes without
  commercial GPS satellites or digital cellular networks — from topographic contour
  interpretation and magnetic declination calculation to prismatic compass resection,
  plane table alidade mapping, and dead reckoning route traverses.
level: intermediate
category: resilience
estimatedHours: 10
xpTotal: 1250
license: CC-BY-SA-4.0
