    prerequisites:
      - "vehicle-anatomy-drivetrain"
    lesson_ids:
      - "vehicle-anatomy-brakes-lesson"
  - id: "vehicle-anatomy-electrical"
    title: "Electrical nervous system: battery, alternator, loads"
    title_sw: "Mfumo wa umeme: betri, alternator, loads"
    description: "How cranking power and running power are two different jobs."
    icon: "🦴"
    exam_domain: "Vehicle electrical"
    prerequisites:
      - "vehicle-anatomy-brakes"
    lesson_ids:
      - "vehicle-anatomy-electrical-lesson"
