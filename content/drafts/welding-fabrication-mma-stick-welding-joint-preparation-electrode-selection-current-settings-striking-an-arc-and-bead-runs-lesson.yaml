exercises:
- id: welding-fabrication-q1
  type: MULTIPLE_CHOICE
  prompt: During a flat position fillet weld on 8mm mild steel using E6013 (3.2mm)
    at 110A DC+, you observe numerous small, spherical voids on the weld surface and
    within the weld metal after chipping slag. What is the most likely defect, and
    what immediate corrective action should you take?
  options:
  - id: a
    text: Undercut; Reduce current and increase travel speed.
  - id: b
    text: Porosity; Clean the base metal thoroughly and ensure electrodes are dry.
  - id: c
    text: Lack of fusion; Increase current and slow down travel speed.
  - id: d
    text: Slag inclusion; Improve interpass cleaning.
  correct_answer: b
  hint: Consider the appearance of the defect (spherical voids) and common causes
    related to gas entrapment during solidification.
  explanation: Spherical voids indicate porosity, which is typically caused by gas
    entrapment during solidification. Common culprits include contaminants (rust,
    oil, paint) on the base metal, excessive arc length allowing atmospheric contamination,
    or damp electrodes releasing moisture. Cleaning the base metal and ensuring electrodes
    are dry (especially for low-hydrogen types, but moisture can affect rutile too)
    are critical corrective actions.
  xp_reward: 50
- id: welding-fabrication-q2
  type: MULTIPLE_CHOICE
  prompt: You are tasked with welding a critical structural component made of 12mm
    thick carbon steel (ASTM A36) requiring high strength and good ductility, in a
    horizontal position. Which electrode type and approximate current range (for 4.0mm
    diameter) would be most suitable, and what polarity should be used?
  options:
  - id: a
    text: E6013; 130-180A AC.
  - id: b
    text: E7018; 140-200A DC+.
  - id: c
    text: E6010; 100-150A DC-.
  - id: d
    text: E7024; 150-220A AC.
  correct_answer: b
  hint: The terms 'critical structural component' and 'high strength, good ductility'
    point to a specific low-hydrogen electrode type. Consider typical current ranges
    for 4.0mm electrodes and standard polarity for such applications.
  explanation: E7018 is a low-hydrogen electrode known for its excellent mechanical
    properties (high strength, good ductility, crack resistance), making it ideal
    for critical structural applications. It's typically used with DC+ (DCEP) polarity
    for deeper penetration and better arc stability. For a 4.0mm E7018 electrode,
    a current range of 140-200A is appropriate, depending on position and joint configuration.
  xp_reward: 50
- id: welding-fabrication-q3
  type: MULTIPLE_CHOICE
  prompt: For a full penetration butt weld on two 10mm thick mild steel plates, you
    decide to use a single V-groove joint. What would be the recommended total included
    angle for the bevel, and what approximate root gap and root face dimensions should
    you aim for to ensure good root fusion with an E7018 electrode?
  options:
  - id: a
    text: 45-50 degrees included angle; 0-1mm root gap, 3-4mm root face.
  - id: b
    text: 60-70 degrees included angle; 2-3mm root gap, 1.5-2mm root face.
  - id: c
    text: 90 degrees included angle; 4-5mm root gap, 0mm root face.
  - id: d
    text: 30-40 degrees included angle; 1-2mm root gap, 2-3mm root face.
  correct_answer: b
  hint: Consider standard joint preparation for full penetration V-groove welds, balancing
    electrode access for the root pass with minimizing the overall weld volume.
  explanation: For a full penetration single V-groove butt weld on 10mm thick plates,
    an included angle of 60-70 degrees (30-35 degrees per plate) provides good access
    for the electrode to achieve root fusion. A root gap of 2-3mm allows for proper
    penetration, while a root face of 1.5-2mm helps prevent burn-through and provides
    a landing for the root pass, especially with E7018 electrodes.
  xp_reward: 50
